  // Единый обработчик для полей, которые сохраняются "на лету" (Табель, Суть,
  // поля счёта в реестре) — раньше такие сохранения были "выстрелил и забыл"
  // без единой обработки ошибок, из-за чего несохранённые правки (например, из-за
  // отсутствующей колонки в БД) были не видны пользователю. Показывает короткую
  // подпись "Сохранено…" / текст ошибки рядом с полем.
  // Подпись храним в состоянии (fieldFeedback), а не пишем в DOM напрямую: таблицы
  // tickets/invoices подписаны на realtime, и событие от собственного же сохранения
  // почти сразу вызывает полный render() — прямая запись в textContent мгновенно
  // стиралась бы этим перерисовыванием, и пользователь не успевал увидеть "Сохранено".
  var fieldFeedback = {};
  function feedbackHtml(id){
    var f = fieldFeedback[id];
    if(!f) return h`<span id="${id}" class="helptext mono"></span>`;
    return h`<span id="${id}" class="helptext mono" style="color:${f.ok?'var(--ok)':'var(--crit)'};">${escapeHtml(f.text)}</span>`;
  }
  function saveWithFeedback(promise, feedbackElId){
    // возвращает true/false (сохранилось или нет) — используется вызывающим
    // кодом, чтобы не писать в журнал запись об "изменении", если сохранение
    // на самом деле не удалось.
    return promise.then(function(res){
      if(res && res.error){
        if(feedbackElId){ fieldFeedback[feedbackElId] = {text:"Ошибка: "+res.error.message, ok:false}; render(); }
        else alert("Не удалось сохранить: "+res.error.message);
        return false;
      }
      if(feedbackElId){
        fieldFeedback[feedbackElId] = {text:"Сохранено", ok:true};
        render();
        setTimeout(function(){
          if(fieldFeedback[feedbackElId] && fieldFeedback[feedbackElId].text==="Сохранено"){ delete fieldFeedback[feedbackElId]; render(); }
        }, 2000);
      }
      return true;
    }).catch(function(err){
      var msg = err && err.message ? err.message : String(err);
      if(feedbackElId){ fieldFeedback[feedbackElId] = {text:"Ошибка: "+msg, ok:false}; render(); }
      else alert("Не удалось сохранить: "+msg);
      return false;
    });
  }
  function saveTicketField(id, patch, feedbackElId){
    patchTicketLocal(id, patch);
    return saveWithFeedback(sb.from("tickets").update(patch).eq("id", id), feedbackElId);
  }
  function saveInvoiceField(id, patch, feedbackElId){ return saveWithFeedback(sb.from("invoices").update(patch).eq("id", id), feedbackElId); }

  /* ---- Журнал: редактирование и удаление записей ---- */
  function updateNote(id, text){
    return sb.from("ticket_notes").update({note_text:text, edited_at:new Date().toISOString()}).eq("id", id);
  }
  // Раньше .delete() ни на что не проверялся: если удаление по какой-то
  // причине не проходило на сервере (RLS, сетевая ошибка) — Supabase не
  // бросает исключение, просто удаляет 0 строк молча, и запись оставалась на
  // месте без единого сообщения об этом (подтверждение "Удалить запись из
  // журнала?" при этом всё равно показывалось и принимало ответ). Плюс сам
  // журнал обновлялся только через realtime-подписку — если она почему-то не
  // сработала, строка тоже осталась бы висеть. Теперь явно проверяем ошибку
  // (и сообщаем о ней) и в любом случае перезапрашиваем список записей, не
  // полагаясь только на realtime.
  function deleteNote(id){
    var note = (state.ticketNotes||[]).find(function(n){ return String(n.id)===String(id); });
    var ticketId = note ? note.ticket_id : notesChannelTicketId;
    return sb.from("ticket_notes").delete().eq("id", id).then(function(res){
      if(res.error){ alert("Не удалось удалить запись: "+res.error.message); return; }
      if(ticketId) fetchNotes(ticketId);
    });
  }

  /* ---- Исполнители: создание/переименование/удаление ---- */
  // 0.4.5, п.3 (по просьбе Антона): раньше "Бригады" были именованными
  // группами с постоянным списком участников (members) — но поскольку люди
  // на самом деле свободно переходят из бригады в бригаду, это переработано
  // в плоский справочник отдельных фамилий ("Исполнители"). Таблица crews в
  // базе та же самая (внутренний ключ раздела/навигации тоже остался "crews"
  // — переименовано только то, что видит пользователь), просто теперь каждая
  // строка — это один человек, а не бригада со своим составом; колонка
  // members в базе больше не используется (не удаляем, чтобы не усложнять
  // миграцию, просто не читаем и не пишем в неё).
  function createCrew(name){
    if(!name || !name.trim()) return;
    sb.from("crews").insert({name:name.trim()}).then(function(){});
  }
  function renameCrew(id, name){
    if(!name || !name.trim()) return;
    sb.from("crews").update({name:name.trim()}).eq("id", id).then(function(){});
  }
  function deleteCrew(id){
    sb.from("crews").delete().eq("id", id).then(function(){});
  }
  // Назначение "Исполнителя" в карточке заявки (см. renderTicketPanel, пункт
  // "Бригада") принимает и выбор из выпадающего списка, и ручной ввод текста
  // — если вписанного вручную имени ещё нет ни среди "Главных инженеров"
  // (специалистов), ни в справочнике "Исполнители", оно добавляется сюда
  // автоматически, чтобы в следующий раз его можно было просто выбрать.
  function ensurePerformerInDirectory(name){
    if(!name) return;
    var trimmed = String(name).trim();
    if(!trimmed) return;
    var isSpecialist = (state.profiles||[]).some(function(m){ return m.role==="specialist" && m.active!==false && (m.name||m.email)===trimmed; });
    if(isSpecialist) return;
    var exists = (state.crews||[]).some(function(c){ return c.name===trimmed; });
    if(exists) return;
    sb.from("crews").insert({name:trimmed}).then(function(){});
  }

  /* ============================== RENDER HELPERS ============================== */
  function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

    var open = hasBody && !!(state.milestoneOpen && state.milestoneOpen[opts.key]);
    // opts.warn (пока только у "Материал", см. materialsState()) — промежуточное
    // жёлтое состояние вдобавок к обычному done/не done.
    var iconCls = opts.done ? " done" : (opts.warn ? " warn" : "");
    var iconTag = opts.clickable
      ? h`<button type="button" class="milestone-icon${iconCls}" data-action="${opts.toggleAction}" data-id="${opts.toggleId}" data-val="${opts.toggleVal}" title="${opts.done?'Снять отметку':'Отметить выполненным'}">${opts.icon}</button>`
      : h`<span class="milestone-icon${iconCls}">${opts.icon}</span>`;
    return h`<div class="milestone-row">
      <div class="milestone-hd" data-key="${opts.key}" ${hasBody?h`data-action="toggle-milestone"`:''}>
        ${iconTag}
        <span class="milestone-title" title="${escapeHtml(opts.title)}">${opts.title}</span>
        ${opts.meta||""}
        ${hasBody ? h`<span class="milestone-chevron">${open?'▾':'▸'}</span>` : ""}
      </div>
      ${open ? h`<div class="milestone-body">${opts.body}</div>` : ""}
    </div>`;
  }
  // Счета/договоры заявки нужной категории (crew | materials | null — обычный
  // "Счета") — фильтр общий для счётчика в шапке пункта и для списка внутри.
  function invoicesFor(t, category){
    return (state.invoices||[]).filter(function(iv){ return iv.ticket_id===t.id && iv.category===category; });
  }
  // Счета без категории (category=null) — раньше загружались через отдельный
  // общий раздел "Счета", который убрали при переходе на разбивку по пунктам
  // чек-листа "Бригада"/"Материал" (см. INVOICE_CATEGORY_LABEL и оба
  // milestoneAttachControl ниже — сейчас новый файл иначе как с category
  // "crew"/"materials" прикрепить нельзя). Уже существующие старые файлы с
  // category=null никуда не делись — они по-прежнему в "Реестре платежей", но
  // без этой функции были бы навсегда не видны в самой карточке заявки, хотя
  // формально прикреплены именно к ней (это и есть баг с заявкой №286).
  function legacyInvoicesFor(t){
    return (state.invoices||[]).filter(function(iv){ return iv.ticket_id===t.id && iv.category==null; });
  }
  // Пилюля "Оплачено"/"Не оплачено" — только для чтения (сама галочка "оплачено"
  // ставится в «Реестре платежей», см. viewRegistry/setInvoicePaid); здесь нужна,
  // чтобы статус счёта было видно прямо в карточке заявки, даже тем ролям, у
  // которых нет доступа к разделу «Реестр платежей» (напр. Снабжение).
  function invoicePaidPill(iv){
    return iv.paid
      ? h`<span class="pill pill-ok">Оплачено</span>`
      : h`<span class="pill pill-warn">Не оплачено</span>`;
  }
  function renderInvoiceList(list){
    if(!list.length) return h`<div class="muted" style="font-size:12.5px;">Файлов пока нет.</div>`;
    return h`<div class="row-gap" style="gap:6px;display:flex;flex-direction:column;">${list.map(function(iv){

      // без НДС по ЭТОЙ заявке — если счёт общий на несколько заявок (см.
      // invoiceGroupMembers), показывается доля этой заявки (по проценту из
      // «Реестра платежей»), а не сумма всего счёта целиком.
      var acc = invoiceAccountedKZTForTicket(iv);
      // 0.4.6 (по просьбе Антона): статус — слева, сумма — справа отдельной
      // колонкой (min-width, чтобы суммы визуально выравнивались по
      // вертикали в списке файлов, как в «Реестре платежей»), имя файла —

      return h`<div class="invoice-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px;">

        <span class="mono muted" style="font-size:12px;min-width:84px;text-align:right;" title="${acc.shared?('Сумма без НДС по этой заявке'+(acc.percent!=null?' ('+acc.percent+'% от счёта)':' — доля этой заявки ещё не указана в «Реестре платежей» (счёт общий на несколько заявок)')):'Сумма без НДС'}">${accountedKZTLabel(acc)}${acc.state==="ok" && !acc.currency ? ' ₸' : ''}</span>
        <button type="button" class="btn btn-sm btn-ghost btn-danger" data-action="invoice-delete" data-id="${iv.id}" data-path="${escapeHtml(iv.file_path)}" title="Удалить файл">✕</button>

  // Список уже прикреплённых к заявке счетов/договоров нужной категории
  // (crew | materials) — используется в чек-листе "Ход работ". Каждый файл
  // можно открыть или удалить (раньше удалить было нельзя вообще).
  function milestoneInvoiceList(t, category){
    return renderInvoiceList(invoicesFor(t, category));
  }
  // Раздел для старых файлов без категории (см. legacyInvoicesFor выше) — виден
  // в карточке заявки, только если такие файлы у неё реально есть, чтобы не
  // загромождать обычные заявки уже неактуальным разделом.
  // Переписка и история статусов из c-lector (0.2.11, автосинхронизация по
  // API — см. edge-functions/clector-sync.ts) — заявка целиком приходит
  // из API и складывается в tickets.clector_raw как есть (comments[],
  // status_history[]), это просто их отображение. Заявок, заведённых
  // ручным импортом файла/вставки (viewImport/commitImport), это не
  // касается — там clector_raw не заполняется, секция не показывается.
  function clectorCommentsList(comments){
    if(!comments || !comments.length) return "";
    return h`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">

        return h`<div style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;">

  function clectorStatusHistoryList(history){
    if(!history || !history.length) return "";
    return h`<div style="display:flex;flex-direction:column;gap:4px;">
      ${history.slice().reverse().map(function(e){
        var from = e.from_status ? (CLECTOR_STATUS_LABEL[e.from_status]||e.from_status) : null;
        var to = CLECTOR_STATUS_LABEL[e.to_status]||e.to_status;
        var by = (e.changed_by && e.changed_by.name) ? e.changed_by.name : "автоматически";
        return h`<div class="kv" style="font-size:12.5px;">
          <span class="k">${escapeHtml(fmtDate(e.changed_at))}</span>
          <span class="v">${from?escapeHtml(from)+" → ":""}${escapeHtml(to)} <span class="muted">(${escapeHtml(by)})</span></span>
        </div>`;
      }).join("")}
    </div>`;
  }
  function clectorSyncSection(t){
    if(t.source!=="c-lector" || !t.clector_raw) return "";
    var raw = t.clector_raw;
    var comments = raw.comments||[];
    var history = raw.status_history||[];

    return h`<div>

  // Фотографии по заявке — раздел "Фото" (замечания, см. category=null у

  function renderPhotoGrid(photos, emptyText){

          ${inner}
          <button type="button" class="photo-del" data-action="photo-delete" data-id="${p.id}" data-path="${escapeHtml(p.file_path)}" title="Удалить фото">✕</button>

    }).join("")}</div>`;

  // Раздел "Фото" — замечания (проблема "до"), category=null. Не влияет на
  // автопереход "Работа выполнена" (см. STATUS_ICON_DEFS/maybeAutoComplete
  // выше) — только информационная галерея.
  function milestonePhotoGrid(t){
    var photos = (state.photos||[]).filter(function(p){return p.ticket_id===t.id && p.category==null;});
    return renderPhotoGrid(photos, "Фото пока нет.");
  }
  // Фото-доказательства выполненной работы, прикреплённые к пункту "Акт"
  // (category="act") — отдельно от замечаний в "Фото" и отдельно от самого
  // файла акта (t.act_file_path/act_file_name, см. uploadActFile выше).
  function actPhotoGrid(t){
    var photos = (state.photos||[]).filter(function(p){return p.ticket_id===t.id && p.category==="act";});
    return renderPhotoGrid(photos, "Фото к акту пока нет.");
  }
  // Ручная пометка "особое внимание" — например, заявкой заинтересовался
  // руководитель или заказчик. В отличие от 4 иконок хода работ выше, эта
  // видна, только когда действительно установлена (не приглушённая по
  // умолчанию иконка, а явный "флажок"), чтобы не размывать внимание на
  // рутинных заявках.
  function attentionBadge(t){
    if(!t.attention_flag) return "";
    var title = "Особое внимание"+(t.attention_note?": "+t.attention_note:"");
    return h`<span class="attn-badge" title="${escapeHtml(title)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </span>`;
  }
  // Акт подписан (файлом, вручную или по фото — см. act_signed), но статус в
  // самом c-lector.ru приложение изменить не может (нет обратной записи) —
  // поэтому в списке заявок нужна явная напоминалка диспетчеру. Показываем
  // только для заявок из c-lector (у ручных заявок нет внешнего статуса,
  // менять там нечего).
  // Гаснет не по внутреннему статусу заявки (он может стать "closed" сам,
  // автопереходом — см. maybeAutoComplete), а только когда САМ c-lector при
  // следующей выгрузке подтвердит, что статус там уже поменяли (см.
  // isClosedExternalStatus выше) — иначе напоминалка теряет смысл: она именно
  // про то, что приложение не может записать статус обратно в c-lector.ru.
  function clectorSyncBadge(t){
    if(!t.act_signed || t.source!=='c-lector') return "";
    if(isClosedExternalStatus(t.external_status)) return "";
    return h`<div class="clector-sync-badge" title="Акт подписан — не забудьте изменить статус этой заявки на сайте c-lector.ru">⟳ изменить статус в c-lector</div>`;
  }
  // 0.2.18: значок "Удалена в c-lector" в списке заявок (см. isDeletedInClector).
  function clectorDeletedBadge(t){
    if(!isDeletedInClector(t)) return "";
    return h`<div class="clector-deleted-badge" title="${escapeHtml("Удалена в c-lector"+(t.clector_deleted_at?(" "+fmtDate(t.clector_deleted_at)):"")+" — данные и история остались здесь, но в самом c-lector этой заявки больше нет")}">Удалена в c-lector</div>`;
  }
  // Показывает, какую заявку дублирует текущая (см. setDuplicateOf выше) — в
  // списке заявок, рядом с номером, чтобы диспетчер сразу видел, что по этой
  // поломке уже есть другая заявка в работе.
  function duplicateBadge(t){

    var dup = (state.tickets||[]).find(function(x){return x.id===t.duplicate_of_ticket_id;});

  }

  /* ============================== AUTH SCREEN ============================== */
  function renderAuthScreen(){
    var app = document.getElementById("app");
    if(state.authView==="sent"){
      morphInto(app, h`<div class="auth-wrap"><div class="card auth-card">
        <div class="auth-logo">Диспетчерская Keruen Inn</div>
        <div class="auth-sub">Служба сервиса</div>
        <div class="auth-ok"><b>Проверьте почту</b><br>Мы отправили ссылку для входа на ${escapeHtml(state.authEmail)}. Откройте её на этом устройстве.</div>
        <button class="btn btn-block" style="margin-top:14px;" id="auth-resend">Отправить ещё раз</button>
      </div></div>`);
      // .onclick/.onsubmit (а не addEventListener) — с morphdom узел формы
      // может быть тем же самым живым узлом, что и на прошлом render() (а не
      // пересозданным заново, как раньше при innerHTML), поэтому
      // addEventListener на каждый render() копил бы обработчики один поверх
      // другого; присваивание же просто заменяет предыдущий.
      document.getElementById("auth-resend").onclick = function(){ sendMagicLink(state.authEmail); };
      return;
    }
    morphInto(app, h`<div class="auth-wrap"><div class="card auth-card">
      <div class="auth-logo">Диспетчерская Keruen Inn</div>
      <div class="auth-sub">Вход по рабочей почте — без пароля</div>
      ${state.authError ? h`<div class="auth-err">${escapeHtml(state.authError)}</div>` : ""}
      <form id="auth-form">
        <div class="field"><label>Рабочая почта</label><input type="email" name="email" required placeholder="you@company.kz" value="${escapeHtml(state.authEmail)}"></div>
        <button class="btn btn-primary btn-block" type="submit">Отправить ссылку для входа</button>
      </form>
    </div></div>`);
    document.getElementById("auth-form").onsubmit = function(e){
      e.preventDefault();
      var email = new FormData(e.target).get("email").trim();
      if(!email) return;
      sendMagicLink(email);
    };
  }

  /* ============================== VIEWS ============================== */

          <div class="table-wrap"><table><thead><tr><th>№ c-lector</th><th>Отель</th><th>Описание</th><th>Статус</th><th>Срок</th></tr></thead><tbody>
            ${attention.map(function(t){ var hotel=hotelById(t.hotel_id); var di=deadlineInfo(t);
              return h`<tr data-open-ticket="${t.id}" ${t.attention_flag?'class="attn-row"':''}>

                <td style="${di.overdue?'color:var(--crit);font-weight:600;':(di.soon?'color:var(--warn);font-weight:600;':'')}" title="${escapeHtml(di.label)}">${di.dateLabel}</td>

  // Общая фильтрация+сортировка списка заявок — используется и для самого экрана
  // «Заявки», и для выгрузки в Excel (чтобы выгружался ровно тот же список, что
  // сейчас показан на экране, с теми же фильтрами и сортировкой).
  function getFilteredTicketsList(){
    var f = state.filters || {statusList:[], zone:"", hotel:"", q:"", showClosed:false, attentionOnly:false};
    if(!f.statusList) f.statusList = [];
    if(!f.tagFilters) f.tagFilters = {};
    if(!f.caseTypeList) f.caseTypeList = [];
    // Активные ключи чек-листа (бригада/материал/работа/акт) из компактных
    // чекбоксов над колонкой "№ c-lector" (см. TAG_FILTER_DEFS/viewTickets) —
    // версия 0.2.3 вернула им поведение настоящего фильтра (по просьбе Антона):
    // включённый тег скрывает все заявки, где этот пункт ещё НЕ выполнен
    // (зелёный/lit), а не подсвечивает их, как было в 0.2.1. Несколько отмеченных
    // тегов одновременно — заявка должна остаться, только если выполнены ВСЕ
    // отмеченные пункты сразу (логика "И", как и для остальных фильтров списка).
    // С версии 0.2.9 "материал" хранит не true/false, а "warn"/"ok" (см.
    // data-cycle-material-filter) — остальные три пункта остаются обычными
    // булевыми чекбоксами, поэтому здесь фильтруем по любому "истинному" значению.
    var activeTagKeys = Object.keys(f.tagFilters).filter(function(k){ return !!f.tagFilters[k]; });
    var q = normalizeForMatch(f.q||"");
    // 0.4.8, п.2: «Клиент» видит только заявки по «своим» объектам (см.
    // visibleTicketsForMe/hotelAllowedForMe) — для всех остальных ролей это
    // просто state.tickets без изменений.
    var baseFiltered = visibleTicketsForMe().filter(function(t){
      if(f.attentionOnly && !t.attention_flag) return false;
      if(f.statusList.length && f.statusList.indexOf(ticketStatusLabel(t))===-1) return false;
      if(f.zone && String(t.zone)!==f.zone) return false;
      if(f.hotel && String(t.hotel_id)!==f.hotel) return false;
      if(f.caseTypeList.length && f.caseTypeList.indexOf(t.case_type)===-1) return false;
      if(f.systemDefectOnly && !t.system_defect_name) return false;
      if(activeTagKeys.length && !activeTagKeys.every(function(key){
        var def = STATUS_ICON_BY_KEY[key];
        if(!def) return false;
        // "Материал" — трёхпозиционный фильтр: значение в tagFilters это не
        // true, а конкретное состояние ("warn"/"ok"), которое надо сравнить
        // с фактическим состоянием заявки через def.state(), а не def.lit().
        if(def.state) return def.state(t) === f.tagFilters[key];
        return def.lit(t);
      })) return false;
      if(q){
        var hay = normalizeForMatch((t.description||"")+" "+(t.description_short||"")+" "+(t.external_ref||""));
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
    // Скрывать закрытые/отклонённые по умолчанию имеет смысл только когда статус
    // не выбран явно — если человек сам кликнул чип "Отклонена" или "Выполнена",
    // он однозначно хочет видеть именно эти заявки, а не получить пустой список
    // из-за того, что они попадают под "закрыто по умолчанию".
    var list = (f.showClosed || f.statusList.length) ? baseFiltered.slice() : baseFiltered.filter(function(t){ return !isTicketDone(t); });
    var hiddenClosedCount = baseFiltered.length - list.length;
    // По умолчанию (пока человек не кликнул ни один заголовок) список отсортирован
    // по номеру заявки по убыванию — самые новые/последние заявки сверху. Как
    // только кликнули по какому-то столбцу — дальше работает обычное переключение
    // возрастание/убывание по клику (см. обработчик data-action="sort-tickets").
    var sortField = (f.sort && f.sort.field) || "ref";
    var sortDir = (f.sort && f.sort.dir) || "desc";
    function sortVal(t, field){
      var hotel = hotelById(t.hotel_id);
      if(field==="ref") return t.external_ref || "";
      if(field==="hotel") return hotel ? hotel.name : "";
      if(field==="desc") return displayShort(t);
      if(field==="status") return ticketStatusLabel(t);
      if(field==="deadline"){ var di=deadlineInfo(t); return di.ms==null ? Infinity : di.ms; }
      return "";
    }
    // Номера заявок из c-lector — по сути числа, но хранятся строкой, поэтому
    // обычное сравнение строк расставило бы "10" раньше "9". Сравниваем как числа,
    // если оба значения похожи на число, иначе — обычным сравнением строк.
    function numericAwareCompare(a, b){
      var sa = String(a), sb = String(b);
      var na = sa.match(/^-?\d+(\.\d+)?$/), nb = sb.match(/^-?\d+(\.\d+)?$/);
      if(na && nb) return parseFloat(sa) - parseFloat(sb);
      return sa.localeCompare(sb, "ru");
    }
    if(sortField){
      list = list.slice().sort(function(a,b){
        var va = sortVal(a, sortField), vb = sortVal(b, sortField);
        var cmp;
        if(sortField==="ref") cmp = numericAwareCompare(va, vb);
        else cmp = (typeof va==="number" || typeof vb==="number") ? ((va||0)-(vb||0)) : String(va).localeCompare(String(vb), "ru");
        return sortDir==="desc" ? -cmp : cmp;
      });
    }
    return { list: list, hiddenClosedCount: hiddenClosedCount, sortField: sortField, sortDir: sortDir };
  }
  function exportTicketsExcel(){
    if(typeof XLSX==="undefined" || !XLSX.utils){ alert("Модуль Excel не загрузился (возможно, заблокирован интернет/VPN) — обновите страницу и попробуйте снова."); return; }
    var list = getFilteredTicketsList().list;
    var header = ["№ c-lector","Отель","Локация","Описание","Статус","Исполнитель","Срок","Особое внимание","Бригада","Материал","Работа","Акт","Категория","Системный брак"];
    var rows = list.map(function(t){
      var hotel = hotelById(t.hotel_id); var di = deadlineInfo(t);
      return [
        t.external_ref||"", hotel?("№"+hotel.id+" "+hotel.name):"", t.location||"", displayShort(t), ticketStatusLabel(t), ticketPerformers(t).join(", "), di.label, t.attention_flag?("Да"+(t.attention_note?": "+t.attention_note:"")):"",
        STATUS_ICON_BY_KEY.crew && STATUS_ICON_BY_KEY.crew.lit(t) ? "Да" : "Нет",
        STATUS_ICON_BY_KEY.materials && STATUS_ICON_BY_KEY.materials.lit(t) ? "Да" : "Нет",
        STATUS_ICON_BY_KEY.work && STATUS_ICON_BY_KEY.work.lit(t) ? "Да" : "Нет",
        STATUS_ICON_BY_KEY.act && STATUS_ICON_BY_KEY.act.lit(t) ? "Да" : "Нет",
        t.case_type ? CASE_LABEL[t.case_type] : "",
        t.system_defect_name || ""
      ];
    });
    var ws = XLSX.utils.aoa_to_sheet([header].concat(rows));
    ws["!cols"] = header.map(function(){ return {wch:22}; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Заявки");
    XLSX.writeFile(wb, "Заявки_Keruen_Inn_"+new Date().toISOString().slice(0,10)+".xlsx");
  }
  function viewTickets(){
    var f = state.filters || {statusList:[], zone:"", hotel:"", q:"", showClosed:false, attentionOnly:false};
    if(!f.statusList) f.statusList = [];
    if(!f.caseTypeList) f.caseTypeList = [];
    // Список статусов для фильтра строим из реальных значений, которые сейчас есть
    // в заявках (текст из c-lector произвольный, единого перечня нет) — а не из
    // фиксированного внутреннего набора new/dispatched/onsite/closed/rejected.
    var statusSeen = {}; state.tickets.forEach(function(t){ statusSeen[ticketStatusLabel(t)] = true; });
    var statusOptions = Object.keys(statusSeen).sort();
    var computed = getFilteredTicketsList();
    var list = computed.list, hiddenClosedCount = computed.hiddenClosedCount, sortField = computed.sortField, sortDir = computed.sortDir;
    function sortableTh(label, field){
      var active = sortField===field;
      return h`<th data-action="sort-tickets" data-field="${field}" style="cursor:pointer;user-select:none;" title="Сортировать">${label}${active?(sortDir==="asc"?" ▲":" ▼"):""}</th>`;
    }
    // Заголовок "№ c-lector" — не просто сортируемый лейбл, а ещё и место для
    // компактных чекбоксов-фильтров по 4 пунктам чек-листа. Специально не
    // переиспользую sortableTh() для этой колонки — тут нужна дополнительная
    // строка внутри <th>, которой у остальных колонок нет.
    function refTh(){
      var active = sortField==="ref";
      return h`<th data-action="sort-tickets" data-field="ref" style="cursor:pointer;user-select:none;" title="Сортировать">
        <span>№ c-lector${active?(sortDir==="asc"?" ▲":" ▼"):""}</span>
        <div class="tag-filter-row">${TAG_FILTER_DEFS.map(function(def){
          // "Материал" — единственный пункт с тремя реальными состояниями
          // (нейтральный/жёлтый счёт не оплачен/зелёный оплачен, см.
          // materialsState()), поэтому его фильтр-чип не обычный чекбокс
          // (вкл/выкл), а трёхпозиционный переключатель по клику: выключен →
          // жёлтый → зелёный → снова выключен. Остальные три пункта (бригада/
          // работа/акт) — простое да/нет, чекбокс им подходит как и раньше.
          if(def.key==="materials"){
            var mVal = f.tagFilters && f.tagFilters.materials;
            var mCls = mVal==="warn" ? " warn-lit active" : (mVal==="ok" ? " lit active" : "");
            var mTitle = mVal==="warn" ? "Показаны заявки: счёт на материал есть, но не оплачен (клик — переключить на «оплачен»)"
              : mVal==="ok" ? "Показаны заявки: материал оплачен (клик — сбросить фильтр)"
              : def.title+" — клик переключает: не оплачен → оплачен → сброс";
            return h`<span class="tag-filter-chip${mCls}" title="${escapeHtml(mTitle)}" data-cycle-material-filter="1">${MS_ICON[def.key]}</span>`;
          }
          var isOn = !!(f.tagFilters && f.tagFilters[def.key]);
          return h`<label class="tag-filter-chip${isOn?' active':''}" title="${escapeHtml(def.title)}">
            ${MS_ICON[def.key]}
            <input type="checkbox" data-tag-filter="${def.key}" ${isOn?'checked':''}>
          </label>`;
        }).join("")}</div>
      </th>`;
    }
    return h`
      ${ticketsTabs('tickets')}
      <div class="filters">
        <div class="status-filter-group">
          ${statusOptions.map(function(s){ var active = f.statusList.indexOf(s)>-1;
            return h`<span class="status-filter-chip ${active?'active':''}" data-action="toggle-status-filter" data-value="${escapeHtml(s)}">${escapeHtml(s)}</span>`;
          }).join("")}
          ${f.statusList.length ? h`<a href="#" data-action="clear-status-filter" style="font-size:12px;">сбросить</a>` : ""}
        </div>
        <div class="status-filter-group">
          ${Object.keys(CASE_LABEL).map(function(ct){ var active = f.caseTypeList.indexOf(ct)>-1;
            return h`<span class="status-filter-chip ${active?'active':''}" data-action="toggle-case-filter" data-value="${ct}">${escapeHtml(CASE_LABEL[ct])}</span>`;
          }).join("")}
          ${f.caseTypeList.length ? h`<a href="#" data-action="clear-case-filter" style="font-size:12px;">сбросить</a>` : ""}
        </div>
        <select data-filter="zone"><option value="">Все зоны</option>${[1,2,3].map(function(z){return h`<option value="${z}" ${f.zone===String(z)?'selected':''}>Зона ${z}</option>`;}).join("")}</select>
        <select data-filter="hotel"><option value="">Все отели</option>${visibleHotelsForMe().filter(function(x){return x.in_service;}).map(function(x){return h`<option value="${x.id}" ${f.hotel===String(x.id)?'selected':''}>№${x.id} ${x.name}</option>`;}).join("")}</select>
        <input type="text" data-filter="q" value="${escapeHtml(f.q||"")}" placeholder="Поиск по описанию или № заявки…" style="min-width:220px;">
        <div class="chip-toggle"><label><input type="checkbox" data-filter-checkbox="showClosed" ${f.showClosed?'checked':''}> Показывать закрытые/отклонённые/удалённые из c-lector</label></div>
        <div class="chip-toggle"><label><input type="checkbox" data-filter-checkbox="attentionOnly" ${f.attentionOnly?'checked':''}> Только с пометкой «особое внимание»</label></div>
        <div class="chip-toggle"><label><input type="checkbox" data-filter-checkbox="systemDefectOnly" ${f.systemDefectOnly?'checked':''}> Только системный брак</label></div>
        ${canSubmitTicket() ? h`<button class="btn btn-sm btn-primary" data-action="new-ticket">+ Подать заявку</button>` : ""}
        <button class="btn btn-sm" data-action="tickets-export" ${list.length===0?'disabled':''}>Экспорт в Excel</button>
        <span class="muted" style="margin-left:auto;">${list.length} заявок${(!f.showClosed && hiddenClosedCount>0) ? h` <span title="Закрытые, отклонённые и удалённые из c-lector скрыты по умолчанию">(скрыто: ${hiddenClosedCount})</span>` : ""}</span>
      </div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr>${refTh()}${sortableTh("Отель","hotel")}${sortableTh("Описание","desc")}${sortableTh("Статус","status")}${sortableTh("Срок","deadline")}</tr></thead>
        <tbody>${list.length===0 ? h`<tr><td colspan="5"><div class="empty-state"><b>Заявок нет</b>Добавьте заявку по данным из c-lector.ru.</div></td></tr>` :
          list.map(function(t){ var hotel=hotelById(t.hotel_id); var di=deadlineInfo(t);
            var rowClasses = [t.attention_flag?'attn-row':'', t.duplicate_of_ticket_id?'dup-row':''].filter(Boolean).join(" ");
            return h`<tr data-open-ticket="${t.id}" ${rowClasses?('class="'+rowClasses+'"'):''}>
              <td class="mono">${attentionBadge(t)}${t.external_ref? escapeHtml(t.external_ref) : '<span class="muted">—</span>'}
                <div style="margin-top:4px;">${statusIconsRow(t)}</div>
                ${duplicateBadge(t)}
              </td>
              <td>
                <div><span class="ttl">№${hotel.id} ${hotel.name}</span></div>
                ${t.location ? h`<div class="muted" style="font-size:11.5px;margin-top:2px;">${escapeHtml(t.location)}</div>` : ""}
                <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;">${zoneBadge(t.zone)}${t.demo?' <span class="demo-tag">пример</span>':''}${t.source==='c-lector'?' <span class="source-tag">c-lector</span>':''}</div>
              </td>
              <td><div class="line-clamp-2" style="max-width:360px;" title="${escapeHtml(displayShort(t))}">${escapeHtml(displayShort(t))}</div></td>
              <td>${t.external_status? externalStatusPill(t.external_status): statusPill(t.status)}${clectorSyncBadge(t)}${clectorDeletedBadge(t)}</td>
              <td style="${di.overdue?'color:var(--crit);font-weight:600;':(di.soon?'color:var(--warn);font-weight:600;':'')}" title="${escapeHtml(di.label)}">${di.dateLabel}</td>
            </tr>`; }).join("")}
        </tbody></table></div></div>`;
  }

  // Раздел "Системный брак" — заявки, помеченные как системный брак (см.
  // distinctSystemDefectNames/clearSystemDefectName выше), сгруппированные по
  // названию брака, чтобы видеть под одним заголовком все заявки, которые к
  // нему относятся, а не искать их по одной в общем списке.
  function viewSystemDefects(){
    var withDefect = state.tickets.filter(function(t){ return !!t.system_defect_name; });
    if(!withDefect.length) return h`<div class="card card-pad"><div class="empty-state"><b>Системных браков пока нет</b>Отметьте заявку «Системный брак» в её карточке (поле рядом с описанием) — она появится здесь, сгруппированная по названию.</div></div>`;
    var groups = {};
    withDefect.forEach(function(t){ (groups[t.system_defect_name] = groups[t.system_defect_name]||[]).push(t); });
    var names = Object.keys(groups).sort(function(a,b){ return groups[b].length - groups[a].length || a.localeCompare(b,"ru"); });
    return h`<div class="row-gap">${names.map(function(name){
      var list = groups[name];
      return h`<div class="card card-pad">
        <div class="section-title">${escapeHtml(name)} <span class="muted" style="text-transform:none;font-weight:400;">— ${list.length} ${ruPlural(list.length,["заявка","заявки","заявок"])}</span></div>
        <div class="table-wrap"><table><thead><tr><th>№ c-lector</th><th>Отель</th><th>Описание</th><th>Статус</th></tr></thead><tbody>
          ${list.map(function(t){ var hotel = hotelById(t.hotel_id);
            return h`<tr data-open-ticket="${t.id}">
              <td class="mono">${attentionBadge(t)}${t.external_ref? escapeHtml(t.external_ref) : '<span class="muted">—</span>'}</td>
              <td><span class="ttl">№${hotel.id} ${hotel.name}</span></td>
              <td>${escapeHtml(displayShort(t))}</td>
              <td>${t.external_status? externalStatusPill(t.external_status): statusPill(t.status)}</td>
            </tr>`;
          }).join("")}
        </tbody></table></div>
      </div>`;
    }).join("")}</div>`;
  }

  // 0.3.7 (по просьбе Антона, п.4): «Активность» — сколько времени команда
  // реально провела в приложении (см. pingActivity/activity_daily выше).
  // Доступно строго Администратору (см. navAllowed). "Заказчик" (внешний
  // человек, не часть команды) и "pending" (роль ещё не назначена) в список
  // не попадают — как и в «Команде», это не сотрудники службы.
  function fmtActivityDuration(totalSeconds){
    var minutes = Math.round((totalSeconds||0)/60);
    if(minutes<=0) return "—";
    var hrs = Math.floor(minutes/60), mins = minutes%60;
    if(hrs===0) return mins+" мин";
    return hrs+" ч"+(mins?(" "+mins+" мин"):"");
  }
  function viewActivity(){
    var todayIso = new Date().toISOString().slice(0,10);
    // Последние 7 календарных дней, включая сегодня — тот же принцип дневных
    // ключей ("YYYY-MM-DD"), что и у activity_daily/ticket_stats_snapshots.
    var last7 = [];
    for(var i=0;i<7;i++){ var d=new Date(); d.setDate(d.getDate()-i); last7.push(d.toISOString().slice(0,10)); }
    var members = (state.profiles||[]).filter(function(m){ return m.role && m.role!=="pending" && m.role!=="customer"; });
    var rows = members.map(function(m){
      var mine = (state.activityDaily||[]).filter(function(a){ return a.profile_id===m.id; });
      var today = mine.filter(function(a){ return a.day===todayIso; }).reduce(function(s,a){ return s+(a.seconds||0); }, 0);
      var week = mine.filter(function(a){ return last7.indexOf(a.day)>-1; }).reduce(function(s,a){ return s+(a.seconds||0); }, 0);
      return {m:m, today:today, week:week};
    });
    rows.sort(function(a,b){ return b.week-a.week; });
    return h`
      ${teamTabs('activity')}
      <div class="row-gap">
      <div class="card card-pad">
        <div class="section-title">Активность команды</div>
        <div class="helptext" style="margin-bottom:10px;">Время считается, пока вкладка приложения открыта и видна на экране (свёрнутое или фоновое окно не считается). «Последний раз был» — по любому обращению к приложению.</div>
        ${rows.length===0 ? h`<div class="empty-state"><b>Пока никто не заходил</b></div>` : h`
        <div class="table-wrap"><table>
          <thead><tr><th>Имя</th><th>Почта</th><th>Роль</th><th>Последний раз был</th><th>Сегодня</th><th>За 7 дней</th></tr></thead>
          <tbody>${rows.map(function(r){
            var m = r.m;
            return h`<tr>
              <td class="ttl">${escapeHtml(m.name||"—")}</td>
              <td class="muted">${escapeHtml(m.email)}</td>
              <td>${escapeHtml(ROLE_LABEL[m.role]||m.role)}</td>
              <td class="muted">${m.last_seen_at ? fmtDate(m.last_seen_at) : "—"}</td>
              <td class="mono">${fmtActivityDuration(r.today)}</td>
              <td class="mono">${fmtActivityDuration(r.week)}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>`}
      </div>
    </div>`;
  }

  // Раньше здесь был отдельный столбец "Зоны" с чекбоксами (1/2/3) на каждого
  // сотрудника — по просьбе Антона убран целиком: непонятный функционал, никак
  // не влиявший на реальную логику зон/сроков (та использует зону отеля/заявки,
  // а не зоны профиля).
  function viewTeam(){
    var owner = isOwner();
    // 0.3.6 (по просьбе Антона, п.2): раньше таблица сотрудников делила экран
    // пополам с карточкой «Пригласить коллегу» (.two-col, 1.4fr/1fr) — при
    // такой ширине колонка «Роль» (выпадающий список) сжималась настолько,
    // что был виден только треугольник раскрытия, без подписи роли. Кнопка
    // приглашения перенесена в топбар (см. render()), а таблица теперь одна
    // карточка на всю ширину раздела — колонкам, включая «Роль», достаточно
    // места без горизонтальной прокрутки.
    return h`
      ${teamTabs('team')}
      <div class="row-gap">
        <div class="card card-pad">
          <div class="section-title">Сотрудники, вошедшие в систему</div>
          ${!owner ? h`<div class="helptext" style="margin-bottom:10px;">Роль и удаление сотрудников редактирует только руководитель службы.</div>` : ""}
          ${state.profiles.length===0 ? h`<div class="empty-state"><b>Пока никто не входил</b>Поделитесь ссылкой на это приложение с коллегами (кнопка «Пригласить коллегу» вверху).</div>` : h`
          <div class="table-wrap"><table>
            <thead><tr><th>Имя</th><th>Почта</th><th>Роль</th><th>Статус</th><th>Telegram</th>${owner?h`<th></th>`:''}</tr></thead>
            <tbody>${state.profiles.map(function(m){
              var isSelf = state.me && m.id===state.me.id;
              var chatIdFilled = !!(m.telegram_chat_id && String(m.telegram_chat_id).trim());
              // 0.4.4: «Администратор» может быть только один — сам владелец
              // (см. isOwner()/OWNER_EMAIL выше). Поэтому эта роль убрана из
              // выпадающего списка для всех, КРОМЕ строки самого владельца —
              // назначить её больше никому нельзя. Если у кого-то она уже
              // почему-то стояла (старые данные до 0.4.4), защитный вариант
              // ниже не даёт списку "потерять" текущее значение, но при первой
              // же смене роли human'ом она пропадёт из списка выбора.
              var rowIsOwner = m.email && m.email.toLowerCase()===OWNER_EMAIL.toLowerCase();
              var roleOptions = Object.keys(ROLE_LABEL).filter(function(r){ return rowIsOwner || r!=="dispatcher" || m.role==="dispatcher"; });
              return h`<tr>
                <td class="ttl">${escapeHtml(m.name||"—")}</td>
                <td class="muted">${escapeHtml(m.email)}</td>
                <td>
                  ${owner ? h`<select data-profile-role="${m.id}">
                    ${roleOptions.map(function(r){return h`<option value="${r}" ${m.role===r?'selected':''}>${ROLE_LABEL[r]}</option>`;}).join("")}
                  </select>` : escapeHtml(ROLE_LABEL[m.role]||m.role)}
                </td>
                <td>${owner
                  ? h`<button class="btn btn-sm ${m.active===false?'':'btn-ghost'}" data-action="profile-toggle-active" data-id="${m.id}" data-val="${m.active===false?1:0}">${m.active===false?'Включить':'Активен'}</button>`
                  : h`<span class="pill ${m.active===false?'pill-neutral':'pill-ok'}">${m.active===false?'Отключён':'Активен'}</span>`}</td>
                <td>${owner ? h`
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <input type="text" data-profile-telegram-chatid="${m.id}" value="${escapeHtml(m.telegram_chat_id||'')}" placeholder="Telegram ID" style="width:100px;" title="ID этого человека в Telegram — см. подсказку «Как узнать Telegram ID?» ниже">
                    <label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft);margin:0;" title="${chatIdFilled?'Присылать этому человеку сообщение о каждой новой заявке':'Сначала укажите Telegram ID — без него уведомления отправлять некуда'}">
                      <input type="checkbox" data-profile-telegram-notify="${m.id}" ${m.telegram_notify_tickets?'checked':''} ${chatIdFilled?'':'disabled'}> увед.
                    </label>
                    <label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft);margin:0;" title="${chatIdFilled?'Присылать этому человеку напоминание, если счёт больше 24ч «подан в оплату», но ещё не «оплачено»':'Сначала укажите Telegram ID — без него уведомления отправлять некуда'}">
                      <input type="checkbox" data-profile-telegram-notify-overdue="${m.id}" ${m.telegram_notify_overdue_payments?'checked':''} ${chatIdFilled?'':'disabled'}> увед. (просрочка оплаты)
                    </label>
                  </div>`
                  : ((m.telegram_notify_tickets||m.telegram_notify_overdue_payments) && chatIdFilled ? h`<span class="pill pill-ok">включены</span>` : h`<span class="muted">—</span>`)}
                </td>
                ${owner ? h`<td style="white-space:nowrap;">
                  <button class="btn btn-sm btn-ghost" data-action="edit-permissions" data-id="${m.id}" title="Полный список разделов и прав этого человека — можно свободно включать и выключать что угодно, даже то, что обычно даёт роль">Права</button>
                  ${m.role==="customer" ? h`<button class="btn btn-sm btn-ghost" data-action="edit-client-hotels" data-id="${m.id}" title="Какие объекты видит этот «Клиент» — заявки, отели, карта и отчёты ограничены только выбранными">Объекты${(m.client_hotel_ids&&m.client_hotel_ids.length)?(' ('+m.client_hotel_ids.length+')'):' (0)'}</button>` : ''}
                  ${isSelf?'':h`<button class="btn btn-sm btn-ghost btn-danger" data-action="profile-delete" data-id="${m.id}" data-label="${escapeHtml(m.name||m.email)}">Удалить</button>`}
                </td>` : ''}
              </tr>`;
            }).join("")}</tbody>
          </table></div>`}
          <div class="helptext" style="margin-top:12px;">Новые коллеги появляются здесь автоматически после первого входа по ссылке — сразу назначьте им роль. Ссылку на приложение можно скопировать кнопкой «Пригласить коллегу» вверху страницы.</div>
          ${owner ? h`<div class="helptext" style="margin-top:6px;"><a href="#" data-action="telegram-chatid-help">Как узнать Telegram ID для уведомлений?</a></div>` : ""}
        </div>
      </div>`;
  }

  function viewParts(){
    return h`
      <div class="two-col">
        <div class="card card-pad">
          <div class="section-title">Склад ЗИП</div>
          ${state.parts.length===0 ? h`<div class="empty-state"><b>Склад пуст</b>Добавьте позиции запчастей и материалов.</div>` : h`
          <div class="table-wrap"><table><thead><tr><th>Наименование</th><th class="num">Остаток</th><th>Ед.</th><th>Заметка</th><th></th></tr></thead>

              return h`<tr>
                <td class="ttl">${escapeHtml(p.name)}</td>

  // Реестр платежей — простой список прикреплённых к заявкам счетов: заявка,
  // отель, сам файл, дата добавления. Раньше здесь было 23 колонки 1:1 с
  // корпоративным Excel-файлом (поставщик, суммы, валюта, НДС, статья бюджета,
  // ERP-поля и т.д.) — по просьбе Антона все они убраны и с экрана, и из
  // выгрузки, т.к. заполнялись вручную и в этом приложении не нужны.
  // 0.2.17 (по просьбе Антона): «Валюта»/«НДС»/«Налог» в «Реестре платежей» —
  // тот же приём, что и «Сумма» (0.2.16) и поля «Отелей» (0.2.17, п.1): без
  // рамки, если уже выбрано, клик раскрывает настоящий <select> на его месте.
  // Только одно поле редактируется одновременно (как у "Сумма") — свой ключ
  // "<id счёта>:currency|vat|tax" в state.registryEditingFieldKey.
  function registrySelectRaw(iv, kind, disabled, title){
    var key = iv.id+":"+kind;
    if(kind==="currency"){
      return h`<select data-invoice-currency data-id="${iv.id}" data-registry-edit-focus="${key}" ${disabled?'disabled':''} title="${title}">
        <option value="">—</option>
        <option value="KZT" ${iv.currency==='KZT'?'selected':''}>KZT</option>
        <option value="RUB" ${iv.currency==='RUB'?'selected':''}>RUB</option>
        <option value="BYN" ${iv.currency==='BYN'?'selected':''}>BYN</option>
      </select>`;
    }

    var hotelsById = {};

    var seenTicketIds = {}, uniqueTicketRows = [];

    // заявок" (раньше она мешала под кнопкой "счёт" в соседней ячейке и тоже
    // норовила перенестись на вторую строку) — сама разбивка по заявкам

    var refCell = isGroup

      : uniqueTicketRows.map(function(r){

  }
