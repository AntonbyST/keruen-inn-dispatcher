  // Вставка таблицы для "Расходов" — тот же принцип, что и импорт из c-lector
  // (parseDelimited + угадывание колонок по заголовку), но своя, более узкая
  // карта полей и своя целевая таблица (cash_expenses, не tickets).
  function guessCashExpenseMapping(headers){
    var map = {}; var used = {};
    var patterns = {
      date: /дата/i,
      qty: /кол[-\s]?во|количество/i,
      unit_cost: /стоимост|цена/i,
      hotel: /мотель|отел|объект/i,
      // "№ Заявки" — проверяем раньше description, иначе широкий паттерн
      // описания перехватит колонку с номерами заявок.
      ticket: /заявк|№/i,
      description: /наименован|товар|расход|назван/i
    };
    Object.keys(patterns).forEach(function(field){
      for(var i=0;i<headers.length;i++){
        if(used[i]) continue;
        if(patterns[field].test(headers[i])){ map[field]=String(i); used[i]=true; return; }
      }
      map[field] = "";
    });
    return map;
  }
  function setCashImportData(headers, rows){
    state.cashImportFileError = "";
    state.cashImportHeaders = headers; state.cashImportRows = rows;
    state.cashImportMapping = guessCashExpenseMapping(headers);
    state.cashImportResult = null;
    render();
  }
  function parseMoney(raw){
    var n = Number(String(raw==null?"":raw).replace(/[^\d.,\-]/g,"").replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  // Строит превью строк для подтверждения перед вставкой — дата/мотель/заявка
  // уже разрешены в реальные объекты (или null, если не найдено/неоднозначно),
  // чтобы дальше и предпросмотр, и commitCashImport() читали готовое значение.
  // 0.4.5, п.5 (по просьбе Антона — прораб Веренков подгружает Excel, где
  // строка часто указывает СРАЗУ несколько заявок, напр. "437, 438, 452, 452,
  // 470, 472, 492"): раньше такая строка сохранялась вовсе БЕЗ привязки к
  // заявке (ticketAmbiguous=true). Теперь колонка "Заявка" разбирается тем же
  // parseTicketRefList, что и командировочные (см. addTravelExpense) —
  // одинаковый номер, встретившийся дважды, НЕ схлопывается в один (для
  // единообразия с уже принятым поведением командировочных), каждое
  // вхождение получает свою долю. Сумма делится поровну до целых
  // (splitAmountEvenly), количество — до сотых (splitQtyEvenly); опционально
  // можно явно указать долю конкретной заявки через "437:1000" — как и в
  // командировочных, остаток делится поровну между остальными. Такая строка
  // помечается isGroup=true и при сохранении (commitCashImport) разворачивается
  // в N строк cash_expenses с общим group_key — они показываются в «Наличных
  // расходах» одной сворачиваемой группой (см. viewCashExpenses).
  function buildCashImportPreview(){
    var m = state.cashImportMapping;
    function get(row, field){ var idx = m[field]; return (idx!==undefined && idx!=="" && row[idx]!=null) ? row[idx] : ""; }
    return state.cashImportRows.map(function(row){
      var dateRaw = get(row,"date"); var date = parseCLectorDate(dateRaw);
      var hotelName = get(row,"hotel"); var hotel = matchHotelByName(hotelName);
      var ticketRaw = String(get(row,"ticket")||"").trim();
      var refTokens = parseTicketRefList(ticketRaw);
      var ticket = null, ticketAmbiguous = false, isGroup = false, groupTickets = null, groupUnresolvedRefs = null;
      if(refTokens.length===1){
        var tid = resolveTicketRef(refTokens[0].ref);
        if(tid) ticket = state.tickets.find(function(x){return x.id===tid;});
      } else if(refTokens.length>1){
        isGroup = true;
        groupUnresolvedRefs = [];
        groupTickets = refTokens.map(function(tok){
          var gtid = resolveTicketRef(tok.ref);
          var gtk = gtid ? state.tickets.find(function(x){return x.id===gtid;}) : null;
          if(!gtk) groupUnresolvedRefs.push(tok.ref);
          return { ref: tok.ref, ticket: gtk, explicitAmount: tok.amount };
        }).filter(function(r){ return r.ticket; });
        if(!groupTickets.length){ isGroup = false; ticketAmbiguous = true; }
      }
      // 0.4.2 (по просьбе Антона, п.2): было Number(...) — при вставке из Excel
      // дробное количество приходит с запятой ("0,34"), а Number("0,34") это
      // NaN, поэтому кол-во молча превращалось в 1. parseMoney() уже умеет
      // разбирать и запятую, и точку (см. выше, "Цена" использует его же).
      var qty = parseMoney(get(row,"qty")) || 1;
      var unitCost = parseMoney(get(row,"unit_cost"));
      var amount = qty*unitCost;
      if(isGroup){
        var n = groupTickets.length;
        var explicitSum = groupTickets.reduce(function(s,r){ return s + (r.explicitAmount!=null?r.explicitAmount:0); }, 0);
        var autoRows = groupTickets.filter(function(r){ return r.explicitAmount==null; });
        var remaining = Math.round(amount) - Math.round(explicitSum);
        var amountShares = autoRows.length ? splitAmountEvenly(Math.max(remaining,0), autoRows.length) : [];
        var qtyShares = splitQtyEvenly(qty, n);
        var autoIdx = 0;
        groupTickets.forEach(function(r, i){
          r.qty = qtyShares[i];
          r.amount = r.explicitAmount!=null ? Math.round(r.explicitAmount) : amountShares[autoIdx++];
        });
      }
      return {
        description: get(row,"description") || "(без наименования)",
        dateRaw: dateRaw, date: date,
        hotelName: hotelName, hotel: hotel,
        ticketRaw: ticketRaw, ticket: ticket, ticketAmbiguous: ticketAmbiguous,
        isGroup: isGroup, groupTickets: groupTickets, groupUnresolvedRefs: groupUnresolvedRefs,
        qty: qty, unitCost: unitCost, amount: amount
      };
    });
  }
  function commitCashImport(category, person){
    if(!canEditCashExpenses()) return;
    var preview = buildCashImportPreview();
    if(!preview.length) return;
    var createdBy = myLabelWithRole();
    var finalCategory = (category==="crew") ? "crew" : "materials";
    var payload = [];
    preview.forEach(function(p){
      var dateStr = p.date ? p.date.toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
      if(p.isGroup){
        var groupKey = genGroupKey();
        p.groupTickets.forEach(function(r){
          payload.push({
            date: dateStr, description: p.description, qty: r.qty, unit_cost: p.unitCost, amount: r.amount,
            hotel_id: p.hotel ? p.hotel.id : null,
            ticket_id: r.ticket.id,
            category: finalCategory, person: person, created_by: createdBy,
            group_key: groupKey
          });
        });
      } else {
        payload.push({
          date: dateStr, description: p.description, qty: p.qty, unit_cost: p.unitCost, amount: p.amount,
          hotel_id: p.hotel ? p.hotel.id : null,
          ticket_id: p.ticket ? p.ticket.id : null,
          category: finalCategory, person: person, created_by: createdBy
        });
      }
    });
    // 0.4.6, п.3: та же немедленная развёртка, что и в addCashExpense — после
    // импорта прораб и все затронутые месяцы должны быть сразу видны в
    // «Расходах», а не спрятаны за свёрнутыми по умолчанию уровнями.
    state.cashExpandedExpensePersons = state.cashExpandedExpensePersons || {};
    state.cashExpandedExpensePersons[person] = true;
    state.cashExpandedExpenseMonths = state.cashExpandedExpenseMonths || {};
    payload.forEach(function(p){ state.cashExpandedExpenseMonths[person+"::"+String(p.date).slice(0,7)] = true; });
    state.cashImportBusy = true; render();
    sb.from("cash_expenses").insert(payload).then(function(res){
      state.cashImportBusy = false;
      if(res && res.error){ state.cashImportFileError = "Не удалось сохранить: " + res.error.message; render(); return; }
      state.cashImportResult = { count: payload.length };
      state.cashImportHeaders = []; state.cashImportRows = []; state.cashImportMapping = {};
      render();
      if(finalCategory==="materials"){
        payload.forEach(function(p){ if(p.ticket_id) maybeClearMaterialsCashPending(p.ticket_id); });
      }
    });
  }
  function resetCashImport(){ state.cashImportHeaders=[]; state.cashImportRows=[]; state.cashImportMapping={}; state.cashImportResult=null; state.cashImportFileError=""; state.cashImportGroupExpanded={}; render(); }
  // 0.4.5, п.5: файл Excel/CSV с отчётом прораба — тот же приём, что и
  // основной импорт заявок (см. loadImportFile выше): xlsx/xls через
  // XLSX.read, остальное — как разделённый текст. Раньше в «Наличных
  // расходах» можно было только ВСТАВИТЬ таблицу текстом.
  function loadCashImportFile(file){
    var ext = (file.name.split(".").pop()||"").toLowerCase();
    state.cashImportFileError = "";
    if(ext==="xlsx" || ext==="xls"){
      if(typeof XLSX==="undefined" || !XLSX.read){
        state.cashImportFileError = "Не удалось загрузить модуль для чтения Excel-файлов (возможно, заблокирован интернет/VPN). Обновите страницу и попробуйте снова, либо вставьте таблицу текстом ниже.";
        render();
        return;
      }
      readFileAsBuffer(file).then(function(buf){
        var wb = XLSX.read(buf, {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:""});
        aoa = aoa.filter(function(r){ return r.some(function(c){ return String(c||"").trim()!==""; }); });
        if(!aoa.length){ state.cashImportFileError = "Файл прочитан, но в нём не найдено ни одной строки с данными."; render(); return; }
        setCashImportData(aoa[0].map(String), aoa.slice(1));
      }).catch(function(err){
        state.cashImportFileError = "Не удалось прочитать файл: " + (err && err.message ? err.message : err) + ". Проверьте, что это корректный XLSX/XLS-файл, либо вставьте таблицу текстом ниже.";
        render();
      });
    } else {
      readFileAsText(file).then(function(text){
        var parsed = parseDelimited(text);
        if(!parsed.headers.length){ state.cashImportFileError = "Файл прочитан, но в нём не найдено ни одной строки с данными."; render(); return; }
        setCashImportData(parsed.headers, parsed.rows);
      }).catch(function(err){
        state.cashImportFileError = "Не удалось прочитать файл: " + (err && err.message ? err.message : err) + ".";
        render();
      });
    }
  }

  // 0.4.5, п.5 (по просьбе Антона): строки cash_expenses, полученные разбивкой
  // ОДНОЙ строки импорта на несколько заявок (см. buildCashImportPreview/
  // commitCashImport) ИЛИ одного перечисления через форму (см. addCashExpense,
  // разбивка на несколько заявок через запятую в поле "Заявка" — с 0.4.6
  // работает для любой категории, не только для бывших "командировочных"),
  // помечены общим group_key — в ленте «Расходы» их нужно показывать одной
  // сворачиваемой группой (тем же приёмом, что и общий счёт на несколько
  // заявок в «Реестре платежей», см. registryGroupRow — и, по просьбе Антона,
  // 0.4.6, визуально выделенной, см. .registry-group-row в <style>, иначе
  // такая группа сливается с обычными строками расходов), а не N независимыми
  // строками подряд. Строки без group_key (одна заявка на расход или совсем
  // без заявки) идут как раньше, по одной.
  function clusterCashExpenseRows(rows){
    var seenAt = {};
    var out = [];
    rows.forEach(function(e){
      if(e.group_key){
        if(seenAt.hasOwnProperty(e.group_key)){ out[seenAt[e.group_key]].rows.push(e); return; }
        seenAt[e.group_key] = out.length;
        out.push({ isGroup:true, key:e.group_key, rows:[e] });
      } else {
        out.push({ isGroup:false, row:e });
      }
    });
    return out;
  }

  // 0.4.3, п.1: третья вкладка «Финансы» — «Накладные расходы». Отдельный

  function viewOverhead(){
    var editable = canEditRegistry();
    var rows = (state.overheadExpenses||[]).slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    var categories = distinctOverheadCategories();

    function fmtSum(n){ return (Number(n)||0).toLocaleString("ru-RU", {maximumFractionDigits:2}); }
    var total = rows.reduce(function(s,e){ return s+(Number(e.amount)||0); }, 0);
    var byCategory = {};
    rows.forEach(function(e){ byCategory[e.category] = (byCategory[e.category]||0) + (Number(e.amount)||0); });
    var categoryTotals = Object.keys(byCategory).sort();

    return h`

          <div class="table-wrap"><table>
            <thead><tr><th>Статья</th><th class="num">Сумма</th></tr></thead>
            <tbody>${categoryTotals.map(function(c){

            }).join("")}</tbody>
            <tfoot><tr><td><b>Итого</b></td><td class="num mono"><b>${fmtSum(total)}</b></td></tr></tfoot>

        </div>

        <div class="card card-pad">
          <div class="section-title">Записи</div>
          <div class="table-wrap"><table>
            <thead><tr><th>Дата</th><th>Статья</th><th class="num">Сумма</th><th>Примечание</th><th>Файлы</th><th>Кто внёс</th>${editable?'<th></th>':''}</tr></thead>
            <tbody>${rows.length===0 ? h`<tr><td colspan="${editable?7:6}"><div class="empty-state"><b>Пока нет записей</b>Внесите накладной расход ниже.</div></td></tr>` :
              rows.map(function(e){
                return h`<tr>
                  <td class="mono muted" style="white-space:nowrap;">${fmtDateShort(e.date)}</td>
                  <td>${escapeHtml(e.category)}</td>
                  <td class="num mono">${fmtSum(e.amount)}</td>
                  <td class="muted">${escapeHtml(e.note||'')}</td>
                  <td style="font-size:12px;">${(Array.isArray(e.files)?e.files:[]).map(function(f){ return h`<div style="white-space:nowrap;"><a href="#" data-action="overhead-file-open" data-path="${escapeHtml(f.path)}" title="${escapeHtml(f.name||'')}">📎 ${escapeHtml(String(f.name||'файл').length>24?String(f.name).slice(0,22)+'…':(f.name||'файл'))}</a>${editable?h` <a href="#" data-action="overhead-file-delete" data-id="${e.id}" data-path="${escapeHtml(f.path)}" style="color:var(--crit);" title="Удалить файл">✕</a>`:''}</div>`; }).join("")}${editable?h`<label class="btn btn-ghost btn-sm" style="cursor:pointer;">＋ файл<input type="file" multiple data-overhead-file-upload="${e.id}" style="display:none;"></label>`:''}</td>
                  <td class="muted" style="white-space:nowrap;">${escapeHtml(e.created_by||'')}</td>
                  ${editable?h`<td><a href="#" data-action="overhead-expense-delete" data-id="${e.id}" style="color:var(--crit);">✕</a></td>`:''}
                </tr>`;
              }).join("")}
            </tbody>
          </table></div>
          ${editable ? h`<form id="overhead-expense-form" data-keep-draft class="field-row" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;">
            <div class="field"><label>Дата</label><input type="date" name="date" value="${todayIso}" required></div>
            <div class="field"><label>Статья</label><input type="text" name="category" list="overhead-categories" placeholder="напр. Зарплата бэк-офиса" required></div>

            <div class="field" style="grid-column:1/-1;"><label>Файлы (необязательно — счета, акты, чеки)</label><input type="file" name="files" multiple></div>
            <button class="btn btn-primary" type="submit">Добавить</button>

  }
  // Вставка таблицы отчёта прораба — тот же принцип, что и импорт из c-lector
  // (paste → угадать колонки → превью → подтвердить), но своя карта полей и
  // одна категория/один прораб на весь вставленный кусок (по умолчанию расходы
  // из одного отчёта — от одного и того же человека и одной категории; если
  // нет — проще вставить двумя кусками, чем городить выбор на каждую строку).
  function cashImportBlock(){
    if(state.cashImportResult){
      return h`<div class="card card-pad">
        <div class="section-title">Готово</div>
        <div class="stat-row"><div class="stat"><b>${state.cashImportResult.count}</b>строк добавлено</div></div>

        <div class="section-title">Импорт отчёта прораба</div>
        <div class="helptext" style="margin-bottom:8px;">Загрузите файл Excel/CSV (со строкой заголовков: Дата/Наименование/Кол-во/Стоимость/Мотель/№ Заявки — порядок колонок не важен), либо скопируйте таблицу и вставьте текстом ниже. Если в колонке «№ Заявки» указано сразу несколько номеров через запятую (напр. «437, 438, 452») — сумма и количество будут поровну распределены между этими заявками (см. предпросмотр далее).</div>
        <div class="field"><label>Файл (.xlsx, .xls, .csv)</label><input type="file" id="cash-import-file" accept=".csv,.txt,.xlsx,.xls" style="width:auto;"></div>
        <div class="field" style="margin-top:6px;"><label>…или вставьте таблицу текстом</label><textarea id="cash-import-paste" rows="6" placeholder="Вставьте скопированную таблицу (Ctrl+V)…"></textarea></div>

    var preview = buildCashImportPreview();
    var unresolvedHotel = preview.filter(function(p){return p.hotelName && !p.hotel;}).length;
    var ambiguousTicket = preview.filter(function(p){return p.ticketAmbiguous;}).length;
    var groupRowsCount = preview.filter(function(p){return p.isGroup;}).length;
    var groupsWithUnresolved = preview.filter(function(p){return p.isGroup && p.groupUnresolvedRefs && p.groupUnresolvedRefs.length;});
    var totalAmount = preview.reduce(function(s,p){return s+p.amount;}, 0);
    var actualRowCount = preview.reduce(function(s,p){ return s + (p.isGroup ? p.groupTickets.length : 1); }, 0);
    return h`<div class="card card-pad">
      <div class="section-title">Проверьте распознанные колонки</div>
      <div class="field-row" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        ${Object.keys(CASH_IMPORT_FIELD_LABEL).map(function(f){
          return h`<div class="field"><label>${CASH_IMPORT_FIELD_LABEL[f]}</label>
            <select data-cash-import-map="${f}">
              <option value="">— не использовать —</option>
              ${state.cashImportHeaders.map(function(hdr,i){ return h`<option value="${i}" ${String(state.cashImportMapping[f])===String(i)?'selected':''}>${escapeHtml(hdr)}</option>`; }).join("")}
            </select>
          </div>`;
        }).join("")}
      </div>
      <div class="field-row" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:6px;">
        <div class="field"><label>Категория (для всех строк)</label><select id="cash-import-category"><option value="materials">Материал</option><option value="crew">Работа</option></select></div>
        <div class="field"><label>Кто потратил (для всех строк)</label><input type="text" id="cash-import-person" list="cash-persons" placeholder="Имя прораба" required></div>
      </div>
      <div class="table-wrap" style="max-height:360px;overflow-y:auto;"><table>
        <thead><tr><th>Дата</th><th>Наименование</th><th class="num">Кол-во</th><th class="num">Цена</th><th class="num">Сумма</th><th>Мотель</th><th>Заявка</th></tr></thead>
        <tbody>${preview.map(function(p, idx){
          if(p.isGroup){
            var expanded = !!state.cashImportGroupExpanded[idx];
            var rows = h`<tr>
              <td class="mono ${p.date?'':'text-warn'}">${p.date ? fmtDateShort(p.date.toISOString()) : (p.dateRaw||'—')}</td>
              <td>${escapeHtml(p.description)}</td>
              <td class="num mono">${p.qty}</td>
              <td class="num mono">${p.unitCost}</td>
              <td class="num mono">${p.amount}</td>
              <td class="${p.hotelName && !p.hotel ? 'text-warn' : 'muted'}">${p.hotel ? ('№'+p.hotel.id+' '+escapeHtml(p.hotel.name)) : (p.hotelName || '—')}</td>
              <td class="mono">
                <button type="button" class="btn btn-ghost btn-sm" data-action="cash-import-group-toggle" data-id="${idx}" title="${expanded?'Свернуть':'Показать долю каждой заявки'}">${expanded?'▾':'▸'}</button>
                Общий на ${p.groupTickets.length} ${pluralRu(p.groupTickets.length,'заявку','заявки','заявок')}${p.groupUnresolvedRefs.length?h` <span class="text-warn" title="Эти номера не найдены среди заявок и будут пропущены: ${escapeHtml(p.groupUnresolvedRefs.join(', '))}">(не найдено: ${p.groupUnresolvedRefs.length})</span>`:''}
              </td>
            </tr>`;
            if(expanded){
              rows += p.groupTickets.map(function(r){
                return h`<tr class="muted">
                  <td></td><td style="padding-left:20px;">— ${escapeHtml(r.ticket.external_ref||r.ref)}</td>
                  <td class="num mono">${r.qty}</td><td class="num mono">—</td><td class="num mono">${r.amount}</td><td></td><td></td>
                </tr>`;
              }).join("");
            }
            return rows;
          }
          return h`<tr>
            <td class="mono ${p.date?'':'text-warn'}">${p.date ? fmtDateShort(p.date.toISOString()) : (p.dateRaw||'—')}</td>
            <td>${escapeHtml(p.description)}</td>
            <td class="num mono">${p.qty}</td>
            <td class="num mono">${p.unitCost}</td>
            <td class="num mono">${p.amount}</td>
            <td class="${p.hotelName && !p.hotel ? 'text-warn' : 'muted'}">${p.hotel ? ('№'+p.hotel.id+' '+escapeHtml(p.hotel.name)) : (p.hotelName || '—')}</td>
            <td class="mono muted">${p.ticketAmbiguous ? 'неск. заявок — без привязки' : (p.ticket ? escapeHtml(p.ticket.external_ref||'') : (p.ticketRaw||'—'))}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
      <div class="helptext" style="padding-top:8px;">Строк: ${preview.length} (после разбивки по заявкам — ${actualRowCount}). Сумма: ${totalAmount.toLocaleString("ru-RU")}.${unresolvedHotel?' Не распознан мотель у '+unresolvedHotel+' '+pluralRu(unresolvedHotel,'строки','строк','строк')+' — сохранится без мотеля.':''}${ambiguousTicket?' У '+ambiguousTicket+' '+pluralRu(ambiguousTicket,'строки','строк','строк')+' указано несколько заявок, но ни одна не распознана — сохранится без привязки к заявке.':''}${groupRowsCount?' '+groupRowsCount+' '+pluralRu(groupRowsCount,'строка','строки','строк')+' с несколькими заявками будут разбиты поровну (▸ — посмотреть долю каждой).':''}${groupsWithUnresolved.length?' Часть номеров в групповых строках не найдена среди заявок — эти доли будут пропущены (см. отметки выше).':''}</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-primary" id="cash-import-commit-btn" ${state.cashImportBusy?'disabled':''}>${state.cashImportBusy?'Сохраняю…':'Сохранить '+actualRowCount+' '+pluralRu(actualRowCount,'строку','строки','строк')}</button>
        <button class="btn btn-ghost" data-action="cash-import-reset">Отмена</button>
      </div>
      ${state.cashImportFileError ? h`<div class="banner" style="margin-top:12px;">${state.cashImportFileError}</div>` : ""}
    </div>`;
  }

  /* ============================== КАРТА (Leaflet + OpenStreetMap) ============================== */
  // 0.3.4 (по просьбе Антона): раньше карта требовала платный Google Maps
  // JavaScript API и отдельный ключ — теперь Leaflet с бесплатными тайлами
  // OpenStreetMap (см. вставку <link>/<script> в <head> в начале файла);
  // ключ вообще не нужен, детализация OSM с большим запасом покрывает то,
  // что здесь требуется (метки отелей поверх обычной карты страны/региона).
  var mapInstance = null, mapMarkers = [];
  // Метки на карте показывают количество активных (не закрытых/не отклонённых)
  // заявок по каждому отелю; клик по метке — переход в список заявок этого отеля.
  // Своя иконка (L.divIcon) вместо стандартной — чтобы число заявок было видно
  // прямо на метке, как раньше на Google-маркере (там это было готовым
  // свойством "label", у Leaflet своей текстовой метки на маркере нет).
  function mapMarkerIcon(count, name){
    return L.divIcon({
      className: "map-marker-icon",
      html: '<div class="map-marker-badge'+(count>0?' has-tickets':'')+'">'+count+'</div>'
          + '<div class="map-marker-label">'+escapeHtml(name||"")+'</div>',
      iconSize: [28,28], iconAnchor: [14,14]
    });
  }
  // 0.3.5 (по просьбе Антона): при наведении на метку — статистика по
  // замечаниям (заявкам) этого отеля: всего когда-либо заведено, и сколько
  // из них заведено за последние 7 дней (включая сегодняшний). Это ПОМИМО
  // числа на самой метке (то — только активные, не закрытые/не отклонённые
  // на сейчас).
  function hotelTicketStats(hotelId){
    var all = state.tickets.filter(function(t){ return t.hotel_id===hotelId; });
    var weekAgoMs = Date.now() - 7*24*60*60*1000;
    var last7 = all.filter(function(t){ return t.created_at && new Date(t.created_at).getTime() >= weekAgoMs; }).length;
    return { total: all.length, last7: last7 };
  }
  function mapHotelTooltipHtml(hotel, activeCount){
    var stats = hotelTicketStats(hotel.id);
    return '<div class="mht-title">№'+hotel.id+' '+escapeHtml(hotel.name)+'</div>'
      + '<div class="mht-row"><span>Активных заявок сейчас</span><b>'+activeCount+'</b></div>'
      + '<div class="mht-row"><span>Всего замечаний</span><b>'+stats.total+'</b></div>'
      + '<div class="mht-row"><span>За последние 7 дней</span><b>'+stats.last7+'</b></div>';
  }
  function ensureMap(){
    if(!MAPS_LIB_LOADED) return;
    var container = document.getElementById("map-canvas");
    if(!container) return;
    var counts = {};
    state.tickets.filter(isActive).forEach(function(t){ counts[t.hotel_id]=(counts[t.hotel_id]||0)+1; });
    // 0.3.4: #map-canvas — часть шаблона раздела "Карта" и уничтожается
    // morphdom'ом при уходе с этого раздела (его нет в шаблоне других
    // разделов); при возврате на "Карту" появляется заново с тем же id, но
    // это уже ДРУГОЙ узел DOM. Старый экземпляр Leaflet, привязанный к
    // прежнему узлу, в этом случае сносим и создаём заново на новом —
    // иначе карта останется пустой (Leaflet рисует только в тот div, на
    // котором был создан).
    if(mapInstance && mapInstance.getContainer()!==container){
      mapInstance.remove();
      mapInstance = null;
      mapMarkers = [];
    }
    if(!mapInstance){
      // 0.3.7 (по просьбе Антона, п.1): "когда я делаю скролл, он увеличивает
      // карту, а не продвигает страницу вниз" — по умолчанию Leaflet сам
      // перехватывает колесо мыши над картой для зума. Отключаем это —
      // прокрутка колесом над картой теперь листает страницу как обычно;
      // зум остаётся доступен через +/- в углу карты и двойной клик.
      mapInstance = L.map(container, {scrollWheelZoom:false}).setView([48.0, 68.0], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(mapInstance);
    } else {
      // тот же самый div, но раздел мог быть скрыт/показан заново (или
      // изменился размер окна) — обновляем размер тайлов на всякий случай.
      mapInstance.invalidateSize();
    }
    mapMarkers.forEach(function(m){ mapInstance.removeLayer(m); });
    mapMarkers = [];
    // 0.4.8, п.2: «Клиент» видит на карте только свои объекты.
    visibleHotelsForMe().forEach(function(hotel){
      if(hotel.lat==null || hotel.lng==null) return;
      var count = counts[hotel.id]||0;
      var marker = L.marker([hotel.lat, hotel.lng], { icon: mapMarkerIcon(count, hotel.name) }).addTo(mapInstance);
      // 0.3.5: своя всплывающая подсказка (см. mapHotelTooltipHtml) вместо
      // обычного title="" — так в неё помещается несколько строк статистики
      // вместо одной строки, и оформление совпадает с темой приложения.
      marker.bindTooltip(mapHotelTooltipHtml(hotel, count), { direction:"top", offset:[0,-16], opacity:1, className:"map-hotel-tip" });
      marker.on("click", function(){
        state.filters = state.filters||{}; state.filters.hotel = String(hotel.id); state.filters.statusList=[]; state.filters.zone=""; state.filters.q="";
        location.hash = "#/tickets";
      });
      mapMarkers.push(marker);
    });
  }
  function viewMap(){
    if(!MAPS_LIB_LOADED){
      return h`<div class="card card-pad">
        <div class="section-title">Карта отелей</div>
        <p style="font-size:13px;">Не удалось загрузить карту (библиотека Leaflet с CDN) — проверьте подключение к интернету и обновите страницу. Остальное приложение работает как обычно.</p>
      </div>`;
    }
    return h`<div class="card card-pad">
      <div class="section-title">Карта отелей — открытые заявки</div>
      <div id="map-canvas"></div>
      <div class="helptext" style="margin-top:10px;">Число на метке — количество активных заявок по объекту. Наведите курсор на метку, чтобы увидеть статистику по замечаниям (всего и за последние 7 дней). Нажмите на метку, чтобы перейти к списку заявок этого отеля. Карта — OpenStreetMap.</div>
    </div>`;
  }

  /* ============================== ИСПОЛНИТЕЛИ ============================== */
  // 0.4.5, п.3 (по просьбе Антона): "Бригады" переработаны в плоский справочник
  // отдельных фамилий "Исполнители" — люди свободно переходят от заявки к
  // заявке, а не закреплены за постоянной бригадой (см. комментарий у
  // createCrew выше). 0.4.6: заявку теперь может вести сразу несколько
  // исполнителей (tickets.crew_names) — ticketPerformers() отдаёт их списком
  // (и сама подчищает легаси-префикс "Бригада: " у старых записей assigned_to,
  // если crew_names почему-то пуст), поэтому здесь достаточно проверить
  // includes.
  function crewActiveCount(crewName){
    return state.tickets.filter(function(t){ return ticketPerformers(t).indexOf(crewName)!==-1 && !isTicketDone(t); }).length;
  }
  function viewCrews(){
    // по просьбе Антона: раньше каждый исполнитель занимал целую широкую
    // карточку, а форма добавления жила в отдельном "тяжёлом" блоке справа —
    // теперь аккуратная таблица (строка на исполнителя), форма добавления —
    // просто последняя строка той же таблицы.
    return h`
      <div class="card card-pad">
        <div class="section-title">Исполнители</div>
        <div class="helptext" style="margin-bottom:10px;">Справочник фамилий тех, кого назначают исполнителем в пункте «Бригада» карточки заявки — один человек, а не бригада с постоянным составом (он может переходить от заявки к заявке). Пополняется и отсюда, и автоматически — если в карточке заявки вписать новое имя вручную.</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Фамилия И.О.</th><th style="width:120px;">В работе</th><th style="width:1%;"></th></tr></thead>
          <tbody>
            ${state.crews.length===0 ? h`<tr><td colspan="3"><div class="empty-state"><b>Исполнителей пока нет</b>Добавьте первого ниже.</div></td></tr>` :

  /* ============================== ОТЕЛИ ============================== */
  function addHotel(name, zone, lat, lng){
    if(!name || !name.trim()){ alert("Введите название отеля."); return; }
    sb.from("hotels").insert({
      name: name.trim(), zone: zone? Number(zone): null, in_service:true,
      lat: (lat!==""&&lat!=null)? Number(lat): null, lng: (lng!==""&&lng!=null)? Number(lng): null
    }).then(function(res){ if(res && res.error) alert("Не удалось добавить отель: "+res.error.message); });
  }
  function updateHotelField(id, field, val){
    var patch = {};
    if(field==="zone") patch.zone = val===""? null : Number(val);
    else if(field==="lat" || field==="lng" || field==="rooms" || field==="area_m2") patch[field] = val===""? null : Number(val);
    else patch[field] = val;
    sb.from("hotels").update(patch).eq("id", id).then(function(){});
  }
  function toggleHotelActive(id, makeActive){ sb.from("hotels").update({in_service: makeActive}).eq("id", id).then(function(){}); }
  function deleteHotel(id){
    var used = state.tickets.some(function(t){ return Number(t.hotel_id)===Number(id); });
    if(used){ alert("Нельзя удалить отель, по которому уже есть заявки в системе — история должна остаться привязана к отелю. Вместо удаления снимите галочку «В эксплуатации»: он перестанет предлагаться для новых заявок, но старые не пострадают."); return; }
    if(!confirm("Удалить отель?")) return;
    sb.from("hotels").delete().eq("id", id).then(function(){});
  }
  // 0.2.17: «Зона» / «Координаты» / «Лицо от Заказчика» в «Отелях» — обычный
  // текст без рамки поля ввода, если уже заполнено; клик раскрывает
  // настоящее поле (или группу полей) ввода на его месте — тот же приём,
  // что и у «Суммы» в «Реестре платежей» (0.2.16). Пока поле пустое,
  // раскрытым остаётся сразу поле ввода (заполнять есть что). «Название» в
  // этот приём не входит — оно обязательное и всегда обычный input.
  function hotelZoneCell(x){
    var key = x.id+":zone";
    if(state.hotelEditingKey!==key && x.zone){
      return h`<button type="button" class="hotel-field-display" data-action="hotel-field-edit" data-key="${key}">Зона ${x.zone}</button>`;
    }
    return h`<div data-hotel-edit-group="${key}">
      <select data-hotel-field="zone" data-id="${x.id}" data-hotel-edit-focus="${key}">
        <option value="">—</option>
        ${[1,2,3].map(function(z){return h`<option value="${z}" ${x.zone===z?'selected':''}>Зона ${z}</option>`;}).join("")}
      </select>
    </div>`;
  }
  function hotelCoordsCell(x){
    var key = x.id+":coords";
    var filled = x.lat!=null && x.lat!=="" && x.lng!=null && x.lng!=="";
    if(state.hotelEditingKey!==key && filled){
      return h`<button type="button" class="hotel-field-display" data-action="hotel-field-edit" data-key="${key}">${x.lat}, ${x.lng}</button>`;
    }
    return h`<div data-hotel-edit-group="${key}" style="display:flex;gap:4px;">
      <input type="number" step="0.0001" data-hotel-field="lat" data-id="${x.id}" data-hotel-edit-focus="${key}" value="${x.lat!=null?x.lat:''}" placeholder="широта" style="width:96px;">
      <input type="number" step="0.0001" data-hotel-field="lng" data-id="${x.id}" value="${x.lng!=null?x.lng:''}" placeholder="долгота" style="width:96px;">
    </div>`;
  }
  function hotelContactCell(x){
    var key = x.id+":contact";
    var filled = !!(x.client_contact_name || x.client_contact_position || x.client_contact_phone);
    if(state.hotelEditingKey!==key && filled){
      return h`<button type="button" class="hotel-field-display" data-action="hotel-field-edit" data-key="${key}">
          ${x.client_contact_name?escapeHtml(x.client_contact_name):h`<span class="muted">без ФИО</span>`}
          ${x.client_contact_position?h`<div class="muted" style="font-size:11px;">${escapeHtml(x.client_contact_position)}</div>`:""}
          ${x.client_contact_phone?h`<div style="font-size:11px;">${escapeHtml(x.client_contact_phone)}</div>`:""}
        </button>${x.client_contact_phone ? h`<a href="tel:${escapeHtml(x.client_contact_phone.replace(/[^\d+]/g,''))}" style="font-size:11px;">Позвонить</a>` : ""}`;
    }
    return h`<div data-hotel-edit-group="${key}">
      <input type="text" data-hotel-field="client_contact_name" data-id="${x.id}" data-hotel-edit-focus="${key}" value="${escapeHtml(x.client_contact_name||'')}" placeholder="ФИО (необязательно)" style="width:100%;margin-bottom:3px;">
      <div style="display:flex;gap:4px;">
        <input type="text" data-hotel-field="client_contact_position" data-id="${x.id}" value="${escapeHtml(x.client_contact_position||'')}" placeholder="должность" style="flex:1;min-width:0;font-size:12px;">
        <input type="text" data-hotel-field="client_contact_phone" data-id="${x.id}" value="${escapeHtml(x.client_contact_phone||'')}" placeholder="телефон" style="flex:1;min-width:0;font-size:12px;">
      </div>
      ${x.client_contact_phone ? h`<a href="tel:${escapeHtml(x.client_contact_phone.replace(/[^\d+]/g,''))}" style="font-size:11px;">Позвонить</a>` : ""}
    </div>`;
  }
  // 0.4.8, п.2: у «Клиента» «Отели» — только просмотр своих объектов, без
  // возможности переименовать/удалить/включить-выключить чужой (или свой)

  function viewImport(){

  function viewImportInner(){

            <div class="stat"><b>${c["no-hotel"]}</b>не распознан отель</div>

    if(state.importHeaders.length===0){

      return h`

            <div class="field"><textarea id="import-paste" rows="6" placeholder="Вставьте скопированную таблицу (Ctrl+V)…"></textarea></div>
            <button class="btn btn-primary" id="import-parse-btn">Разобрать вставленные данные</button>
            <div class="helptext" style="margin:12px 0 6px;">— или —</div>
            <div class="dropzone">
              <input type="file" id="import-file" accept=".csv,.txt,.xlsx,.xls" style="width:auto;">
              <div style="margin-top:6px;">CSV, TXT или XLSX-файл выгрузки из c-lector</div>
            </div>
            ${state.importFileError ? h`<div class="banner" style="margin-top:12px;">${state.importFileError}</div>` : ""}
          </div>
          <div class="card card-pad">
            <div class="section-title">Автосинхронизация по API</div>
            <div class="kv"><span class="k">Последняя синхронизация</span><span class="v">${lastSync ? fmtDate(lastSync.imported_at) : "ещё не было"}</span></div>
            <div class="helptext" style="margin:10px 0 14px;">Если давно не обновлялось — проверьте расписание и ключ API в Supabase (Edge Functions → clector-sync → Logs).</div>
            <div class="section-title">Как работает ручной перенос (запасной путь)</div>
            <div class="kv"><span class="k">1</span><span class="v" style="text-align:left;">Вставляете или загружаете таблицу заявок</span></div>
            <div class="kv"><span class="k">2</span><span class="v" style="text-align:left;">Сопоставляете колонки c-lector с полями платформы</span></div>

            <div class="helptext" style="margin-top:10px;">Повторный импорт того же файла не создаст дублей, если в c-lector есть номер заявки — используйте его как «внешний номер».</div>

    var preview = computeImportPreview();
    var fieldLabel = {external_ref:"Внешний номер (для защиты от дублей)", hotel:"Отель", description:"Описание", group:"Группа критичности (1/2/3)", created_at:"Дата создания", status:"Статус (из c-lector)", deadline:"Срок устранения (из c-lector)", location:"Локация/комната (необязательно)", case_type:"Гарантия/не гарантия (необязательно)"};
    var fieldOrder = ["hotel","description","location","external_ref","status","deadline","case_type","group","created_at"];
    return h`
      <div class="row-gap">
        <div class="card card-pad">
          <div class="section-title">2. Сопоставьте колонки</div>
          <div class="field-row" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">
            ${fieldOrder.map(function(f){
              return h`<div class="field"><label>${fieldLabel[f]}</label>
                <select data-import-map="${f}">
                  <option value="">— не использовать —</option>
                  ${state.importHeaders.map(function(hdr,i){ return h`<option value="${i}" ${String(state.importMapping[f])===String(i)?'selected':''}>${escapeHtml(hdr)}</option>`; }).join("")}

            return h`<tr>

                    </label>
                  </div>` : ""}
                  ${performers.length ? h`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px;">

                      <span style="flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(name)}</span>
                      <button type="button" class="btn btn-sm btn-ghost btn-danger" data-action="crew-performer-remove" data-id="${t.id}" data-name="${escapeHtml(name)}" title="Убрать с заявки">✕</button>
                    </div>`; }).join("")}

                  ${/* добавление исполнителя доступно, пока не отмечено "не нужна" —

                       всегда сбрасывает crew_not_needed при добавлении), и
                       чекбокс, и кнопки добавления пропадали бы одновременно —
                       без единого способа выбраться из этого состояния через
                       интерфейс. */ (!crewNotNeeded || crewReal) ? h`
                  <div class="actions-row" style="margin-bottom:8px;">

                      <option value="">+ добавить исполнителя из списка…</option>

                      ${state.crews.length ? h`<optgroup label="Исполнители">${state.crews.map(function(c){return h`<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`;}).join("")}</optgroup>` : ""}

                  <div class="actions-row" style="margin-bottom:8px;">
                    <input type="text" id="crew-performer-free-input" data-id="${t.id}" placeholder="…или впишите имя вручную" style="max-width:240px;">

                  </div>` : ""}
                  ${crewCash.length ? h`<div class="helptext" style="margin-bottom:8px;">Оплачено наличными (Работа, в т.ч. командировочные): ${fmtCashSum(crewCashTotal)} (${crewCash.length} ${ruPlural(crewCash.length,["запись","записи","записей"])}) — подтянуто автоматически из «Наличные расходы».</div>` : ""}
                  ${milestoneInvoiceList(t, "crew")}
                  ${(crewGrandTotal>0) ? h`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
                    <span style="font-size:12.5px;color:var(--ink-soft);font-weight:600;">Итого по работе <span class="muted" style="font-weight:500;">(без НДС)</span></span>
                    <b class="mono" style="font-size:15px;color:var(--accent);" title="${crewInvoiceIncomplete?'Не все суммы по счетам ещё посчитаны (курс/доля) — итог может увеличиться':'Счета (без НДС, с доп. налогом) + наличные'}">${fmtCashSum(crewGrandTotal)} ₸${crewInvoiceIncomplete?' (не все суммы учтены)':''}</b>
                  </div>` : ""}`
              })}
              ${milestoneRow({
                key: "materials",
                icon: MS_ICON.materials,
                done: materialsDone,
                warn: materialsWarn,
                clickable: false,
                title: materialsDone ? (t.materials_not_needed ? "Материал не требуется" : "Материал оплачен") : (materialsWarn ? (invoicesFor(t,"materials").some(function(iv){return !iv.paid;}) ? "Счёт приложен, ещё не оплачен" : "Отмечено «оплачено за наличные», ждём запись в «Наличные расходы»") : "Материал ещё не приобретён"),
                meta: h`
                  ${materialsFiles ? h`<span class="milestone-meta">${materialsFiles} ${ruPlural(materialsFiles,["файл","файла","файлов"])}</span>` : ""}
                  ${milestoneAttachControl({cls:"ms-quick-attach", id:t.id, category:"materials", accept:"application/pdf,image/*", multiple:true, title:"Прикрепить счёт/накладную (можно сразу несколько)"})}`,
                body: h`
                  <div class="actions-row" style="margin-bottom:8px;align-items:center;">
                    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:400;margin:0;">
                      <input type="checkbox" data-action="materials-not-needed-toggle" data-id="${t.id}" data-val="${t.materials_not_needed?'0':'1'}" ${t.materials_not_needed?'checked':''}>
                      Материал не нужен
                    </label>
                  </div>
                  ${(!t.materials_not_needed && !materialsCash.length) ? h`
                  <div class="actions-row" style="margin-bottom:8px;align-items:center;">
                    <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:400;margin:0;">
                      <input type="checkbox" data-action="materials-cash-pending-toggle" data-id="${t.id}" data-val="${t.materials_cash_pending?'0':'1'}" ${t.materials_cash_pending?'checked':''}>
                      Оплачено за наличные
                    </label>
                  </div>
                  ${t.materials_cash_pending ? h`<div class="helptext" style="margin-bottom:8px;">Ожидает записи в «Финансы → Наличные расходы» (категория «Материал», эта заявка) — как только прораб внесёт расход, подвяжется сюда автоматически и статус станет зелёным.</div>` : ""}` : ""}
                  ${materialsCash.length ? h`<div class="helptext" style="margin-bottom:8px;">Оплачено наличными: ${fmtCashSum(materialsCashTotal)} (${materialsCash.length} ${ruPlural(materialsCash.length,["запись","записи","записей"])}) — подтянуто автоматически из «Наличные расходы».</div>` : ""}
                  ${t.status==="onsite" ? h`<div class="actions-row" style="margin-bottom:8px;"><button class="btn btn-sm" data-action="materials" data-id="${t.id}">Нужны материалы…</button></div>` : ""}
                  ${t.materials_wait ? h`<div class="helptext" style="margin-bottom:8px;">Ожидаются материалы (срок поставки: ${fmtDateShort(t.materials_eta)}).</div>` : ""}
                  ${materialsFiles ? h`<div class="helptext" style="margin-bottom:8px;">Оплата счёта отмечается галочкой «Оплачено» в «Реестре платежей».</div>` : ""}
                  ${milestoneInvoiceList(t, "materials")}
                  ${(materialsGrandTotal>0) ? h`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">

                  </div>` : ""}`
              })}
              ${milestoneRow({
                key: "work",
                icon: MS_ICON.work,
                done: workDone,
                clickable: true,
                toggleAction: "work-manual-toggle", toggleId: t.id, toggleVal: workDone?'0':'1',
                title: workDone ? "Работа отмечена выполненной" : "Работа ещё не выполнена",
                meta: "",
                // 0.4.5, п.4 (по просьбе Антона): поле "Кол-во часов" (repair_hours)
                // убрано из интерфейса — им фактически никто не пользовался, остаётся
                // только сам ручной флажок "выполнено/не выполнено" (см. иконку выше).
                // Колонку repair_hours в базе не трогаем (просто больше не показываем
                // и не редактируем), body теперь пустое — см. пункт про пустое body у
                // milestoneRow ниже, стрелка разворачивания у "Работы" из-за этого
                // больше не показывается.
                body: ""
              })}
              ${milestoneRow({
                key: "act",
                icon: MS_ICON.act,
                done: actDone,
                clickable: !actHasFile,
                toggleAction: "act-signed-toggle", toggleId: t.id, toggleVal: actDone?'0':'1',
                title: actDone ? (actHasFile ? "Акт подписан" : (actPhotoCount ? "Акт подтверждён по фото-доказательству" : "Акт отмечен вручную (без файла)")) : "Акт ещё не подписан",
                meta: h`
                  ${actPhotoCount ? h`<span class="milestone-meta">${actPhotoCount} фото</span>` : ""}
                  ${actHasFile ? "" : milestoneAttachControl({cls:"ms-quick-act", id:t.id, accept:"application/pdf,image/*", title:"Прикрепить акт"})}`,
                body: h`
                  ${actHasFile ? h`<div class="actions-row" style="margin-bottom:8px;">
                    <button type="button" class="btn btn-sm" data-action="act-open" data-path="${escapeHtml(t.act_file_path||'')}">${escapeHtml(t.act_file_name||'Файл акта')}</button>
                    <button type="button" class="btn btn-sm btn-ghost" data-action="act-clear" data-id="${t.id}">Снять отметку</button>
                  </div>` : (actDone ? h`<div class="helptext" style="margin-bottom:8px;">${actPhotoCount ? "Подтверждён фото-доказательством (ниже), без файла акта." : "Отмечено вручную, без файла."}</div>` : h`<div class="muted" style="font-size:12.5px;margin-bottom:8px;">Акт ещё не прикреплён.</div>`)}
                  <div class="helptext" style="margin-bottom:6px;">Фото-доказательства выполненной работы (отдельно от замечаний в разделе «Фото» ниже):</div>
                  ${actPhotoGrid(t)}
                  <label class="btn btn-sm" style="margin-top:8px;position:relative;overflow:hidden;align-self:flex-start;display:inline-flex;width:fit-content;">
                    Прикрепить фото к акту
                    <input type="file" class="ms-quick-act-photo" data-id="${t.id}" accept="image/*" capture="environment" multiple style="position:absolute;inset:0;opacity:0;cursor:pointer;">
                  </label>
                  <div class="helptext" style="margin-top:12px;margin-bottom:6px;">Табель на выполненные работы (для расчёта зарплаты):</div>
                  ${t.timesheet_ref_ticket_id ? (function(){
                      var ref = state.tickets.find(function(x){return x.id===t.timesheet_ref_ticket_id;});
                      var refLabel = ref ? (ref.external_ref ? ("№ "+escapeHtml(ref.external_ref)) : escapeHtml(ref.id)) : "заявки (не найдена в списке)";
                      return h`<div class="actions-row" style="align-items:center;">
                        <span class="pill pill-neutral">Учтён в заявке ${refLabel}</span>
                        ${ref ? h`<button type="button" class="btn btn-ghost btn-sm" data-open-ticket="${ref.id}">Открыть</button>` : ""}
                        <button type="button" class="btn btn-ghost btn-sm" data-action="timesheet-ref-clear" data-id="${t.id}">Снять</button>
                      </div>`;
                    })() : (t.timesheet_file_path ? h`
                    <div class="actions-row">
                      <button type="button" class="btn btn-sm" data-action="timesheet-open" data-path="${escapeHtml(t.timesheet_file_path)}">${escapeHtml(t.timesheet_file_name||'Файл табеля')}</button>
                      <button type="button" class="btn btn-sm btn-ghost" data-action="timesheet-clear" data-id="${t.id}">Удалить</button>
                    </div>` : h`
                    <div class="actions-row" style="flex-wrap:wrap;">
                      <label class="btn btn-sm" style="position:relative;overflow:hidden;">
                        Прикрепить табель
                        <input type="file" class="ms-quick-timesheet" data-id="${t.id}" accept="application/pdf,image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
                      </label>
                      <button type="button" class="btn btn-ghost btn-sm" data-action="timesheet-ref-set" data-id="${t.id}">Табель учтён в другой заявке…</button>
                    </div>`)}`
              })}`;
            })()}
          </div>
          ${t.status==="onsite" ? h`<div>
            <div class="section-title">Категория (по осмотру)</div>
            ${t.source==='c-lector' ? h`
              <div class="kv"><span class="k">Категория</span><span class="v">${t.case_type? CASE_LABEL[t.case_type]:'ещё не пришла из c-lector'}</span></div>
              <div class="helptext">Гарантия/не гарантия для заявок из c-lector приходит из выгрузки — вручную не редактируется (см. импорт).</div>
            ` : h`
              <select id="case-select" data-id="${t.id}">
                <option value="">Не определена</option>
                <option value="warranty" ${t.case_type==='warranty'?'selected':''}>Гарантийный случай</option>
                <option value="nonwarranty" ${t.case_type==='nonwarranty'?'selected':''}>Негарантийный случай</option>
                <option value="unfounded" ${t.case_type==='unfounded'?'selected':''}>Необоснованная заявка</option>
              </select>
              <div class="helptext">Влияет на расчёт оплаты по Регламенту (п.5.1–5.4).</div>
            `}
          </div>` : ""}
          <div>
            <div class="section-title">Карточка заявки</div>
            ${t.external_status ? h`<div class="kv"><span class="k">Статус в c-lector</span><span class="v">${externalStatusPill(t.external_status)}</span></div>` : ""}
            <div class="kv"><span class="k">Зарегистрирована</span><span class="v">${fmtDate(t.created_at).split(" ")[0]}</span></div>
            <div class="kv"><span class="k">Исполнитель</span><span class="v">${ticketPerformers(t).length? escapeHtml(ticketPerformers(t).join(", ")):'—'}</span></div>
            <div class="kv"><span class="k">Категория</span><span class="v">${t.case_type? CASE_LABEL[t.case_type]:'—'}</span></div>
            <div class="kv"><span class="k">Срок устранения</span><span class="v" style="${(!di.done && t.resolution_deadline && new Date(t.resolution_deadline).getTime()<Date.now())?'color:var(--crit);font-weight:600;':''}">${t.resolution_deadline? fmtDate(t.resolution_deadline): "не указан (нет данных c-lector)"}</span></div>
            <div class="kv"><span class="k">Наряд-задание</span><span class="v mono">${workOrderNo(t)}</span></div>
          </div>
          ${clectorSyncSection(t)}
          ${(function(){
            var cost = ticketCostTotal(t);
            if(!cost.invoiceCount && !cost.cashCount) return "";
            var fmt = function(n){ return (Number(n)||0).toLocaleString("ru-RU", {maximumFractionDigits:2}); };
            return h`<div>
              <div class="section-title">Затраты по заявке ${infoTip("Сумма оплаченных счетов (Бригада + Материал, без НДС, с доп. налогом по способу оплаты — как в «Итого по работе»/«Итого по материалам» выше) и наличных расходов, привязанных к этой заявке. Неоплаченные счета сюда не входят — деньги ещё не потрачены. Если прорабу, оплатившему расход, в «Финансы → Наличные расходы → Выдачи» указан способ учёта («Учтено в затратах»), сумма расхода досчитывается с наценкой по его ставке (напр. нал. 30%: 1000 ₸ расхода войдёт сюда как 1429 ₸) — раздел «Наличные расходы» при этом продолжает показывать сумму как есть, реально оплаченную.")}</div>
              <div class="cost-summary">
                <div class="cost-summary-total">
                  <span class="cost-summary-total-label">Итого потрачено</span>
                  <span class="cost-summary-total-value">${fmt(cost.total)} ₸${cost.incomplete?' <span style="font-size:11px;font-weight:600;color:var(--warn);white-space:normal;">(не все суммы учтены)</span>':''}</span>
                </div>
                ${(cost.invoiceCount || cost.cashCount) ? h`<div class="cost-summary-breakdown">
                  ${cost.invoiceCount ? h`<div class="cost-summary-item"><span class="cost-summary-item-label">из них по счетам</span><span class="cost-summary-item-value">${fmt(cost.invoiceSum)} ₸ <span class="count">(${cost.invoiceCount})</span></span></div>` : ""}
                  ${cost.cashCount ? h`<div class="cost-summary-item"><span class="cost-summary-item-label">из них наличными</span><span class="cost-summary-item-value">${fmt(cost.cashSum)} ₸ <span class="count">(${cost.cashCount})</span></span></div>` : ""}
                </div>` : ""}
                ${(function(){
                  if(isClientRole()) return "";
                  var ov = ticketOverheadShare(t).share;
                  if(!(ov>0)) return "";
                  return h`<div class="cost-summary-breakdown" data-cost="overhead">
                    <div class="cost-summary-item"><span class="cost-summary-item-label">накладные (распределённые) ${infoTip("Доля накладных расходов компании, приходящаяся на эту заявку: каждый её расход × процент накладных того месяца (накладные ÷ прямые расходы месяца), см. «Финансы → Отчёты».")}</span><span class="cost-summary-item-value">${fmt(ov)} ₸</span></div>
                    <div class="cost-summary-item"><span class="cost-summary-item-label">полная стоимость</span><span class="cost-summary-item-value"><b>${fmt(cost.total+ov)} ₸</b></span></div>
                  </div>`;
                })()}
                ${cost.missingAmountCount ? h`<div class="cost-summary-warn">⚠ ${cost.missingAmountCount===1?'По одному отмеченному «оплачено» счёту':'По '+cost.missingAmountCount+' отмеченным «оплачено» счетам'} ещё не указана сумма (или доля этой заявки) в «Реестре платежей» — сюда пока не включено.</div>` : ""}
              </div>
            </div>`;
          })()}
          ${legacyInvoiceSection(t)}
          <div>
            <div class="section-title">Фото ${infoTip("Фото замечания — то, что видно при осмотре (\"до\"). Фото-доказательства выполненной работы прикладываются отдельно, к пункту «Акт» в чек-листе «Ход работ» выше.")}</div>
            ${milestonePhotoGrid(t)}
            <label class="btn btn-sm" style="margin-top:10px;position:relative;overflow:hidden;align-self:flex-start;display:inline-flex;width:fit-content;">
              Прикрепить фото
              <input type="file" class="ms-quick-photo" data-id="${t.id}" accept="image/*" capture="environment" multiple style="position:absolute;inset:0;opacity:0;cursor:pointer;">
            </label>
          </div>
          <div>
            <div class="section-title">Журнал</div>
            <div class="journal-list">${state.ticketNotes.slice().reverse().map(function(n){
              if(state.editingNoteId===n.id){
                return h`<form class="note-edit-form" data-note-id="${n.id}" style="display:flex;gap:6px;margin-bottom:7px;">
                  <input type="text" name="text" value="${escapeHtml(n.note_text)}" style="flex:1;">
                  <button class="btn btn-sm" type="submit">Сохранить</button>
                  <button type="button" class="btn btn-sm btn-ghost" data-action="note-cancel">Отмена</button>
                </form>`;
              }
              return h`<div class="note">
                <div class="meta">${fmtDate(n.created_at)} · ${escapeHtml(n.author||'—')}${n.edited_at?h` · <span title="${escapeHtml(fmtDate(n.edited_at))}">(изменено)</span>`:''}
                  <span style="float:right;display:inline-flex;gap:8px;">
                    <a href="#" data-action="note-edit" data-id="${n.id}">Изменить</a>
                    <a href="#" data-action="note-delete" data-id="${n.id}" style="color:var(--crit);">Удалить</a>
                  </span>
                </div>
                ${escapeHtml(n.note_text)}
              </div>`;
            }).join("") || '<div class="muted" style="font-size:12.5px;">Записей пока нет.</div>'}</div>
            <form id="note-form" data-id="${t.id}" style="margin-top:8px;display:flex;gap:8px;">
              <input type="text" name="text" placeholder="Добавить запись…" style="flex:1;">
              <button class="btn btn-sm" type="submit">+</button>
            </form>
          </div>
        </div>
      </div>`);
  }

  /* ============================== MODALS ============================== */
  function openModal(html){ document.getElementById("overlay-root").appendChild(el(h`<div class="modal-scrim" data-close-modal>${html}</div>`)); }
  function closeModal(){ var m=document.querySelector(".modal-scrim"); if(m) m.remove(); }

  function openMeModal(){
    openModal(h`
      <div class="modal" data-stop style="width:420px;">
        <div class="modal-head"><h2>Профиль</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="me-form">
          <div class="modal-body">
            <div class="field"><label>Почта</label><input type="text" value="${escapeHtml(state.me.email)}" disabled></div>
            <div class="field"><label>Имя</label><input type="text" name="name" value="${escapeHtml(state.me.name||'')}" placeholder="Как к вам обращаться"></div>
            <div class="field"><label>Роль</label><input type="text" value="${roleLabel(state.me.role)}" disabled></div>
            <div class="helptext">Роль и зоны назначает руководитель службы в разделе «Команда».</div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-danger" id="me-signout">Выйти</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>`);
    document.getElementById("me-form").addEventListener("submit", function(e){
      e.preventDefault(); saveMyName(new FormData(e.target).get("name")||""); closeModal();
    });
    document.getElementById("me-signout").addEventListener("click", function(){ closeModal(); signOut(); });

  // 0.4.8, п.2 (по просьбе Антона): первая в приложении форма, через которую
  // заявку заводит не диспетчер (импорт/вставка из c-lector), а сам «Клиент» —

  function openNewTicketModal(){
    var hotels = visibleHotelsForMe().filter(function(h){ return h.in_service; });
    openModal(h`
      <div class="modal" data-stop style="width:480px;">
        <div class="modal-head"><h2>Подать заявку</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="new-ticket-form">
          <div class="modal-body">
            ${hotels.length===0 ? h`<div class="banner">Вам пока не назначен ни один объект — обратитесь к диспетчеру.</div>` : h`
            <div class="field"><label>Отель</label>
              <select name="hotel_id" required>
                <option value="">— выберите —</option>
                ${hotels.map(function(x){ return h`<option value="${x.id}">№${x.id} ${escapeHtml(x.name)}</option>`; }).join("")}
              </select>
            </div>
            <div class="field"><label>Локация (комната/этаж, необязательно)</label><input type="text" name="location" placeholder="напр. номер 214"></div>
            <div class="field"><label>Описание проблемы</label><textarea name="description" rows="4" required placeholder="Опишите, что случилось"></textarea></div>
            <div class="field"><label>Фото (необязательно)</label><input type="file" name="photos" accept="image/*" multiple></div>
            `}
          </div>

        </form>
      </div>`);
    if(hotels.length===0) return;
    document.getElementById("new-ticket-form").addEventListener("submit", function(e){
      e.preventDefault();
      var form = e.target;
      var fd = new FormData(form);
      var hotelId = Number(fd.get("hotel_id"));
      var hotel = hotelById(hotelId);
      var description = (fd.get("description")||"").trim();
      if(!hotel || !hotelAllowedForMe(hotelId)){ alert("Выберите отель из списка."); return; }
      if(!description){ alert("Опишите проблему."); return; }
      // ВАЖНО: не называть эту переменную "location" — иначе она затенит
      // глобальный window.location, который нужен ниже для перехода на
      // карточку новой заявки (уже наступали на эти грабли в других местах).
      var locationText = (fd.get("location")||"").trim();
      var files = Array.from((form.elements.photos && form.elements.photos.files) || []);
      var submitBtn = form.querySelector('button[type="submit"]'); if(submitBtn) submitBtn.disabled = true;
      sb.from("tickets").insert({
        hotel_id: hotelId, zone: hotel.zone||null, ticket_group: 2,
        description: description, location: locationText||null,
        status: "new", source: "customer", created_by: myLabel()
      }).select().then(function(res){
        if(res.error) throw res.error;
        var ticket = res.data && res.data[0];
        if(ticket && files.length){
          return Promise.all(files.map(function(f){ return uploadPhoto(ticket.id, f); })).then(function(){ return ticket; });
        }
        return ticket;
      }).then(function(ticket){
        closeModal();
        if(ticket) window.location.hash = "#/tickets/"+ticket.id;
      }).catch(function(err){
        if(submitBtn) submitBtn.disabled = false;
        alert("Не удалось отправить заявку: " + (err&&err.message?err.message:err));
      });
    });
  }

  // 0.3.4 (по просьбе Антона): "Реестр платежей" группирует оплаченные счета

      e.preventDefault(); var fd=new FormData(e.target); var m=fd.get("paidMonth");

  // Ручная форма правки снимка портфеля (openPortfolioModal, кнопка
  // "Обновить снимок") убрана в 0.2.9 — снимок теперь считается и сохраняется
  // автоматически при каждом импорте из c-lector, см. updatePortfolioFromImport().

  /* ============================== ROOT RENDER ============================== */
  // 0.3.3 (по просьбе Антона — «оптимизация и совершенствование», после того
  // как фикс 0.3.2 для "стирается поле при вводе" вылечил именно этот
  // конкретный симптом, но не саму причину): вместо полной пересборки
  // #app/#overlay-root через innerHTML на каждый render() — а render()
  // вызывается не только по прямому действию человека, но и любым из
  // realtime-каналов (см. "-rt" ниже) и минутным таймером — теперь
  // используется morphdom (вшита выше, в <head>). Она патчит только реально
  // изменившиеся узлы живого DOM, а не пересоздаёт всё целиком: узел, который
  // и так совпадает с новым состоянием (в том числе поле, в которое человек
  // печатает прямо сейчас), просто не трогается — фокус, курсор и
  // недописанный текст сохраняются сами по себе, без отдельной ловли и
  // ручного переноса значения после пересборки, как приходилось делать
  // раньше.
  var renderInProgress = false;
  function isActiveTypingField(el){
    return !!(el && (el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && /^(text|number|tel|email|search|)$/i.test(el.type||"text"))));
  }
  // morphdom по умолчанию всегда синхронизирует .value инпута/textarea с
  // новым состоянием (см. specialElHandlers внутри вшитой библиотеки) — это
  // ровно то, что стирало бы набранный текст. Для поля, в которое прямо
  // сейчас печатает человек, подменяем "новое" значение на уже стоящее в
  // поле — синхронизировать тогда нечего, и .value/курсор не трогаются
  // вовсе (сам узел morphdom и так не пересоздаёт, раз атрибуты совпадают).
  function morphdomPreserveTyping(fromEl, toEl){
    if(fromEl === document.activeElement && isActiveTypingField(fromEl)){
      toEl.value = fromEl.value;
    }
    // 0.4.10: незаконченная форма внесения (data-keep-draft) — раньше
    // сохранялось значение только у поля с фокусом, поэтому после перехода
    // в следующее поле любая перерисовка (realtime, таймер) стирала уже
    // введённое в предыдущих. Теперь значения ВСЕХ полей такой формы
    // переживают перерисовку; после form.reset() значения — уже по умолчанию,
    // и они же копируются, так что сброс формы работает как обычно.
    var tag = fromEl.tagName;
    if((tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") && fromEl.form && fromEl.form.hasAttribute("data-keep-draft")){
      if(fromEl.type==="file") return false;
      if(fromEl.type==="checkbox"||fromEl.type==="radio") toEl.checked = fromEl.checked;
      else toEl.value = fromEl.value;
    }
    return true;
  }
  // #map-canvas (см. ensureMap() ниже) — Google Maps сама вставляет туда
  // тайлы/controls напрямую через DOM API, в обход наших html-шаблонов, где
  // этот div всегда пустой. Без этой отметки morphdom при каждом render()
  // удалял бы из него всё, что туда вставила карта, потому что в "новом"
  // HTML у этого div нет детей.
  function morphdomSkipChildrenFor(fromEl){
    return fromEl.id !== "map-canvas";
  }
  function morphInto(container, html){
    window.morphdom(container, "<div>" + html + "</div>", {
      childrenOnly: true,
      onBeforeElUpdated: morphdomPreserveTyping,
      onBeforeElChildrenUpdated: morphdomSkipChildrenFor
    });
  }
  function render(){
    invalidateInvoiceGroupIndex();
    renderInProgress = true;
    try{ renderInner(); } finally { renderInProgress = false; }
  }
  function renderInner(){
    if(!CONFIGURED){
      morphInto(document.getElementById("app"), h`<div class="card configwarn">
        <h2 style="margin-top:0;">Настройка не завершена</h2>
        <p>Впишите <code>SUPABASE_URL</code> и <code>SUPABASE_ANON_KEY</code> в начале файла (значения — в вашем проекте Supabase: Project Settings → API) и разверните страницу снова.</p>
      </div>`);
      return;
    }
    if(!LIB_LOADED){
      morphInto(document.getElementById("app"), h`<div class="card configwarn">
        <h2 style="margin-top:0;">Не удалось загрузить Supabase</h2>
        <p>Библиотека <code>supabase-js</code> не загрузилась с CDN (cdn.jsdelivr.net) — проверьте подключение к интернету, отключите VPN/блокировщик, если он ограничивает доступ к CDN, и обновите страницу (F5).</p>
        <button class="btn btn-primary" onclick="location.reload()">Обновить страницу</button>
      </div>`);
      return;
    }
    if(!state.session){ renderAuthScreen(); return; }
    if(!state.me || !state.hotelsLoaded){ morphInto(document.getElementById("app"), h`<div class="auth-wrap"><div class="muted">Загрузка…</div></div>`); return; }
    // Новый человек (0.2.9) — авторизован (сессия и профиль есть), но пока
    // Администратор (владелец, см. isOwner()) не назначил ему настоящую роль
    // в «Команде», профиль остаётся с ролью по умолчанию "pending" (см.
    // supabase_schema.sql) — такой человек не должен видеть вообще ничего,
    // кроме экрана ожидания. isOwner() в условии — на случай, если сам
    // владелец почему-то окажется с ролью "pending" (например, ручная правка
    // в базе) — ему это ограничение применяться не должно (см. navAllowed()).
    if(!isOwner() && state.me.role==="pending"){
      morphInto(document.getElementById("app"), h`<div class="auth-wrap"><div class="card auth-card">
        <div class="auth-logo">Диспетчерская Keruen Inn</div>
        <div class="auth-sub">Служба сервиса</div>
        <div class="auth-maintenance"><b>Ожидает назначения роли</b><br>Администратор ещё не открыл вам доступ — обратитесь к нему, либо загляните чуть позже.</div>
        <button class="btn btn-block" style="margin-top:14px;" data-action="sign-out">Выйти</button>
      </div></div>`);
      return;
    }
    // «Заказчик» (0.2.8) без включённого доступа — авторизован (сессия и
    // профиль есть), но саму диспетчерскую видеть не должен. Показываем
    // нейтральный экран вместо приложения; выйти можно, войти обратно — как
    // только Администратор поставит галочку "Активен" в «Команде».
    if(state.me.role==="customer" && state.me.active===false){
      morphInto(document.getElementById("app"), h`<div class="auth-wrap"><div class="card auth-card">
        <div class="auth-logo">Диспетчерская Keruen Inn</div>
        <div class="auth-sub">Служба сервиса</div>
        <div class="auth-maintenance"><b>Ведутся работы на сайте</b><br>Доступ временно закрыт — загляните чуть позже.</div>
        <button class="btn btn-block" style="margin-top:14px;" data-action="sign-out">Выйти</button>
      </div></div>`);
      return;
    }

    // Прямые ссылки на заявку (0.2.3, п.7): переход по ссылке вида
    // "#/tickets/<id>" открывает карточку этой заявки сразу, без отдельного
    // клика по строке в списке. Сравниваем с уже открытой заявкой, чтобы не
    // мешать закрытию панели пользователем — обработчик data-close-panel ниже
    // сбрасывает state.route.id при закрытии именно для этого.

  document.addEventListener("focusout", function(e){
    // См. комментарий у соседних focusout-обработчиков ниже (registryEditingFieldKey/
    // hotelEditingKey) — без этой проверки побочный focusout от собственной
    // пересборки DOM (morphdom удаляет/переносит узлы во время своего обхода)
    // может вызвать render() ПОВТОРНО, пока внешний render() ещё выполняется —
    // с morphdom это ломает его внутренний обход дерева (NotFoundError: removeChild).
    if(renderInProgress) return;
    if(e.target.matches(".registry-amount-input") && state.registryEditingAmountId){
      state.registryEditingAmountId = null;
      render();
    }

  // 0.2.17: «Валюта»/«НДС»/«Налог» в «Реестре платежей» — уход фокуса без
  // изменения значения (setInvoiceCurrency/Vat/TaxBasis уже сворачивают поле
  // сами при реальном изменении, см. выше) тоже должен свернуть поле обратно.
  // 0.3.7 (по просьбе Антона: "я не могу даже вести ничего - пропадает
  // ячейка") — «Налог»="Свой…" — это НЕСКОЛЬКО элементов в одной сессии
  // редактирования (select + поле % + поле ₸, см. registrySelectRaw и
  // data-registry-edit-focus-group на их общей обёртке). setInvoiceTaxBasis
  // программно переводит фокус со select на поле % сразу после выбора
  // "Свой…" — это обычный focusout у select, и раньше эта проверка (одно
  // e.target на весь ключ) сразу сворачивала поле, не дав ничего напечатать.
  // Как и у data-hotel-edit-group ниже — прежде чем сворачивать, проверяем,
  // не уходит ли фокус на другой элемент ТОЙ ЖЕ группы.
  document.addEventListener("focusout", function(e){
    if(renderInProgress) return;
    if(!state.registryEditingFieldKey) return;
    if(!e.target.matches('[data-registry-edit-focus="'+state.registryEditingFieldKey+'"]')) return;
    var group = e.target.closest && e.target.closest('[data-registry-edit-focus-group="'+state.registryEditingFieldKey+'"]');

  // Заказчика) — но тут группа может состоять из НЕСКОЛЬКИХ полей ввода
  // (например lat+lng, или ФИО+должность+телефон), поэтому просто "потеря
  // фокуса элементом" недостаточна: перевод фокуса клавишей Tab с одного
  // поля группы на соседнее — это ещё не "ушли из группы". Проверяем
  // e.relatedTarget (куда фокус переходит) относительно общего
  // data-hotel-edit-group — сворачиваем обратно, только если фокус ушёл ЗА
  // пределы этой группы (или вовсе никуда, например клик по не-фокусируемому
  // месту страницы).
  document.addEventListener("focusout", function(e){
    // Побочный focusout от собственной пересборки DOM — не считается уходом
    // пользователя из поля (см. комментарий у render()/renderInProgress).
    if(renderInProgress) return;
    if(!state.hotelEditingKey) return;
    var group = e.target.closest && e.target.closest('[data-hotel-edit-group="'+state.hotelEditingKey+'"]');
    if(!group) return;
    var related = e.relatedTarget;
    if(related && group.contains(related)) return;
    state.hotelEditingKey = null;
    render();

  // Группа «Отелей» может быть УЖЕ пустой (значит, изначально показана как
  // обычные поля ввода, без единого клика по display — см. hotelZoneCell/
  // hotelCoordsCell/hotelContactCell). Если пользователь начинает вписывать
  // значение прямо в такую пустую группу (первое поле заполнилось раньше

  // ререндер после "change" по одному полю не должен схлопнуть всю группу,
  // пока не заполнены остальные — иначе оставшиеся поля исчезнут из-под
  // курсора. Поэтому как только фокус попадает в любое поле группы —
  // фиксируем это как "сейчас редактируется", не дожидаясь клика по display
  // (без render() здесь — просто запоминаем, чтобы следующий ререндер, если
  // он случится, не свернул группу раньше времени).
  document.addEventListener("focusin", function(e){
    var group = e.target.closest && e.target.closest("[data-hotel-edit-group]");
    if(group) state.hotelEditingKey = group.getAttribute("data-hotel-edit-group");
  });

  // 0.2.16: разряды в поле "Сумма" пробелом по мере ввода (без запятой в
  // качестве разделителя тысяч — запятая используется только для дробной
  // части, как в обычной русской записи "1 234,5"). Курсор стараемся не
  // "прыгать" — считаем, сколько значащих символов было до курсора, и
  // ставим курсор после того же по счёту символа в переформатированной
  // строке.
  document.addEventListener("input", function(e){
    // 0.3.7: ".registry-tax-custom-input" (поля % / ₸ у "Свой…") добавлены в
    // этот список — та же живая разбивка разрядов пробелом по мере ввода, что
    // и у "Суммы"/"Доли", особенно полезна для крупных ₸-сумм.
    if(!e.target.matches(".registry-amount-input, .registry-alloc-input, .registry-tax-custom-input")) return;
    var el = e.target;
    var caret = el.selectionStart==null ? el.value.length : el.selectionStart;
    var before = el.value.slice(0, caret);
    var significantBefore = (before.match(/[\d.,]/g)||[]).length;
    var formatted = formatAmountInputValue(el.value);
    el.value = formatted;
    var count = 0, pos = formatted.length;
    for(var i=0;i<formatted.length;i++){
      if(/[\d.,]/.test(formatted[i])) count++;
      if(count>=significantBefore){ pos = i+1; break; }
    }
    if(significantBefore===0) pos = 0;
    el.setSelectionRange(pos, pos);
  });

  // 0.3.2 (по просьбе Антона, п.5 — "при вводе суммы в окошко, нажимаю
  // enter и ничего не происходит"): поля click-to-edit (Сумма/Валюта/НДС/
  // Налог в «Реестре платежей», Доля %/= сумма, поля «Отелей») сохраняют
  // значение по событию "change", которое браузер сам создаёт только при
  // уходе фокуса (blur) — Enter в обычном текстовом <input> вне <form>
  // ничего не делает и уж точно не создаёт change. Раньше единственным
  // способом сохранить значение было кликнуть куда-то ещё. Добавляем Enter
  // как явный способ подтвердить ввод: просто снимаем фокус (blur) —
  // дальше срабатывает та же цепочка "change" (сохранение) → "focusout"
  // (сворачивание поля обратно в обычный текст), что и раньше при клике
  // мимо.
  document.addEventListener("keydown", function(e){
    if(e.key!=="Enter") return;
    if(!e.target.matches('input[data-registry-edit-focus], input[data-hotel-edit-focus], input.registry-amount-input, input[data-hotel-field]')) return;
    e.preventDefault();
    e.target.blur();
  });

  document.addEventListener("submit", function(e){
    if(e.target.id==="note-form"){
      e.preventDefault(); var fd=new FormData(e.target); var text=(fd.get("text")||"").trim();
      if(text){ addNote(e.target.getAttribute("data-id"), text); e.target.reset(); }
    }
    if(e.target.matches(".note-edit-form")){
      e.preventDefault(); var fdn=new FormData(e.target); var newText=(fdn.get("text")||"").trim();
      var noteId = e.target.getAttribute("data-note-id");
      if(newText){ updateNote(noteId, newText).then(function(){ state.editingNoteId=null; }); }
      else { state.editingNoteId=null; renderTicketPanel(); }
    }
    if(e.target.id==="part-form"){
      e.preventDefault(); var fd3=new FormData(e.target); if(!fd3.get("name")) return;
      addPart({name:fd3.get("name"), qty:fd3.get("qty"), unit:fd3.get("unit"), note:fd3.get("note")}); e.target.reset();
    }
    if(e.target.id==="crew-form"){
      e.preventDefault(); var fdc=new FormData(e.target); var name=(fdc.get("name")||"").trim();
      if(name){ createCrew(name); e.target.reset(); }
    }
    if(e.target.id==="cash-advance-form"){
      e.preventDefault(); var fdca=new FormData(e.target);
      var okCa = addCashAdvance({date:fdca.get("date"), person:fdca.get("person"), amount:fdca.get("amount"), hotel_id:fdca.get("hotel_id"), note:fdca.get("note")});
      if(okCa!==false) e.target.reset();
    }
    if(e.target.id==="cash-expense-form"){
      e.preventDefault(); var fdce=new FormData(e.target);
      var okCe = addCashExpense({date:fdce.get("date"), description:fdce.get("description"), qty:fdce.get("qty"), unit_cost:fdce.get("unit_cost"), hotel_id:fdce.get("hotel_id"), ticket_ref:fdce.get("ticket_ref"), category:fdce.get("category"), person:fdce.get("person")});
      if(okCe!==false) e.target.reset();
    }
    if(e.target.id==="overhead-expense-form"){
      e.preventDefault(); var fdoe=new FormData(e.target);
      var oeFiles = Array.from((e.target.elements.files && e.target.elements.files.files) || []);
      var okOe = addOverheadExpense({date:fdoe.get("date"), category:fdoe.get("category"), amount:fdoe.get("amount"), note:fdoe.get("note")}, oeFiles);
      if(okOe!==false) e.target.reset();
    }
  });

  setInterval(function(){ if(!document.querySelector(".modal-scrim")) render(); }, 60000);

  render();
  initAuth();
})();
</script>
</body>
</html>
