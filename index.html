  // Реестр платежей — простой список прикреплённых к заявкам счетов: заявка,
  // отель, сам файл, дата добавления. Раньше здесь было 23 колонки 1:1 с
  // корпоративным Excel-файлом (поставщик, суммы, валюта, НДС, статья бюджета,
  // ERP-поля и т.д.) — по просьбе Антона все они убраны и с экрана, и из
  // выгрузки, т.к. заполнялись вручную и в этом приложении не нужны.
  // 0.2.17 (по просьбе Антона): «Валюта»/«НДС»/«Налог» в «Реестре платежей» —
  // тот же приём, что и «Сумма» (0.2.16) и поля «Отелей» (0.2.17, п.1): без
  // рамки, если уже выбрано, клик раскрывает настоящий <select> на его месте.
  // Только одно поле редактируется одновременно (как у "Сумма") — свой ключ
  // "<id счёта>:currency|vat|tax" в state.registryEditingFieldKey.
  function registrySelectRaw(iv, kind, disabled, title){
    var key = iv.id+":"+kind;
    if(kind==="currency"){
      return h`<select data-invoice-currency data-id="${iv.id}" data-registry-edit-focus="${key}" ${disabled?'disabled':''} title="${title}">
        <option value="">—</option>
        <option value="KZT" ${iv.currency==='KZT'?'selected':''}>KZT</option>
        <option value="RUB" ${iv.currency==='RUB'?'selected':''}>RUB</option>
        <option value="BYN" ${iv.currency==='BYN'?'selected':''}>BYN</option>
      </select>`;
    }
    if(kind==="vat"){
      return h`<select data-invoice-vat data-id="${iv.id}" data-registry-edit-focus="${key}" ${disabled?'disabled':''} title="${title}">
        <option value="">—</option>
        <option value="with" ${iv.vat_included===true?'selected':''}>С НДС</option>
        <option value="without" ${iv.vat_included===false?'selected':''}>Без</option>
      </select>`;
    }
    var vatOn = iv.vat_included===true;
    return h`<select data-invoice-tax-basis data-id="${iv.id}" data-registry-edit-focus="${key}" ${disabled?'disabled':''} title="${title}">
      <option value="">—</option>
      ${vatOn ? "" : h`<option value="simplified" ${iv.tax_basis==='simplified'?'selected':''}>Упрощ. +20%</option>
      <option value="cash" ${iv.tax_basis==='cash'?'selected':''}>Нал. +30%</option>`}
    </select>`;
  }
  function registrySelectCell(iv, kind, editableRegistry){
    var key = iv.id+":"+kind;
    var value, label, forceDisabled = false, title;
    if(kind==="currency"){
      value = iv.currency||""; label = value;
      title = "Валюта оплаты счёта (влияет на ставку НДС)";
    } else if(kind==="vat"){
      value = iv.vat_included===true?"with":(iv.vat_included===false?"without":"");
      label = iv.vat_included===true?"С НДС":(iv.vat_included===false?"Без":"");
      title = "Указана ли «Сумма» с учётом НДС";
    } else {
      // 0.2.18: "regular" ("Обычный счёт") — значение доп. налога, которое
      // существовало ДО 0.2.15 и означало те же 0%, что теперь означает
      // просто прочерк. У старых счетов оно ещё может быть сохранено в базе,
      // и раньше здесь всё равно показывалась старая подпись "Обычный счёт"
      // вместо прочерка — рядом со счетами, где прочерк means то же самое,
      // это выглядело как два разных состояния. Показываем оба одинаково.
      var taxForDisplay = iv.tax_basis==="regular" ? null : iv.tax_basis;
      value = taxForDisplay||"";
      label = taxForDisplay ? (TAX_BASIS_LABEL[taxForDisplay]||taxForDisplay) : "";
      forceDisabled = iv.vat_included===true;
      title = forceDisabled ? "При «с НДС» доп. налог не применяется — ставится автоматически прочерком" : "Способ оплаты — влияет на доп. налог в «Учтено в затратах»";
    }
    var roleTitle = editableRegistry ? title : "Редактировать может только Администратор, Руководитель или Финансист";
    if(editableRegistry && !forceDisabled && state.registryEditingFieldKey!==key && value){
      return h`<button type="button" class="hotel-field-display" data-action="registry-field-edit" data-key="${key}" title="${roleTitle}">${escapeHtml(label)}</button>`;
    }
    return registrySelectRaw(iv, kind, !editableRegistry || forceDisabled, roleTitle);
  }
  // 0.2.20: группировка счетов в «Реестре платежей» — один и тот же файл
  // счёта иногда прикреплён по отдельности сразу к нескольким заявкам (см.
  // invoiceGroupMembers); раньше это давало N визуально одинаковых пустых
  // строк реестра (см. историю в invoiceRelatedTickets выше). Строим группу
  // из ВСЕХ копий этого файла в базе, но для отображения (список заявок,
  // раскрытие) оставляем только те копии, что прошли текущий фильтр — сама
  // группа при этом не теряется, если фильтру соответствует хотя бы одна
  // копия. `primary` — всегда САМАЯ РАННЯЯ загруженная копия вообще (без
  // учёта фильтра) — только на ней редактируются Сумма/Валюта/НДС/Налог, это
  // и есть данные всего счёта как документа.
  function buildInvoiceGroups(filteredInvoices){
    var seen = {}, groups = [];
    filteredInvoices.forEach(function(iv){
      var key = normalizeForMatch(iv.file_name||"") || ("__id_"+iv.id);
      if(seen[key]) return;
      seen[key] = true;
      var trueMembers = invoiceGroupMembers(iv);
      var shownMembers = trueMembers.filter(function(x){ return filteredInvoices.indexOf(x)!==-1; });
      if(!shownMembers.length) shownMembers = [iv];
      groups.push({ key:key, primary:trueMembers[0], members:shownMembers, hiddenCount: trueMembers.length-shownMembers.length });
    });
    return groups;
  }
  // Одна строка «Реестра платежей» — счёт на одну заявку выглядит как обычная
  // строка; счёт сразу на несколько заявок сворачивается в одну строку (номера
  // всех заявок — в ячейке "№ заявки"), со стрелкой, разворачивающей построчную
  // разбивку доли каждой заявки (см. registryGroupExpandRows).
  function registryGroupRow(group, rowNum, editableRegistry, expanded){
    var primary = group.primary;
    var members = group.members;
    var isGroup = members.length>1;
    var rows = members.map(function(iv){ return { iv:iv, tk: state.tickets.find(function(x){return x.id===iv.ticket_id;}) }; });
    var hotelsById = {};
    rows.forEach(function(r){ var h2 = r.tk?hotelById(r.tk.hotel_id):null; if(h2) hotelsById[h2.id]=h2; });
    var hotelIds = Object.keys(hotelsById);
    var hotelCell, hotelTitle;
    if(hotelIds.length===1){ var onlyHotel = hotelsById[hotelIds[0]]; hotelCell = "№"+onlyHotel.id+" "+escapeHtml(onlyHotel.name); hotelTitle = onlyHotel.name; }
    else if(hotelIds.length>1){ hotelCell = h`<span class="muted">Разные (${hotelIds.length})</span>`; hotelTitle = hotelIds.map(function(k){return hotelsById[k].name;}).join(", "); }
    else { hotelCell = "—"; hotelTitle = ""; }
    // 0.2.21 (по просьбе Антона): один и тот же счёт иногда прикреплён к ОДНОЙ
    // и той же заявке дважды (например, отдельно в "Бригада" и в "Материал")
    // — это разные строки invoices, но для читателя это одна заявка, а не
    // "заявка встретилась дважды". Ячейка "№ заявки" показывает каждую
    // заявку один раз, отсортированной по номеру, а не в порядке загрузки.
    var seenTicketIds = {}, uniqueTicketRows = [];
    rows.forEach(function(r){
      var tid = r.tk ? r.tk.id : null;
      if(tid!=null && seenTicketIds[tid]) return;
      if(tid!=null) seenTicketIds[tid] = true;
      uniqueTicketRows.push(r);
    });
    uniqueTicketRows.sort(function(a,b){
      var ra = a.tk && a.tk.external_ref, rb = b.tk && b.tk.external_ref;
      if(ra==null && rb==null) return 0; if(ra==null) return 1; if(rb==null) return -1;
      var na = Number(ra), nb = Number(rb);
      if(!isNaN(na) && !isNaN(nb)) return na-nb;
      return String(ra).localeCompare(String(rb));
    });
    var ticketCount = uniqueTicketRows.length;
    var extraCopiesNote = members.length>ticketCount ? (' ('+members.length+' '+pluralRu(members.length,'копия счёта','копии счёта','копий счёта')+')') : '';
    // 0.3.4 (по просьбе Антона): раньше свёрнутая строка группы всё равно
    // перечисляла ВСЕ заявки через запятую в ячейке "№ заявки" — при большой
    // группе (20+ заявок на один общий счёт) это растягивало строку на
    // добрый десяток строк текста, хотя по определению свёрнутый вид не
    // должен показывать построчную разбивку вообще (она и так доступна по
    // стрелке). Для группы здесь теперь только короткая надпись "Общий на N
    // заявок" (раньше она мешала под кнопкой "счёт" в соседней ячейке и тоже
    // норовила перенестись на вторую строку) — сама разбивка по заявкам
    // видна только в развёрнутом виде (registryGroupExpandRows), включая имя
    // счёта не отсылая к отдельной ячейке.
    var refCell = isGroup
      ? h`<span class="muted">Общий на ${ticketCount} ${pluralRu(ticketCount,'заявку','заявки','заявок')}${extraCopiesNote}${group.hiddenCount?' (+'+group.hiddenCount+' скрыто фильтром)':''}</span>`
      : uniqueTicketRows.map(function(r){
          return r.tk ? h`<a href="#" data-open-ticket="${r.tk.id}" title="Открыть заявку">${r.tk.external_ref?escapeHtml(r.tk.external_ref):'открыть'}</a>` : '—';
        }).join(", ");
    var accKZT = invoiceAccountedKZT(primary);
    var groupIds = members.map(function(r){return r.id;}).join(",");
    var allSubmitted = members.every(function(r){return r.submitted_for_payment;});
    var allPaid = members.every(function(r){return r.paid;});
    // 0.3.0: подозрение на случайное совпадение имени файла — только когда
    // это реально РАЗНЫЕ заявки (не просто одна и та же заявка с двумя
    // копиями в "Бригада"/"Материал") и имя типично для сканера/камеры.
    var suspiciousMatch = isGroup && ticketCount>1 && isGenericInvoiceFileName(primary.file_name);
    return h`<tr class="${isGroup?'registry-group-row':''}">
      <td class="mono muted">${rowNum}</td>
      <td class="mono" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${isGroup ? h`<button type="button" class="btn btn-ghost btn-sm registry-expand-btn" data-action="registry-group-toggle" data-key="${escapeHtml(group.key)}" title="${expanded?'Свернуть':'Показать долю каждой заявки'}">${expanded?'▾':'▸'}</button>` : ""}${refCell}</td>
      <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;" title="${escapeHtml(hotelTitle)}">${hotelCell}</td>
      <td>
        <button class="btn btn-sm registry-file-btn" data-action="invoice-open" data-path="${escapeHtml(primary.file_path)}" title="${escapeHtml(primary.file_name)}">счёт</button>
        ${(!isGroup && group.hiddenCount) ? h`<div class="muted registry-related-line">Также на ${group.hiddenCount} ${pluralRu(group.hiddenCount,'заявке','заявках','заявках')} — скрыто фильтром</div>` : ""}
        ${suspiciousMatch ? h`<div class="registry-suspicious-match" title="Имя файла типично для сканера/камеры («${escapeHtml(primary.file_name)}») — возможно, это на самом деле РАЗНЫЕ счета со случайно одинаковым именем, а не один общий счёт. Проверьте в развёрнутом виде («это другой счёт»).">⚠ похоже на случайное совпадение имени</div>` : ""}
      </td>
      <td>${(editableRegistry && state.registryEditingAmountId===primary.id)
        ? h`<input type="text" inputmode="decimal" class="registry-amount-input" data-invoice-amount data-id="${primary.id}" value="${primary.amount!=null?formatAmountInputValue(String(primary.amount)):''}" placeholder="—">`
        : h`<button type="button" class="registry-amount-display" data-action="${editableRegistry?'registry-amount-edit':''}" data-id="${primary.id}" ${editableRegistry?'':'disabled'} title="${editableRegistry?'Нажмите, чтобы изменить сумму':'Редактировать может только Администратор, Руководитель или Финансист'}">${primary.amount!=null?fmtKZT(primary.amount):'—'}</button>`}</td>
      <td>${registrySelectCell(primary, "currency", editableRegistry)}</td>
      <td>${registrySelectCell(primary, "vat", editableRegistry)}</td>
      <td>${registrySelectCell(primary, "tax", editableRegistry)}</td>
      <td class="mono" style="text-align:right;" title="${accKZT.currency ? 'Сумма без НДС и с доп. налогом, переведена в KZT по курсу Нацбанка РК'+(primary.paid?' на день оплаты':' на сегодня — пересчитается на день оплаты') : 'Сумма без НДС, скорректированная на доп. налог по способу оплаты'}">${accountedKZTLabel(accKZT)}</td>
      <td style="text-align:center;"><input type="checkbox" data-action="invoice-submitted-toggle" data-id="${groupIds}" data-val="${allSubmitted?'0':'1'}" ${allSubmitted?'checked':''} ${editableRegistry?'':'disabled'} title="${editableRegistry?(isGroup?'Отметить, что счёт передан в бухгалтерию/банк на оплату (для всех заявок сразу)':'Отметить, что счёт передан в бухгалтерию/банк на оплату'):'Редактировать может только Администратор, Руководитель или Финансист'}"></td>
      <td style="text-align:center;white-space:nowrap;"><input type="checkbox" data-action="invoice-paid-toggle" data-id="${groupIds}" data-val="${allPaid?'0':'1'}" ${allPaid?'checked':''} ${editableRegistry?'':'disabled'} title="${editableRegistry?(isGroup?'Отметить оплату счёта (для всех заявок сразу)':'Отметить оплату счёта'):'Редактировать может только Администратор, Руководитель или Финансист'}">${(allPaid && editableRegistry) ? h` <a href="#" data-action="invoice-paid-month-edit" data-id="${groupIds}" style="font-size:11px;" title="Месяц оплаты: ${paidMonthKey(primary)?monthLabelRu(paidMonthKey(primary)):'не определён'}. Нажмите, чтобы указать другой месяц — например, если счёт оплатили раньше, а отметили в системе только сейчас.">✎</a>` : ""}</td>
    </tr>${isGroup && expanded ? registryGroupExpandRows(group, accKZT, editableRegistry) : ""}`;
  }
  // 0.2.21 (по просьбе Антона): доля/сумма конкретной заявки — тем же
  // приёмом click-to-edit, что и «Сумма» счёта/поля «Отелей» выше: обычный
  // текст без рамки, ДАЖЕ когда это прочерк (доля ещё не указана) — рамка
  // появляется только при наведении, клик раскрывает настоящее поле ввода.
  // Процент можно вводить всегда — это просто число само по себе; сумма в
  // KZT требует уже известную "Учтено в затратах" основного счёта (чтобы
  // посчитать по ней процент обратно), поэтому до этого её поле неактивно.
  function registryAllocFieldCell(iv, kind, value, canEdit, title){
    var key = iv.id+":alloc"+kind;
    var attr = kind==="pct" ? "data-alloc-percent" : "data-alloc-amount";
    var raw = value==null ? null : (kind==="amt" ? Math.round(value*100)/100 : value);
    var label = raw!=null ? formatAmountInputValue(String(raw)) : "";
    if(canEdit && state.registryEditingFieldKey===key){
      return h`<input type="text" inputmode="decimal" ${attr} data-id="${iv.id}" data-registry-edit-focus="${key}" class="registry-alloc-input" value="${label}" placeholder="—" style="width:${kind==='pct'?'50px':'86px'};" title="${title}">`;
    }
    return h`<button type="button" class="registry-alloc-display" data-action="${canEdit?'registry-field-edit':''}" data-key="${key}" ${canEdit?'':'disabled'} title="${title}">${label||'—'}</button>`;
  }
  // Развёрнутый вид группы — по строке на каждую заявку, с долей счёта на
  // неё: процент и сумма (KZT без НДС) редактируются оба, второе поле каждый
  // раз пересчитывается автоматически от другого (см. setInvoiceAllocPercent/
  // setInvoiceAllocAmount).
  function registryGroupExpandRows(group, groupAcc, editableRegistry){
    var total = groupAcc.value;
    var rowsHtml = group.members.map(function(iv){
      var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
      var hotel = tk ? hotelById(tk.hotel_id) : null;
      var pct = invoiceAllocPercent(iv);
      var amount = (pct!=null && total!=null) ? (total*pct/100) : null;
      var amtTitle = total!=null ? "Сумма KZT без НДС на эту заявку" : "Сначала укажите сумму счёта (в свёрнутой строке) — без неё нельзя посчитать сумму по проценту";
      return h`<tr class="registry-alloc-row">
        <td></td>
        <td class="mono">${tk ? h`<a href="#" data-open-ticket="${tk.id}">${tk.external_ref?escapeHtml(tk.external_ref):'открыть'}</a>` : '—'}</td>
        <td style="text-align:center;">${hotel ? ('№'+hotel.id+' '+escapeHtml(hotel.name)) : '—'}</td>
        <td colspan="8">
          <span class="muted" style="font-size:12px;display:inline-flex;align-items:center;gap:6px;">
            Доля: ${registryAllocFieldCell(iv,"pct",pct,editableRegistry,"Процент от суммы счёта на эту заявку")}%
            = ${registryAllocFieldCell(iv,"amt",amount,editableRegistry && total!=null,amtTitle)} ₸
            ${editableRegistry ? h`<a href="#" data-action="invoice-ungroup" data-id="${iv.id}" style="margin-left:6px;font-size:11px;" title="Совпадение имени файла случайное — это на самом деле другой, не связанный счёт">это другой счёт</a>` : ""}
          </span>
        </td>
      </tr>`;
    }).join("");
    return rowsHtml + registryAllocSummaryRow(group, total);
  }
  function registryAllocSummaryRow(group, total){
    var sumPct = 0, anySet = false;
    group.members.forEach(function(iv){ var p=invoiceAllocPercent(iv); if(p!=null){ anySet=true; sumPct+=p; } });
    if(!anySet) return "";
    var warn = Math.abs(sumPct-100) > 0.5;
    return h`<tr class="registry-alloc-row">
      <td colspan="11" class="muted" style="font-size:11px;padding-left:52px;${warn?'color:var(--warn);':''}">
        Распределено: ${fmtKZT(sumPct)}%${total!=null?(' ('+fmtKZT(total*sumPct/100)+' ₸ из '+fmtKZT(total)+' ₸)'):''}${warn?' — не сходится со 100%':''}
      </td>
    </tr>`;
  }
  // Строка-разделитель месяца оплаты (0.2.19) — вместе с подписью месяца
  // показывает, сколько счетов и на какую сумму (KZT без НДС, как и итоги
  // внизу) оплачено именно в этом месяце. items — группы (см. buildInvoiceGroups),
  // каждый общий счёт считается здесь один раз, а не по разу на заявку.
  function paidMonthDividerRow(key, items, expanded){
    var label = key==="unknown" ? "Дата оплаты не указана" : monthLabelRu(key);
    var sum = 0, pendingCount = 0, missingCount = 0;
    items.forEach(function(group){
      var acc = invoiceAccountedKZT(group.primary);
      if(acc.state==="pending"){ pendingCount++; return; }
      if(acc.value==null){ missingCount++; return; }
      sum += acc.value;
    });
    // 0.3.2 (по просьбе Антона): сам месяц сворачивается/разворачивается по
    // клику — так же, как строка "общий счёт на несколько заявок" (▸/▾)
    // выше; по умолчанию свёрнут (см. registryExpandedMonths), видна только
    // сводка (сколько счетов, на какую сумму).
    return h`<tr class="registry-month-divider" data-action="registry-month-toggle" data-key="${escapeHtml(key)}" style="cursor:pointer;">
      <td colspan="8"><button type="button" class="btn btn-ghost btn-sm registry-expand-btn" style="margin-right:6px;" title="${expanded?'Свернуть месяц':'Показать счета за месяц'}">${expanded?'▾':'▸'}</button>${escapeHtml(label)} — ${items.length} ${pluralRu(items.length,'счёт','счёта','счетов')}${pendingCount?' (ожидание курса: '+pendingCount+')':''}${missingCount?' (без данных: '+missingCount+')':''}</td>
      <td class="mono" style="text-align:right;">${fmtKZT(sum)}</td>
      <td colspan="2"></td>
    </tr>`;
  }
  function viewRegistry(){
    var all = (state.invoices||[]).filter(function(iv){ return iv.in_registry; });
    // 0.2.17 (по просьбе Антона): оплаченные счета теперь показываются по
    // умолчанию (галочка изначально стоит) — реестр остаётся полной картиной
    // "что оплачено, что ещё предстоит", а не только списком долгов; галочку
    // можно снять вручную, чтобы временно скрыть уже оплаченное.
    var rf = state.registryFilters || {q:"", hotel:"", dateFrom:"", dateTo:"", showPaid:true, currency:""};
    var q = normalizeForMatch(rf.q||"");
    // Поиск/фильтр действуют только на то, что показано на экране — выгрузка в
    // Excel всегда забирает ВЕСЬ реестр целиком, чтобы случайно не забытый
    // фильтр не «съел» часть строк из официальной выгрузки.
    var preShowPaid = all.filter(function(iv){
      var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
      var hotel = tk ? hotelById(tk.hotel_id) : null;
      if(rf.hotel && (!hotel || String(hotel.id)!==rf.hotel)) return false;
      if(rf.currency && iv.currency!==rf.currency) return false;
      if(rf.dateFrom && (!iv.added_to_registry_at || iv.added_to_registry_at < rf.dateFrom)) return false;
      if(rf.dateTo && (!iv.added_to_registry_at || iv.added_to_registry_at > (rf.dateTo+"T23:59:59"))) return false;
      if(q){
        var hay = normalizeForMatch((tk&&tk.external_ref||"")+" "+(hotel?hotel.name:"")+" "+(iv.file_name||""));
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
    // 0.2.17: оплаченные счета показываются по умолчанию (см. галочку выше) —
    // сняв её вручную, можно временно скрыть уже оплаченное и увидеть только
    // то, что ещё предстоит оплатить.
    var list = rf.showPaid ? preShowPaid : preShowPaid.filter(function(iv){ return !iv.paid; });
    var hiddenPaidCount = preShowPaid.length - list.length;
    var filtersActive = !!(rf.q||rf.hotel||rf.dateFrom||rf.dateTo||rf.currency);
    // Сортировка по клику на заголовок — как в «Заявках». На выгрузку в Excel не
    // влияет — она всегда идёт по всему реестру целиком (см. комментарий выше).
    var rsort = rf.sort || {};
    var rSortField = rsort.field, rSortDir = rsort.dir || "asc";
    // 0.2.20: сортировка по клику на заголовок теперь работает по ГРУППАМ (см.
    // buildInvoiceGroups ниже) — значение берётся с первой видимой (прошедшей
    // фильтр) заявки в группе — именно она первой показана в ячейке
    // "№ заявки"/"Отель" у свёрнутой строки.
    function registryGroupSortVal(group, field){
      var iv = group.members[0];
      var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
      var hotel = tk ? hotelById(tk.hotel_id) : null;
      if(field==="ref") return (tk && tk.external_ref) || "";
      if(field==="hotel") return hotel ? hotel.name : "";
      return "";
    }
    function registryTh(label, field){
      if(!field) return h`<th>${label}</th>`;
      var active = rSortField===field;
      return h`<th data-action="sort-registry" data-field="${field}" style="cursor:pointer;user-select:none;" title="Сортировать">${label}${active?(rSortDir==="asc"?" ▲":" ▼"):""}</th>`;
    }
    // поле сортировки для каждой колонки — null там, где сортировка не имеет
    // смысла (порядковый номер, сам файл, суммы/селекты, галочки "подано"/"оплачено")
    var REGISTRY_SORT_FIELDS = [null,"ref","hotel",null,null,null,null,null,null,null,null];
    var editableRegistry = canEditRegistry();
    // 0.2.20 (по просьбе Антона): один и тот же счёт, прикреплённый отдельно
    // сразу к нескольким заявкам, теперь даёт ОДНУ строку реестра (см.
    // buildInvoiceGroups/registryGroupRow), а не N визуально одинаковых
    // пустых строк — раньше это ещё и приводило к тому, что итоги
    // "Оплачено"/"К оплате" ниже складывали сумму такого счёта N раз вместо
    // одного. "N из M" и итоги теперь считаются по группам (реальным счетам).
    var allGroups = buildInvoiceGroups(all);
    var groups = buildInvoiceGroups(list);
    if(rSortField){
      groups = groups.slice().sort(function(a,b){
        var va = registryGroupSortVal(a, rSortField), vb = registryGroupSortVal(b, rSortField);
        var cmp = (typeof va==="number" || typeof vb==="number") ? ((va||0)-(vb||0)) : String(va).localeCompare(String(vb), "ru");
        return rSortDir==="desc" ? -cmp : cmp;
      });
    }
    var expandedGroups = state.registryExpandedGroups || {};
    // Итоги "оплачено"/"к оплате" (0.2.3, п.2; с 0.2.13.1 — по просьбе Антона
    // считаются по "Учтено в затратах", а не по сырой "Сумма", т.к. это и есть
    // сумма без НДС с поправкой на доп. налог — реальная величина для бюджета)
    // — считаются по тем же группам, что сейчас показаны на экране (с учётом
    // фильтров), а не по всему реестру — та же логика, что и у счётчика
    // "N из M" выше. Счета, для которых ещё не заполнены все поля, нужные для
    // расчёта (сумма/валюта/НДС/налог), просто не участвуют в сумме, но их
    // количество показываем отдельно, чтобы итог не выглядел как "полный".
    // 0.2.16: суммы теперь в KZT (invoiceAccountedKZT переводит RUB/BYN по
    // курсу Нацбанка РК) — иначе "Оплачено"/"К оплате" складывали бы разные
    // валюты как одну. pendingRateCount — курс ещё грузится (Edge Function
    // асинхронна) — отдельно от missingAmountCount (там правда нет данных
    // для расчёта), т.к. это временное состояние, которое само разрешится
    // (см. ensureNbkRate/render()).
    var sumPaid = 0, sumDue = 0, missingAmountCount = 0, pendingRateCount = 0;
    groups.forEach(function(group){
      var acc = invoiceAccountedKZT(group.primary);
      if(acc.state==="pending"){ pendingRateCount++; return; }
      if(acc.value==null){ missingAmountCount++; return; }
      if(group.primary.paid) sumPaid += acc.value; else sumDue += acc.value;
    });
    return h`
      ${financeTabs('registry')}
      <div class="row-gap">
        <div class="filters">
          <input type="text" data-registry-filter="q" value="${escapeHtml(rf.q||"")}" placeholder="Поиск: № заявки, отель, файл…" style="min-width:220px;">
          <select data-registry-filter="hotel"><option value="">Все отели</option>${state.hotels.filter(function(x){return x.in_service;}).map(function(x){return h`<option value="${x.id}" ${rf.hotel===String(x.id)?'selected':''}>№${x.id} ${x.name}</option>`;}).join("")}</select>
          <select data-registry-filter="currency"><option value="">Все валюты</option><option value="KZT" ${rf.currency==='KZT'?'selected':''}>KZT</option><option value="RUB" ${rf.currency==='RUB'?'selected':''}>RUB</option><option value="BYN" ${rf.currency==='BYN'?'selected':''}>BYN</option></select>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin:0;">с <input type="date" data-registry-filter="dateFrom" value="${rf.dateFrom||''}" style="width:auto;"></label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin:0;">по <input type="date" data-registry-filter="dateTo" value="${rf.dateTo||''}" style="width:auto;"></label>
          <div class="chip-toggle"><label><input type="checkbox" data-registry-filter-checkbox="showPaid" ${rf.showPaid?'checked':''}> Показывать оплаченные</label></div>
          ${filtersActive ? h`<a href="#" data-action="clear-registry-filter" style="font-size:12px;">сбросить</a>` : ""}
          <button class="btn btn-sm" data-action="registry-export" ${all.length===0?'disabled':''}>Экспорт в Excel${filtersActive?' (весь реестр)':''}</button>
          <span class="muted" style="margin-left:auto;">${groups.length} из ${allGroups.length} счетов${(!rf.showPaid && hiddenPaidCount>0) ? h` <span title="Снята галочка «Показывать оплаченные»">(скрыто оплаченных вложений: ${hiddenPaidCount})</span>` : ""}</span>
        </div>
        <div class="card">
          <div class="table-wrap"><table class="registry-table">
            <colgroup>
              <col style="width:28px"><col style="width:60px"><col style="width:110px"><col style="width:56px">
              <col style="width:70px"><col style="width:56px"><col style="width:50px"><col style="width:76px">
              <col style="width:96px"><col style="width:60px"><col style="width:56px">
            </colgroup>
            <thead><tr>${REGISTRY_COLUMN_LABELS.map(function(lbl, i){ return registryTh(lbl, REGISTRY_SORT_FIELDS[i]); }).join("")}</tr></thead>
            <tbody>${groups.length===0 ? h`<tr><td colspan="${REGISTRY_COLUMN_LABELS.length}"><div class="empty-state"><b>${filtersActive?'Ничего не найдено':(rf.showPaid?'Реестр пуст':'Все счета в реестре оплачены')}</b>${filtersActive?'Попробуйте изменить или сбросить фильтр.':(rf.showPaid?'Прикрепите счёт к заявке — он появится здесь автоматически.':'Включите «Показывать оплаченные», чтобы увидеть их.')}</div></td></tr>` :
              (function(){
                // 0.2.19 (по просьбе Антона): оплаченные счета группируются по
                // месяцу ОПЛАТЫ (invoices.paid_at), а не идут общим плоским
                // списком — иначе за месяц вручную не свести. Неоплаченные (без
                // даты оплаты — группировать их по этому признаку не по чему)
                // остаются обычным плоским списком сверху, как и раньше. С
                // 0.2.20 группируем/сортируем СЧЕТА (group), а не отдельные
                // вложения — общий на несколько заявок счёт даёт одну строку.
                var rowNum = 0;
                var out = [];
                groups.filter(function(g){ return !g.primary.paid; }).forEach(function(g){
                  rowNum++;
                  out.push(registryGroupRow(g, rowNum, editableRegistry, !!expandedGroups[g.key]));
                });
                var paidGroupsMap = {};
                groups.filter(function(g){ return g.primary.paid; }).forEach(function(g){
                  var key = paidMonthKey(g.primary) || "unknown";
                  (paidGroupsMap[key] = paidGroupsMap[key]||[]).push(g);
                });
                var paidGroupKeys = Object.keys(paidGroupsMap).sort(function(a,b){
                  if(a==="unknown") return 1;
                  if(b==="unknown") return -1;
                  return b.localeCompare(a); // сначала последний оплаченный месяц
                });
                var expandedMonths = state.registryExpandedMonths || {};
                paidGroupKeys.forEach(function(key){
                  var items = paidGroupsMap[key];
                  // Пока не выбрана сортировка по колонке — внутри месяца
                  // показываем сначала недавно оплаченное; клик по заголовку
                  // ("№ заявки"/"Отель") переопределяет это, как и для
                  // неоплаченных выше.
                  if(!rSortField) items = items.slice().sort(function(a,b){ return (b.primary.paid_at||"").localeCompare(a.primary.paid_at||""); });
                  var monthExpanded = !!expandedMonths[key];
                  out.push(paidMonthDividerRow(key, items, monthExpanded));
                  // 0.3.2: счета внутри месяца рисуем, только если месяц
                  // раскрыт — иначе нумерация строк ("№" в первой колонке)
                  // прыгала бы через невидимые строки.
                  if(monthExpanded) items.forEach(function(g){
                    rowNum++;
                    out.push(registryGroupRow(g, rowNum, editableRegistry, !!expandedGroups[g.key]));
                  });
                });
                return out.join("");
              })()}
            </tbody>
            ${groups.length>0 ? h`<tfoot><tr class="registry-totals-row">
              <td colspan="8" class="muted" style="text-align:right;">Итого по показанным ${groups.length} счетам${missingAmountCount?' (без данных для расчёта: '+missingAmountCount+')':''}${pendingRateCount?' (ожидание курса НБ РК: '+pendingRateCount+')':''}:</td>
              <td class="mono" style="text-align:right;font-size:11px;" title="«Оплачено»/«К оплате» — это «Учтено в затратах», т.е. KZT без НДС"><b>Оплачено: ${fmtKZT(sumPaid)}</b><br><span class="muted">К оплате: ${fmtKZT(sumDue)}</span></td>
              <td colspan="2"></td>
            </tr></tfoot>` : ""}
            </table></div>
          <div class="helptext" style="padding:10px 16px;">Счёт попадает сюда автоматически при прикреплении к заявке в её карточке. Сумму счёта указывает Администратор, Руководитель или Финансист — по ней считаются итоги «оплачено»/«к оплате» выше. Один и тот же счёт, приложенный сразу к нескольким заявкам, показан одной строкой — раскройте её (▸), чтобы указать долю каждой заявки в процентах или в сумме.</div>
        </div>
      </div>`;
  }

  /* ============================== «ФИНАНСЫ» → НАЛИЧНЫЕ РАСХОДЫ (0.2.4) ============================== */
  // Отдельно от invoices/«Реестра платежей»: там — счета от поставщиков,
  // оплаченные по безналу против конкретного документа; здесь — наличные,
  // которые прораб получает на руки под мелкие покупки, а что именно на них
  // куплено, известно только из его последующего отчёта. Две ленты фактов без
  // формального согласования (по решению Антона): "Выдачи" и "Расходы" —
  // баланс по каждому прорабу приложение считает само (см. viewCashExpenses).
  var CASH_EXPENSE_CATEGORY_LABEL = { materials: "Материал", other: "Другое" };
  function distinctCashPersons(){
    var set = {};
    (state.cashAdvances||[]).forEach(function(a){ if(a.person) set[a.person]=true; });
    (state.cashExpenses||[]).forEach(function(e){ if(e.person) set[e.person]=true; });
    return Object.keys(set).sort();
  }
  // Расходы конкретной заявки (по одной, не по нескольким — см. cash_expenses.ticket_id
  // в схеме) — используется и в materialsState() (пункт "Материал" чек-листа),
  // и в блоке "Затраты по заявке" в карточке.
  function cashExpensesFor(t, category){
    return (state.cashExpenses||[]).filter(function(ce){ return ce.ticket_id===t.id && (category===undefined || ce.category===category); });
  }
  // "Затраты по заявке" — сколько денег реально ушло на конкретную заявку:
  // сумма ОПЛАЧЕННЫХ счетов (любая категория — и «Бригада», и «Материал») плюс
  // сумма привязанных к заявке наличных расходов (тоже любая категория).
  // Неоплаченные счета не считаются — это ещё не потраченные, а только
  // предстоящие деньги.
  function ticketCostTotal(t){
    var paidInvoices = (state.invoices||[]).filter(function(iv){ return iv.ticket_id===t.id && iv.paid; });
    var invoiceSum = paidInvoices.reduce(function(s,iv){ return s + (Number(iv.amount)||0); }, 0);
    var cashRows = cashExpensesFor(t);
    var cashSum = cashRows.reduce(function(s,ce){ return s + (Number(ce.amount)||0); }, 0);
    return { invoiceSum: invoiceSum, cashSum: cashSum, total: invoiceSum + cashSum, invoiceCount: paidInvoices.length, cashCount: cashRows.length };
  }
  function addCashAdvance(data){
    if(!canEditRegistry()){ alert("Фиксировать выдачу наличных может только Администратор, Руководитель или Финансист."); return false; }
    var person = (data.person||"").trim();
    if(!person){ alert("Укажите, кому выданы наличные."); return false; }
    var amount = Number(data.amount);
    if(!amount || amount<=0){ alert("Укажите сумму выдачи."); return false; }
    sb.from("cash_advances").insert({
      date: data.date || new Date().toISOString().slice(0,10),
      person: person, amount: amount,
      hotel_id: data.hotel_id ? Number(data.hotel_id) : null,
      note: data.note ? data.note.trim() : null,
      created_by: myLabelWithRole()
    }).then(function(res){ if(res && res.error) alert("Не удалось сохранить выдачу: " + res.error.message); });
    return true;
  }
  function deleteCashAdvance(id){
    if(!canEditRegistry()) return;
    if(!confirm("Удалить эту запись о выдаче?")) return;
    sb.from("cash_advances").delete().eq("id", id).then(function(){});
  }
  // 0.3.2 (по просьбе Антона, п.3): галочка "Выдано" — подтверждение самим
  // Финансистом, что деньги реально ушли (в отличие от факта записи выдачи
  // в систему, который мог внести и Администратор/Руководитель). Только
  // Финансист может её ставить/снимать — см. isFinance() выше. Патчим
  // state.cashAdvances локально ДО запроса, как и setInvoicePaid выше, —
  // чтобы галочка не "прыгала" в ожидании ответа сети.
  function setCashAdvanceConfirmed(id, val){
    if(!isFinance()){ alert("Отмечать выдачу как «Выдано» может только Финансист."); return; }
    var a = (state.cashAdvances||[]).find(function(x){ return x.id===id; });
    var confirmedAt = val ? new Date().toISOString() : (a ? a.confirmed_at : null);
    if(a){ a.confirmed = val; a.confirmed_at = confirmedAt; }
    sb.from("cash_advances").update({confirmed:val, confirmed_at:confirmedAt}).eq("id", id).then(function(res){
      if(res && res.error) alert("Не удалось сохранить отметку: " + res.error.message);
    });
    render();
  }
  // Чек/квитанция к выдаче (например, если деньги переведены на карту, а не
  // выданы наличными) — тот же приём, что uploadInvoice/uploadPhoto выше:
  // файл в Storage (свой бакет "cash-receipts", см. supabase_schema.sql),
  // путь и исходное имя — в самой записи cash_advances.
  function uploadCashReceipt(id, file){
    var path = id + "/" + Date.now() + "_" + file.name.replace(/[^\w.\-]+/g,"_");
    return readFileAsBuffer(file).then(function(buf){
      return sb.storage.from("cash-receipts").upload(path, buf, {contentType: file.type || "application/octet-stream"});
    }).then(function(res){
      if(res.error) throw res.error;
      return sb.from("cash_advances").update({receipt_path: path, receipt_name: file.name}).eq("id", id);
    }).then(function(res){
      if(res && res.error) throw res.error;
      var a = (state.cashAdvances||[]).find(function(x){ return x.id===id; });
      if(a){ a.receipt_path = path; a.receipt_name = file.name; }
      render();
    }).catch(function(err){
      alert("Не удалось прикрепить чек: " + (err&&err.message?err.message:err));
    });
  }
  function openCashReceiptFile(path){
    sb.storage.from("cash-receipts").createSignedUrl(path, 3600).then(function(res){
      if(res.data && res.data.signedUrl) window.open(res.data.signedUrl, "_blank");
      else alert("Не удалось открыть файл.");
    });
  }
  function deleteCashReceipt(id, path){
    if(!confirm("Удалить прикреплённый чек?")) return;
    sb.storage.from("cash-receipts").remove([path]).then(function(){
      return sb.from("cash_advances").update({receipt_path: null, receipt_name: null}).eq("id", id);
    }).then(function(){
      var a = (state.cashAdvances||[]).find(function(x){ return x.id===id; });
      if(a){ a.receipt_path = null; a.receipt_name = null; }
      render();
    });
  }
  // ticketRef — то, что человек ввёл в поле "Заявка" (текст с автоподсказкой по
  // № c-lector существующих заявок). Разрешена только ОДНА заявка на расход —
  // по решению Антона: если один расход в отчёте прораба относится сразу к
  // нескольким заявкам, точную сумму "сколько ушло на эту заявку" посчитать
  // нельзя, такую строку правильнее оставить вовсе без привязки к заявке.
  function resolveTicketRef(ticketRef){
    var raw = String(ticketRef||"").trim();
    if(!raw) return null;
    var t = state.tickets.find(function(x){ return x.external_ref && normalizeForMatch(x.external_ref)===normalizeForMatch(raw); });
    return t ? t.id : null;
  }
  function addCashExpense(data){
    if(!canEditRegistry()){ alert("Вносить наличные расходы может только Администратор, Руководитель или Финансист."); return false; }
    var person = (data.person||"").trim();
    var description = (data.description||"").trim();
    if(!person || !description){ alert("Укажите наименование и кто потратил."); return false; }
    var qty = Number(data.qty) || 1;
    var unitCost = Number(data.unit_cost) || 0;
    var category = data.category==="other" ? "other" : "materials";
    var expTicketId = resolveTicketRef(data.ticket_ref);
    sb.from("cash_expenses").insert({
      date: data.date || new Date().toISOString().slice(0,10),
      description: description, qty: qty, unit_cost: unitCost, amount: qty*unitCost,
      hotel_id: data.hotel_id ? Number(data.hotel_id) : null,
      ticket_id: expTicketId,
      category: category,
      person: person, created_by: myLabelWithRole()
    }).then(function(res){
      if(res && res.error){ alert("Не удалось сохранить расход: " + res.error.message); return; }
      if(category==="materials" && expTicketId) maybeClearMaterialsCashPending(expTicketId);
    });
    return true;
  }
  function deleteCashExpense(id){
    if(!canEditRegistry()) return;
    if(!confirm("Удалить эту запись о расходе?")) return;
    sb.from("cash_expenses").delete().eq("id", id).then(function(){});
  }
  // Вставка таблицы для "Расходов" — тот же принцип, что и импорт из c-lector
  // (parseDelimited + угадывание колонок по заголовку), но своя, более узкая
  // карта полей и своя целевая таблица (cash_expenses, не tickets).
  function guessCashExpenseMapping(headers){
    var map = {}; var used = {};
    var patterns = {
      date: /дата/i,
      qty: /кол[-\s]?во|количество/i,
      unit_cost: /стоимост|цена/i,
      hotel: /мотель|отел|объект/i,
      // "№ Заявки" — проверяем раньше description, иначе широкий паттерн
      // описания перехватит колонку с номерами заявок.
      ticket: /заявк|№/i,
      description: /наименован|товар|расход|назван/i
    };
    Object.keys(patterns).forEach(function(field){
      for(var i=0;i<headers.length;i++){
        if(used[i]) continue;
        if(patterns[field].test(headers[i])){ map[field]=String(i); used[i]=true; return; }
      }
      map[field] = "";
    });
    return map;
  }
  function setCashImportData(headers, rows){
    state.cashImportFileError = "";
    state.cashImportHeaders = headers; state.cashImportRows = rows;
    state.cashImportMapping = guessCashExpenseMapping(headers);
    state.cashImportResult = null;
    render();
  }
  function parseMoney(raw){
    var n = Number(String(raw==null?"":raw).replace(/[^\d.,\-]/g,"").replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  // Строит превью строк для подтверждения перед вставкой — дата/мотель/заявка
  // уже разрешены в реальные объекты (или null, если не найдено/неоднозначно),
  // чтобы дальше и предпросмотр, и commitCashImport() читали готовое значение.
  function buildCashImportPreview(){
    var m = state.cashImportMapping;
    function get(row, field){ var idx = m[field]; return (idx!==undefined && idx!=="" && row[idx]!=null) ? row[idx] : ""; }
    return state.cashImportRows.map(function(row){
      var dateRaw = get(row,"date"); var date = parseCLectorDate(dateRaw);
      var hotelName = get(row,"hotel"); var hotel = matchHotelByName(hotelName);
      var ticketRaw = String(get(row,"ticket")||"").trim();
      var ticketTokens = ticketRaw.split(/[,;]+/).map(function(s){return s.trim();}).filter(Boolean);
      var ticket = null, ticketAmbiguous = false;
      if(ticketTokens.length===1){ var tid = resolveTicketRef(ticketTokens[0]); if(tid) ticket = state.tickets.find(function(x){return x.id===tid;}); }
      else if(ticketTokens.length>1){ ticketAmbiguous = true; }
      var qty = Number(get(row,"qty")) || 1;
      var unitCost = parseMoney(get(row,"unit_cost"));
      return {
        description: get(row,"description") || "(без наименования)",
        dateRaw: dateRaw, date: date,
        hotelName: hotelName, hotel: hotel,
        ticketRaw: ticketRaw, ticket: ticket, ticketAmbiguous: ticketAmbiguous,
        qty: qty, unitCost: unitCost, amount: qty*unitCost
      };
    });
  }
  function commitCashImport(category, person){
    if(!canEditRegistry()) return;
    var preview = buildCashImportPreview();
    if(!preview.length) return;
    var createdBy = myLabelWithRole();
    var payload = preview.map(function(p){
      return {
        date: p.date ? p.date.toISOString().slice(0,10) : new Date().toISOString().slice(0,10),
        description: p.description, qty: p.qty, unit_cost: p.unitCost, amount: p.amount,
        hotel_id: p.hotel ? p.hotel.id : null,
        ticket_id: p.ticket ? p.ticket.id : null,
        category: category==="other" ? "other" : "materials",
        person: person, created_by: createdBy
      };
    });
    state.cashImportBusy = true; render();
    sb.from("cash_expenses").insert(payload).then(function(res){
      state.cashImportBusy = false;
      if(res && res.error){ state.cashImportFileError = "Не удалось сохранить: " + res.error.message; render(); return; }
      state.cashImportResult = { count: payload.length };
      state.cashImportHeaders = []; state.cashImportRows = []; state.cashImportMapping = {};
      render();
      if(category==="materials"){
        payload.forEach(function(p){ if(p.ticket_id) maybeClearMaterialsCashPending(p.ticket_id); });
      }
    });
  }
  function resetCashImport(){ state.cashImportHeaders=[]; state.cashImportRows=[]; state.cashImportMapping={}; state.cashImportResult=null; state.cashImportFileError=""; render(); }
  var CASH_IMPORT_FIELD_LABEL = { date:"Дата", description:"Наименование", qty:"Кол-во", unit_cost:"Цена", hotel:"Мотель", ticket:"№ Заявки" };
  function viewCashExpenses(){
    var editable = canEditRegistry();
    var advances = (state.cashAdvances||[]).slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    var expenses = (state.cashExpenses||[]).slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    var persons = distinctCashPersons();
    var todayIso = new Date().toISOString().slice(0,10);
    function fmtSum(n){ return (Number(n)||0).toLocaleString("ru-RU", {maximumFractionDigits:2}); }
    var byPerson = {};
    persons.forEach(function(p){ byPerson[p] = {given:0, spent:0}; });
    advances.forEach(function(a){ if(byPerson[a.person]) byPerson[a.person].given += Number(a.amount)||0; });
    expenses.forEach(function(e){ if(byPerson[e.person]) byPerson[e.person].spent += Number(e.amount)||0; });
    var hotelOptions = state.hotels.filter(function(x){return x.in_service;}).map(function(x){ return h`<option value="${x.id}">№${x.id} ${escapeHtml(x.name)}</option>`; }).join("");

    return h`
      ${financeTabs('cashexpenses')}
      <datalist id="cash-persons">${persons.map(function(p){ return `<option value="${escapeHtml(p)}">`; }).join("")}</datalist>
      <datalist id="cash-expense-tickets">${state.tickets.filter(function(t){return t.external_ref;}).map(function(t){ return `<option value="${escapeHtml(t.external_ref)}">`; }).join("")}</datalist>
      <div class="row-gap">
        <div class="card card-pad">
          <div class="section-title">Баланс по прорабам</div>
          ${persons.length===0 ? h`<div class="muted" style="font-size:13px;">Пока нет ни одной записи.</div>` : h`
          <div class="table-wrap"><table>
            <thead><tr><th>Прораб</th><th class="num">Выдано</th><th class="num">Потрачено</th><th class="num">Остаток</th></tr></thead>
            <tbody>${persons.map(function(p){
              var b = byPerson[p]; var balance = b.given - b.spent;
              return h`<tr class="cash-balance-row ${balance<0?'negative':''}">
                <td>${escapeHtml(p)}</td>
                <td class="num mono">${fmtSum(b.given)}</td>
                <td class="num mono">${fmtSum(b.spent)}</td>
                <td class="num mono">${fmtSum(balance)}</td>
              </tr>`;
            }).join("")}</tbody>
          </table></div>`}
          <div class="helptext" style="padding-top:8px;">Остаток = выдано минус подтверждено расходами. Отрицательный — прораб потратил больше, чем получил на руки.</div>
        </div>

        <div class="row-gap">
          <div class="card card-pad">
            <div class="section-title">Выдачи</div>
            <div class="table-wrap"><table>
              <thead><tr><th>Дата</th><th>Кому</th><th class="num">Сумма</th><th>Мотель</th><th>Комментарий</th><th style="text-align:center;">Выдано</th><th>Чек</th>${editable?'<th></th>':''}</tr></thead>
              <tbody>${advances.length===0 ? h`<tr><td colspan="${editable?8:7}"><div class="empty-state"><b>Пока нет выдач</b>Выдали наличные — впишите ниже.</div></td></tr>` :
                advances.map(function(a){
                  var hotel = a.hotel_id ? hotelById(a.hotel_id) : null;
                  return h`<tr>
                    <td class="mono muted">${fmtDateShort(a.date)}</td>
                    <td>${escapeHtml(a.person)}</td>
                    <td class="num mono">${fmtSum(a.amount)}</td>
                    <td class="muted">${hotel ? ('№'+hotel.id+' '+escapeHtml(hotel.name)) : '—'}</td>

            ${editable ? h`<form id="cash-expense-form" class="field-row" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;">

  }
  // Вставка таблицы отчёта прораба — тот же принцип, что и импорт из c-lector
  // (paste → угадать колонки → превью → подтвердить), но своя карта полей и

  // из одного отчёта — от одного и того же человека и одной категории; если

  function cashImportBlock(){
    if(state.cashImportResult){

        <tbody>${preview.map(function(p){
          return h`<tr>
            <td class="mono ${p.date?'':'text-warn'}">${p.date ? fmtDateShort(p.date.toISOString()) : (p.dateRaw||'—')}</td>

  /* ============================== КАРТА (Leaflet + OpenStreetMap) ============================== */
  // 0.3.4 (по просьбе Антона): раньше карта требовала платный Google Maps
  // JavaScript API и отдельный ключ — теперь Leaflet с бесплатными тайлами
  // OpenStreetMap (см. вставку <link>/<script> в <head> в начале файла);
  // ключ вообще не нужен, детализация OSM с большим запасом покрывает то,
  // что здесь требуется (метки отелей поверх обычной карты страны/региона).
  var mapInstance = null, mapMarkers = [];
  // Метки на карте показывают количество активных (не закрытых/не отклонённых)
  // заявок по каждому отелю; клик по метке — переход в список заявок этого отеля.
  // Своя иконка (L.divIcon) вместо стандартной — чтобы число заявок было видно
  // прямо на метке, как раньше на Google-маркере (там это было готовым
  // свойством "label", у Leaflet своей текстовой метки на маркере нет).
  function mapMarkerIcon(count){
    return L.divIcon({
      className: "map-marker-icon",
      html: '<div class="map-marker-badge'+(count>0?' has-tickets':'')+'">'+count+'</div>',
      iconSize: [28,28], iconAnchor: [14,14]
    });
  }
  function ensureMap(){
    if(!MAPS_LIB_LOADED) return;
    var container = document.getElementById("map-canvas");
    if(!container) return;
    var counts = {};
    state.tickets.filter(isActive).forEach(function(t){ counts[t.hotel_id]=(counts[t.hotel_id]||0)+1; });
    // 0.3.4: #map-canvas — часть шаблона раздела "Карта" и уничтожается
    // morphdom'ом при уходе с этого раздела (его нет в шаблоне других
    // разделов); при возврате на "Карту" появляется заново с тем же id, но
    // это уже ДРУГОЙ узел DOM. Старый экземпляр Leaflet, привязанный к
    // прежнему узлу, в этом случае сносим и создаём заново на новом —
    // иначе карта останется пустой (Leaflet рисует только в тот div, на
    // котором был создан).
    if(mapInstance && mapInstance.getContainer()!==container){
      mapInstance.remove();
      mapInstance = null;
      mapMarkers = [];
    }
    if(!mapInstance){
      mapInstance = L.map(container).setView([48.0, 68.0], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(mapInstance);
    } else {
      // тот же самый div, но раздел мог быть скрыт/показан заново (или
      // изменился размер окна) — обновляем размер тайлов на всякий случай.
      mapInstance.invalidateSize();
    }
    mapMarkers.forEach(function(m){ mapInstance.removeLayer(m); });
    mapMarkers = [];
    state.hotels.forEach(function(hotel){
      if(hotel.lat==null || hotel.lng==null) return;
      var count = counts[hotel.id]||0;
      var marker = L.marker([hotel.lat, hotel.lng], { icon: mapMarkerIcon(count), title: "№"+hotel.id+" "+hotel.name+" — открытых заявок: "+count }).addTo(mapInstance);
      marker.on("click", function(){
        state.filters = state.filters||{}; state.filters.hotel = String(hotel.id); state.filters.statusList=[]; state.filters.zone=""; state.filters.q="";
        location.hash = "#/tickets";
      });
      mapMarkers.push(marker);
    });
  }
  function viewMap(){
    if(!MAPS_LIB_LOADED){
      return h`<div class="card card-pad">
        <div class="section-title">Карта отелей</div>
        <p style="font-size:13px;">Не удалось загрузить карту (библиотека Leaflet с CDN) — проверьте подключение к интернету и обновите страницу. Остальное приложение работает как обычно.</p>
      </div>`;
    }
    return h`<div class="card card-pad">
      <div class="section-title">Карта отелей — открытые заявки</div>
      <div id="map-canvas"></div>
      <div class="helptext" style="margin-top:10px;">Число на метке — количество активных заявок по объекту. Нажмите на метку, чтобы перейти к списку заявок этого отеля. Карта — OpenStreetMap.</div>
    </div>`;
  }

  /* ============================== БРИГАДЫ ============================== */
  // Сколько сейчас активных (не выполненных/не отклонённых) заявок числится за
  // бригадой — заявка на бригаду хранит assigned_to как "Бригада: <название>"
  // (см. renderTicketPanel/assign-select).
  function crewActiveCount(crewName){
    var label = "Бригада: " + crewName;
    return state.tickets.filter(function(t){ return t.assigned_to===label && !isTicketDone(t); }).length;
  }
  function viewCrews(){
    return h`
      <div class="two-col">
        <div class="card card-pad">
          <div class="section-title">Бригады</div>
          ${state.crews.length===0 ? h`<div class="empty-state"><b>Бригад пока нет</b>Создайте первую бригаду справа.</div>` : h`
          <div class="row-gap">${state.crews.map(function(c){
            var activeCount = crewActiveCount(c.name);
            return h`<div class="card card-pad" style="background:var(--surface-2);">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <input type="text" data-crew-rename="${c.id}" value="${escapeHtml(c.name)}" style="flex:1;min-width:160px;font-weight:600;">
                <span class="pill ${activeCount>0?'pill-accent':'pill-neutral'}" title="Активных заявок на этой бригаде сейчас">${activeCount} в работе</span>
                <button class="btn btn-sm btn-ghost btn-danger" data-action="crew-delete" data-id="${c.id}">Удалить бригаду</button>
              </div>
              <div class="chip-toggle" style="margin-top:10px;">
                ${(c.members||[]).map(function(m){ return h`<label>${escapeHtml(m)} <a href="#" data-action="crew-member-remove" data-id="${c.id}" data-member="${escapeHtml(m)}" style="color:var(--crit);text-decoration:none;">✕</a></label>`; }).join("") || '<span class="muted" style="font-size:12px;">Участников пока нет.</span>'}
              </div>
              <form class="crew-member-form" data-id="${c.id}" style="margin-top:10px;display:flex;gap:6px;">
                <input type="text" name="member" placeholder="Фамилия И.О." style="flex:1;min-width:140px;">
                <button class="btn btn-sm" type="submit">Добавить</button>
              </form>
            </div>`;
          }).join("")}</div>`}
        </div>
        <div class="card card-pad">
          <div class="section-title">Новая бригада</div>
          <form id="crew-form">
            <div class="field"><label>Название бригады</label><input type="text" name="name" required placeholder="напр. Бригада №1"></div>
            <button class="btn btn-primary" type="submit">Создать</button>
          </form>
        </div>
      </div>
      <div class="card card-pad" style="margin-top:18px;">
        <div class="section-title">Ответственный техник по объектам</div>
        <div class="helptext" style="margin-bottom:10px;">Тот, кто от VDS выезжает на объект на осмотр, если там что-то произошло — не путать с «Лицом от Заказчика» (контакт со стороны отеля, редактируется в разделе «Отели»).</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Отель</th><th>Ответственный техник</th><th>Телефон</th></tr></thead>
          <tbody>${state.hotels.length===0 ? h`<tr><td colspan="3"><div class="empty-state"><b>Отелей пока нет</b>Добавьте их в разделе «Отели».</div></td></tr>` :
            state.hotels.slice().sort(function(a,b){ return a.id-b.id; }).map(function(x){
              return h`<tr>
                <td><span class="ttl">№${x.id} ${escapeHtml(x.name)}</span></td>
                <td><input type="text" data-hotel-field="vds_tech_name" data-id="${x.id}" value="${escapeHtml(x.vds_tech_name||'')}" placeholder="ФИО" style="min-width:160px;"></td>
                <td>
                  <input type="text" data-hotel-field="vds_tech_phone" data-id="${x.id}" value="${escapeHtml(x.vds_tech_phone||'')}" placeholder="+7…" style="min-width:140px;">
                  ${x.vds_tech_phone ? h`<div><a href="tel:${escapeHtml(x.vds_tech_phone.replace(/[^\d+]/g,''))}" style="font-size:11px;">Позвонить</a></div>` : ""}
                </td>
              </tr>`;
            }).join("")}
          </tbody></table></div>
      </div>`;
  }

  /* ============================== ОТЕЛИ ============================== */
  function addHotel(name, zone, lat, lng){
    if(!name || !name.trim()){ alert("Введите название отеля."); return; }
    sb.from("hotels").insert({
      name: name.trim(), zone: zone? Number(zone): null, in_service:true,
      lat: (lat!==""&&lat!=null)? Number(lat): null, lng: (lng!==""&&lng!=null)? Number(lng): null
    }).then(function(res){ if(res && res.error) alert("Не удалось добавить отель: "+res.error.message); });
  }
  function updateHotelField(id, field, val){
    var patch = {};
    if(field==="zone") patch.zone = val===""? null : Number(val);
    else if(field==="lat" || field==="lng") patch[field] = val===""? null : Number(val);
    else patch[field] = val;
    sb.from("hotels").update(patch).eq("id", id).then(function(){});
  }
  function toggleHotelActive(id, makeActive){ sb.from("hotels").update({in_service: makeActive}).eq("id", id).then(function(){}); }
  function deleteHotel(id){
    var used = state.tickets.some(function(t){ return Number(t.hotel_id)===Number(id); });
    if(used){ alert("Нельзя удалить отель, по которому уже есть заявки в системе — история должна остаться привязана к отелю. Вместо удаления снимите галочку «В эксплуатации»: он перестанет предлагаться для новых заявок, но старые не пострадают."); return; }
    if(!confirm("Удалить отель?")) return;
    sb.from("hotels").delete().eq("id", id).then(function(){});
  }
  // 0.2.17: «Зона» / «Координаты» / «Лицо от Заказчика» в «Отелях» — обычный
  // текст без рамки поля ввода, если уже заполнено; клик раскрывает
  // настоящее поле (или группу полей) ввода на его месте — тот же приём,
  // что и у «Суммы» в «Реестре платежей» (0.2.16). Пока поле пустое,
  // раскрытым остаётся сразу поле ввода (заполнять есть что). «Название» в
  // этот приём не входит — оно обязательное и всегда обычный input.
  function hotelZoneCell(x){
    var key = x.id+":zone";
    if(state.hotelEditingKey!==key && x.zone){

  /* ============================== TICKET PANEL ============================== */
  // 0.3.4 (по просьбе Антона): при скролле вниз по карточке заявки её
  // почему-то само возвращало вверх — карточка перерисовывается очень часто
  // (любое сохранение поля, любое realtime-обновление заявки/счёта/фото
  // вызывает полный render(), который каждый раз вызывает и
  // renderTicketPanel() тоже), и morphdom не всегда сохраняет один и тот же
  // узел .panel между перерисовками один в один — например когда рядом с
  // началом карточки появляется/исчезает условный блок (баннер, предупреждение)
  // и это сдвигает позицию последующих элементов. Раньше это просто теряло
  // scrollTop. Явно запоминаем прокрутку .panel до перерисовки и
  // восстанавливаем её после — независимо от того, сохранил morphdom узел
  // сам по себе или нет.
  function renderTicketPanel(){
    var panelEl = document.querySelector("#overlay-root .panel");
    var savedScrollTop = panelEl ? panelEl.scrollTop : 0;
    renderInProgress = true;
    try{ renderTicketPanelInner(); } finally { renderInProgress = false; }
    if(savedScrollTop){
      var newPanelEl = document.querySelector("#overlay-root .panel");
      if(newPanelEl) newPanelEl.scrollTop = savedScrollTop;
    }
  }
  function renderTicketPanelInner(){
    var root = document.getElementById("overlay-root");

    var hotel = hotelById(t.hotel_id); var di = deadlineInfo(t);
    var specialists = state.profiles.filter(function(m){ return m.role==="specialist" && m.active!==false; });

    morphInto(root, h`

                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                </button>
                <span style="font-size:12px;color:var(--ink-faint);font-weight:600;white-space:nowrap;">· ${t.zone? ("Зона "+escapeHtml(String(t.zone))) : "стройка"}</span>
              </span>
              <span style="display:flex;align-items:center;gap:6px;flex:none;">
                ${t.external_status? externalStatusPill(t.external_status): statusPill(t.status)}

  // Окно «Права» в «Команде» (0.2.10, по просьбе Антона) — владелец службы
  // может для КОНКРЕТНОГО человека галочками добавить разделы сверх того, что

  // право отмечать счета оплаченными («Оплачено» в «Реестре платежей» и

  function openPermissionsModal(userId){
    var m = state.profiles.find(function(p){ return p.id===userId; });

    var extra = m.extra_views || [];
    var roleAllowed = ROLE_NAV.hasOwnProperty(m.role) ? ROLE_NAV[m.role] : null;
    openModal(h`
      <div class="modal" data-stop style="width:560px;">
        <div class="modal-head"><h2>Права — ${escapeHtml(m.name||m.email)}</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="permissions-form">
          <div class="modal-body">
            <div class="helptext" style="margin-bottom:12px;">Роль «${escapeHtml(roleLabel(m.role))}»${roleAllowed===null?' уже даёт доступ ко всем разделам — галочки ниже ничего не добавят.':(roleAllowed&&roleAllowed.length?' уже даёт доступ к: '+roleAllowed.map(function(v){var f=PERMISSION_VIEWS.find(function(x){return x[0]===v;});return f?f[1]:v;}).join(", ")+'.':' пока не даёт доступа ни к одному разделу.')} Галочки ниже ДОБАВЛЯЮТ разделы именно этому человеку, не трогая роль и остальных.${m.role==="pending"?' Пока роль «Ожидает назначения роли» — человек не попадёт даже на «Дашборд», какие бы галочки здесь ни стояли: сначала смените роль (например, на «Диспетчер»).':''}</div>
            <div class="chip-toggle" style="gap:8px;">
              ${PERMISSION_VIEWS.map(function(v){
                var alreadyByRole = roleAllowed===null || (roleAllowed && roleAllowed.indexOf(v[0])>-1);
                var checked = alreadyByRole || extra.indexOf(v[0])>-1;
                return h`<label title="${alreadyByRole?'Уже открыто ролью «'+escapeHtml(roleLabel(m.role))+'»':''}">
                  <input type="checkbox" name="view_${v[0]}" ${checked?'checked':''} ${alreadyByRole?'disabled':''}> ${v[1]}
                </label>`;
              }).join("")}
            </div>
            <hr style="margin:14px 0;border:none;border-top:1px solid var(--line);">
            <div class="chip-toggle"><label title="${(m.role==="dispatcher"||m.role==="head"||m.role==="finance")?'Уже даётся ролью «'+escapeHtml(roleLabel(m.role))+'»':''}"><input type="checkbox" name="editRegistry" ${(m.role==="dispatcher"||m.role==="head"||m.role==="finance")?'checked disabled':(m.can_edit_registry?'checked':'')}> Может отмечать счета оплаченными (Реестр платежей / Наличные расходы)</label></div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close-modal>Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>
        </form>
      </div>`);
    document.getElementById("permissions-form").addEventListener("submit", function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var newExtra = PERMISSION_VIEWS.filter(function(v){
        var alreadyByRole = roleAllowed===null || (roleAllowed && roleAllowed.indexOf(v[0])>-1);
        return !alreadyByRole && fd.get("view_"+v[0]);
      }).map(function(v){ return v[0]; });
      var editRegistry = (m.role==="dispatcher"||m.role==="head"||m.role==="finance") ? false : !!fd.get("editRegistry");
      updateProfile(userId, {extra_views:newExtra, can_edit_registry:editRegistry});

  // Раньше дата ожидаемой поставки материалов вводилась через prompt() обычным

  // 0.3.4 (по просьбе Антона): "Реестр платежей" группирует оплаченные счета

  // "id1,id2,..." (может быть несколько копий одного счёта в группе),
  // currentPaidAt — paid_at основного счёта группы, для значения по

            <div class="helptext">Меняет только раздел «Реестра платежей», в котором показан счёт — на сумму пересчёта по курсу Нацбанка РК (см. «Учтено в затратах») это тоже повлияет, раз она считается на день оплаты.</div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close-modal>Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>

    document.getElementById("invoice-paid-month-form").addEventListener("submit", function(e){
      e.preventDefault(); var fd=new FormData(e.target); var m=fd.get("paidMonth");

  // Ручная форма правки снимка портфеля (openPortfolioModal, кнопка
  // "Обновить снимок") убрана в 0.2.9 — снимок теперь считается и сохраняется
  // автоматически при каждом импорте из c-lector, см. updatePortfolioFromImport().

  /* ============================== ROOT RENDER ============================== */
  // 0.3.3 (по просьбе Антона — «оптимизация и совершенствование», после того
  // как фикс 0.3.2 для "стирается поле при вводе" вылечил именно этот
  // конкретный симптом, но не саму причину): вместо полной пересборки
  // #app/#overlay-root через innerHTML на каждый render() — а render()
  // вызывается не только по прямому действию человека, но и любым из
  // realtime-каналов (см. "-rt" ниже) и минутным таймером — теперь
  // используется morphdom (вшита выше, в <head>). Она патчит только реально
  // изменившиеся узлы живого DOM, а не пересоздаёт всё целиком: узел, который
  // и так совпадает с новым состоянием (в том числе поле, в которое человек
  // печатает прямо сейчас), просто не трогается — фокус, курсор и
  // недописанный текст сохраняются сами по себе, без отдельной ловли и
  // ручного переноса значения после пересборки, как приходилось делать
  // раньше.
  var renderInProgress = false;
  function isActiveTypingField(el){
    return !!(el && (el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && /^(text|number|tel|email|search|)$/i.test(el.type||"text"))));
  }
  // morphdom по умолчанию всегда синхронизирует .value инпута/textarea с
  // новым состоянием (см. specialElHandlers внутри вшитой библиотеки) — это
  // ровно то, что стирало бы набранный текст. Для поля, в которое прямо
  // сейчас печатает человек, подменяем "новое" значение на уже стоящее в
  // поле — синхронизировать тогда нечего, и .value/курсор не трогаются
  // вовсе (сам узел morphdom и так не пересоздаёт, раз атрибуты совпадают).
  function morphdomPreserveTyping(fromEl, toEl){
    if(fromEl === document.activeElement && isActiveTypingField(fromEl)){
      toEl.value = fromEl.value;
    }
    return true;
  }
  // #map-canvas (см. ensureMap() ниже) — Google Maps сама вставляет туда
  // тайлы/controls напрямую через DOM API, в обход наших html-шаблонов, где
  // этот div всегда пустой. Без этой отметки morphdom при каждом render()
  // удалял бы из него всё, что туда вставила карта, потому что в "новом"
  // HTML у этого div нет детей.
  function morphdomSkipChildrenFor(fromEl){
    return fromEl.id !== "map-canvas";
  }
  function morphInto(container, html){
    window.morphdom(container, "<div>" + html + "</div>", {
      childrenOnly: true,
      onBeforeElUpdated: morphdomPreserveTyping,
      onBeforeElChildrenUpdated: morphdomSkipChildrenFor
    });
  }
  function render(){
    invalidateInvoiceGroupIndex();
    renderInProgress = true;
    try{ renderInner(); } finally { renderInProgress = false; }
  }
  function renderInner(){
    if(!CONFIGURED){
      morphInto(document.getElementById("app"), h`<div class="card configwarn">
        <h2 style="margin-top:0;">Настройка не завершена</h2>
        <p>Впишите <code>SUPABASE_URL</code> и <code>SUPABASE_ANON_KEY</code> в начале файла (значения — в вашем проекте Supabase: Project Settings → API) и разверните страницу снова.</p>
      </div>`);
      return;
    }
    if(!LIB_LOADED){
      morphInto(document.getElementById("app"), h`<div class="card configwarn">
        <h2 style="margin-top:0;">Не удалось загрузить Supabase</h2>
        <p>Библиотека <code>supabase-js</code> не загрузилась с CDN (cdn.jsdelivr.net) — проверьте подключение к интернету, отключите VPN/блокировщик, если он ограничивает доступ к CDN, и обновите страницу (F5).</p>
        <button class="btn btn-primary" onclick="location.reload()">Обновить страницу</button>
      </div>`);
      return;
    }
    if(!state.session){ renderAuthScreen(); return; }
    if(!state.me || !state.hotelsLoaded){ morphInto(document.getElementById("app"), h`<div class="auth-wrap"><div class="muted">Загрузка…</div></div>`); return; }
    // Новый человек (0.2.9) — авторизован (сессия и профиль есть), но пока
    // Администратор (владелец, см. isOwner()) не назначил ему настоящую роль
    // в «Команде», профиль остаётся с ролью по умолчанию "pending" (см.
    // supabase_schema.sql) — такой человек не должен видеть вообще ничего,
    // кроме экрана ожидания. isOwner() в условии — на случай, если сам
    // владелец почему-то окажется с ролью "pending" (например, ручная правка
    // в базе) — ему это ограничение применяться не должно (см. navAllowed()).
    if(!isOwner() && state.me.role==="pending"){
      morphInto(document.getElementById("app"), h`<div class="auth-wrap"><div class="card auth-card">
        <div class="auth-logo">Диспетчерская Keruen Inn</div>
        <div class="auth-sub">Служба сервиса</div>
        <div class="auth-maintenance"><b>Ожидает назначения роли</b><br>Администратор ещё не открыл вам доступ — обратитесь к нему, либо загляните чуть позже.</div>
        <button class="btn btn-block" style="margin-top:14px;" data-action="sign-out">Выйти</button>
      </div></div>`);
      return;
    }
    // «Заказчик» (0.2.8) без включённого доступа — авторизован (сессия и
    // профиль есть), но саму диспетчерскую видеть не должен. Показываем
    // нейтральный экран вместо приложения; выйти можно, войти обратно — как
    // только Администратор поставит галочку "Активен" в «Команде».
    if(state.me.role==="customer" && state.me.active===false){
      morphInto(document.getElementById("app"), h`<div class="auth-wrap"><div class="card auth-card">
        <div class="auth-logo">Диспетчерская Keruen Inn</div>
        <div class="auth-sub">Служба сервиса</div>
        <div class="auth-maintenance"><b>Ведутся работы на сайте</b><br>Доступ временно закрыт — загляните чуть позже.</div>
        <button class="btn btn-block" style="margin-top:14px;" data-action="sign-out">Выйти</button>
      </div></div>`);
      return;
    }

    // Прямые ссылки на заявку (0.2.3, п.7): переход по ссылке вида
    // "#/tickets/<id>" открывает карточку этой заявки сразу, без отдельного
    // клика по строке в списке. Сравниваем с уже открытой заявкой, чтобы не
    // мешать закрытию панели пользователем — обработчик data-close-panel ниже
    // сбрасывает state.route.id при закрытии именно для этого.
    // «Заказчик» с 0.2.9 видит «Заявки» наравне с остальными разрешёнными
    // разделами (см. ROLE_NAV), поэтому прямая ссылка "#/tickets/<id>"
    // открывает карточку заявки как и для всех остальных ролей — раньше тут
