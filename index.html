<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диспетчерская Keruen Inn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E4EAEE; --surface-3:#DAE2E7;
    --line:#D3DBE1; --ink:#16232E; --ink-soft:#54636F; --ink-faint:#8B99A4;
    --accent:#0E7C90; --accent-ink:#FFFFFF; --accent-soft:#DCEFF2; --accent-line:#B9DEE4;
    --ok:#1E8E5A; --ok-soft:#E1F3E8; --warn:#A8710F; --warn-soft:#FBEED9; --crit:#C2410C; --crit-soft:#FBE1D2;
    --shadow:0 1px 2px rgba(22,35,46,.07),0 6px 18px rgba(22,35,46,.08);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1620; --surface:#16212B; --surface-2:#1C2833; --surface-3:#23313D;
      --line:#2B3A46; --ink:#E7EDF1; --ink-soft:#A9B8C2; --ink-faint:#70828D;
      --accent:#3FB5C9; --accent-ink:#062229; --accent-soft:#163239; --accent-line:#255560;
      --ok:#4FC08C; --ok-soft:#123524; --warn:#DDAA55; --warn-soft:#3A2C14; --crit:#E17A4C; --crit-soft:#3C2216;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.38);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }
  button, select, input, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  a{ color:var(--accent); }
  #app{ display:flex; min-height:100vh; max-width:1440px; margin:0 auto; background:var(--surface); box-shadow:0 0 0 1px var(--line), 0 24px 60px rgba(22,35,46,.14); }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:216px; flex:0 0 216px; background:var(--surface-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 0; position:sticky; top:0; height:100vh;
  }
  .brand{ padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:.2px; }
  .brand-sub{ color:var(--ink-faint); font-size:11.5px; margin-top:3px; text-transform:uppercase; letter-spacing:.06em; }
  .nav{ display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
    color:var(--ink-soft); text-decoration:none; border-left:3px solid transparent; font-weight:500;
  }
  .nav-item:hover{ background:var(--surface-3); color:var(--ink); }
  .nav-item.active{ background:var(--surface); color:var(--ink); border-left-color:var(--accent); box-shadow:var(--shadow); }
  .nav-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto; }
  .nav-footer{ margin-top:auto; padding:14px 20px 0; border-top:1px solid var(--line); }
  .nav-footer p{ margin:10px 0 0; font-size:11.5px; color:var(--ink-faint); line-height:1.5; }

  /* ---------- main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
    padding:14px 28px; display:flex; align-items:center; gap:16px;
  }
  .topbar h1{ font-size:18px; margin:0; font-weight:700; flex:1; min-width:0; }
  .whoami{ display:flex; align-items:center; gap:6px; }
  .whoami-chip{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    padding:6px 10px 6px 6px; border-radius:20px; cursor:pointer;
  }
  .avatar{
    width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:0 0 auto;
  }
  .content{ padding:24px 28px 60px; max-width:1180px; width:100%; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ color:var(--crit); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- cards / kpi ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:18px 20px; }
  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; margin:0 0 12px; }
  .info-dot{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--surface-3); border:1px solid var(--line); color:var(--ink-faint); font-size:10px; font-weight:700; font-style:italic; font-family:Georgia,'Times New Roman',serif; text-transform:none; letter-spacing:normal; cursor:help; flex:none; margin-left:5px; user-select:none; vertical-align:middle; }
  .grid-kpi{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi{ padding:16px 18px; }
  .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .kpi-value{ font-size:30px; font-weight:600; margin-top:6px; }
  .kpi-value.crit{ color:var(--crit); } .kpi-value.ok{ color:var(--ok); } .kpi-value.accent{ color:var(--accent); }
  .kpi-sub{ font-size:12px; color:var(--ink-faint); margin-top:3px; }

  .row-gap{ display:flex; flex-direction:column; gap:18px; }
  .two-col{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; align-items:start; }
  @media (max-width:880px){ .two-col{ grid-template-columns:1fr; } }

  /* ---------- badges / pills ---------- */
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill-neutral{ background:var(--surface-3); color:var(--ink-soft); }
  .pill-accent{ background:var(--accent-soft); color:var(--accent); }
  .pill-ok{ background:var(--ok-soft); color:var(--ok); }
  .pill-warn{ background:var(--warn-soft); color:var(--warn); }
  .pill-crit{ background:var(--crit-soft); color:var(--crit); }
  .zone-badge{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; border:1px solid var(--line); font-size:11px; font-weight:600; color:var(--ink-soft); }
  .demo-tag{ background:var(--warn-soft); color:var(--warn); font-size:10px; padding:1px 6px; border-radius:5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .source-tag{ background:var(--accent-soft); color:var(--accent); font-size:10px; padding:1px 6px; border-radius:5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .clector-sync-badge{ display:inline-block; margin-top:5px; background:var(--warn-soft); color:var(--warn); font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px; white-space:nowrap; }
  .status-icons{ display:inline-flex; align-items:center; gap:4px; vertical-align:middle; }
  .status-icon{ width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-faint); opacity:.4; transition:opacity .15s ease, color .15s ease, filter .15s ease; cursor:default; }
  .status-icon svg{ width:14px; height:14px; display:block; }
  .status-icon.lit{ color:var(--ok); opacity:1; filter:drop-shadow(0 0 3px var(--ok)); }
  .attn-badge{ display:inline-flex; color:var(--crit); margin-right:5px; filter:drop-shadow(0 0 3px var(--crit)); vertical-align:middle; }
  .attn-badge svg{ width:15px; height:15px; display:block; }
  tr.attn-row{ background:var(--crit-soft); }
  tr.attn-row:hover{ filter:brightness(0.97); }
  .attn-toggle-btn{ color:var(--ink-faint); opacity:.55; }
  .attn-toggle-btn svg{ display:block; }
  .attn-toggle-btn:hover{ opacity:1; }
  .attn-toggle-btn.is-active{ color:var(--crit); opacity:1; filter:drop-shadow(0 0 3px var(--crit)); }
  .photo-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .photo-item{ display:flex; flex-direction:column; align-items:center; gap:3px; width:84px; }
  .photo-thumb{ position:relative; width:84px; height:84px; border-radius:8px; border:1px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--surface-3); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .photo-del{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:5px; font-size:11px; line-height:1; padding:3px 5px; cursor:pointer; }
  .photo-date{ font-size:10.5px; color:var(--ink-faint); line-height:1.2; }
  .map-table td, .map-table th{ vertical-align:middle; }
  .import-summary{ display:flex; gap:18px; flex-wrap:wrap; margin:14px 0; }
  .import-summary .stat{ font-size:13px; } .import-summary .stat b{ font-size:18px; display:block; font-family:"IBM Plex Mono",monospace; }
  .dropzone{ border:1px dashed var(--line); border-radius:9px; padding:16px; text-align:center; color:var(--ink-faint); font-size:12.5px; }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--surface-2); }
  td.num, th.num{ text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .ttl{ font-weight:600; }
  .muted{ color:var(--ink-faint); }
  .empty-state{ padding:40px 20px; text-align:center; color:var(--ink-faint); }
  .empty-state b{ color:var(--ink-soft); display:block; margin-bottom:4px; font-size:14px; }

  /* ---------- forms ---------- */
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=email], input[type=number], input[type=date], select, textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .chip-toggle{ display:inline-flex; gap:6px; flex-wrap:wrap; }
  .chip-toggle label{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:4px 10px 4px 6px; font-size:12px; font-weight:500; color:var(--ink-soft); cursor:pointer; margin:0; }
  .chip-toggle input{ width:auto; }

  /* ---------- filters ---------- */
  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .filters select, .filters input[type=text]{ width:auto; min-width:140px; }
  .status-filter-group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .status-filter-chip{ cursor:pointer; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--line); color:var(--ink-soft); background:var(--surface-2); user-select:none; }
  .status-filter-chip:hover{ border-color:var(--accent-line); }
  .status-filter-chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  /* ---------- panel (slide-over) ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(10,16,22,.35); z-index:20; }
  .panel{
    position:fixed; top:0; right:0; height:100vh; width:460px; max-width:94vw; background:var(--surface);
    box-shadow:-8px 0 30px rgba(0,0,0,.18); z-index:21; overflow-y:auto; border-left:1px solid var(--line);
  }
  .panel-head{ padding:18px 20px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:10px; position:sticky; top:0; background:var(--surface); z-index:2;}
  .panel-body{ padding:20px; display:flex; flex-direction:column; gap:18px; }
  .panel-close{ margin-left:auto; }
  .kv{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--ink-faint); }
  .kv .v{ font-weight:600; text-align:right; }
  .deadline-box{ padding:12px 14px; border-radius:9px; border:1px solid var(--line); }
  .deadline-box.overdue{ border-color:var(--crit); background:var(--crit-soft); }
  .deadline-box.soon{ border-color:var(--warn); background:var(--warn-soft); }
  .note{ padding:9px 10px; background:var(--surface-2); border-radius:8px; font-size:12.5px; margin-bottom:7px; }
  .note .meta{ color:var(--ink-faint); font-size:11px; margin-bottom:3px; }
  .actions-row{ display:flex; gap:8px; flex-wrap:wrap; }
  /* "Ход работ" — компактный аккордеон: по умолчанию видна только строка
     галочка+название+шеврон (1 строка на пункт), тело (формы/списки) — только
     у раскрытого пункта. Раньше все 4 пункта были всегда полностью раскрыты
     и раздел растягивался на весь экран. */
  .milestone-row{ border-top:1px solid var(--line); }
  .milestone-row:first-child{ border-top:none; }
  .milestone-hd{ display:flex; align-items:center; gap:8px; padding:7px 2px; cursor:pointer; user-select:none; }
  /* Значок-иконка пункта (бригада/материал/работа/акт) — та же картинка, что и
     в статус-иконках под номером заявки наверху (см. STATUS_ICON_DEFS), чтобы
     обе точки были явно "одно и то же состояние". Для пункта "Материал" значок
     ещё и кликабелен — мгновенно переключает t.materials_ready, не разворачивая
     строку (см. renderTicketPanel/milestoneRow); остальные 3 пункта отмечаются
     выполненными только реальным действием (назначить бригаду/приложить
     фото/подписать акт), поэтому там значок не кликабелен. */
  .milestone-icon{ flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink-faint); border:none; padding:0; }
  .milestone-icon svg{ width:14px; height:14px; display:block; }
  .milestone-icon.done{ background:var(--ok-soft); color:var(--ok); filter:drop-shadow(0 0 3px var(--ok)); }
  button.milestone-icon{ cursor:pointer; }
  .milestone-title{ flex:1; min-width:0; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .milestone-meta{ flex:none; font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
  /* Кнопка "прикрепить" прямо в строке чек-листа (видна без разворачивания) —
     круглая иконка со скрепкой, поверх которой лежит невидимый input[type=file];
     клик по ней открывает системный диалог выбора файлов (можно выбрать сразу
     несколько — счетов на бригаду/материал, или фото на работу). */
  .milestone-attach-btn{ flex:none; position:relative; overflow:hidden; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-faint); cursor:pointer; }
  .milestone-attach-btn svg{ width:13px; height:13px; display:block; }
  .milestone-attach-btn:hover{ color:var(--accent); border-color:var(--accent-line); }
  .milestone-attach-btn input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .milestone-chevron{ flex:none; color:var(--ink-faint); font-size:10px; }
  .milestone-body{ padding:0 4px 10px 32px; }
  .line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---------- modal ---------- */
  .modal-scrim{ position:fixed; inset:0; background:rgba(10,16,22,.4); z-index:30; display:flex; align-items:flex-start; justify-content:center; padding:6vh 20px; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:12px; width:640px; max-width:100%; box-shadow:var(--shadow); }
  .modal-head{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .modal-head h2{ font-size:16px; margin:0; flex:1; }
  .modal-body{ padding:18px 20px; max-height:70vh; overflow-y:auto; }
  .modal-foot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }

  /* ---------- workorder (print) ---------- */
  .wo-page{ max-width:760px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:40px 44px; box-shadow:var(--shadow); }
  .wo-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .wo-co{ font-weight:700; font-size:14px; }
  .wo-addr{ color:var(--ink-faint); font-size:12px; margin-top:2px; }
  .wo-title{ font-size:22px; font-weight:700; margin:18px 0 2px; }
  .wo-no{ color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:13px; }
  .wo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 26px; margin:22px 0; }
  .wo-field .k{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  .wo-field .v{ font-size:14.5px; margin-top:3px; }
  .wo-desc{ background:var(--surface-2); border-radius:9px; padding:14px 16px; margin:8px 0 20px; font-size:13.5px; }
  .wo-sign{ display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-top:44px; }
  .sign-line{ border-top:1px solid var(--ink-faint); padding-top:6px; font-size:11.5px; color:var(--ink-faint); }
  .wo-toolbar{ max-width:760px; margin:0 auto 16px; display:flex; gap:8px; justify-content:flex-end; }
  @media print{
    .sidebar, .topbar, .wo-toolbar, .no-print{ display:none !important; }
    body, .content{ background:#fff; padding:0; margin:0; }
    .wo-page{ box-shadow:none; border:none; max-width:none; }
  }

  .banner{ display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:9px; background:var(--warn-soft); color:var(--warn); font-size:13px; margin-bottom:18px; font-weight:500; }
  .banner .btn{ margin-left:auto; }
  .helptext{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .zone-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); }
  .zone-legend span b{ color:var(--ink); }
  #map-canvas{ height:540px; width:100%; border-radius:var(--radius); border:1px solid var(--line); }
  ::selection{ background:var(--accent-soft); }

  /* ---------- auth screen ---------- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:380px; max-width:100%; padding:34px 30px; }
  .auth-logo{ font-weight:700; font-size:19px; margin-bottom:2px; }
  .auth-sub{ color:var(--ink-faint); font-size:12.5px; margin-bottom:26px; }
  .auth-err{ background:var(--crit-soft); color:var(--crit); border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; }
  .auth-ok{ background:var(--ok-soft); color:var(--ok); border-radius:8px; padding:12px 14px; font-size:13px; }
  .configwarn{ max-width:560px; margin:60px auto; padding:24px 26px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>

<script>
(function(){
  "use strict";

  /* ============================== SUPABASE CONFIG ==============================
     Заполните значениями вашего проекта: Project Settings -> API

      return { extRef:extRef, hotelName:hotelName, hotel:hotel, description:desc, groupRaw:groupRaw, dateRaw:dateRaw, statusRaw:statusRaw, deadlineRaw:deadlineRaw, deadlineIso:deadlineIso, location:locationRaw, existingTicket:existingTicket, willUpdateStatus:willUpdateStatus, status:status };
    });
    var counts = {total:out.length, "new":0, dupe:0, "no-hotel":0, empty:0, statusUpdate:0};
    out.forEach(function(r){ counts[r.status]++; if(r.willUpdateStatus) counts.statusUpdate++; });
    return {rows:out, counts:counts};
  }
  // Пишем «снимок» счётчиков после каждого импорта — раз загрузка из c-lector
  // делается вручную (не каждый день), только так можно потом посчитать
  // «закрыто с прошлой загрузки» (см. дашборд) вместо привязки к календарным 7 дням.
  function recordImportSnapshot(){
    sb.from("tickets").select("status,external_status").then(function(res){
      var rows = res.data || [];
      var closed = rows.filter(function(t){ return isClosedExternalStatus(t.external_status) || (!t.external_status && t.status==="closed"); }).length;
      sb.from("import_snapshots").insert({ total: rows.length, closed: closed, imported_at: new Date().toISOString() }).then(function(){ reloadSnapshots(); });
    });
  }
  function commitImport(){
    var preview = computeImportPreview();
    var toInsert = preview.rows.filter(function(r){ return r.status==="new"; });
    var toUpdate = preview.rows.filter(function(r){ return r.willUpdateStatus; });
    if(!toInsert.length && !toUpdate.length){ state.importResult = {inserted:0, updated:0, failed:0, counts:preview.counts}; render(); return; }
    state.importBusy = true; state.importFileError = ""; render();
    var now = new Date().toISOString();

    var payloads = toInsert.map(function(r){
      var g = Number(r.groupRaw); if([1,2,3].indexOf(g)===-1) g = 2;
      var createdDate = parseCLectorDate(r.dateRaw);
      var createdAt = createdDate ? createdDate.toISOString() : now;
      return {
        hotel_id: r.hotel.id, zone: r.hotel.zone, ticket_group: g,
        description: r.description,
        status:"new", created_by: myLabel()+" (импорт c-lector)", created_at: createdAt,
        arrival_deadline: r.hotel.zone ? addHours(createdAt, ZONE_HOURS[r.hotel.zone]) : null,
        resolution_deadline: r.deadlineIso,
        location: r.location || null,
        external_ref: r.extRef || null, external_status: r.statusRaw || null, source:"c-lector", demo:false
      };
    });
    // берём ПОЛНУЮ существующую строку и меняем в ней external_status и/или
    // resolution_deadline ("срок устранения" — только из c-lector, платформа
    // его сама не считает) — частичный upsert (только id + пара полей) упал бы
    // на NOT NULL полях (hotel_id, description и т.п.), так как Postgres
    // проверяет их при построении INSERT-строки ещё до ON CONFLICT DO UPDATE.
    // location тоже подтягиваем повторно, если в файле она есть, — так задним
    // числом заполнится и у заявок, импортированных до появления этого поля.
    var updatePayloads = toUpdate.map(function(r){
      var patch = { external_status: r.statusRaw };
      if(r.deadlineRaw) patch.resolution_deadline = r.deadlineIso;
      if(r.location) patch.location = r.location;
      return Object.assign({}, r.existingTicket, patch);
    });

    // вставляем/обновляем пачками, а не одним залпом из сотен параллельных
    // запросов — иначе один упавший запрос топит весь Promise.all без единой
    // ошибки на экране. Идём по очереди небольшими партиями и всегда доходим
    // до финального экрана, даже если часть партий не прошла.
    var CHUNK = 100;
    var insertChunks = []; for(var i=0;i<payloads.length;i+=CHUNK){ insertChunks.push(payloads.slice(i,i+CHUNK)); }
    var updateChunks = []; for(var j=0;j<updatePayloads.length;j+=CHUNK){ updateChunks.push(updatePayloads.slice(j,j+CHUNK)); }
    var insertedCount = 0, updatedCount = 0, failedCount = 0, lastError = "";

    function finish(){
      state.importBusy = false;
      state.importResult = { inserted: insertedCount, updated: updatedCount, failed: failedCount, lastError: lastError, counts: preview.counts };
      state.importHeaders = []; state.importRows = []; state.importMapping = {};
      recordImportSnapshot();
      render();
    }
    function nextInsert(idx){
      if(idx>=insertChunks.length){ nextUpdate(0); return; }
      sb.from("tickets").insert(insertChunks[idx]).then(function(res){
        if(res && res.error){ failedCount += insertChunks[idx].length; lastError = res.error.message || String(res.error); }
        else { insertedCount += insertChunks[idx].length; }
        nextInsert(idx+1);
      }).catch(function(err){
        failedCount += insertChunks[idx].length; lastError = err && err.message ? err.message : String(err);
        nextInsert(idx+1);
      });
    }
    function nextUpdate(idx){
      if(idx>=updateChunks.length){ finish(); return; }
      sb.from("tickets").upsert(updateChunks[idx]).then(function(res){
        if(res && res.error){ failedCount += updateChunks[idx].length; lastError = res.error.message || String(res.error); }
        else { updatedCount += updateChunks[idx].length; }
        nextUpdate(idx+1);
      }).catch(function(err){
        failedCount += updateChunks[idx].length; lastError = err && err.message ? err.message : String(err);
        nextUpdate(idx+1);
      });
    }
    nextInsert(0);
  }

  function weekRangeLabel(iso){
    if(!iso) return "";
    var d = new Date(iso);
    var day = d.getDay();
    var diffToMonday = (day===0?-6:1-day);
    var monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
    var sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    function f(x){ return String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0"); }
    return f(monday)+"–"+f(sunday)+"."+sunday.getFullYear();

  /* ============================== DEADLINES ============================== */
  function deadlineInfo(t){
    // label — с пояснением ("Прибытие к…"/"Устранение к…"), используется там,
    // где колонка/поле само по себе не называется "Срок" (карточка заявки,
    // экспорт). dateLabel — голая дата без пояснения, для колонки "Срок" в
    // списках (там пояснение излишне, только дата).
    var now = Date.now();
    if(t.status==="closed" || t.status==="rejected") return {label:"—", dateLabel:"—", overdue:false, done:true};
    if(t.status==="new" || t.status==="dispatched"){
      var ms = new Date(t.arrival_deadline).getTime()-now;
      return {label:"Прибытие к "+fmtDateShort(t.arrival_deadline), dateLabel:fmtDateShort(t.arrival_deadline), overdue: ms<0, soon: ms>0 && ms<4*3600*1000, ms:ms, kind:"arrival"};
    }
    if(t.status==="onsite"){
      // Срок устранения теперь берётся ТОЛЬКО из данных c-lector (колонка при
      // импорте) — платформа сама его больше не считает и не сдвигает. Если
      // в c-lector этот срок не указан/не сопоставлен при импорте, честно
      // показываем, что данных нет, а не подставляем свою дату.
      if(!t.resolution_deadline) return {label:"Срок не указан (нет данных c-lector)", dateLabel:"Срок не указан", overdue:false, kind:"resolution"};
      var ms2 = new Date(t.resolution_deadline).getTime()-now;
      return {label:"Устранение к "+fmtDate(t.resolution_deadline), dateLabel:fmtDateShort(t.resolution_deadline), overdue: ms2<0, soon: ms2>0 && ms2<24*3600*1000, ms:ms2, kind:"resolution"};
    }
    return {label:"—", dateLabel:"—", overdue:false};
  }
  // ВАЖНО: раньше здесь проверялся только внутренний t.status ("closed"/"rejected"),
  // без учёта реального статуса из c-lector (t.external_status, например
  // "Выполнена") — из-за этого выполненные/отклонённые по c-lector заявки, у
  // которых внутренний статус наряда-задания не был вручную переведён в
  // closed/rejected, продолжали считаться "активными" и попадали в дашборд
  // ("Требуют внимания", KPI, зоны) и на карту. Делегируем в isTicketDone(t) —
  // ту же логику, что уже используется в списке «Заявки» для скрытия закрытых.
  function isActive(t){ return !isTicketDone(t); }
  // Заявки грузятся из c-lector вручную (не каждый день), поэтому "закрыто за 7
  // дней" не может опираться на календарные сутки внутри платформы — вместо
  // этого берём снимок счётчиков из ЗАГРУЗКИ, ближайшей к 7 дням назад, и
  // сравниваем с последней загрузкой (см. recordImportSnapshot).
  function closedSinceLastWeek(){
    var snaps = state.snapshots || [];
    if(snaps.length<2) return null;
    var latest = snaps[snaps.length-1];
    var targetTime = Date.now() - 7*24*3600*1000;
    var best = null, bestDiff = Infinity;
    for(var i=0;i<snaps.length-1;i++){
      var diff = Math.abs(new Date(snaps[i].imported_at).getTime() - targetTime);
      if(diff<bestDiff){ bestDiff = diff; best = snaps[i]; }
    }
    if(!best) return null;
    return { delta: latest.closed-best.closed, fromDate: best.imported_at, toDate: latest.imported_at };
  }

  /* ============================== MUTATIONS ============================== */
  // Заявки регистрируются только через импорт из c-lector (см. раздел "Импорт") —
  // ручного создания заявки в платформе больше нет, так как источник один.
  function myLabel(){ return (state.me && (state.me.name||state.me.email)) || "—"; }
  function addNote(ticketId, text){
    // не полагаемся только на realtime-канал notes-* (может запаздывать или не
    // сработать, если для ticket_notes republication/RLS настроены не так, как
    // для остальных таблиц) — как только запись реально сохранена, сразу же
    // перезапрашиваем журнал открытой заявки, чтобы запись гарантированно
    // появилась в интерфейсе немедленно.
    return sb.from("ticket_notes").insert({ticket_id:ticketId, author:myLabel(), note_text:text}).then(function(res){
      if(res && res.error){ console.error("addNote failed:", res.error); }
      else if(state.selectedTicketId===ticketId){ loadNotesFor(ticketId); }
      return res;
    });
  }
  // Применяем патч к state.tickets НЕМЕДЛЕННО, синхронно, ещё до того, как
  // запрос на сохранение вообще ушёл в Supabase — а не только после того, как
  // он подтвердится (тот вариант чинил гонку лишь наполовину: в реальном
  // приложении подтверждение приходит по сети не мгновенно, и быстрое
  // закрытие/открытие карточки заявки успевает отрендерить её из ещё не
  // обновлённого state.tickets ДО завершения запроса). Не полагаемся и на
  // realtime-канал "tickets-rt" (см. reloadTickets выше) — та же история, что
  // и у уже исправленного бага с журналом (addNote/loadNotesFor выше), только
  // без сетевой задержки её было не воспроизвести локально в тестах.
  // Если сохранение всё же не удастся (сеть/права), значение останется
  // визуально применённым до следующего эха realtime — сознательный компромисс:
  // остальной код приложения тоже нигде не показывает "не сохранилось" для
  // этих полей и не делает откат, кроме отдельных полей с fieldFeedback.
  function patchTicketLocal(id, patch){
    var t = state.tickets.find(function(x){return x.id===id;});
    if(t) Object.assign(t, patch);
  }
  function assignSpecialist(id, name){
    var patch = {assigned_to:name, status:"dispatched"};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Назначен главный инженер: "+name+".");
      maybeAutoComplete(id);
    });
  }
  // Смена исполнителя уже назначенной заявки (в отличие от assignSpecialist выше,
  // не трогает status/дедлайны — те уже отсчитываются от прибытия/устранения).
  function reassignSpecialist(id, name){
    var patch = {assigned_to:name};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Исполнитель изменён на: "+name+".");
      maybeAutoComplete(id);
    });
  }
  function markArrived(id){
    // Срок устранения (resolution_deadline) сюда больше не пишем — он приходит
    // только из c-lector при импорте, платформа его сама не считает.
    var patch = {status:"onsite", arrived_at:new Date().toISOString()};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Главный инженер прибыл на объект.");
    });
  }
  // ВАЖНО: в отличие от соседних сеттеров выше/ниже, эта функция не пишет
  // запись в журнал (addNote) — категория "Гарантийный/Негарантийный/
  // Необоснованная" сама по себе не событие для журнала. Из-за этого раньше
  // (единственная среди всех сеттеров заявки) она не вызывала вообще никакого
  // перерисовывания карточки после сохранения — только addNote()-у соседей
  // "случайно" перепадал render() через fetchNotes()->renderTicketPanel().
  // Именно поэтому при быстром закрытии/открытии заявки выбранная категория
  // "откатывалась" на старое значение: state.tickets ещё не подтянул новое
  // значение, а перерисовать карточку было некому. Немедленный patchTicketLocal
  // + renderTicketPanel() ниже чинят это, не дожидаясь ни ответа от Supabase,
  // ни эха realtime-подписки.
  function setCaseType(id, val){
    var patch = {case_type: val||null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id);
  }
  function setMaterialsEta(id, dateStr){
    // Дата ожидаемой поставки материалов — чисто информационная пометка, срок
    // устранения (из c-lector) она больше не подменяет и не сдвигает.
    var patch = {materials_wait:true, materials_eta:dateStr};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Ожидание материалов — ожидаемая поставка: "+fmtDateShort(dateStr)+".");
    });
  }
  function setMaterialsReady(id, val){
    var patch = {materials_ready:val};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Материалы закуплены/получены." : "Отметка «материалы закуплены» снята.");
      if(val) maybeAutoComplete(id);

  // Ручные флажки "Бригада"/"Работа" — для случаев, когда что-то по факту уже
  // сделано (например, замечание устранили на месте), а формального
  // подтверждения в системе нет и заводить его прямо сейчас смысла нет
  // (никто не назначал бригаду через приложение, фото никто не сделал).
  // В отличие от реальных признаков (t.assigned_to / наличие фото), этот
  // флажок не появляется на кнопке "Назначить"/в разделе "Действия" — это
  // отдельная, чисто визуальная отметка "выполнено", доступная только через
  // клик по значку пункта в "Ход работ" (см. milestoneRow в renderTicketPanel),
  // и только пока нет настоящего признака (тогда значок вместо этого просто
  // показывает реальное состояние и не кликабелен).
  function setCrewManualDone(id, val){
    var patch = {crew_manual_done:val};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Бригада отмечена выполненной вручную (без назначения в приложении)." : "Ручная отметка «бригада» снята.");
      if(val) maybeAutoComplete(id);
    });
  }
  function setWorkManualDone(id, val){
    var patch = {work_manual_done:val};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Работа отмечена выполненной вручную (без фото)." : "Ручная отметка «работа» снята.");
      if(val) maybeAutoComplete(id);
    });
  }
  // Акт — четвёртый пункт чек-листа хода работ. В отличие от трёх остальных,
  // хранится отдельным полем (act_signed), а не выводится из статуса заявки —
  // иначе автопереход "все 4 пункта -> статус Выполнено" ниже был бы замкнут сам
  // на себя (акт делался бы условием статуса closed, а сам получался бы из него).
  function uploadActFile(ticketId, file){
    var path = ticketId + "/act_" + Date.now() + "_" + file.name.replace(/[^\w.\-]+/g,"_");
    var patch = {act_signed:true, act_file_path:path, act_file_name:file.name};
    return readFileAsBuffer(file).then(function(buf){
      return sb.storage.from("invoices").upload(path, buf, {contentType: file.type || "application/octet-stream"});
    }).then(function(res){
      if(res.error) throw res.error;
      patchTicketLocal(ticketId, patch);
      renderTicketPanel();
      return sb.from("tickets").update(patch).eq("id", ticketId);
    }).then(function(){
      addNote(ticketId, "Акт подписан, файл прикреплён: "+file.name+".");
      maybeAutoComplete(ticketId);
    }).catch(function(err){
      alert("Не удалось загрузить акт: " + (err&&err.message?err.message:err));
    });
  }
  function clearActSigned(id){
    var t = state.tickets.find(function(x){return x.id===id;});
    var msg = (t && t.act_file_path)
      ? "Снять отметку «акт подписан»? Прикреплённый файл акта останется доступным по ссылке, но перестанет учитываться как подтверждение."
      : "Снять ручную отметку «акт подписан»?";
    if(!confirm(msg)) return;
    var patch = {act_signed:false};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Отметка «акт подписан» снята.");
    });
  }
  // Быстрая ручная отметка "акт подписан" прямо по клику на значок пункта
  // (см. setCrewManualDone/setWorkManualDone выше) — доступна только пока файл
  // акта не прикреплён; как только файл есть, снимать отметку нужно через
  // кнопку "Снять отметку" внутри пункта (clearActSigned, с подтверждением).
  function setActSigned(id, val){
    var patch = {act_signed:val};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Акт отмечен подписанным вручную (без файла)." : "Ручная отметка «акт» снята.");
      if(val) maybeAutoComplete(id);
    });
  }
  // Фото-доказательство к Акту (category:"act", см. actPhotoGrid/uploadPhoto
  // выше) само по себе подтверждает, что акт есть — по просьбе Антона это
  // должно сразу переводить пункт "Акт" в "акт имеется", без отдельного клика
  // по значку. Если акт уже подписан (файлом или вручную) — трогать нечего.
  function markActConfirmedByPhoto(id){
    var t = state.tickets.find(function(x){return x.id===id;});
    if(t && t.act_signed) return;
    var patch = {act_signed:true};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Акт отмечен подписанным автоматически — прикреплено фото-доказательство.");
      maybeAutoComplete(id);
    });
  }
  function openActFile(path){
    sb.storage.from("invoices").createSignedUrl(path, 3600).then(function(res){
      if(res.data && res.data.signedUrl) window.open(res.data.signedUrl, "_blank");
      else alert("Не удалось открыть файл акта.");
    });
  }
  // Автопереход "в работе -> выполнено": как только у заявки одновременно
  // назначен исполнитель, закуплены материалы, вписаны часы устранения и
  // подписан акт — статус сам становится "Закрыта", без дополнительных условий
  // (по решению Антона — категория "Гарантийный/Негарантийный/Необоснованный"
  // для этого НЕ обязательна, хотя обычно нужна для оплаты по Регламенту, поэтому
  // если она не заполнена — обращаем на это внимание отдельной записью в журнале).
  // Тянем свежую строку заявки напрямую из базы (а не из state.tickets), чтобы не
  // зависеть от того, успел ли уже прийти realtime-апдейт к этому моменту.
  function maybeAutoComplete(id){
    sb.from("tickets").select("*").eq("id", id).maybeSingle().then(function(res){
      var t = res.data; if(!t) return;
      if(t.status==="closed" || t.status==="rejected") return;
      // Каждый из 4 пунктов может быть выполнен либо реальным действием
      // (назначена бригада / прикреплён файл акта), либо вручную отмечен как
      // выполненный (см. crew_manual_done/work_manual_done и act_signed без
      // файла — setCrewManualDone/setWorkManualDone/setActSigned) для случаев,
      // когда что-то по факту сделано, а подтверждения в системе нет.
      // "Материал" и "Работа" — всегда просто ручной флажок (см. STATUS_ICON_DEFS
      // выше: фото в "Работа" больше не участвуют — "Фото" теперь отдельная
      // галерея замечаний, а не признак сделанной работы).
      var allDone = (!!t.assigned_to || !!t.crew_manual_done) && !!t.materials_ready && !!t.work_manual_done && !!t.act_signed;
      if(!allDone) return;
      var patch = {status:"closed", closed_at:new Date().toISOString()};
      patchTicketLocal(id, patch);
      render();
      sb.from("tickets").update(patch).eq("id",id).then(function(){
        addNote(id, "Все 4 пункта выполнены (бригада, материал, работа, акт) — статус автоматически изменён на «Закрыта»."+(!t.case_type?" Категория по осмотру не указана — заполните её для расчёта оплаты по Регламенту.":""));
      });
    });
  }
  // Ручная пометка "особое внимание" — например, когда заявкой заинтересовался
  // руководитель или заказчик, независимо от статуса/сроков по c-lector.
  function setAttentionFlag(id, val, note){
    var patch = {attention_flag:val, attention_note: val ? (note||null) : null};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? ("Поставлена пометка «особое внимание»."+(note?" "+note:"")) : "Пометка «особое внимание» снята.");
    });
  }
  // Пометка "дубль" — заявка по факту та же поломка, что уже заведена под
  // другим номером c-lector (частая ситуация при повторной выгрузке/повторном
  // обращении жильца). Ищем целевую заявку по её номеру c-lector (external_ref)
  // среди уже загруженных — самый надёжный признак, который знает диспетчер,
  // не открывая саму заявку. Заявку саму на себя дублем не делаем.
  function findTicketByRef(ref){
    var needle = String(ref||"").trim();
    if(!needle) return null;
    return (state.tickets||[]).find(function(x){ return x.external_ref && String(x.external_ref).trim()===needle; }) || null;
  }
  function setDuplicateOf(id){
    var t = state.tickets.find(function(x){return x.id===id;});
    var ref = prompt("Номер заявки c-lector, которую дублирует эта заявка (например, "+"123"+"):", "");
    if(ref==null) return;
    ref = ref.trim();
    if(!ref) return;
    var target = findTicketByRef(ref);
    if(!target){ alert("Заявка с номером c-lector «"+ref+"» не найдена среди загруженных."); return; }
    if(target.id===id){ alert("Заявка не может дублировать сама себя."); return; }
    var patch = {duplicate_of_ticket_id: target.id};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Отмечена как дубль заявки № "+(target.external_ref||target.id)+".");
    });
  }
  function clearDuplicateOf(id){
    if(!confirm("Снять пометку «дубль»?")) return;
    var patch = {duplicate_of_ticket_id:null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Пометка «дубль» снята.");
    });
  }
  // Ручного закрытия/отклонения/переоткрытия заявки в приложении больше нет
  // (по решению Антона) — заявка закрывается либо автоматически, когда
  // выполнены все 4 пункта "Ход работ" (см. maybeAutoComplete выше), либо
  // когда следующая выгрузка из c-lector.ru покажет её закрытой/отклонённой
  // (t.external_status — см. isTicketDone/isActive).
  function clearDemo(){
    sb.from("tickets").delete().eq("demo", true).then(function(){});
  }
  function updateProfile(id, fields){ sb.from("profiles").update(fields).eq("id", id).then(function(){}); }
  // Удаление сотрудника из «Команды» — доступно только владельцу (см. isOwner()).
  // Заявки, уже назначенные на этого человека (assigned_to — текст-имя, не
  // внешний ключ), не трогаем: они просто останутся с прежним именем исполнителя.
  function deleteProfile(id, label){
    if(!confirm("Удалить сотрудника «"+label+"» из списка команды и сбросить его роль/зоны? Уже назначенные на него заявки не изменятся (имя останется в поле «Исполнитель»).\n\nВажно: сам вход по почте это не отключает (это может сделать только Supabase Auth, у приложения нет туда доступа) — если человек всё ещё нужен, войдя снова, он будет работать как «Главный инженер» без ролей/зон, но обратно в этот список автоматически не попадёт.")) return;
    sb.from("profiles").delete().eq("id", id).then(function(){});
  }
  function saveMyName(name){ updateProfile(state.me.id, {name:name}); }
  function addPart(data){
    sb.from("parts").insert({name:data.name, qty:Number(data.qty)||0, unit:data.unit||"шт", note:data.note||""}).then(function(){});
  }
  function updatePartQty(id, qty){ sb.from("parts").update({qty:Number(qty)||0, updated_at:new Date().toISOString()}).eq("id",id).then(function(){}); }
  function removePart(id){ sb.from("parts").delete().eq("id",id).then(function(){}); }
  function savePortfolio(byHotel, snapshotDate){ sb.from("portfolio_snapshot").upsert({id:1, by_hotel:byHotel, snapshot_date:snapshotDate}).then(function(){}); }

  // Единый обработчик для полей, которые сохраняются "на лету" (Табель, Суть,
  // поля счёта в реестре) — раньше такие сохранения были "выстрелил и забыл"
  // без единой обработки ошибок, из-за чего несохранённые правки (например, из-за
  // отсутствующей колонки в БД) были не видны пользователю. Показывает короткую
  // подпись "Сохранено…" / текст ошибки рядом с полем.
  // Подпись храним в состоянии (fieldFeedback), а не пишем в DOM напрямую: таблицы
  // tickets/invoices подписаны на realtime, и событие от собственного же сохранения
  // почти сразу вызывает полный render() — прямая запись в textContent мгновенно
  // стиралась бы этим перерисовыванием, и пользователь не успевал увидеть "Сохранено".
  var fieldFeedback = {};
  function feedbackHtml(id){
    var f = fieldFeedback[id];
    if(!f) return h`<span id="${id}" class="helptext mono"></span>`;
    return h`<span id="${id}" class="helptext mono" style="color:${f.ok?'var(--ok)':'var(--crit)'};">${escapeHtml(f.text)}</span>`;
  }
  function saveWithFeedback(promise, feedbackElId){
    // возвращает true/false (сохранилось или нет) — используется вызывающим
    // кодом, чтобы не писать в журнал запись об "изменении", если сохранение
    // на самом деле не удалось.
    return promise.then(function(res){
      if(res && res.error){
        if(feedbackElId){ fieldFeedback[feedbackElId] = {text:"Ошибка: "+res.error.message, ok:false}; render(); }
        else alert("Не удалось сохранить: "+res.error.message);
        return false;
      }
      if(feedbackElId){
        fieldFeedback[feedbackElId] = {text:"Сохранено", ok:true};
        render();
        setTimeout(function(){
          if(fieldFeedback[feedbackElId] && fieldFeedback[feedbackElId].text==="Сохранено"){ delete fieldFeedback[feedbackElId]; render(); }
        }, 2000);
      }
      return true;
    }).catch(function(err){
      var msg = err && err.message ? err.message : String(err);
      if(feedbackElId){ fieldFeedback[feedbackElId] = {text:"Ошибка: "+msg, ok:false}; render(); }
      else alert("Не удалось сохранить: "+msg);
      return false;
    });
  }
  function saveTicketField(id, patch, feedbackElId){
    patchTicketLocal(id, patch);
    return saveWithFeedback(sb.from("tickets").update(patch).eq("id", id), feedbackElId);
  }
  function saveInvoiceField(id, patch, feedbackElId){ return saveWithFeedback(sb.from("invoices").update(patch).eq("id", id), feedbackElId); }

  /* ---- Журнал: редактирование и удаление записей ---- */
  function updateNote(id, text){
    return sb.from("ticket_notes").update({note_text:text, edited_at:new Date().toISOString()}).eq("id", id);
  }
  function deleteNote(id){
    return sb.from("ticket_notes").delete().eq("id", id);
  }

  /* ---- Бригады: создание/переименование/участники/удаление ---- */
  function createCrew(name){
    if(!name || !name.trim()) return;
    sb.from("crews").insert({name:name.trim(), members:[]}).then(function(){});
  }
  function renameCrew(id, name){
    if(!name || !name.trim()) return;
    sb.from("crews").update({name:name.trim()}).eq("id", id).then(function(){});
  }
  function deleteCrew(id){
    sb.from("crews").delete().eq("id", id).then(function(){});
  }
  function addCrewMember(crew, name){
    if(!name || !name.trim()) return;
    var members = (crew.members||[]).slice();
    if(members.indexOf(name.trim())===-1) members.push(name.trim());
    sb.from("crews").update({members:members}).eq("id", crew.id).then(function(){});
  }
  function removeCrewMember(crew, name){
    var members = (crew.members||[]).filter(function(m){ return m!==name; });
    sb.from("crews").update({members:members}).eq("id", crew.id).then(function(){});
  }

  /* ============================== RENDER HELPERS ============================== */
  function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function h(strings){ var args=[].slice.call(arguments,1); return strings.reduce(function(acc,s,i){ return acc+s+(i<args.length?args[i]:""); },""); }
  function navItem(view, label){ var active = state.route.view===view ? "active":""; return h`<a class="nav-item ${active}" href="#/${view}"><span class="nav-dot"></span>${label}</a>`; }
  function statusPill(status){ return h`<span class="pill ${STATUS_PILL[status]}">${STATUS_LABEL[status]}</span>`; }
  // Статус, который прислал c-lector.ru — показываем его текстом как есть (там свои
  // формулировки), просто подбираем цвет пилюли по ключевым словам.
  function externalStatusPill(text){
    if(!text) return h`<span class="pill pill-neutral">—</span>`;
    var cls = "pill-neutral";
    if(/выполн|заверш|устранен[оы]|закрыт/i.test(text)) cls = "pill-ok";
    else if(/отклон|отказ/i.test(text)) cls = "pill-crit";
    else if(/работ|обраб|принят|провер|назначен/i.test(text)) cls = "pill-accent";
    else if(/подан|нов|ожида/i.test(text)) cls = "pill-warn";
    return h`<span class="pill ${cls}">${escapeHtml(text)}</span>`;
  }
  function isClosedExternalStatus(text){ return !!text && /выполн|заверш|устранен[оы]|закрыт/i.test(text); }
  // Внутренний статус наряда-задания — второстепенная метка рядом со статусом c-lector,
  // когда у заявки уже есть внешний статус (иначе внутренний и есть единственный статус).
  function internalStageTag(status){ return h`<span class="pill pill-neutral" style="opacity:.65;font-weight:500;" title="Статус внутреннего наряда-задания">наряд: ${STATUS_LABEL[status]}</span>`; }
  function groupPill(g){ var cls = g===1?"pill-crit":(g===2?"pill-warn":"pill-neutral"); return h`<span class="pill ${cls}">${GROUP_LABEL[g]}</span>`; }
  function zoneBadge(zone){ return zone ? h`<span class="zone-badge">Зона ${zone}</span>` : h`<span class="zone-badge">стройка</span>`; }
  function roleLabel(r){ return ROLE_LABEL[r] || r; }
  // Видимый статус заявки для списка/фильтра: если есть статус из c-lector — берём
  // его текстом как есть (это и есть то, что реально показывается пользователю),
  // иначе — внутренний статус наряда-задания.
  function ticketStatusLabel(t){ return t.external_status || STATUS_LABEL[t.status] || "—"; }
  // Заявка считается закрытой/отклонённой для целей списка «Заявки» (скрыть по
  // умолчанию), если так говорит статус c-lector (там свои формулировки —
  // "Выполнена", "Отклонена" и т.п.), а если внешнего статуса нет — по
  // внутреннему статусу наряда-задания.
  function isTicketDone(t){
    if(t.external_status) return /выполн|заверш|устранен[оы]|закрыт|отклон|отказ/i.test(t.external_status);
    return t.status==="closed" || t.status==="rejected";
  }
  // Компактная отметка "назначена бригаде/инженеру" — раньше для этого была отдельная
  // колонка "Главный инженер" в списке заявок, теперь вместо неё значок рядом со
  // статусом (статуса "Диспетчеризована" как отдельного состояния на практике не бывает,
  // а вот видеть с одного взгляда, назначен ли исполнитель, — нужно).
  // Мини-иконки хода работ в списке заявок (заменяют собой прежний текстовый
  // значок "✓ назначена"). Каждая иконка приглушена по умолчанию и "загорается"
  // (акцентный цвет + лёгкое свечение) когда соответствующее условие выполнено.
  // Иконка "материал закуплен" опирается на новое поле t.materials_ready —
  // остальные три используют уже существующие поля заявки.
  var STATUS_ICON_DEFS = [
    { svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L2 19l3 3 7.1-7.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2-2 2.5-2.5z"/></svg>',
      lit:function(t){ return !!t.assigned_to || !!t.crew_manual_done; },
      label:function(t){ return t.assigned_to ? "Бригада назначена: "+t.assigned_to : (t.crew_manual_done ? "Бригада отмечена вручную" : "Бригада ещё не назначена"); } },
    { svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
      lit:function(t){ return !!t.materials_ready; },
      label:function(t){ return t.materials_ready ? "Материал закуплен" : "Материал ещё не закуплен"; } },
    { svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      // "работа выполнена" — раньше срабатывала по наличию ЛЮБОГО фото в общей
      // галерее "Фото", но с разделением "Фото" (замечания) и фото-доказательств
      // к Акту (см. actPhotoGrid/uploadPhoto ниже) это перестало иметь смысл:
      // замечания обычно фотографируют ДО начала работ, это не признак того, что
      // работа сделана. По решению Антона пункт "Работа" теперь всегда только
      // ручной флажок (work_manual_done) — как "Материал".
      lit:function(t){ return !!t.work_manual_done; },
      label:function(t){ return t.work_manual_done ? "Работа отмечена выполненной" : "Работа ещё не выполнена"; } },
    { svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="9 2 9 8 15 8"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>',
      lit:function(t){ return !!t.act_signed; },
      label:function(t){
        if(!t.act_signed) return "Акт ещё не подписан";
        if(t.act_file_path) return "Акт подписан";
        var hasActPhoto = (state.photos||[]).some(function(p){ return p.ticket_id===t.id && p.category==="act"; });
        return hasActPhoto ? "Акт подтверждён по фото-доказательству" : "Акт отмечен вручную (без файла)";
      } }
  ];
  // Ряд из 4 иконок хода работ (бригада/материал/работа/акт) — показывается и
  // в общем списке заявок (только для быстрого визуального статуса, кликнуть
  // по ним там нельзя — data-action на иконках нет), и в карточке заявки под
  // номером, где рядом с каждым пунктом уже есть реальные действия (прикрепить
  // счёт/фото/акт, сменить исполнителя) — см. renderTicketPanel().
  function statusIconsRow(t){
    return h`<span class="status-icons">${STATUS_ICON_DEFS.map(function(def){
      var lit = def.lit(t);
      return h`<span class="status-icon${lit?' lit':''}" title="${escapeHtml(def.label(t))}">${def.svg}</span>`;
    }).join("")}</span>`;
  }
  // Те же 4 картинки, что и в STATUS_ICON_DEFS выше, по ключу пункта — чтобы в
  // чек-листе "Ход работ" (milestoneRow) стояла ровно та же иконка, что и в
  // строке статус-иконок под номером заявки: это одно и то же состояние,
  // показанное в двух местах, и они обязаны выглядеть одинаково.
  var MS_ICON = { crew: STATUS_ICON_DEFS[0].svg, materials: STATUS_ICON_DEFS[1].svg, work: STATUS_ICON_DEFS[2].svg, act: STATUS_ICON_DEFS[3].svg };
  // Круглая кнопка "прикрепить" прямо в строке чек-листа (см. .milestone-attach-btn) —
  // скрепка, под которой лежит настоящий <input type=file>. category — categория
  // счёта (crew|materials), multiple — можно выбрать сразу несколько файлов разом
  // (один и тот же пункт часто закрывают несколькими счетами/накладными).
  function milestoneAttachControl(opts){
    return h`<label class="milestone-attach-btn" title="${escapeHtml(opts.title)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      <input type="file" class="${opts.cls}" data-id="${opts.id}" ${opts.category?('data-category="'+opts.category+'"'):''} accept="${opts.accept}" ${opts.multiple?'multiple':''}>
    </label>`;
  }
  // Строка чек-листа "Ход работ" в карточке заявки (см. renderTicketPanel):
  // одна и та же вёрстка для всех 4 пунктов (бригада/материал/работа/акт),
  // отличаются иконка, галочка-статус, заголовок, содержимое meta (счётчик
  // файлов + кнопка "прикрепить", видны сразу, без разворачивания строки) и
  // произвольное тело (form/список), которое остаётся скрытым до раскрытия.
  function milestoneRow(opts){
    // opts.key — уникальный ключ пункта (crew/materials/work/act) для
    // сворачивания/разворачивания (state.milestoneOpen), opts.done — галочка,
    // opts.icon — svg пункта (см. MS_ICON), opts.clickable — если true, клик по
    // иконке сразу переключает opts.toggleAction/toggleId/toggleVal. "Материал"
    // всегда кликабелен (это просто ручной флажок). У "Бригада"/"Работа"/"Акт"
    // иконка кликабельна только пока нет реального подтверждения (назначение/
    // файл акта) — так можно вручную отметить пункт выполненным, если по
    // факту сделано, а подтверждения в системе нет; как только реальное
    // подтверждение появляется, иконка становится статичной (см. crewReal/
    // actHasFile в блоке "Ход работ" — "Материал"/"Работа" всегда кликабельны,
    // это чисто ручные флажки), opts.title — заголовок (1 строка,
    // длинный текст обрезается), opts.meta — счётчик файлов/кнопка "прикрепить"
    // (видны всегда), opts.body — раскрывающееся содержимое, видно только когда
    // раскрыто.
    var open = !!(state.milestoneOpen && state.milestoneOpen[opts.key]);
    var iconTag = opts.clickable
      ? h`<button type="button" class="milestone-icon${opts.done?' done':''}" data-action="${opts.toggleAction}" data-id="${opts.toggleId}" data-val="${opts.toggleVal}" title="${opts.done?'Снять отметку':'Отметить выполненным'}">${opts.icon}</button>`
      : h`<span class="milestone-icon${opts.done?' done':''}">${opts.icon}</span>`;
    return h`<div class="milestone-row">
      <div class="milestone-hd" data-action="toggle-milestone" data-key="${opts.key}">
        ${iconTag}
        <span class="milestone-title" title="${escapeHtml(opts.title)}">${opts.title}</span>
        ${opts.meta||""}
        <span class="milestone-chevron">${open?'▾':'▸'}</span>
      </div>
      ${open ? h`<div class="milestone-body">${opts.body}</div>` : ""}
    </div>`;
  }
  // Счета/договоры заявки нужной категории (crew | materials | null — обычный
  // "Счета") — фильтр общий для счётчика в шапке пункта и для списка внутри.
  function invoicesFor(t, category){
    return (state.invoices||[]).filter(function(iv){ return iv.ticket_id===t.id && iv.category===category; });
  }
  // Счета без категории (category=null) — раньше загружались через отдельный
  // общий раздел "Счета", который убрали при переходе на разбивку по пунктам
  // чек-листа "Бригада"/"Материал" (см. INVOICE_CATEGORY_LABEL и оба
  // milestoneAttachControl ниже — сейчас новый файл иначе как с category
  // "crew"/"materials" прикрепить нельзя). Уже существующие старые файлы с
  // category=null никуда не делись — они по-прежнему в "Реестре платежей", но
  // без этой функции были бы навсегда не видны в самой карточке заявки, хотя
  // формально прикреплены именно к ней (это и есть баг с заявкой №286).
  function legacyInvoicesFor(t){
    return (state.invoices||[]).filter(function(iv){ return iv.ticket_id===t.id && iv.category==null; });
  }
  function renderInvoiceList(list){
    if(!list.length) return h`<div class="muted" style="font-size:12.5px;">Файлов пока нет.</div>`;
    return h`<div class="row-gap" style="gap:6px;display:flex;flex-direction:column;">${list.map(function(iv){
      return h`<div class="invoice-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px;">
        <button type="button" class="btn btn-sm" data-action="invoice-open" data-path="${escapeHtml(iv.file_path)}">${escapeHtml(iv.file_name)}</button>
        <button type="button" class="btn btn-sm btn-ghost btn-danger" style="margin-left:auto;" data-action="invoice-delete" data-id="${iv.id}" data-path="${escapeHtml(iv.file_path)}" title="Удалить файл">✕</button>
      </div>`;
    }).join("")}</div>`;
  }
  // Список уже прикреплённых к заявке счетов/договоров нужной категории
  // (crew | materials) — используется в чек-листе "Ход работ". Каждый файл
  // можно открыть или удалить (раньше удалить было нельзя вообще).
  function milestoneInvoiceList(t, category){
    return renderInvoiceList(invoicesFor(t, category));
  }
  // Раздел для старых файлов без категории (см. legacyInvoicesFor выше) — виден
  // в карточке заявки, только если такие файлы у неё реально есть, чтобы не
  // загромождать обычные заявки уже неактуальным разделом.
  function legacyInvoiceSection(t){
    var list = legacyInvoicesFor(t);
    if(!list.length) return "";
    return h`<div>
      <div class="section-title">Прочие счета ${infoTip("Файлы, прикреплённые ещё до разделения на «Бригада»/«Материал» в чек-листе «Ход работ». Они есть в «Реестре платежей» и здесь — просто без привязки к конкретному пункту чек-листа.")}</div>
      ${renderInvoiceList(list)}
    </div>`;
  }
  // Фотографии по заявке — раздел "Фото" (замечания, см. category=null у
  // uploadPhoto выше) и отдельная галерея фото-доказательств к Акту
  // (actPhotoGrid ниже) используют одну и ту же вёрстку сетки/миниатюр.
  function renderPhotoGrid(photos, emptyText){
    if(!photos.length) return h`<div class="muted" style="font-size:12.5px;">${emptyText}</div>`;
    return h`<div class="photo-grid">${photos.map(function(p){
      ensurePhotoUrl(p.file_path);
      var url = photoUrlCache[p.file_path];
      var inner = (url && url!=="pending") ? h`<img src="${url}" alt="${escapeHtml(p.file_name)}">` : h`<span class="muted" style="font-size:10.5px;">…</span>`;

  // Общая фильтрация+сортировка списка заявок — используется и для самого экрана
  // «Заявки», и для выгрузки в Excel (чтобы выгружался ровно тот же список, что
  // сейчас показан на экране, с теми же фильтрами и сортировкой).
  function getFilteredTicketsList(){
    var f = state.filters || {statusList:[], zone:"", hotel:"", q:"", showClosed:false, attentionOnly:false};
    if(!f.statusList) f.statusList = [];
    var q = normalizeForMatch(f.q||"");
    var baseFiltered = state.tickets.filter(function(t){
      if(f.attentionOnly && !t.attention_flag) return false;
      if(f.statusList.length && f.statusList.indexOf(ticketStatusLabel(t))===-1) return false;
      if(f.zone && String(t.zone)!==f.zone) return false;
      if(f.hotel && String(t.hotel_id)!==f.hotel) return false;
      if(q){
        var hay = normalizeForMatch((t.description||"")+" "+(t.description_short||"")+" "+(t.external_ref||""));
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
    // Скрывать закрытые/отклонённые по умолчанию имеет смысл только когда статус
    // не выбран явно — если человек сам кликнул чип "Отклонена" или "Выполнена",
    // он однозначно хочет видеть именно эти заявки, а не получить пустой список
    // из-за того, что они попадают под "закрыто по умолчанию".
    var list = (f.showClosed || f.statusList.length) ? baseFiltered.slice() : baseFiltered.filter(function(t){ return !isTicketDone(t); });
    var hiddenClosedCount = baseFiltered.length - list.length;
    // По умолчанию (пока человек не кликнул ни один заголовок) список отсортирован
    // по номеру заявки по убыванию — самые новые/последние заявки сверху. Как
    // только кликнули по какому-то столбцу — дальше работает обычное переключение
    // возрастание/убывание по клику (см. обработчик data-action="sort-tickets").
    var sortField = (f.sort && f.sort.field) || "ref";
    var sortDir = (f.sort && f.sort.dir) || "desc";
    function sortVal(t, field){
      var hotel = hotelById(t.hotel_id);
      if(field==="ref") return t.external_ref || "";
      if(field==="hotel") return hotel ? hotel.name : "";
      if(field==="desc") return displayShort(t);
      if(field==="status") return ticketStatusLabel(t);
      if(field==="deadline"){ var di=deadlineInfo(t); return di.ms==null ? Infinity : di.ms; }
      return "";
    }
    // Номера заявок из c-lector — по сути числа, но хранятся строкой, поэтому
    // обычное сравнение строк расставило бы "10" раньше "9". Сравниваем как числа,
    // если оба значения похожи на число, иначе — обычным сравнением строк.
    function numericAwareCompare(a, b){
      var sa = String(a), sb = String(b);
      var na = sa.match(/^-?\d+(\.\d+)?$/), nb = sb.match(/^-?\d+(\.\d+)?$/);
      if(na && nb) return parseFloat(sa) - parseFloat(sb);
      return sa.localeCompare(sb, "ru");
    }
    if(sortField){
      list = list.slice().sort(function(a,b){
        var va = sortVal(a, sortField), vb = sortVal(b, sortField);
        var cmp;
        if(sortField==="ref") cmp = numericAwareCompare(va, vb);
        else cmp = (typeof va==="number" || typeof vb==="number") ? ((va||0)-(vb||0)) : String(va).localeCompare(String(vb), "ru");
        return sortDir==="desc" ? -cmp : cmp;
      });
    }
    return { list: list, hiddenClosedCount: hiddenClosedCount, sortField: sortField, sortDir: sortDir };
  }
  function exportTicketsExcel(){
    if(typeof XLSX==="undefined" || !XLSX.utils){ alert("Модуль Excel не загрузился (возможно, заблокирован интернет/VPN) — обновите страницу и попробуйте снова."); return; }
    var list = getFilteredTicketsList().list;
    var header = ["№ c-lector","Отель","Локация","Описание","Статус","Исполнитель","Срок","Особое внимание"];
    var rows = list.map(function(t){
      var hotel = hotelById(t.hotel_id); var di = deadlineInfo(t);
      return [ t.external_ref||"", hotel?("№"+hotel.id+" "+hotel.name):"", t.location||"", displayShort(t), ticketStatusLabel(t), t.assigned_to||"", di.label, t.attention_flag?("Да"+(t.attention_note?": "+t.attention_note:"")):"" ];
    });
    var ws = XLSX.utils.aoa_to_sheet([header].concat(rows));
    ws["!cols"] = header.map(function(){ return {wch:22}; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Заявки");
    XLSX.writeFile(wb, "Заявки_Keruen_Inn_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  function viewTeam(){
    var owner = isOwner();
    return h`
      <div class="two-col">
        <div class="card card-pad">
          <div class="section-title">Сотрудники, вошедшие в систему</div>
          ${!owner ? h`<div class="helptext" style="margin-bottom:10px;">Роль и удаление сотрудников редактирует только руководитель службы.</div>` : ""}

  // Реестр платежей — простой список прикреплённых к заявкам счетов: заявка,
  // отель, сам файл, дата добавления. Раньше здесь было 23 колонки 1:1 с
  // корпоративным Excel-файлом (поставщик, суммы, валюта, НДС, статья бюджета,
  // ERP-поля и т.д.) — по просьбе Антона все они убраны и с экрана, и из
  // выгрузки, т.к. заполнялись вручную и в этом приложении не нужны.
  function viewRegistry(){
    var all = (state.invoices||[]).filter(function(iv){ return iv.in_registry; });
    var rf = state.registryFilters || {q:"", hotel:"", dateFrom:"", dateTo:""};
    var q = normalizeForMatch(rf.q||"");
    // Поиск/фильтр действуют только на то, что показано на экране — выгрузка в
    // Excel всегда забирает ВЕСЬ реестр целиком, чтобы случайно не забытый
    // фильтр не «съел» часть строк из официальной выгрузки.
    var list = all.filter(function(iv){
      var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
      var hotel = tk ? hotelById(tk.hotel_id) : null;
      if(rf.hotel && (!hotel || String(hotel.id)!==rf.hotel)) return false;
      if(rf.dateFrom && (!iv.added_to_registry_at || iv.added_to_registry_at < rf.dateFrom)) return false;
      if(rf.dateTo && (!iv.added_to_registry_at || iv.added_to_registry_at > (rf.dateTo+"T23:59:59"))) return false;
      if(q){
        var hay = normalizeForMatch((tk&&tk.external_ref||"")+" "+(hotel?hotel.name:"")+" "+(iv.file_name||""));
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
    var filtersActive = !!(rf.q||rf.hotel||rf.dateFrom||rf.dateTo);
    // Сортировка по клику на заголовок — как в «Заявках». На выгрузку в Excel не
    // влияет — она всегда идёт по всему реестру целиком (см. комментарий выше).
    var rsort = rf.sort || {};
    var rSortField = rsort.field, rSortDir = rsort.dir || "asc";
    function registrySortVal(iv, field){
      var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
      var hotel = tk ? hotelById(tk.hotel_id) : null;
      if(field==="ref") return (tk && tk.external_ref) || "";
      if(field==="hotel") return hotel ? hotel.name : "";
      if(field==="added_at") return iv.added_to_registry_at || "";
      return "";
    }
    if(rSortField){
      list = list.slice().sort(function(a,b){
        var va = registrySortVal(a, rSortField), vb = registrySortVal(b, rSortField);
        var cmp = (typeof va==="number" || typeof vb==="number") ? ((va||0)-(vb||0)) : String(va).localeCompare(String(vb), "ru");
        return rSortDir==="desc" ? -cmp : cmp;
      });
    }
    function registryTh(label, field){
      if(!field) return h`<th>${label}</th>`;
      var active = rSortField===field;
      return h`<th data-action="sort-registry" data-field="${field}" style="cursor:pointer;user-select:none;" title="Сортировать">${label}${active?(rSortDir==="asc"?" ▲":" ▼"):""}</th>`;
    }
    // поле сортировки для каждой колонки — null там, где сортировка не имеет
    // смысла (порядковый номер, сам файл)
    var REGISTRY_SORT_FIELDS = [null,"ref","hotel",null,"added_at"];
    return h`
      <div class="row-gap">
        <div class="filters">
          <input type="text" data-registry-filter="q" value="${escapeHtml(rf.q||"")}" placeholder="Поиск: № заявки, отель, файл…" style="min-width:220px;">
          <select data-registry-filter="hotel"><option value="">Все отели</option>${state.hotels.filter(function(x){return x.in_service;}).map(function(x){return h`<option value="${x.id}" ${rf.hotel===String(x.id)?'selected':''}>№${x.id} ${x.name}</option>`;}).join("")}</select>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin:0;">с <input type="date" data-registry-filter="dateFrom" value="${rf.dateFrom||''}" style="width:auto;"></label>
          <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin:0;">по <input type="date" data-registry-filter="dateTo" value="${rf.dateTo||''}" style="width:auto;"></label>
          ${filtersActive ? h`<a href="#" data-action="clear-registry-filter" style="font-size:12px;">сбросить</a>` : ""}
          <button class="btn btn-sm" data-action="registry-export" ${all.length===0?'disabled':''}>Экспорт в Excel${filtersActive?' (весь реестр)':''}</button>
          <span class="muted" style="margin-left:auto;">${list.length} из ${all.length}</span>
        </div>
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr>${REGISTRY_COLUMN_LABELS.map(function(lbl, i){ return registryTh(lbl, REGISTRY_SORT_FIELDS[i]); }).join("")}</tr></thead>
            <tbody>${list.length===0 ? h`<tr><td colspan="${REGISTRY_COLUMN_LABELS.length}"><div class="empty-state"><b>${filtersActive?'Ничего не найдено':'Реестр пуст'}</b>${filtersActive?'Попробуйте изменить или сбросить фильтр.':'Прикрепите счёт к заявке — он появится здесь автоматически.'}</div></td></tr>` :
              list.map(function(iv, i){
                var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
                var hotel = tk ? hotelById(tk.hotel_id) : null;
                return h`<tr>
                  <td class="mono muted">${i+1}</td>
                  <td class="mono">${tk && tk.external_ref ? escapeHtml(tk.external_ref) : (tk?h`<a href="#" data-open-ticket="${tk.id}">открыть</a>`:'—')}</td>
                  <td>${hotel ? ('№'+hotel.id+' '+escapeHtml(hotel.name)) : '—'}</td>
                  <td><button class="btn btn-sm" data-action="invoice-open" data-path="${escapeHtml(iv.file_path)}">${escapeHtml(iv.file_name)}</button></td>
                  <td class="mono muted">${iv.added_to_registry_at? fmtDateShort(iv.added_to_registry_at) : '—'}</td>
                </tr>`;
              }).join("")}
            </tbody></table></div>
          <div class="helptext" style="padding:10px 16px;">Счёт попадает сюда автоматически при прикреплении к заявке в её карточке.</div>
        </div>
      </div>`;
  }

  /* ============================== КАРТА (Google Maps) ============================== */
  var mapInstance = null, mapMarkers = [];
  function loadGoogleMaps(cb){
    if(typeof google !== "undefined" && google.maps){ cb(); return; }
    if(window.__gmapsLoading){ window.__gmapsCallbacks = window.__gmapsCallbacks||[]; window.__gmapsCallbacks.push(cb); return; }
    window.__gmapsLoading = true;
    window.__gmapsCallbacks = [cb];
    window.__gmapsInit = function(){ (window.__gmapsCallbacks||[]).forEach(function(f){ f(); }); };
    var s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(GOOGLE_MAPS_API_KEY)+"&callback=__gmapsInit";
    s.async = true;
    s.onerror = function(){
      window.__gmapsLoading = false;
      var c = document.getElementById("map-canvas");
      if(c) c.innerHTML = '<div class="empty-state"><b>Не удалось загрузить Google Maps</b>Проверьте ключ API (GOOGLE_MAPS_API_KEY) и подключение к интернету.</div>';
    };
    document.head.appendChild(s);
  }
  // Метки на карте показывают количество активных (не закрытых/не отклонённых)
  // заявок по каждому отелю; клик по метке — переход в список заявок этого отеля.
  function ensureMap(){
    if(!MAPS_CONFIGURED) return;
    var container = document.getElementById("map-canvas");
    if(!container) return;
    function draw(){
      var counts = {};
      state.tickets.filter(isActive).forEach(function(t){ counts[t.hotel_id]=(counts[t.hotel_id]||0)+1; });
      if(!mapInstance){
        mapInstance = new google.maps.Map(container, { center:{lat:48.0, lng:68.0}, zoom:5 });
      }
      mapMarkers.forEach(function(m){ m.setMap(null); });
      mapMarkers = [];
      state.hotels.forEach(function(hotel){
        if(hotel.lat==null || hotel.lng==null) return;
        var count = counts[hotel.id]||0;
        var marker = new google.maps.Marker({
          position: {lat:hotel.lat, lng:hotel.lng}, map: mapInstance, label: String(count),
          title: "№"+hotel.id+" "+hotel.name+" — открытых заявок: "+count
        });
        marker.addListener("click", function(){
          state.filters = state.filters||{}; state.filters.hotel = String(hotel.id); state.filters.statusList=[]; state.filters.zone=""; state.filters.q="";
          location.hash = "#/tickets";
        });
        mapMarkers.push(marker);
      });
    }
    loadGoogleMaps(draw);
  }
  function viewMap(){
    if(!MAPS_CONFIGURED){
      return h`<div class="card card-pad">
        <div class="section-title">Карта отелей</div>
        <p style="font-size:13px;">Чтобы увидеть карту с локациями отелей и количеством открытых заявок, впишите свой ключ Google Maps JavaScript API в переменную <code>GOOGLE_MAPS_API_KEY</code> в начале файла.</p>
        <p style="font-size:13px;">Как получить ключ: console.cloud.google.com → APIs & Services → Credentials → Create credentials → API key, затем включить «Maps JavaScript API» для проекта.</p>
      </div>`;
    }
    return h`<div class="card card-pad">
      <div class="section-title">Карта отелей — открытые заявки</div>
      <div id="map-canvas"></div>
      <div class="helptext" style="margin-top:10px;">Число на метке — количество активных заявок по объекту. Нажмите на метку, чтобы перейти к списку заявок этого отеля.</div>
    </div>`;

  // Сколько сейчас активных (не выполненных/не отклонённых) заявок числится за
  // бригадой — заявка на бригаду хранит assigned_to как "Бригада: <название>"

  /* ============================== ОТЕЛИ ============================== */
  function addHotel(name, zone, lat, lng){
    if(!name || !name.trim()){ alert("Введите название отеля."); return; }
    sb.from("hotels").insert({
      name: name.trim(), zone: zone? Number(zone): null, in_service:true,
      lat: (lat!==""&&lat!=null)? Number(lat): null, lng: (lng!==""&&lng!=null)? Number(lng): null
    }).then(function(res){ if(res && res.error) alert("Не удалось добавить отель: "+res.error.message); });
  }
  function updateHotelField(id, field, val){
    var patch = {};
    if(field==="zone") patch.zone = val===""? null : Number(val);
    else if(field==="lat" || field==="lng") patch[field] = val===""? null : Number(val);
    else patch[field] = val;
    sb.from("hotels").update(patch).eq("id", id).then(function(){});
  }
  function toggleHotelActive(id, makeActive){ sb.from("hotels").update({in_service: makeActive}).eq("id", id).then(function(){}); }
  function deleteHotel(id){
    var used = state.tickets.some(function(t){ return Number(t.hotel_id)===Number(id); });
    if(used){ alert("Нельзя удалить отель, по которому уже есть заявки в системе — история должна остаться привязана к отелю. Вместо удаления снимите галочку «В эксплуатации»: он перестанет предлагаться для новых заявок, но старые не пострадают."); return; }
    if(!confirm("Удалить отель?")) return;
    sb.from("hotels").delete().eq("id", id).then(function(){});
  }

            ${t.external_status ? h`<div class="kv"><span class="k">Статус в c-lector</span><span class="v">${externalStatusPill(t.external_status)}</span></div>` : ""}
            <div class="kv"><span class="k">Зарегистрирована</span><span class="v">${fmtDate(t.created_at).split(" ")[0]}</span></div>

                return h`<form class="note-edit-form" data-note-id="${n.id}" style="display:flex;gap:6px;margin-bottom:7px;">

            <form id="note-form" data-id="${t.id}" style="margin-top:8px;display:flex;gap:8px;">
