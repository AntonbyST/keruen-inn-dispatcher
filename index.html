      lit:function(t){ return !!t.work_manual_done; },
      label:function(t){ return t.work_manual_done ? "Работа отмечена выполненной" : "Работа ещё не выполнена"; } },
    { key:'act', svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="9 2 9 8 15 8"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>',
      lit:function(t){ return !!t.act_signed; },
      label:function(t){
        if(!t.act_signed) return "Акт ещё не подписан";
        if(t.act_file_path) return "Акт подписан";
        var hasActPhoto = (state.photos||[]).some(function(p){ return p.ticket_id===t.id && p.category==="act"; });
        return hasActPhoto ? "Акт подтверждён по фото-доказательству" : "Акт отмечен вручную (без файла)";
      } }
  ];
  // Быстрый доступ к пункту чек-листа по ключу — нужен для фильтра по тегам в
  // списке заявок (см. TAG_FILTER_DEFS/getFilteredTicketsList ниже), чтобы не
  // дублировать логику "готово/не готово" из STATUS_ICON_DEFS ещё раз.
  var STATUS_ICON_BY_KEY = {};
  STATUS_ICON_DEFS.forEach(function(def){ STATUS_ICON_BY_KEY[def.key] = def; });
  // Версия 0.2.3: тег-фильтры снова настоящий фильтр (не подсветка, как было в
  // 0.2.1) — заголовки описывают именно это (см. getFilteredTicketsList).
  var TAG_FILTER_DEFS = [
    { key:'crew', title:'Показать только заявки с назначенной бригадой' },
    { key:'materials', title:'Показать только заявки с закупленным материалом' },
    { key:'work', title:'Показать только заявки, где работа отмечена выполненной' },
    { key:'act', title:'Показать только заявки с подписанным актом' }
  ];
  // Ряд из 4 иконок хода работ (бригада/материал/работа/акт) — показывается и
  // в общем списке заявок (только для быстрого визуального статуса, кликнуть
  // по ним там нельзя — data-action на иконках нет), и в карточке заявки под
  // номером, где рядом с каждым пунктом уже есть реальные действия (прикрепить
  // счёт/фото/акт, сменить исполнителя) — см. renderTicketPanel().
  function statusIconsRow(t){
    return h`<span class="status-icons">${STATUS_ICON_DEFS.map(function(def){
      // def.state (пока только у "Материал") — три состояния neutral/warn/ok;
      // у остальных пунктов только два (def.lit boolean), как и раньше.
      var st = def.state ? def.state(t) : (def.lit(t) ? "ok" : "neutral");
      var cls = st==="ok" ? " lit" : (st==="warn" ? " warn-lit" : "");
      return h`<span class="status-icon${cls}" title="${escapeHtml(def.label(t))}">${def.svg}</span>`;
    }).join("")}</span>`;
  }
  // Те же 4 картинки, что и в STATUS_ICON_DEFS выше, по ключу пункта — чтобы в
  // чек-листе "Ход работ" (milestoneRow) стояла ровно та же иконка, что и в
  // строке статус-иконок под номером заявки: это одно и то же состояние,
  // показанное в двух местах, и они обязаны выглядеть одинаково.
  var MS_ICON = { crew: STATUS_ICON_DEFS[0].svg, materials: STATUS_ICON_DEFS[1].svg, work: STATUS_ICON_DEFS[2].svg, act: STATUS_ICON_DEFS[3].svg };
  // Круглая кнопка "прикрепить" прямо в строке чек-листа (см. .milestone-attach-btn) —
  // скрепка, под которой лежит настоящий <input type=file>. category — categория
  // счёта (crew|materials), multiple — можно выбрать сразу несколько файлов разом
  // (один и тот же пункт часто закрывают несколькими счетами/накладными).
  function milestoneAttachControl(opts){
    return h`<label class="milestone-attach-btn" title="${escapeHtml(opts.title)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      <input type="file" class="${opts.cls}" data-id="${opts.id}" ${opts.category?('data-category="'+opts.category+'"'):''} accept="${opts.accept}" ${opts.multiple?'multiple':''}>
    </label>`;
  }
  // Строка чек-листа "Ход работ" в карточке заявки (см. renderTicketPanel):
  // одна и та же вёрстка для всех 4 пунктов (бригада/материал/работа/акт),
  // отличаются иконка, галочка-статус, заголовок, содержимое meta (счётчик
  // файлов + кнопка "прикрепить", видны сразу, без разворачивания строки) и
  // произвольное тело (form/список), которое остаётся скрытым до раскрытия.
  function milestoneRow(opts){
    // opts.key — уникальный ключ пункта (crew/materials/work/act) для
    // сворачивания/разворачивания (state.milestoneOpen), opts.done — галочка,
    // opts.icon — svg пункта (см. MS_ICON), opts.clickable — если true, клик по
    // иконке сразу переключает opts.toggleAction/toggleId/toggleVal. С версии
    // 0.2.2 "Бригада"/"Материал" не кликабельны вообще — у них теперь свои явные
    // элементы управления в теле пункта ("Назначить"/"Сменить" или галочка
    // "не нужна(-ен)"), значок только отображает состояние (см. materialsState()
    // выше). "Работа" — простой ручной флажок, поэтому кликабелен всегда. "Акт"
    // кликабелен только пока нет реального подтверждения (файл акта) — так можно
    // вручную отметить пункт выполненным, если по факту сделано, а подтверждения
    // в системе нет; как только файл появляется, иконка становится статичной
    // (см. actHasFile в блоке "Ход работ"). opts.warn — промежуточное жёлтое
    // состояние (пока только у "Материал"). opts.title — заголовок (1 строка,
    // длинный текст обрезается), opts.meta — счётчик файлов/кнопка "прикрепить"
    // (видны всегда), opts.body — раскрывающееся содержимое, видно только когда
    // раскрыто.
    var open = !!(state.milestoneOpen && state.milestoneOpen[opts.key]);
    // opts.warn (пока только у "Материал", см. materialsState()) — промежуточное
    // жёлтое состояние вдобавок к обычному done/не done.
    var iconCls = opts.done ? " done" : (opts.warn ? " warn" : "");
    var iconTag = opts.clickable
      ? h`<button type="button" class="milestone-icon${iconCls}" data-action="${opts.toggleAction}" data-id="${opts.toggleId}" data-val="${opts.toggleVal}" title="${opts.done?'Снять отметку':'Отметить выполненным'}">${opts.icon}</button>`
      : h`<span class="milestone-icon${iconCls}">${opts.icon}</span>`;
    return h`<div class="milestone-row">
      <div class="milestone-hd" data-action="toggle-milestone" data-key="${opts.key}">
        ${iconTag}
        <span class="milestone-title" title="${escapeHtml(opts.title)}">${opts.title}</span>
        ${opts.meta||""}
        <span class="milestone-chevron">${open?'▾':'▸'}</span>
      </div>
      ${open ? h`<div class="milestone-body">${opts.body}</div>` : ""}
    </div>`;
  }
  // Счета/договоры заявки нужной категории (crew | materials | null — обычный
  // "Счета") — фильтр общий для счётчика в шапке пункта и для списка внутри.
  function invoicesFor(t, category){
    return (state.invoices||[]).filter(function(iv){ return iv.ticket_id===t.id && iv.category===category; });
  }
  // Счета без категории (category=null) — раньше загружались через отдельный
  // общий раздел "Счета", который убрали при переходе на разбивку по пунктам
  // чек-листа "Бригада"/"Материал" (см. INVOICE_CATEGORY_LABEL и оба
  // milestoneAttachControl ниже — сейчас новый файл иначе как с category
  // "crew"/"materials" прикрепить нельзя). Уже существующие старые файлы с
  // category=null никуда не делись — они по-прежнему в "Реестре платежей", но
  // без этой функции были бы навсегда не видны в самой карточке заявки, хотя
  // формально прикреплены именно к ней (это и есть баг с заявкой №286).
  function legacyInvoicesFor(t){
    return (state.invoices||[]).filter(function(iv){ return iv.ticket_id===t.id && iv.category==null; });
  }
  // Пилюля "Оплачено"/"Не оплачено" — только для чтения (сама галочка "оплачено"
  // ставится в «Реестре платежей», см. viewRegistry/setInvoicePaid); здесь нужна,
  // чтобы статус счёта было видно прямо в карточке заявки, даже тем ролям, у
  // которых нет доступа к разделу «Реестр платежей» (напр. Снабжение).
  function invoicePaidPill(iv){
    return iv.paid
      ? h`<span class="pill pill-ok">Оплачено</span>`
      : h`<span class="pill pill-warn">Не оплачено</span>`;
  }
  function renderInvoiceList(list){
    if(!list.length) return h`<div class="muted" style="font-size:12.5px;">Файлов пока нет.</div>`;
    return h`<div class="row-gap" style="gap:6px;display:flex;flex-direction:column;">${list.map(function(iv){
      // 0.2.20 (по просьбе Антона): в карточке заявки теперь видна сумма в KZT
      // без НДС по ЭТОЙ заявке — если счёт общий на несколько заявок (см.
      // invoiceGroupMembers), показывается доля этой заявки (по проценту из
      // «Реестра платежей»), а не сумма всего счёта целиком.
      var acc = invoiceAccountedKZTForTicket(iv);
      return h`<div class="invoice-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px;">
        <button type="button" class="btn btn-sm" data-action="invoice-open" data-path="${escapeHtml(iv.file_path)}">${escapeHtml(iv.file_name)}</button>
        <span class="mono muted" style="font-size:12px;" title="${acc.shared?('Сумма без НДС по этой заявке'+(acc.percent!=null?' ('+acc.percent+'% от счёта)':' — доля этой заявки ещё не указана в «Реестре платежей» (счёт общий на несколько заявок)')):'Сумма без НДС'}">${accountedKZTLabel(acc)}${acc.state==="ok" && !acc.currency ? ' ₸' : ''}</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
          ${invoicePaidPill(iv)}
          <button type="button" class="btn btn-sm btn-ghost btn-danger" data-action="invoice-delete" data-id="${iv.id}" data-path="${escapeHtml(iv.file_path)}" title="Удалить файл">✕</button>
        </div>
      </div>`;
    }).join("")}</div>`;
  }
  // Список уже прикреплённых к заявке счетов/договоров нужной категории
  // (crew | materials) — используется в чек-листе "Ход работ". Каждый файл
  // можно открыть или удалить (раньше удалить было нельзя вообще).
  function milestoneInvoiceList(t, category){
    return renderInvoiceList(invoicesFor(t, category));
  }
  // Раздел для старых файлов без категории (см. legacyInvoicesFor выше) — виден
  // в карточке заявки, только если такие файлы у неё реально есть, чтобы не
  // загромождать обычные заявки уже неактуальным разделом.
  // Переписка и история статусов из c-lector (0.2.11, автосинхронизация по
  // API — см. edge-functions/clector-sync.ts) — заявка целиком приходит
  // из API и складывается в tickets.clector_raw как есть (comments[],
  // status_history[]), это просто их отображение. Заявок, заведённых
  // ручным импортом файла/вставки (viewImport/commitImport), это не
  // касается — там clector_raw не заполняется, секция не показывается.
  function clectorCommentsList(comments){
    if(!comments || !comments.length) return "";
    return h`<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">
      ${comments.slice().reverse().map(function(c){
        var author = (c.author && c.author.name) ? c.author.name : "—";
        return h`<div style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;">
          <div class="muted" style="font-size:11.5px;margin-bottom:2px;">${escapeHtml(author)} · ${escapeHtml(fmtDate(c.created_at))}</div>
          <div>${escapeHtml(c.text||"")}</div>
        </div>`;
      }).join("")}
    </div>`;
  }
  function clectorStatusHistoryList(history){
    if(!history || !history.length) return "";
    return h`<div style="display:flex;flex-direction:column;gap:4px;">
      ${history.slice().reverse().map(function(e){
        var from = e.from_status ? (CLECTOR_STATUS_LABEL[e.from_status]||e.from_status) : null;
        var to = CLECTOR_STATUS_LABEL[e.to_status]||e.to_status;
        var by = (e.changed_by && e.changed_by.name) ? e.changed_by.name : "автоматически";
        return h`<div class="kv" style="font-size:12.5px;">
          <span class="k">${escapeHtml(fmtDate(e.changed_at))}</span>
          <span class="v">${from?escapeHtml(from)+" → ":""}${escapeHtml(to)} <span class="muted">(${escapeHtml(by)})</span></span>
        </div>`;
      }).join("")}
    </div>`;
  }
  function clectorSyncSection(t){
    if(t.source!=="c-lector" || !t.clector_raw) return "";
    var raw = t.clector_raw;
    var comments = raw.comments||[];
    var history = raw.status_history||[];
    if(!comments.length && !history.length) return "";
    return h`<div>
      <div class="section-title">Из c-lector ${infoTip("Переписка и история статусов подтягиваются автоматически при синхронизации с API c-lector, только для чтения — ответить отсюда нельзя, писать нужно в самой системе c-lector.")}</div>
      ${history.length ? h`<div class="helptext" style="margin-bottom:4px;">История статусов:</div>${clectorStatusHistoryList(history)}` : ""}
      ${comments.length ? h`<div class="helptext" style="margin:10px 0 4px;">Переписка:</div>${clectorCommentsList(comments)}` : ""}
    </div>`;
  }
  function legacyInvoiceSection(t){
    var list = legacyInvoicesFor(t);
    if(!list.length) return "";
    return h`<div>
      <div class="section-title">Прочие счета ${infoTip("Файлы, прикреплённые ещё до разделения на «Бригада»/«Материал» в чек-листе «Ход работ». Они есть в «Реестре платежей» и здесь — просто без привязки к конкретному пункту чек-листа.")}</div>
      ${renderInvoiceList(list)}
    </div>`;
  }
  // Фотографии по заявке — раздел "Фото" (замечания, см. category=null у
  // uploadPhoto выше) и отдельная галерея фото-доказательств к Акту
  // (actPhotoGrid ниже) используют одну и ту же вёрстку сетки/миниатюр.
  function renderPhotoGrid(photos, emptyText){
    if(!photos.length) return h`<div class="muted" style="font-size:12.5px;">${emptyText}</div>`;
    return h`<div class="photo-grid">${photos.map(function(p){
      ensurePhotoUrl(p.file_path);
      var url = photoUrlCache[p.file_path];
      var inner = (url && url!=="pending") ? h`<img src="${url}" alt="${escapeHtml(p.file_name)}">` : h`<span class="muted" style="font-size:10.5px;">…</span>`;
      return h`<div class="photo-item">
        <div class="photo-thumb" title="${escapeHtml(p.file_name)} · ${escapeHtml(p.uploaded_by||'—')} · ${escapeHtml(fmtDate(p.uploaded_at))}" data-action="photo-open" data-path="${escapeHtml(p.file_path)}" style="cursor:pointer;">
          ${inner}
          <button type="button" class="photo-del" data-action="photo-delete" data-id="${p.id}" data-path="${escapeHtml(p.file_path)}" title="Удалить фото">✕</button>
        </div>
        <div class="photo-date">${escapeHtml(fmtDateShort(p.uploaded_at))}</div>
      </div>`;
    }).join("")}</div>`;
  }
  // Раздел "Фото" — замечания (проблема "до"), category=null. Не влияет на
  // автопереход "Работа выполнена" (см. STATUS_ICON_DEFS/maybeAutoComplete
  // выше) — только информационная галерея.
  function milestonePhotoGrid(t){
    var photos = (state.photos||[]).filter(function(p){return p.ticket_id===t.id && p.category==null;});
    return renderPhotoGrid(photos, "Фото пока нет.");
  }
  // Фото-доказательства выполненной работы, прикреплённые к пункту "Акт"
  // (category="act") — отдельно от замечаний в "Фото" и отдельно от самого
  // файла акта (t.act_file_path/act_file_name, см. uploadActFile выше).
  function actPhotoGrid(t){
    var photos = (state.photos||[]).filter(function(p){return p.ticket_id===t.id && p.category==="act";});
    return renderPhotoGrid(photos, "Фото к акту пока нет.");
  }
  // Ручная пометка "особое внимание" — например, заявкой заинтересовался
  // руководитель или заказчик. В отличие от 4 иконок хода работ выше, эта
  // видна, только когда действительно установлена (не приглушённая по
  // умолчанию иконка, а явный "флажок"), чтобы не размывать внимание на
  // рутинных заявках.
  function attentionBadge(t){
    if(!t.attention_flag) return "";
    var title = "Особое внимание"+(t.attention_note?": "+t.attention_note:"");
    return h`<span class="attn-badge" title="${escapeHtml(title)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </span>`;
  }
  // Акт подписан (файлом, вручную или по фото — см. act_signed), но статус в
  // самом c-lector.ru приложение изменить не может (нет обратной записи) —
  // поэтому в списке заявок нужна явная напоминалка диспетчеру. Показываем
  // только для заявок из c-lector (у ручных заявок нет внешнего статуса,
  // менять там нечего).
  // Гаснет не по внутреннему статусу заявки (он может стать "closed" сам,
  // автопереходом — см. maybeAutoComplete), а только когда САМ c-lector при
  // следующей выгрузке подтвердит, что статус там уже поменяли (см.
  // isClosedExternalStatus выше) — иначе напоминалка теряет смысл: она именно
  // про то, что приложение не может записать статус обратно в c-lector.ru.
  function clectorSyncBadge(t){
    if(!t.act_signed || t.source!=='c-lector') return "";
    if(isClosedExternalStatus(t.external_status)) return "";
    return h`<div class="clector-sync-badge" title="Акт подписан — не забудьте изменить статус этой заявки на сайте c-lector.ru">⟳ изменить статус в c-lector</div>`;
  }
  // 0.2.18: значок "Удалена в c-lector" в списке заявок (см. isDeletedInClector).
  function clectorDeletedBadge(t){
    if(!isDeletedInClector(t)) return "";
    return h`<div class="clector-deleted-badge" title="${escapeHtml("Удалена в c-lector"+(t.clector_deleted_at?(" "+fmtDate(t.clector_deleted_at)):"")+" — данные и история остались здесь, но в самом c-lector этой заявки больше нет")}">Удалена в c-lector</div>`;
  }
  // Показывает, какую заявку дублирует текущая (см. setDuplicateOf выше) — в
  // списке заявок, рядом с номером, чтобы диспетчер сразу видел, что по этой
  // поломке уже есть другая заявка в работе.
  function duplicateBadge(t){
    if(!t.duplicate_of_ticket_id) return "";
    var dup = (state.tickets||[]).find(function(x){return x.id===t.duplicate_of_ticket_id;});
    var label = dup ? (dup.external_ref ? ("№"+dup.external_ref) : "заявки") : "заявки (не найдена)";
    return h`<div class="muted" style="font-size:11px;margin-top:3px;">Дубль ${escapeHtml(label)}</div>`;
  }

  /* ============================== AUTH SCREEN ============================== */
  function renderAuthScreen(){
    var app = document.getElementById("app");
    if(state.authView==="sent"){
      morphInto(app, h`<div class="auth-wrap"><div class="card auth-card">
        <div class="auth-logo">Диспетчерская Keruen Inn</div>
        <div class="auth-sub">Служба сервиса</div>
        <div class="auth-ok"><b>Проверьте почту</b><br>Мы отправили ссылку для входа на ${escapeHtml(state.authEmail)}. Откройте её на этом устройстве.</div>
        <button class="btn btn-block" style="margin-top:14px;" id="auth-resend">Отправить ещё раз</button>
      </div></div>`);
      // .onclick/.onsubmit (а не addEventListener) — с morphdom узел формы
      // может быть тем же самым живым узлом, что и на прошлом render() (а не
      // пересозданным заново, как раньше при innerHTML), поэтому
      // addEventListener на каждый render() копил бы обработчики один поверх
      // другого; присваивание же просто заменяет предыдущий.
      document.getElementById("auth-resend").onclick = function(){ sendMagicLink(state.authEmail); };
      return;
    }
    morphInto(app, h`<div class="auth-wrap"><div class="card auth-card">
      <div class="auth-logo">Диспетчерская Keruen Inn</div>
      <div class="auth-sub">Вход по рабочей почте — без пароля</div>
      ${state.authError ? h`<div class="auth-err">${escapeHtml(state.authError)}</div>` : ""}
      <form id="auth-form">
        <div class="field"><label>Рабочая почта</label><input type="email" name="email" required placeholder="you@company.kz" value="${escapeHtml(state.authEmail)}"></div>
        <button class="btn btn-primary btn-block" type="submit">Отправить ссылку для входа</button>
      </form>
    </div></div>`);
    document.getElementById("auth-form").onsubmit = function(e){
      e.preventDefault();
      var email = new FormData(e.target).get("email").trim();
      if(!email) return;
      sendMagicLink(email);
    };
  }

  /* ============================== VIEWS ============================== */
  // Дашборд (0.2.6): раньше отчёт по СЕРВИСу жил в отдельном пункте меню
  // «Отчёты», видимом только Финансисту — по просьбе Антона перенесён прямо

  function viewDashboard(){

    var attention = active.filter(function(t){ return !!t.attention_flag; }).sort(function(a,b){

    });
    var byZone = {1:0,2:0,3:0}; active.forEach(function(t){ if(t.zone) byZone[t.zone]=(byZone[t.zone]||0)+1; });
    var pf = state.portfolio; var pfTotal = {total:0,submitted:0,inWork:0,overdue:0,done:0,rejected:0};
    if(pf && pf.by_hotel){ Object.keys(pf.by_hotel).forEach(function(k){ var r=pf.by_hotel[k]; Object.keys(pfTotal).forEach(function(f){ pfTotal[f]+=(r[f]||0); }); }); }

          <div class="table-wrap"><table><thead><tr><th>№ c-lector</th><th>Отель</th><th>Описание</th><th>Статус</th><th>Срок</th></tr></thead><tbody>

              return h`<tr data-open-ticket="${t.id}" ${t.attention_flag?'class="attn-row"':''}>

          <div class="report-period-row">
            <span class="muted" style="font-size:12px;">Период:</span>
            ${[7,14,30].map(function(d){ return h`<span class="status-filter-chip ${reportDays===d?'active':''}" data-action="report-period-preset" data-value="${d}">${d} дней</span>`; }).join("")}
            <div class="field"><label style="font-size:11px;">свой, дней</label><input type="number" id="report-period-days" min="1" max="90" value="${reportDays}"></div>

            ${report.thin ? h`<div class="banner report-period-banner" style="margin-bottom:12px;">Истории снимков меньше суток — период сравнения получился короче запрошенного. Он станет полноценным через несколько дней, по мере накопления снимков.</div>`
              // 0.3.0 (по просьбе Антона): если снимка ровно на выбранное число дней
              // назад ещё нет, findSnapshotNearDaysAgo молча подставляет ближайший из

              : (Math.abs(report.actualDays-reportDays)>=2 ? h`<div class="banner report-period-banner" style="margin-bottom:12px;">Снимка ровно на ${reportDays} ${pluralRu(reportDays,"день","дня","дней")} назад ещё нет — сравниваем с ближайшим доступным (${report.actualDays} ${pluralRu(report.actualDays,"день","дня","дней")} назад, от ${fmtDMY(report.baselineDate)}). Поэтому разные периоды пока могут показывать одно и то же — по мере накопления дневных снимков разница появится.</div>` : '')}
            <div class="report-stats">

              <div class="report-stat"><div class="report-stat-label">📈 % выполнения</div><div class="report-stat-value">${report.fmtPct(report.pctNow)}%</div><div class="report-stat-sub">было ${report.fmtPct(report.pctBefore)}%</div></div>

            <details class="report-raw">

        <div class="two-col">

            <div class="kv"><span class="k">Всего заявок</span><span class="v mono">${pfTotal.total}</span></div>

            <div class="kv"><span class="k">Завершено</span><span class="v mono">${pfTotal.done}</span></div>
            <div class="kv"><span class="k">% выполнения</span><span class="v mono">${pfTotal.total-pfTotal.rejected>0? Math.round(pfTotal.done/(pfTotal.total-pfTotal.rejected)*1000)/10 : 0}%</span></div>

  // Общая фильтрация+сортировка списка заявок — используется и для самого экрана
  // «Заявки», и для выгрузки в Excel (чтобы выгружался ровно тот же список, что
  // сейчас показан на экране, с теми же фильтрами и сортировкой).
  function getFilteredTicketsList(){
    var f = state.filters || {statusList:[], zone:"", hotel:"", q:"", showClosed:false, attentionOnly:false};
    if(!f.statusList) f.statusList = [];
    if(!f.tagFilters) f.tagFilters = {};
    if(!f.caseTypeList) f.caseTypeList = [];
    // Активные ключи чек-листа (бригада/материал/работа/акт) из компактных
    // чекбоксов над колонкой "№ c-lector" (см. TAG_FILTER_DEFS/viewTickets) —
    // версия 0.2.3 вернула им поведение настоящего фильтра (по просьбе Антона):
    // включённый тег скрывает все заявки, где этот пункт ещё НЕ выполнен
    // (зелёный/lit), а не подсвечивает их, как было в 0.2.1. Несколько отмеченных
    // тегов одновременно — заявка должна остаться, только если выполнены ВСЕ
    // отмеченные пункты сразу (логика "И", как и для остальных фильтров списка).
    // С версии 0.2.9 "материал" хранит не true/false, а "warn"/"ok" (см.
    // data-cycle-material-filter) — остальные три пункта остаются обычными
    // булевыми чекбоксами, поэтому здесь фильтруем по любому "истинному" значению.
    var activeTagKeys = Object.keys(f.tagFilters).filter(function(k){ return !!f.tagFilters[k]; });
    var q = normalizeForMatch(f.q||"");
    var baseFiltered = state.tickets.filter(function(t){
      if(f.attentionOnly && !t.attention_flag) return false;
      if(f.statusList.length && f.statusList.indexOf(ticketStatusLabel(t))===-1) return false;
      if(f.zone && String(t.zone)!==f.zone) return false;
      if(f.hotel && String(t.hotel_id)!==f.hotel) return false;
      if(f.caseTypeList.length && f.caseTypeList.indexOf(t.case_type)===-1) return false;
      if(f.systemDefectOnly && !t.system_defect_name) return false;
      if(activeTagKeys.length && !activeTagKeys.every(function(key){
        var def = STATUS_ICON_BY_KEY[key];
        if(!def) return false;
        // "Материал" — трёхпозиционный фильтр: значение в tagFilters это не
        // true, а конкретное состояние ("warn"/"ok"), которое надо сравнить
        // с фактическим состоянием заявки через def.state(), а не def.lit().
        if(def.state) return def.state(t) === f.tagFilters[key];
        return def.lit(t);
      })) return false;
      if(q){
        var hay = normalizeForMatch((t.description||"")+" "+(t.description_short||"")+" "+(t.external_ref||""));
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
    // Скрывать закрытые/отклонённые по умолчанию имеет смысл только когда статус
    // не выбран явно — если человек сам кликнул чип "Отклонена" или "Выполнена",
    // он однозначно хочет видеть именно эти заявки, а не получить пустой список
    // из-за того, что они попадают под "закрыто по умолчанию".
    var list = (f.showClosed || f.statusList.length) ? baseFiltered.slice() : baseFiltered.filter(function(t){ return !isTicketDone(t); });
    var hiddenClosedCount = baseFiltered.length - list.length;
    // По умолчанию (пока человек не кликнул ни один заголовок) список отсортирован
    // по номеру заявки по убыванию — самые новые/последние заявки сверху. Как
    // только кликнули по какому-то столбцу — дальше работает обычное переключение
    // возрастание/убывание по клику (см. обработчик data-action="sort-tickets").
    var sortField = (f.sort && f.sort.field) || "ref";
    var sortDir = (f.sort && f.sort.dir) || "desc";
    function sortVal(t, field){
      var hotel = hotelById(t.hotel_id);
      if(field==="ref") return t.external_ref || "";
      if(field==="hotel") return hotel ? hotel.name : "";
      if(field==="desc") return displayShort(t);
      if(field==="status") return ticketStatusLabel(t);
      if(field==="deadline"){ var di=deadlineInfo(t); return di.ms==null ? Infinity : di.ms; }
      return "";
    }
    // Номера заявок из c-lector — по сути числа, но хранятся строкой, поэтому
    // обычное сравнение строк расставило бы "10" раньше "9". Сравниваем как числа,
    // если оба значения похожи на число, иначе — обычным сравнением строк.
    function numericAwareCompare(a, b){
      var sa = String(a), sb = String(b);
      var na = sa.match(/^-?\d+(\.\d+)?$/), nb = sb.match(/^-?\d+(\.\d+)?$/);
      if(na && nb) return parseFloat(sa) - parseFloat(sb);
      return sa.localeCompare(sb, "ru");
    }
    if(sortField){
      list = list.slice().sort(function(a,b){
        var va = sortVal(a, sortField), vb = sortVal(b, sortField);
        var cmp;
        if(sortField==="ref") cmp = numericAwareCompare(va, vb);
        else cmp = (typeof va==="number" || typeof vb==="number") ? ((va||0)-(vb||0)) : String(va).localeCompare(String(vb), "ru");
        return sortDir==="desc" ? -cmp : cmp;
      });
    }
    return { list: list, hiddenClosedCount: hiddenClosedCount, sortField: sortField, sortDir: sortDir };
  }
  function exportTicketsExcel(){
    if(typeof XLSX==="undefined" || !XLSX.utils){ alert("Модуль Excel не загрузился (возможно, заблокирован интернет/VPN) — обновите страницу и попробуйте снова."); return; }
    var list = getFilteredTicketsList().list;
    var header = ["№ c-lector","Отель","Локация","Описание","Статус","Исполнитель","Срок","Особое внимание","Бригада","Материал","Работа","Акт","Категория","Системный брак"];
    var rows = list.map(function(t){
      var hotel = hotelById(t.hotel_id); var di = deadlineInfo(t);
      return [
        t.external_ref||"", hotel?("№"+hotel.id+" "+hotel.name):"", t.location||"", displayShort(t), ticketStatusLabel(t), t.assigned_to||"", di.label, t.attention_flag?("Да"+(t.attention_note?": "+t.attention_note:"")):"",
        STATUS_ICON_BY_KEY.crew && STATUS_ICON_BY_KEY.crew.lit(t) ? "Да" : "Нет",
        STATUS_ICON_BY_KEY.materials && STATUS_ICON_BY_KEY.materials.lit(t) ? "Да" : "Нет",
        STATUS_ICON_BY_KEY.work && STATUS_ICON_BY_KEY.work.lit(t) ? "Да" : "Нет",
        STATUS_ICON_BY_KEY.act && STATUS_ICON_BY_KEY.act.lit(t) ? "Да" : "Нет",
        t.case_type ? CASE_LABEL[t.case_type] : "",
        t.system_defect_name || ""
      ];
    });
    var ws = XLSX.utils.aoa_to_sheet([header].concat(rows));
    ws["!cols"] = header.map(function(){ return {wch:22}; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Заявки");
    XLSX.writeFile(wb, "Заявки_Keruen_Inn_"+new Date().toISOString().slice(0,10)+".xlsx");
  }
  function viewTickets(){
    var f = state.filters || {statusList:[], zone:"", hotel:"", q:"", showClosed:false, attentionOnly:false};
    if(!f.statusList) f.statusList = [];
    if(!f.caseTypeList) f.caseTypeList = [];
    // Список статусов для фильтра строим из реальных значений, которые сейчас есть
    // в заявках (текст из c-lector произвольный, единого перечня нет) — а не из
    // фиксированного внутреннего набора new/dispatched/onsite/closed/rejected.
    var statusSeen = {}; state.tickets.forEach(function(t){ statusSeen[ticketStatusLabel(t)] = true; });
    var statusOptions = Object.keys(statusSeen).sort();
    var computed = getFilteredTicketsList();
    var list = computed.list, hiddenClosedCount = computed.hiddenClosedCount, sortField = computed.sortField, sortDir = computed.sortDir;
    function sortableTh(label, field){
      var active = sortField===field;
      return h`<th data-action="sort-tickets" data-field="${field}" style="cursor:pointer;user-select:none;" title="Сортировать">${label}${active?(sortDir==="asc"?" ▲":" ▼"):""}</th>`;
    }
    // Заголовок "№ c-lector" — не просто сортируемый лейбл, а ещё и место для
    // компактных чекбоксов-фильтров по 4 пунктам чек-листа. Специально не
    // переиспользую sortableTh() для этой колонки — тут нужна дополнительная
    // строка внутри <th>, которой у остальных колонок нет.
    function refTh(){
      var active = sortField==="ref";
      return h`<th data-action="sort-tickets" data-field="ref" style="cursor:pointer;user-select:none;" title="Сортировать">
        <span>№ c-lector${active?(sortDir==="asc"?" ▲":" ▼"):""}</span>
        <div class="tag-filter-row">${TAG_FILTER_DEFS.map(function(def){
          // "Материал" — единственный пункт с тремя реальными состояниями
          // (нейтральный/жёлтый счёт не оплачен/зелёный оплачен, см.
          // materialsState()), поэтому его фильтр-чип не обычный чекбокс
          // (вкл/выкл), а трёхпозиционный переключатель по клику: выключен →
          // жёлтый → зелёный → снова выключен. Остальные три пункта (бригада/
          // работа/акт) — простое да/нет, чекбокс им подходит как и раньше.
          if(def.key==="materials"){
            var mVal = f.tagFilters && f.tagFilters.materials;
            var mCls = mVal==="warn" ? " warn-lit active" : (mVal==="ok" ? " lit active" : "");
            var mTitle = mVal==="warn" ? "Показаны заявки: счёт на материал есть, но не оплачен (клик — переключить на «оплачен»)"

            return h`<span class="tag-filter-chip${mCls}" title="${escapeHtml(mTitle)}" data-cycle-material-filter="1">${MS_ICON[def.key]}</span>`;

  // Раздел "Системный брак" — заявки, помеченные как системный брак (см.
