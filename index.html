<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диспетчерская Keruen Inn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E4EAEE; --surface-3:#DAE2E7;
    --line:#D3DBE1; --ink:#16232E; --ink-soft:#54636F; --ink-faint:#8B99A4;
    --accent:#0E7C90; --accent-ink:#FFFFFF; --accent-soft:#DCEFF2; --accent-line:#B9DEE4;
    --ok:#1E8E5A; --ok-soft:#E1F3E8; --warn:#A8710F; --warn-soft:#FBEED9; --crit:#C2410C; --crit-soft:#FBE1D2;
    --shadow:0 1px 2px rgba(22,35,46,.07),0 6px 18px rgba(22,35,46,.08);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1620; --surface:#16212B; --surface-2:#1C2833; --surface-3:#23313D;
      --line:#2B3A46; --ink:#E7EDF1; --ink-soft:#A9B8C2; --ink-faint:#70828D;
      --accent:#3FB5C9; --accent-ink:#062229; --accent-soft:#163239; --accent-line:#255560;
      --ok:#4FC08C; --ok-soft:#123524; --warn:#DDAA55; --warn-soft:#3A2C14; --crit:#E17A4C; --crit-soft:#3C2216;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.38);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }
  button, select, input, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  a{ color:var(--accent); }
  #app{ display:flex; min-height:100vh; max-width:1440px; margin:0 auto; background:var(--surface); box-shadow:0 0 0 1px var(--line), 0 24px 60px rgba(22,35,46,.14); }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:216px; flex:0 0 216px; background:var(--surface-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 0; position:sticky; top:0; height:100vh;
  }
  .brand{ padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:.2px; }
  .brand-sub{ color:var(--ink-faint); font-size:11.5px; margin-top:3px; text-transform:uppercase; letter-spacing:.06em; }
  .nav{ display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
    color:var(--ink-soft); text-decoration:none; border-left:3px solid transparent; font-weight:500;
  }
  .nav-item:hover{ background:var(--surface-3); color:var(--ink); }
  .nav-item.active{ background:var(--surface); color:var(--ink); border-left-color:var(--accent); box-shadow:var(--shadow); }
  .nav-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto; }
  .nav-footer{ margin-top:auto; padding:14px 20px 0; border-top:1px solid var(--line); }
  .nav-footer p{ margin:10px 0 0; font-size:11.5px; color:var(--ink-faint); line-height:1.5; }

  /* ---------- main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
    padding:14px 28px; display:flex; align-items:center; gap:16px;
  }
  .topbar h1{ font-size:18px; margin:0; font-weight:700; flex:1; min-width:0; }
  .whoami{ display:flex; align-items:center; gap:6px; }
  .whoami-chip{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    padding:6px 10px 6px 6px; border-radius:20px; cursor:pointer;
  }
  .avatar{
    width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:0 0 auto;
  }
  .content{ padding:24px 28px 60px; max-width:1180px; width:100%; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ color:var(--crit); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- cards / kpi ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:18px 20px; }
  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; margin:0 0 12px; }
  .grid-kpi{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi{ padding:16px 18px; }
  .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .kpi-value{ font-size:30px; font-weight:600; margin-top:6px; }
  .kpi-value.crit{ color:var(--crit); } .kpi-value.ok{ color:var(--ok); } .kpi-value.accent{ color:var(--accent); }
  .kpi-sub{ font-size:12px; color:var(--ink-faint); margin-top:3px; }

  .row-gap{ display:flex; flex-direction:column; gap:18px; }
  .two-col{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; align-items:start; }
  @media (max-width:880px){ .two-col{ grid-template-columns:1fr; } }

  /* ---------- badges / pills ---------- */
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill-neutral{ background:var(--surface-3); color:var(--ink-soft); }
  .pill-accent{ background:var(--accent-soft); color:var(--accent); }
  .pill-ok{ background:var(--ok-soft); color:var(--ok); }
  .pill-warn{ background:var(--warn-soft); color:var(--warn); }
  .pill-crit{ background:var(--crit-soft); color:var(--crit); }
  .zone-badge{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; border:1px solid var(--line); font-size:11px; font-weight:600; color:var(--ink-soft); }
  .demo-tag{ background:var(--warn-soft); color:var(--warn); font-size:10px; padding:1px 6px; border-radius:5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .source-tag{ background:var(--accent-soft); color:var(--accent); font-size:10px; padding:1px 6px; border-radius:5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .map-table td, .map-table th{ vertical-align:middle; }
  .import-summary{ display:flex; gap:18px; flex-wrap:wrap; margin:14px 0; }
  .import-summary .stat{ font-size:13px; } .import-summary .stat b{ font-size:18px; display:block; font-family:"IBM Plex Mono",monospace; }
  .dropzone{ border:1px dashed var(--line); border-radius:9px; padding:16px; text-align:center; color:var(--ink-faint); font-size:12.5px; }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--surface-2); }
  td.num, th.num{ text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .ttl{ font-weight:600; }
  .muted{ color:var(--ink-faint); }
  .empty-state{ padding:40px 20px; text-align:center; color:var(--ink-faint); }
  .empty-state b{ color:var(--ink-soft); display:block; margin-bottom:4px; font-size:14px; }

  /* ---------- forms ---------- */
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=email], input[type=number], input[type=date], select, textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .chip-toggle{ display:inline-flex; gap:6px; flex-wrap:wrap; }
  .chip-toggle label{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:4px 10px 4px 6px; font-size:12px; font-weight:500; color:var(--ink-soft); cursor:pointer; margin:0; }
  .chip-toggle input{ width:auto; }

  /* ---------- filters ---------- */
  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .filters select, .filters input[type=text]{ width:auto; min-width:140px; }

  /* ---------- panel (slide-over) ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(10,16,22,.35); z-index:20; }
  .panel{
    position:fixed; top:0; right:0; height:100vh; width:460px; max-width:94vw; background:var(--surface);
    box-shadow:-8px 0 30px rgba(0,0,0,.18); z-index:21; overflow-y:auto; border-left:1px solid var(--line);
  }
  .panel-head{ padding:18px 20px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:10px; position:sticky; top:0; background:var(--surface); z-index:2;}
  .panel-body{ padding:20px; display:flex; flex-direction:column; gap:18px; }
  .panel-close{ margin-left:auto; }
  .kv{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--ink-faint); }
  .kv .v{ font-weight:600; text-align:right; }
  .deadline-box{ padding:12px 14px; border-radius:9px; border:1px solid var(--line); }
  .deadline-box.overdue{ border-color:var(--crit); background:var(--crit-soft); }
  .deadline-box.soon{ border-color:var(--warn); background:var(--warn-soft); }
  .note{ padding:9px 10px; background:var(--surface-2); border-radius:8px; font-size:12.5px; margin-bottom:7px; }
  .note .meta{ color:var(--ink-faint); font-size:11px; margin-bottom:3px; }
  .actions-row{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- modal ---------- */
  .modal-scrim{ position:fixed; inset:0; background:rgba(10,16,22,.4); z-index:30; display:flex; align-items:flex-start; justify-content:center; padding:6vh 20px; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:12px; width:640px; max-width:100%; box-shadow:var(--shadow); }
  .modal-head{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .modal-head h2{ font-size:16px; margin:0; flex:1; }
  .modal-body{ padding:18px 20px; max-height:70vh; overflow-y:auto; }
  .modal-foot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }

  /* ---------- workorder (print) ---------- */
  .wo-page{ max-width:760px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:40px 44px; box-shadow:var(--shadow); }
  .wo-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .wo-co{ font-weight:700; font-size:14px; }
  .wo-addr{ color:var(--ink-faint); font-size:12px; margin-top:2px; }
  .wo-title{ font-size:22px; font-weight:700; margin:18px 0 2px; }
  .wo-no{ color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:13px; }
  .wo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 26px; margin:22px 0; }
  .wo-field .k{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  .wo-field .v{ font-size:14.5px; margin-top:3px; }
  .wo-desc{ background:var(--surface-2); border-radius:9px; padding:14px 16px; margin:8px 0 20px; font-size:13.5px; }
  .wo-sign{ display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-top:44px; }
  .sign-line{ border-top:1px solid var(--ink-faint); padding-top:6px; font-size:11.5px; color:var(--ink-faint); }
  .wo-toolbar{ max-width:760px; margin:0 auto 16px; display:flex; gap:8px; justify-content:flex-end; }
  @media print{
    .sidebar, .topbar, .wo-toolbar, .no-print{ display:none !important; }
    body, .content{ background:#fff; padding:0; margin:0; }
    .wo-page{ box-shadow:none; border:none; max-width:none; }
  }

  .banner{ display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:9px; background:var(--warn-soft); color:var(--warn); font-size:13px; margin-bottom:18px; font-weight:500; }
  .banner .btn{ margin-left:auto; }
  .helptext{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .zone-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); }
  .zone-legend span b{ color:var(--ink); }
  ::selection{ background:var(--accent-soft); }

  /* ---------- auth screen ---------- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:380px; max-width:100%; padding:34px 30px; }
  .auth-logo{ font-weight:700; font-size:19px; margin-bottom:2px; }
  .auth-sub{ color:var(--ink-faint); font-size:12.5px; margin-bottom:26px; }
  .auth-err{ background:var(--crit-soft); color:var(--crit); border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; }
  .auth-ok{ background:var(--ok-soft); color:var(--ok); border-radius:8px; padding:12px 14px; font-size:13px; }
  .configwarn{ max-width:560px; margin:60px auto; padding:24px 26px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>

<script>
(function(){
  "use strict";

  /* ============================== SUPABASE CONFIG ==============================
     Заполните значениями вашего проекта: Project Settings -> API
     (Project URL и anon public key — не секретный service_role!). */
  var SUPABASE_URL = "https://wpgbkndpojjjimppxogm.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_WOzfGGAkM1SJiFKnhkBc2w_Nia1I0za";
  /* ============================================================================ */

  var CONFIGURED = SUPABASE_URL.indexOf("YOUR-PROJECT") === -1 && SUPABASE_ANON_KEY.indexOf("YOUR-ANON") === -1;
  var LIB_LOADED = typeof window.supabase !== "undefined" && !!window.supabase.createClient;
  var sb = (CONFIGURED && LIB_LOADED) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  /* ============================== CONFIG ============================== */
  var HOTELS = [
    {id:1, name:"Мерке",        zone:3, inService:true},
    {id:2, name:"Аральск",      zone:3, inService:true},
    {id:3, name:"Семей",        zone:2, inService:true},
    {id:4, name:"Атырау",       zone:2, inService:true},
    {id:5, name:"Актау",        zone:2, inService:true},
    {id:6, name:"Каркаралинск", zone:1, inService:true},
    {id:7, name:"Караганда",    zone:1, inService:true},
    {id:8, name:"Кызылорда",    zone:null, inService:false}
  ];
  var ZONE_HOURS = {1:24, 2:48, 3:72};
  var ZONE_LABEL = {1:"Зона 1 · авто", 2:"Зона 2 · авиа", 3:"Зона 3 · смешанная"};
  var GROUP_LABEL = {1:"Группа 1 · критическая", 2:"Группа 2 · средняя", 3:"Группа 3 · плановая"};
  var STATUS_LABEL = { new:"Новая", dispatched:"Диспетчеризована", onsite:"На объекте / устранение", closed:"Закрыта", rejected:"Отклонена" };
  var STATUS_PILL = { new:"pill-neutral", dispatched:"pill-accent", onsite:"pill-warn", closed:"pill-ok", rejected:"pill-neutral" };
  var CASE_LABEL = { warranty:"Гарантийный", nonwarranty:"Негарантийный", unfounded:"Необоснованная" };
  var ROLE_LABEL = {dispatcher:"Диспетчер", specialist:"Главный инженер", head:"Руководитель", warehouse:"Склад ЗИП", finance:"Финансист"};
  var CURRENCIES = ["KZT","RUB","USD","EUR","BYN"];

  function hotelById(id){ for (var i=0;i<HOTELS.length;i++){ if (HOTELS[i].id===Number(id)) return HOTELS[i]; } return null; }
  function fmtDate(iso){ if(!iso) return "—"; var d=new Date(iso); return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
  function fmtDateShort(iso){ if(!iso) return "—"; var d=new Date(iso); return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"}); }
  function addHours(iso, h){ var d=new Date(iso); d.setHours(d.getHours()+h); return d.toISOString(); }
  function addBusinessDays(iso, n){
    var d = new Date(iso); var added=0;
    while(added<n){ d.setDate(d.getDate()+1); var wd=d.getDay(); if(wd!==0 && wd!==6){ added++; } }
    return d.toISOString();
  }
  function pluralRu(n, one, few, many){ n = Math.abs(n)%100; var n1=n%10; if(n>10&&n<20) return many; if(n1>1&&n1<5) return few; if(n1===1) return one; return many; }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function workOrderNo(t){ var d=new Date(t.created_at||Date.now()); var ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); return "НЗ-"+ds+"-"+(t.id||"").replace(/-/g,"").slice(-4).toUpperCase(); }

  /* ============================== ИМПОРТ ИЗ C-LECTOR ==============================
     У c-lector.ru нет публичного API — импорт делается из данных, которые сам
     пользователь скопировал (вставка таблицы) или выгрузил (CSV/XLSX) из c-lector. */
  function normalizeForMatch(s){ return String(s||"").toLowerCase().replace(/[«»"'.,№#]/g,"").replace(/\s+/g," ").trim(); }
  function matchHotelByName(name){
    var n = normalizeForMatch(name);
    if(!n) return null;
    var byNum = n.match(/(?:^|\D)(\d{1,2})(?:\D|$)/); // "№4 Атырау" / "отель 4"
    if(byNum){ var h1 = hotelById(Number(byNum[1])); if(h1 && n.indexOf(normalizeForMatch(h1.name))>-1) return h1; }
    for(var i=0;i<HOTELS.length;i++){ var hn = normalizeForMatch(HOTELS[i].name); if(hn && (n.indexOf(hn)>-1 || hn.indexOf(n)>-1)) return HOTELS[i]; }
    return null;
  }
  function parseDelimited(text){
    var lines = String(text||"").split(/\r\n|\r|\n/).filter(function(l){ return l.trim()!==""; });
    if(!lines.length) return {headers:[], rows:[]};
    var delim = lines[0].indexOf("\t")>-1 ? "\t" : (lines[0].indexOf(";")>-1 && lines[0].indexOf(",")===-1 ? ";" : ",");
    function splitLine(l){ return l.split(delim).map(function(c){ return c.replace(/^"|"$/g,"").trim(); }); }
    var headers = splitLine(lines[0]);
    var rows = lines.slice(1).map(splitLine);
    return {headers:headers, rows:rows};
  }
  function guessMapping(headers){
    var map = {};
    var used = {};
    // порядок важен: поля с более узким/точным смыслом определяются раньше,
    // чтобы, например, столбец "Номер заявки" не перехватывался описанием
    // из-за общей подстроки "заявк" — уже занятые столбцы пропускаются.
    var patterns = {
      external_ref: /№|номер|id|ref/i,
      hotel: /отел|объект|гостиниц|hotel/i,
      description: /описан|замечан|проблем|суть|заявк/i,
      group: /групп|критич|приоритет/i,
      created_at: /дата|созда|подач|created/i
    };
    Object.keys(patterns).forEach(function(field){
      for(var i=0;i<headers.length;i++){
        if(used[i]) continue;
        if(patterns[field].test(headers[i])){ map[field]=String(i); used[i]=true; return; }
      }
      map[field] = "";
    });
    return map;
  }
  function setImportData(headers, rows){
    state.importFileError = "";
    state.importHeaders = headers; state.importRows = rows;
    state.importMapping = guessMapping(headers);
    state.importResult = null;
    render();
  }
  function readFileAsText(file){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsText(file, "utf-8"); }); }
  function readFileAsBuffer(file){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsArrayBuffer(file); }); }
  function loadImportFile(file){
    var ext = (file.name.split(".").pop()||"").toLowerCase();
    state.importFileError = "";
    if(ext==="xlsx" || ext==="xls"){
      if(typeof XLSX==="undefined" || !XLSX.read){
        // Библиотека для чтения Excel не загрузилась (например, заблокирована сетью/VPN) —
        // без этой проверки страница молча ничего не делала при выборе файла.
        state.importFileError = "Не удалось загрузить модуль для чтения Excel-файлов (возможно, заблокирован интернет/VPN). Обновите страницу и попробуйте снова, либо скопируйте таблицу из c-lector и вставьте её текстом выше.";
        render();
        return;
      }
      readFileAsBuffer(file).then(function(buf){
        var wb = XLSX.read(buf, {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:""});
        aoa = aoa.filter(function(r){ return r.some(function(c){ return String(c||"").trim()!==""; }); });
        if(!aoa.length){ state.importFileError = "Файл прочитан, но в нём не найдено ни одной строки с данными."; render(); return; }
        setImportData(aoa[0].map(String), aoa.slice(1));
      }).catch(function(err){
        state.importFileError = "Не удалось прочитать файл: " + (err && err.message ? err.message : err) + ". Проверьте, что это корректный XLSX/XLS-файл, либо вставьте таблицу текстом выше.";
        render();
      });
    } else {
      readFileAsText(file).then(function(text){
        var parsed = parseDelimited(text);
        if(!parsed.headers.length){ state.importFileError = "Файл прочитан, но в нём не найдено ни одной строки с данными."; render(); return; }
        setImportData(parsed.headers, parsed.rows);
      }).catch(function(err){
        state.importFileError = "Не удалось прочитать файл: " + (err && err.message ? err.message : err) + ".";
        render();
      });
    }
  }
  function computeImportPreview(){
    var m = state.importMapping;
    var hasExt = m.external_ref!=="" && m.external_ref!=null;
    var existingRefs = {}; state.tickets.forEach(function(t){ if(t.external_ref) existingRefs[t.external_ref]=true; });
    var out = state.importRows.map(function(row){
      var get = function(field){ var idx = m[field]; return (idx!=="" && idx!=null) ? (row[Number(idx)]||"").trim() : ""; };
      var extRef = get("external_ref"), hotelName = get("hotel"), desc = get("description"), groupRaw = get("group"), dateRaw = get("created_at");
      var hotel = matchHotelByName(hotelName);
      var isDupe = hasExt && extRef && existingRefs[extRef];
      var status = !desc ? "empty" : (!hotel ? "no-hotel" : (isDupe ? "dupe" : "new"));
      return { extRef:extRef, hotelName:hotelName, hotel:hotel, description:desc, groupRaw:groupRaw, dateRaw:dateRaw, status:status };
    });
    var counts = {total:out.length, "new":0, dupe:0, "no-hotel":0, empty:0};
    out.forEach(function(r){ counts[r.status]++; });
    return {rows:out, counts:counts};
  }
  function commitImport(){
    var preview = computeImportPreview();
    var toInsert = preview.rows.filter(function(r){ return r.status==="new"; });
    if(!toInsert.length){ state.importResult = {inserted:0, failed:0, counts:preview.counts}; render(); return; }
    state.importBusy = true; state.importFileError = ""; render();
    var now = new Date().toISOString();
    var payloads = toInsert.map(function(r){
      var g = Number(r.groupRaw); if([1,2,3].indexOf(g)===-1) g = 2;
      var createdAt = r.dateRaw && !isNaN(new Date(r.dateRaw).getTime()) ? new Date(r.dateRaw).toISOString() : now;
      return {
        hotel_id: r.hotel.id, zone: r.hotel.zone, ticket_group: g,
        description: r.description, status:"new", created_by: myLabel()+" (импорт c-lector)", created_at: createdAt,
        arrival_deadline: r.hotel.zone ? addHours(createdAt, ZONE_HOURS[r.hotel.zone]) : null,
        external_ref: r.extRef || null, source:"c-lector", demo:false
      };
    });
    // вставляем пачками (а не по одной запросу на строку одновременно) — при сотнях
    // строк одновременный залп из стольких же отдельных запросов мог зависать без
    // единой ошибки на экране; теперь идём по очереди небольшими партиями и всегда
    // доходим до финального экрана, даже если часть партий не прошла.
    var CHUNK = 100;
    var chunks = [];
    for(var i=0;i<payloads.length;i+=CHUNK){ chunks.push(payloads.slice(i,i+CHUNK)); }
    var insertedCount = 0, failedCount = 0, lastError = "";
    function finish(){
      state.importBusy = false;
      state.importResult = { inserted: insertedCount, failed: failedCount, lastError: lastError, counts: preview.counts };
      state.importHeaders = []; state.importRows = []; state.importMapping = {};
      render();
    }
    function next(idx){
      if(idx>=chunks.length){ finish(); return; }
      sb.from("tickets").insert(chunks[idx]).then(function(res){
        if(res && res.error){ failedCount += chunks[idx].length; lastError = res.error.message || String(res.error); }
        else { insertedCount += chunks[idx].length; }
        next(idx+1);
      }).catch(function(err){
        failedCount += chunks[idx].length; lastError = err && err.message ? err.message : String(err);
        next(idx+1);
      });
    }
    next(0);
  }

  /* ============================== DEADLINES ============================== */
  function deadlineInfo(t){
    var now = Date.now();
    if(t.status==="closed" || t.status==="rejected") return {label:"—", overdue:false, done:true};
    if(t.status==="new" || t.status==="dispatched"){
      var ms = new Date(t.arrival_deadline).getTime()-now;
      return {label:"Прибытие к "+fmtDate(t.arrival_deadline), overdue: ms<0, soon: ms>0 && ms<4*3600*1000, ms:ms, kind:"arrival"};
    }
    if(t.status==="onsite"){
      var ms2 = new Date(t.resolution_deadline).getTime()-now;
      return {label:"Устранение к "+fmtDate(t.resolution_deadline), overdue: ms2<0, soon: ms2>0 && ms2<24*3600*1000, ms:ms2, kind:"resolution"};
    }
    return {label:"—", overdue:false};
  }

    return h`
      <div class="row-gap">
        <div class="card card-pad">
          <div class="section-title">Итого по валютам</div>
          ${Object.keys(totals).length===0 ? h`<div class="muted" style="font-size:12.5px;">Реестр пуст.</div>` : h`

            return h`<div class="kv"><span class="k">${escapeHtml(c)}</span><span class="v mono">${totals[c].toLocaleString("ru-RU")}</span></div>`;
          }).join("")}</div>`}
        </div>
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr><th>Заявка</th><th>Отель</th><th>Поставщик</th><th class="num">Сумма</th><th>Валюта</th><th>Файл</th><th>Добавлен</th></tr></thead>

              list.map(function(iv){

  function viewImport(){

          <div class="import-summary">
            <div class="stat"><b>${state.importResult.inserted}</b>добавлено</div>
            ${state.importResult.failed ? h`<div class="stat"><b style="color:var(--warn);">${state.importResult.failed}</b>не удалось сохранить</div>` : ""}
            <div class="stat"><b>${c.dupe}</b>уже были (по номеру)</div>
            <div class="stat"><b>${c["no-hotel"]}</b>не распознан отель</div>
            <div class="stat"><b>${c.empty}</b>пустое описание</div>
          </div>
          ${state.importResult.failed ? h`<div class="banner" style="margin-top:12px;">Часть заявок (${state.importResult.failed}) не удалось сохранить в базу. Ошибка: ${escapeHtml(state.importResult.lastError||"—")}</div>` : ""}

            <div class="field"><textarea id="import-paste" rows="6" placeholder="Вставьте скопированную таблицу (Ctrl+V)…"></textarea></div>
            <button class="btn btn-primary" id="import-parse-btn">Разобрать вставленные данные</button>
            <div class="helptext" style="margin:12px 0 6px;">— или —</div>
            <div class="dropzone">
              <input type="file" id="import-file" accept=".csv,.txt,.xlsx,.xls" style="width:auto;">
              <div style="margin-top:6px;">CSV, TXT или XLSX-файл выгрузки из c-lector</div>
            </div>
            ${state.importFileError ? h`<div class="banner" style="margin-top:12px;">${state.importFileError}</div>` : ""}
          </div>
          <div class="card card-pad">
            <div class="section-title">Как это работает</div>
            <div class="kv"><span class="k">1</span><span class="v" style="text-align:left;">Вставляете или загружаете таблицу заявок</span></div>
            <div class="kv"><span class="k">2</span><span class="v" style="text-align:left;">Сопоставляете колонки c-lector с полями платформы</span></div>
            <div class="kv"><span class="k">3</span><span class="v" style="text-align:left;">Платформа сама находит отель по названию и пропускает уже импортированные заявки</span></div>
            <div class="helptext" style="margin-top:10px;">Повторный импорт того же файла не создаст дублей, если в c-lector есть номер заявки — используйте его как «внешний номер».</div>
          </div>
        </div>`;
    }
    var preview = computeImportPreview();
    var fieldLabel = {external_ref:"Внешний номер (для защиты от дублей)", hotel:"Отель", description:"Описание", group:"Группа критичности (1/2/3)", created_at:"Дата создания"};
    var fieldOrder = ["hotel","description","external_ref","group","created_at"];
    return h`
      <div class="row-gap">
        <div class="card card-pad">
          <div class="section-title">2. Сопоставьте колонки</div>
          <div class="field-row" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">
            ${fieldOrder.map(function(f){
              return h`<div class="field"><label>${fieldLabel[f]}</label>
                <select data-import-map="${f}">
                  <option value="">— не использовать —</option>
                  ${state.importHeaders.map(function(hdr,i){ return h`<option value="${i}" ${String(state.importMapping[f])===String(i)?'selected':''}>${escapeHtml(hdr)}</option>`; }).join("")}
                </select></div>`;
            }).join("")}
          </div>
          <div class="import-summary">
            <div class="stat"><b>${preview.counts.total}</b>строк найдено</div>
            <div class="stat"><b style="color:var(--ok);">${preview.counts["new"]}</b>будет импортировано</div>
            <div class="stat"><b style="color:var(--ink-faint);">${preview.counts.dupe}</b>уже были</div>
            <div class="stat"><b style="color:var(--crit);">${preview.counts["no-hotel"]}</b>отель не распознан</div>
            <div class="stat"><b style="color:var(--ink-faint);">${preview.counts.empty}</b>без описания</div>
          </div>
          <div class="actions-row">
            <button class="btn btn-primary" data-action="import-commit" ${preview.counts["new"]===0||state.importBusy?'disabled':''}>${state.importBusy?'Импортирую…':'Импортировать '+preview.counts["new"]+' '+pluralRu(preview.counts["new"],'заявку','заявки','заявок')}</button>
            <button class="btn" data-action="import-reset">Отмена</button>
          </div>
        </div>
        <div class="card"><div class="table-wrap"><table class="map-table">
          <thead><tr><th>Отель</th><th>Описание</th><th>Внешний №</th><th>Статус</th></tr></thead>

            return h`<tr>
              <td>${r.hotel? ('№'+r.hotel.id+' '+escapeHtml(r.hotel.name)) : h`<span class="muted">${escapeHtml(r.hotelName)||'—'}</span>`}</td>

              <td class="mono muted">${escapeHtml(r.extRef||"—")}</td>
              <td>${statusPillMap[r.status]}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>${preview.rows.length>25 ? h`<div class="helptext" style="padding:10px 16px;">Показаны первые 25 из ${preview.rows.length} строк.</div>`:''}</div>
      </div>`;
  }

  function renderTicketPanel(){
    var root = document.getElementById("overlay-root");
    if(!state.selectedTicketId){ root.innerHTML=""; if(notesChannel){ sb.removeChannel(notesChannel); notesChannel=null; } return; }
    var t = state.tickets.find(function(x){return x.id===state.selectedTicketId;});
    if(!t){ root.innerHTML=""; return; }
    var hotel = hotelById(t.hotel_id); var di = deadlineInfo(t);
    var specialists = state.profiles.filter(function(m){ return m.role==="specialist" && m.active!==false; });

    root.innerHTML = h`
      <div class="scrim" data-close-panel></div>
      <div class="panel">
        <div class="panel-head">
          <div>
            ${t.external_ref ? h`<div class="mono" style="font-weight:700;font-size:18px;color:var(--accent);">№ ${escapeHtml(t.external_ref)}</div>` : ""}
            <div style="font-weight:700;font-size:16px;${t.external_ref?'margin-top:2px;':''}">№${hotel.id} ${hotel.name} ${t.demo?'<span class="demo-tag">пример</span>':''} ${t.source==='c-lector'?'<span class="source-tag">c-lector</span>':''}</div>
            <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">${zoneBadge(t.zone)} ${groupPill(t.ticket_group)} ${statusPill(t.status)}</div>
          </div>
          <button class="btn btn-ghost panel-close" data-close-panel>✕</button>
        </div>
        <div class="panel-body">
          <div><div class="section-title">Описание</div><div style="font-size:13.5px;">${escapeHtml(t.description)}</div></div>
          ${!di.done ? h`<div class="deadline-box ${di.overdue?'overdue':(di.soon?'soon':'')}">
            <div style="font-weight:600;">${di.label}</div>
            <div class="helptext" style="margin-top:2px;">${di.kind==='arrival'?'Срок прибытия главного инженера по зоне логистики.':'Срок устранения — 3 рабочих дня с момента прибытия.'}</div>
            ${t.materials_wait ? h`<div class="helptext" style="margin-top:4px;">Ожидаются материалы (срок поставки: ${fmtDateShort(t.materials_eta)}).</div>` : ""}
          </div>` : ""}
          <div>
            <div class="section-title">Действия</div>
            <div class="actions-row">
              ${t.status==="new" ? h`
                <select id="assign-select" style="max-width:220px;"><option value="">Выбрать главного инженера…</option>${specialists.map(function(s){return h`<option value="${escapeHtml(s.name||s.email)}">${escapeHtml(s.name||s.email)}</option>`;}).join("")}</select>
                <button class="btn btn-primary btn-sm" data-action="assign" data-id="${t.id}">Назначить</button>` : ""}
              ${t.status==="dispatched" ? h`<button class="btn btn-primary btn-sm" data-action="arrived" data-id="${t.id}">Отметить прибытие</button>`:""}
              ${t.status==="onsite" ? h`<button class="btn btn-sm" data-action="materials" data-id="${t.id}">Нужны материалы…</button>
                <button class="btn btn-primary btn-sm" data-action="close" data-id="${t.id}" ${!t.case_type?'disabled':''}>Закрыть заявку</button>`:""}
              ${t.assigned_to ? h`<a class="btn btn-sm" href="#/workorder/${t.id}">Наряд-задание</a>` : ""}
              ${(t.status==="dispatched"||t.status==="onsite") ? h`<button class="btn btn-sm btn-danger" data-action="reject" data-id="${t.id}">Отклонить</button>`:""}
              ${(t.status==="closed"||t.status==="rejected") ? h`<button class="btn btn-sm" data-action="reopen" data-id="${t.id}">Переоткрыть</button>`:""}
            </div>
          </div>
          ${t.status==="onsite" ? h`<div>
            <div class="section-title">Категория (по осмотру)</div>
            <select id="case-select" data-id="${t.id}">
              <option value="">Не определена</option>
              <option value="warranty" ${t.case_type==='warranty'?'selected':''}>Гарантийный случай</option>
              <option value="nonwarranty" ${t.case_type==='nonwarranty'?'selected':''}>Негарантийный случай</option>
              <option value="unfounded" ${t.case_type==='unfounded'?'selected':''}>Необоснованная заявка</option>
            </select>
            <div class="helptext">Нужна для закрытия заявки — влияет на оплату по Регламенту (п.5.1–5.4).</div>
          </div>` : ""}
          <div>
            <div class="section-title">Карточка заявки</div>
            ${t.external_ref ? h`<div class="kv"><span class="k">Номер в c-lector</span><span class="v mono">${escapeHtml(t.external_ref)}</span></div>` : ""}
            <div class="kv"><span class="k">Зарегистрирована</span><span class="v">${fmtDate(t.created_at)} · ${escapeHtml(t.created_by||'—')}</span></div>
            <div class="kv"><span class="k">Главный инженер</span><span class="v">${t.assigned_to? escapeHtml(t.assigned_to):'—'}</span></div>
            <div class="kv"><span class="k">Прибыл</span><span class="v">${t.arrived_at? fmtDate(t.arrived_at):'—'}</span></div>
            <div class="kv"><span class="k">Категория</span><span class="v">${t.case_type? CASE_LABEL[t.case_type]:'—'}</span></div>
            <div class="kv"><span class="k">Наряд-задание</span><span class="v mono">${workOrderNo(t)}</span></div>
          </div>
          <div>
            <div class="section-title">Табель — часы на устранение</div>
            <div class="actions-row">
              <input type="number" id="repair-hours-input" data-id="${t.id}" min="0" step="0.5" placeholder="Кол-во часов" value="${t.repair_hours!=null?t.repair_hours:''}" style="max-width:160px;">
              <span class="helptext">Заполняет главный инженер по факту устранения.</span>
            </div>
          </div>
          <div>
            <div class="section-title">Счета</div>
            ${(state.invoices||[]).filter(function(iv){return iv.ticket_id===t.id;}).length===0 ? h`<div class="muted" style="font-size:12.5px;">Счетов пока нет.</div>` : h`
            <div class="row-gap" style="gap:8px;">${(state.invoices||[]).filter(function(iv){return iv.ticket_id===t.id;}).map(function(iv){
              return h`<div class="invoice-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px;">
                <button type="button" class="btn btn-sm" data-action="invoice-open" data-path="${escapeHtml(iv.file_path)}">${escapeHtml(iv.file_name)}</button>
                <span class="muted" style="font-size:12.5px;">${iv.supplier?escapeHtml(iv.supplier):'—'}${iv.amount!=null?(' · '+iv.amount+' '+(iv.currency||'')):''}</span>
                ${iv.in_registry ? h`<span class="pill pill-ok">В реестре</span>` : h`<button type="button" class="btn btn-sm" data-action="invoice-registry" data-id="${iv.id}">Добавить в реестр</button>`}
              </div>`;
            }).join("")}</div>`}
            <form id="invoice-form" data-id="${t.id}" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
              <input type="file" name="file" accept="application/pdf,image/*" required>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input type="text" name="supplier" placeholder="Поставщик" style="flex:1;min-width:120px;">
                <input type="number" name="amount" placeholder="Сумма" step="0.01" style="max-width:120px;">
                <select name="currency" style="max-width:100px;"><option value="">Валюта</option>${CURRENCIES.map(function(c){return h`<option value="${c}">${c}</option>`;}).join("")}</select>
              </div>
              <button class="btn btn-sm" type="submit" style="align-self:flex-start;">Прикрепить счёт</button>
            </form>
          </div>
          <div>
            <div class="section-title">Журнал</div>
            ${state.ticketNotes.slice().reverse().map(function(n){ return h`<div class="note"><div class="meta">${fmtDate(n.created_at)} · ${escapeHtml(n.author||'—')}</div>${escapeHtml(n.note_text)}</div>`; }).join("") || '<div class="muted" style="font-size:12.5px;">Записей пока нет.</div>'}
            <form id="note-form" data-id="${t.id}" style="margin-top:8px;display:flex;gap:8px;">
              <input type="text" name="text" placeholder="Добавить запись…" style="flex:1;">
              <button class="btn btn-sm" type="submit">+</button>
            </form>
          </div>
        </div>
      </div>`;
  }

  /* ============================== MODALS ============================== */
  function openModal(html){ document.getElementById("overlay-root").appendChild(el(h`<div class="modal-scrim" data-close-modal>${html}</div>`)); }
  function closeModal(){ var m=document.querySelector(".modal-scrim"); if(m) m.remove(); }

  function openNewTicketModal(){
    var options = HOTELS.filter(function(x){return x.inService;}).map(function(x){return h`<option value="${x.id}">№${x.id} ${x.name} (Зона ${x.zone})</option>`;}).join("");
    openModal(h`
      <div class="modal" data-stop>
        <div class="modal-head"><h2>Новая заявка</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="new-ticket-form">
          <div class="modal-body">
            <div class="field"><label>Отель</label><select name="hotelId">${options}</select></div>
            <div class="field"><label>Группа критичности</label>
              <select name="group"><option value="1">Группа 1 · критическая</option><option value="2" selected>Группа 2 · средняя</option><option value="3">Группа 3 · плановая</option></select>
            </div>
            <div class="field"><label>Описание (по данным c-lector.ru)</label><textarea name="description" required placeholder="Кратко опишите замечание из заявки"></textarea></div>
            <div class="helptext">Срок прибытия рассчитается автоматически по зоне логистики объекта.</div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close-modal>Отмена</button><button type="submit" class="btn btn-primary">Зарегистрировать</button></div>
        </form>
      </div>`);
    document.getElementById("new-ticket-form").addEventListener("submit", function(e){
      e.preventDefault(); var fd=new FormData(e.target);
      createTicket({hotelId:fd.get("hotelId"), group:fd.get("group"), description:fd.get("description")});
      closeModal();
    });
  }

  function openMeModal(){
    openModal(h`
      <div class="modal" data-stop style="width:420px;">
        <div class="modal-head"><h2>Профиль</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="me-form">
          <div class="modal-body">
            <div class="field"><label>Почта</label><input type="text" value="${escapeHtml(state.me.email)}" disabled></div>
            <div class="field"><label>Имя</label><input type="text" name="name" value="${escapeHtml(state.me.name||'')}" placeholder="Как к вам обращаться"></div>
            <div class="field"><label>Роль</label><input type="text" value="${roleLabel(state.me.role)}" disabled></div>
            <div class="helptext">Роль и зоны назначает руководитель службы в разделе «Команда».</div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-danger" id="me-signout">Выйти</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>

      </div>`);
    document.getElementById("me-form").addEventListener("submit", function(e){
      e.preventDefault(); saveMyName(new FormData(e.target).get("name")||""); closeModal();
    });
    document.getElementById("me-signout").addEventListener("click", function(){ closeModal(); signOut(); });
  }

  function openPortfolioModal(){
    var pf = state.portfolio || {by_hotel:{}, snapshot_date:new Date().toISOString().slice(0,10)};
    var fields = ["total","submitted","inWork","overdue","done","rejected"];
    var fieldLabels = {total:"Всего",submitted:"Подано",inWork:"В работе",overdue:"Просрочено",done:"Завершено",rejected:"Отклонено"};
    openModal(h`
      <div class="modal" data-stop style="width:760px;">
        <div class="modal-head"><h2>Снимок портфеля (c-lector.ru)</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="portfolio-form">
          <div class="modal-body">
            <div class="field" style="max-width:220px;"><label>Дата снимка</label><input type="date" name="snapshotDate" value="${pf.snapshot_date||''}"></div>
            <div class="table-wrap"><table><thead><tr><th>Отель</th>${fields.map(function(f){return '<th class="num">'+fieldLabels[f]+'</th>';}).join("")}</tr></thead>
              <tbody>${HOTELS.filter(function(x){return x.inService;}).map(function(x){
                var row = (pf.by_hotel && pf.by_hotel[x.id]) || {};
                return h`<tr><td>№${x.id} ${x.name}</td>${fields.map(function(f){return '<td class="num"><input type="number" name="h'+x.id+'_'+f+'" value="'+(row[f]||0)+'" style="width:64px;text-align:right;padding:4px 6px;"></td>';}).join("")}</tr>`;
              }).join("")}</tbody></table></div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close-modal>Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>
        </form>
      </div>`);
    document.getElementById("portfolio-form").addEventListener("submit", function(e){
      e.preventDefault(); var fd=new FormData(e.target); var byHotel={};
      HOTELS.filter(function(x){return x.inService;}).forEach(function(x){ byHotel[x.id]={}; fields.forEach(function(f){ byHotel[x.id][f]=Number(fd.get("h"+x.id+"_"+f))||0; }); });
      savePortfolio(byHotel, fd.get("snapshotDate")); closeModal();
    });
  }

  /* ============================== ROOT RENDER ============================== */
  function render(){
    if(!CONFIGURED){
      document.getElementById("app").innerHTML = h`<div class="card configwarn">
        <h2 style="margin-top:0;">Настройка не завершена</h2>
        <p>Впишите <code>SUPABASE_URL</code> и <code>SUPABASE_ANON_KEY</code> в начале файла (значения — в вашем проекте Supabase: Project Settings → API) и разверните страницу снова.</p>
      </div>`;
      return;
    }
    if(!LIB_LOADED){
      document.getElementById("app").innerHTML = h`<div class="card configwarn">
        <h2 style="margin-top:0;">Не удалось загрузить Supabase</h2>
        <p>Библиотека <code>supabase-js</code> не загрузилась с CDN (cdn.jsdelivr.net) — проверьте подключение к интернету, отключите VPN/блокировщик, если он ограничивает доступ к CDN, и обновите страницу (F5).</p>
        <button class="btn btn-primary" onclick="location.reload()">Обновить страницу</button>
      </div>`;
      return;
    }
    if(!state.session){ renderAuthScreen(); return; }
    if(!state.me){ document.getElementById("app").innerHTML = h`<div class="auth-wrap"><div class="muted">Загрузка…</div></div>`; return; }

    var app = document.getElementById("app");
    if(state.route.view==="workorder"){
      state.selectedTicketId = null; document.getElementById("overlay-root").innerHTML = "";
      app.innerHTML = h`<div class="content" style="max-width:900px;">${viewWorkOrder(state.route.id)}</div>`;
      return;
    }
    var titleMap = {dashboard:"Дашборд", tickets:"Заявки", team:"Команда", parts:"Склад ЗИП", "import":"Импорт из c-lector", registry:"Реестр платежей"};
    var body = state.route.view==="tickets"?viewTickets(): state.route.view==="team"?viewTeam(): state.route.view==="parts"?viewParts(): state.route.view==="import"?viewImport(): state.route.view==="registry"?viewRegistry(): viewDashboard();

    app.innerHTML = h`
      <div class="sidebar">
        <div class="brand"><div class="brand-name">Диспетчерская</div><div class="brand-sub">Keruen Inn · Служба сервиса</div></div>
        <nav class="nav">${navItem("dashboard","Дашборд")}${navItem("tickets","Заявки")}${navItem("import","Импорт из c-lector")}${navItem("team","Команда")}${navItem("parts","Склад ЗИП")}${navItem("registry","Реестр платежей")}</nav>
        <div class="nav-footer">
          <div class="zone-legend"><span><b>З1</b> 24ч</span><span><b>З2</b> 48ч</span><span><b>З3</b> 72ч</span></div>
          <p>Заявки поступают через c-lector.ru — здесь только внутренняя диспетчеризация и наряд-задания.</p>
        </div>
      </div>
      <div class="main">
        <div class="topbar">
          <h1>${titleMap[state.route.view]||"Дашборд"}</h1>
          <button class="btn btn-primary" data-action="new-ticket">+ Новая заявка</button>
          <div class="whoami"><div class="whoami-chip" data-action="me">
            <span class="avatar">${(state.me.name||state.me.email||"?").trim().charAt(0).toUpperCase()}</span>
            <span>${escapeHtml(state.me.name||state.me.email)}</span>
          </div></div>
        </div>
        <div class="content">${body}</div>
      </div>`;
    renderTicketPanel();
    if(state.selectedTicketId) loadNotesFor(state.selectedTicketId);

  /* ============================== EVENTS ============================== */
  document.addEventListener("click", function(e){
    var t = e.target;
    if(t.closest(".nav-item")) return;
    var openTicket = t.closest("[data-open-ticket]");
    if(openTicket){ state.selectedTicketId = openTicket.getAttribute("data-open-ticket"); renderTicketPanel(); loadNotesFor(state.selectedTicketId); return; }
    if(t.closest("[data-close-panel]")){ state.selectedTicketId = null; renderTicketPanel(); return; }
    if(t.matches(".modal-scrim") && t.hasAttribute("data-close-modal")){ closeModal(); return; }
    if(t.hasAttribute("data-close-modal")){ closeModal(); return; }

    if(t.id==="import-parse-btn"){
      var ta = document.getElementById("import-paste"); var parsed = parseDelimited(ta?ta.value:"");
      if(parsed.headers.length) setImportData(parsed.headers, parsed.rows);
      else alert("Не удалось распознать таблицу — убедитесь, что скопирована таблица с заголовками.");
      return;
    }
    if(t.id==="copy-link"){
      navigator.clipboard && navigator.clipboard.writeText(window.location.origin+window.location.pathname).then(function(){ t.textContent="Скопировано"; setTimeout(function(){ t.textContent="Скопировать ссылку"; },1500); });
      return;
    }

    var actionEl = t.closest("[data-action]");
    if(actionEl){
      var action = actionEl.getAttribute("data-action"); var id = actionEl.getAttribute("data-id");
      if(action==="new-ticket") return openNewTicketModal();
      if(action==="me") return openMeModal();
      if(action==="edit-portfolio") return openPortfolioModal();
      if(action==="clear-demo"){ if(confirm("Удалить все примеры заявок?")) clearDemo(); return; }
      if(action==="import-commit") return commitImport();
      if(action==="import-reset") return resetImport();
      if(action==="assign"){
        var sel=document.getElementById("assign-select"); var name=sel&&sel.value;
        if(!name){ alert("Выберите главного инженера из списка (назначьте роль в разделе «Команда», если список пуст)."); return; }
        assignSpecialist(id,name); return;
      }
      if(action==="arrived") return markArrived(id);
      if(action==="materials"){ var d=prompt("Ожидаемая дата поставки материалов (ГГГГ-ММ-ДД):"); if(d) setMaterialsEta(id,d); return; }
      if(action==="close") return closeTicket(id);
      if(action==="reject"){ var reason=prompt("Причина отклонения (необязательно):")||""; return rejectTicket(id,reason); }
      if(action==="reopen") return reopenTicket(id);
      if(action==="invoice-open") return openInvoiceFile(actionEl.getAttribute("data-path"));
      if(action==="invoice-registry") return addInvoiceToRegistry(id);
      if(action==="wo-download"){
        var tk = state.tickets.find(function(x){return x.id===id;});
        var htmlDoc = "<!doctype html><html><head><meta charset='utf-8'><title>"+workOrderNo(tk)+"</title></head><body>"+document.getElementById("wo-content").outerHTML+"</body></html>";
        var blob = new Blob([htmlDoc], {type:"text/html"}); var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href=url; a.download=workOrderNo(tk)+".html"; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        return;
      }
      var pActive = actionEl.getAttribute("data-profile-active");
      if(pActive){ updateProfile(pActive, {active: actionEl.getAttribute("data-val")==="1"}); return; }
      var partRemove = actionEl.getAttribute("data-part-remove");
      if(partRemove){ if(confirm("Удалить позицию склада?")) removePart(partRemove); return; }
    }
  });

  document.addEventListener("change", function(e){
    if(e.target.matches("[data-filter]")){ state.filters=state.filters||{}; state.filters[e.target.getAttribute("data-filter")]=e.target.value; render(); }
    if(e.target.id==="import-file"){ var f=e.target.files&&e.target.files[0]; if(f) loadImportFile(f); return; }
    if(e.target.matches("[data-import-map]")){ state.importMapping[e.target.getAttribute("data-import-map")]=e.target.value; render(); return; }
    if(e.target.id==="case-select") setCaseType(e.target.getAttribute("data-id"), e.target.value);
    if(e.target.id==="repair-hours-input"){
      var rh = e.target.value===""?null:Number(e.target.value);
      sb.from("tickets").update({repair_hours: rh}).eq("id", e.target.getAttribute("data-id"));
    }
    if(e.target.matches("[data-part-qty]")) updatePartQty(e.target.getAttribute("data-part-qty"), e.target.value);
    if(e.target.matches("[data-profile-role]")) updateProfile(e.target.getAttribute("data-profile-role"), {role:e.target.value});
    if(e.target.matches("[data-profile-zone]")){
      var pid = e.target.getAttribute("data-profile-zone");
      var m = state.profiles.find(function(p){return p.id===pid;});
      var zones = (m&&m.zones)? m.zones.slice() : [];
      var z = Number(e.target.value);
      if(e.target.checked){ if(zones.indexOf(z)===-1) zones.push(z); } else { zones = zones.filter(function(x){return x!==z;}); }
      updateProfile(pid, {zones:zones});
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target.id==="note-form"){
      e.preventDefault(); var fd=new FormData(e.target); var text=(fd.get("text")||"").trim();
      if(text){ addNote(e.target.getAttribute("data-id"), text); e.target.reset(); }
    }
    if(e.target.id==="invoice-form"){
      e.preventDefault(); var ifd=new FormData(e.target);
      var file = ifd.get("file");
      if(!file || !file.name){ alert("Выберите файл счёта (PDF или фото)."); return; }
      var ticketId = e.target.getAttribute("data-id");
      uploadInvoice(ticketId, file, (ifd.get("supplier")||"").trim(), ifd.get("amount"), ifd.get("currency")).then(function(){ e.target.reset(); });
    }
    if(e.target.id==="part-form"){
      e.preventDefault(); var fd3=new FormData(e.target); if(!fd3.get("name")) return;
      addPart({name:fd3.get("name"), qty:fd3.get("qty"), unit:fd3.get("unit"), note:fd3.get("note")}); e.target.reset();
    }
  });

  setInterval(function(){ if(!document.querySelector(".modal-scrim")) render(); }, 60000);

  render();
  initAuth();
})();
</script>
</body>
</html>
