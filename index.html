    // hotelEditingKey): при удалении morphdom'ом узла, из которого не снят
    // фокус (например поле поиска/фильтра при переходе между разделами),
    // браузер сам синтезирует "change" ПРЯМО ВНУТРИ вызова removeChild —
    // если обработать его как обычно, он вызовет render() повторно, пока
    // внешний render() ещё выполняется, и сломает обход дерева у morphdom
    // (NotFoundError: removeChild). Настоящее пользовательское изменение
    // никогда не может произойти, пока renderInProgress истинен — JS
    // однопоточный, так что это условие отсекает только такие побочные события.
    if(renderInProgress) return;
    if(e.target.matches("[data-filter]")){ state.filters=state.filters||{}; state.filters[e.target.getAttribute("data-filter")]=e.target.value; render(); }
    if(e.target.matches("[data-filter-checkbox]")){ state.filters=state.filters||{}; state.filters[e.target.getAttribute("data-filter-checkbox")]=e.target.checked; render(); return; }
    if(e.target.matches("[data-tag-filter]")){ state.filters=state.filters||{}; state.filters.tagFilters=state.filters.tagFilters||{}; state.filters.tagFilters[e.target.getAttribute("data-tag-filter")]=e.target.checked; render(); return; }
    if(e.target.matches("[data-registry-filter]")){ state.registryFilters=state.registryFilters||{}; state.registryFilters[e.target.getAttribute("data-registry-filter")]=e.target.value; render(); return; }
    if(e.target.matches("[data-registry-filter-checkbox]")){ state.registryFilters=state.registryFilters||{}; state.registryFilters[e.target.getAttribute("data-registry-filter-checkbox")]=e.target.checked; render(); return; }
    if(e.target.matches("[data-hotel-field]")){ updateHotelField(e.target.getAttribute("data-id"), e.target.getAttribute("data-hotel-field"), e.target.value); return; }
    if(e.target.matches("[data-invoice-amount]")){ setInvoiceAmount(e.target.getAttribute("data-id"), e.target.value); return; }
    if(e.target.matches("[data-invoice-currency]")){ setInvoiceCurrency(e.target.getAttribute("data-id"), e.target.value); return; }
    if(e.target.matches("[data-invoice-vat]")){ setInvoiceVatIncluded(e.target.getAttribute("data-id"), e.target.value); return; }
    if(e.target.matches("[data-invoice-tax-basis]")){ setInvoiceTaxBasis(e.target.getAttribute("data-id"), e.target.value); return; }
    if(e.target.matches("[data-alloc-percent]")){ setInvoiceAllocPercent(e.target.getAttribute("data-id"), e.target.value); return; }
    if(e.target.matches("[data-alloc-amount]")){ setInvoiceAllocAmount(e.target.getAttribute("data-id"), e.target.value); return; }
    if(e.target.id==="import-file"){ var f=e.target.files&&e.target.files[0]; if(f) loadImportFile(f); return; }
    if(e.target.matches("[data-cash-receipt-upload]")){ var crf=e.target.files&&e.target.files[0]; if(crf) uploadCashReceipt(e.target.getAttribute("data-cash-receipt-upload"), crf); return; }
    if(e.target.matches("[data-import-map]")){ state.importMapping[e.target.getAttribute("data-import-map")]=e.target.value; render(); return; }
    if(e.target.matches("[data-cash-import-map]")){ state.cashImportMapping[e.target.getAttribute("data-cash-import-map")]=e.target.value; render(); return; }
    if(e.target.id==="report-period-days"){
      var reportDays = Number(e.target.value);
      state.reportPeriodDays = (reportDays>0) ? reportDays : 7;
      render();
      return;
    }
    if(e.target.id==="case-select") setCaseType(e.target.getAttribute("data-id"), e.target.value);
    if(e.target.id==="repair-hours-input"){
      var rh = e.target.value===""?null:Number(e.target.value);
      var rhId = e.target.getAttribute("data-id");
      saveTicketField(rhId, {repair_hours: rh}, "repair-hours-feedback").then(function(ok){
        if(!ok) return;
        if(rh!=null) maybeAutoComplete(rhId);
        addNote(rhId, rh!=null ? ("Указаны часы главного инженера на устранение: "+rh+".") : "Часы главного инженера на устранение сброшены.");
      });
    }
    if(e.target.id==="desc-short-input"){
      var dsId = e.target.getAttribute("data-id"), dsVal = e.target.value.trim()||null;
      saveTicketField(dsId, {description_short: dsVal}, "desc-short-feedback").then(function(ok){
        if(!ok) return;
        addNote(dsId, dsVal ? ("Изменена формулировка «Сути»: "+dsVal) : "Формулировка «Сути» очищена.");
      });
    }
    if(e.target.id==="system-defect-input"){
      var sdId = e.target.getAttribute("data-id"), sdVal = e.target.value.trim()||null;
      saveTicketField(sdId, {system_defect_name: sdVal}, "system-defect-feedback").then(function(ok){
        if(!ok) return;
        addNote(sdId, sdVal ? ("Отмечена как системный брак: "+sdVal) : "Пометка «системный брак» снята.");
      });
    }
    if(e.target.matches("[data-crew-rename]")) renameCrew(e.target.getAttribute("data-crew-rename"), e.target.value);
    if(e.target.matches("[data-part-qty]")) updatePartQty(e.target.getAttribute("data-part-qty"), e.target.value);
    if(e.target.matches("[data-profile-role]")){ if(!isOwner()) return; updateProfile(e.target.getAttribute("data-profile-role"), {role:e.target.value}); }
    if(e.target.matches("[data-profile-telegram-chatid]")){
      if(!isOwner()) return;
      var tgId = e.target.getAttribute("data-profile-telegram-chatid");
      var tgVal = e.target.value.trim()||null;
      var patch = {telegram_chat_id: tgVal};
      // без chat_id галочка "увед." всё равно ничего не отправит — снимаем
      // её сразу, чтобы состояние в базе не выглядело противоречиво.
      if(!tgVal){
        var mProf = state.profiles.find(function(x){return x.id===tgId;});
        if(mProf && mProf.telegram_notify_tickets) patch.telegram_notify_tickets = false;
      }
      updateProfile(tgId, patch);
      return;
    }
    if(e.target.matches("[data-profile-telegram-notify]")){ if(!isOwner()) return; updateProfile(e.target.getAttribute("data-profile-telegram-notify"), {telegram_notify_tickets: e.target.checked}); return; }
    // Кнопки "прикрепить" прямо в строке чек-листа "Ход работ" (milestoneAttachControl) —
    // в отличие от прежних форм с отдельной кнопкой "Отправить", загрузка начинается
    // сразу при выборе файла(ов), можно выбрать несколько штук за один раз.
    if(e.target.matches(".ms-quick-attach")){
      var qaFiles = Array.from(e.target.files||[]);
      if(!qaFiles.length) return;
      var qaId = e.target.getAttribute("data-id"), qaCategory = e.target.getAttribute("data-category");
      Promise.all(qaFiles.map(function(f){ return uploadInvoice(qaId, f, qaCategory); })).then(function(){ e.target.value=""; });
      return;
    }
    if(e.target.matches(".ms-quick-photo")){
      // Замечания (раздел "Фото") — сюда фото-доказательства выполненной
      // работы к Акту больше не попадают, см. .ms-quick-act-photo ниже, и ни
      // одно из двух не влияет на автопереход "Работа" (см. STATUS_ICON_DEFS/
      // maybeAutoComplete выше — этот пункт теперь всегда только ручной).
      var qpFiles = Array.from(e.target.files||[]);
      if(!qpFiles.length) return;
      var qpId = e.target.getAttribute("data-id");
      Promise.all(qpFiles.map(function(f){ return uploadPhoto(qpId, f); })).then(function(){ e.target.value=""; });
      return;
    }
    if(e.target.matches(".ms-quick-act-photo")){
      var qapFiles = Array.from(e.target.files||[]);
      if(!qapFiles.length) return;
      var qapId = e.target.getAttribute("data-id");
      Promise.all(qapFiles.map(function(f){ return uploadPhoto(qapId, f, "act"); })).then(function(){ e.target.value=""; markActConfirmedByPhoto(qapId); });
      return;
    }
    if(e.target.matches(".ms-quick-act")){
      var qactFile = e.target.files && e.target.files[0];
      if(!qactFile) return;
      var qactId = e.target.getAttribute("data-id");
      uploadActFile(qactId, qactFile).then(function(){ e.target.value=""; });
      return;
    }
    if(e.target.matches(".ms-quick-timesheet")){
      var qtsFile = e.target.files && e.target.files[0];
      if(!qtsFile) return;
      var qtsId = e.target.getAttribute("data-id");
      uploadTimesheetFile(qtsId, qtsFile).then(function(){ e.target.value=""; });
      return;
    }
  });

  // 0.2.16: поле "Сумма" в «Реестре платежей» сворачивается обратно в
  // обычный (нередактируемый) текст, как только из него уходит фокус — не
  // важно, изменилось ли значение (тогда это уже сделал "change" выше) или
  // нет (тогда это единственное место, где режим редактирования снимается).
  document.addEventListener("focusout", function(e){
    // См. комментарий у соседних focusout-обработчиков ниже (registryEditingFieldKey/
    // hotelEditingKey) — без этой проверки побочный focusout от собственной
    // пересборки DOM (morphdom удаляет/переносит узлы во время своего обхода)
    // может вызвать render() ПОВТОРНО, пока внешний render() ещё выполняется —
    // с morphdom это ломает его внутренний обход дерева (NotFoundError: removeChild).
    if(renderInProgress) return;
    if(e.target.matches(".registry-amount-input") && state.registryEditingAmountId){
      state.registryEditingAmountId = null;
      render();
    }
  });
  // 0.2.17: «Валюта»/«НДС»/«Налог» в «Реестре платежей» — уход фокуса без
  // изменения значения (setInvoiceCurrency/Vat/TaxBasis уже сворачивают поле
  // сами при реальном изменении, см. выше) тоже должен свернуть поле обратно.
  document.addEventListener("focusout", function(e){
    if(renderInProgress) return;
    if(!state.registryEditingFieldKey) return;
    if(!e.target.matches('[data-registry-edit-focus="'+state.registryEditingFieldKey+'"]')) return;
    state.registryEditingFieldKey = null;
    render();
  });

  // 0.2.17: то же самое для групп полей «Отелей» (Зона/Координаты/Лицо от
  // Заказчика) — но тут группа может состоять из НЕСКОЛЬКИХ полей ввода
  // (например lat+lng, или ФИО+должность+телефон), поэтому просто "потеря
  // фокуса элементом" недостаточна: перевод фокуса клавишей Tab с одного
  // поля группы на соседнее — это ещё не "ушли из группы". Проверяем
  // e.relatedTarget (куда фокус переходит) относительно общего
  // data-hotel-edit-group — сворачиваем обратно, только если фокус ушёл ЗА
  // пределы этой группы (или вовсе никуда, например клик по не-фокусируемому
  // месту страницы).
  document.addEventListener("focusout", function(e){
    // Побочный focusout от собственной пересборки DOM — не считается уходом
    // пользователя из поля (см. комментарий у render()/renderInProgress).
    if(renderInProgress) return;
    if(!state.hotelEditingKey) return;
    var group = e.target.closest && e.target.closest('[data-hotel-edit-group="'+state.hotelEditingKey+'"]');
    if(!group) return;
    var related = e.relatedTarget;
    if(related && group.contains(related)) return;
    state.hotelEditingKey = null;
    render();
  });
  // Группа «Отелей» может быть УЖЕ пустой (значит, изначально показана как
  // обычные поля ввода, без единого клика по display — см. hotelZoneCell/
  // hotelCoordsCell/hotelContactCell). Если пользователь начинает вписывать
  // значение прямо в такую пустую группу (первое поле заполнилось раньше
  // остальных — например, вписали ФИО, а должность/телефон ещё пустые),
  // ререндер после "change" по одному полю не должен схлопнуть всю группу,
  // пока не заполнены остальные — иначе оставшиеся поля исчезнут из-под
  // курсора. Поэтому как только фокус попадает в любое поле группы —
  // фиксируем это как "сейчас редактируется", не дожидаясь клика по display
  // (без render() здесь — просто запоминаем, чтобы следующий ререндер, если
  // он случится, не свернул группу раньше времени).
  document.addEventListener("focusin", function(e){
    var group = e.target.closest && e.target.closest("[data-hotel-edit-group]");
    if(group) state.hotelEditingKey = group.getAttribute("data-hotel-edit-group");
  });

  // 0.2.16: разряды в поле "Сумма" пробелом по мере ввода (без запятой в
  // качестве разделителя тысяч — запятая используется только для дробной
  // части, как в обычной русской записи "1 234,5"). Курсор стараемся не
  // "прыгать" — считаем, сколько значащих символов было до курсора, и
  // ставим курсор после того же по счёту символа в переформатированной
  // строке.
  document.addEventListener("input", function(e){
    if(!e.target.matches(".registry-amount-input, .registry-alloc-input")) return;
    var el = e.target;
    var caret = el.selectionStart==null ? el.value.length : el.selectionStart;
    var before = el.value.slice(0, caret);
    var significantBefore = (before.match(/[\d.,]/g)||[]).length;
    var formatted = formatAmountInputValue(el.value);
    el.value = formatted;
    var count = 0, pos = formatted.length;
    for(var i=0;i<formatted.length;i++){
      if(/[\d.,]/.test(formatted[i])) count++;
      if(count>=significantBefore){ pos = i+1; break; }
    }
    if(significantBefore===0) pos = 0;
    el.setSelectionRange(pos, pos);
  });

  // 0.3.2 (по просьбе Антона, п.5 — "при вводе суммы в окошко, нажимаю
  // enter и ничего не происходит"): поля click-to-edit (Сумма/Валюта/НДС/
  // Налог в «Реестре платежей», Доля %/= сумма, поля «Отелей») сохраняют
  // значение по событию "change", которое браузер сам создаёт только при
  // уходе фокуса (blur) — Enter в обычном текстовом <input> вне <form>
  // ничего не делает и уж точно не создаёт change. Раньше единственным
  // способом сохранить значение было кликнуть куда-то ещё. Добавляем Enter
  // как явный способ подтвердить ввод: просто снимаем фокус (blur) —
  // дальше срабатывает та же цепочка "change" (сохранение) → "focusout"
  // (сворачивание поля обратно в обычный текст), что и раньше при клике
  // мимо.
  document.addEventListener("keydown", function(e){
    if(e.key!=="Enter") return;
    if(!e.target.matches('input[data-registry-edit-focus], input[data-hotel-edit-focus], input.registry-amount-input, input[data-hotel-field]')) return;
    e.preventDefault();
    e.target.blur();
  });

  document.addEventListener("submit", function(e){
    if(e.target.id==="note-form"){
      e.preventDefault(); var fd=new FormData(e.target); var text=(fd.get("text")||"").trim();
      if(text){ addNote(e.target.getAttribute("data-id"), text); e.target.reset(); }
    }
    if(e.target.matches(".note-edit-form")){
      e.preventDefault(); var fdn=new FormData(e.target); var newText=(fdn.get("text")||"").trim();
      var noteId = e.target.getAttribute("data-note-id");
      if(newText){ updateNote(noteId, newText).then(function(){ state.editingNoteId=null; }); }
      else { state.editingNoteId=null; renderTicketPanel(); }
    }
    if(e.target.id==="part-form"){
      e.preventDefault(); var fd3=new FormData(e.target); if(!fd3.get("name")) return;
      addPart({name:fd3.get("name"), qty:fd3.get("qty"), unit:fd3.get("unit"), note:fd3.get("note")}); e.target.reset();
    }
    if(e.target.id==="crew-form"){
      e.preventDefault(); var fdc=new FormData(e.target); var name=(fdc.get("name")||"").trim();
      if(name){ createCrew(name); e.target.reset(); }
    }
    if(e.target.matches(".crew-member-form")){
      e.preventDefault(); var fdm=new FormData(e.target); var member=(fdm.get("member")||"").trim();
      var crewId = e.target.getAttribute("data-id");
      var crew = state.crews.find(function(c){return c.id===crewId;});
      if(member && crew){ addCrewMember(crew, member); e.target.reset(); }
    }
    if(e.target.id==="cash-advance-form"){
      e.preventDefault(); var fdca=new FormData(e.target);
      var okCa = addCashAdvance({date:fdca.get("date"), person:fdca.get("person"), amount:fdca.get("amount"), hotel_id:fdca.get("hotel_id"), note:fdca.get("note")});
      if(okCa!==false) e.target.reset();
    }
    if(e.target.id==="cash-expense-form"){
      e.preventDefault(); var fdce=new FormData(e.target);
      var okCe = addCashExpense({date:fdce.get("date"), description:fdce.get("description"), qty:fdce.get("qty"), unit_cost:fdce.get("unit_cost"), hotel_id:fdce.get("hotel_id"), ticket_ref:fdce.get("ticket_ref"), category:fdce.get("category"), person:fdce.get("person")});
      if(okCe!==false) e.target.reset();
    }
  });

  setInterval(function(){ if(!document.querySelector(".modal-scrim")) render(); }, 60000);

  render();
  initAuth();
})();
</script>
</body>
</html>
