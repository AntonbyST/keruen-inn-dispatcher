  /* ============================== MODALS ============================== */
  function openModal(html){ document.getElementById("overlay-root").appendChild(el(h`<div class="modal-scrim" data-close-modal>${html}</div>`)); }
  function closeModal(){ var m=document.querySelector(".modal-scrim"); if(m) m.remove(); }

  function openMeModal(){
    openModal(h`
      <div class="modal" data-stop style="width:420px;">
        <div class="modal-head"><h2>Профиль</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="me-form">
          <div class="modal-body">
            <div class="field"><label>Почта</label><input type="text" value="${escapeHtml(state.me.email)}" disabled></div>
            <div class="field"><label>Имя</label><input type="text" name="name" value="${escapeHtml(state.me.name||'')}" placeholder="Как к вам обращаться"></div>
            <div class="field"><label>Роль</label><input type="text" value="${roleLabel(state.me.role)}" disabled></div>
            <div class="helptext">Роль и зоны назначает руководитель службы в разделе «Команда».</div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-danger" id="me-signout">Выйти</button>

      </div>`);
    document.getElementById("me-form").addEventListener("submit", function(e){
      e.preventDefault(); saveMyName(new FormData(e.target).get("name")||""); closeModal();
    });
    document.getElementById("me-signout").addEventListener("click", function(){ closeModal(); signOut(); });
  }

  // Раньше дата ожидаемой поставки материалов вводилась через prompt() обычным
  // текстом ("ГГГГ-ММ-ДД") — по просьбе Антона заменили на настоящий выпадающий
  // календарь (тот же <input type="date">, что уже использовался в снимке
  // портфеля выше).
  function openMaterialsEtaModal(ticketId){
    var t = state.tickets.find(function(x){return x.id===ticketId;});
    var todayIso = new Date().toISOString().slice(0,10);
    openModal(h`
      <div class="modal" data-stop style="width:380px;">
        <div class="modal-head"><h2>Ожидание материалов</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="materials-eta-form">
          <div class="modal-body">
            <div class="field"><label>Ожидаемая дата поставки</label><input type="date" name="eta" value="${(t&&t.materials_eta)||todayIso}" required></div>
            <div class="helptext">Это просто памятка — на срок устранения (он приходит из c-lector) не влияет.</div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close-modal>Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>
        </form>
      </div>`);
    document.getElementById("materials-eta-form").addEventListener("submit", function(e){
      e.preventDefault(); var fd=new FormData(e.target); var d=fd.get("eta");
      if(d){ setMaterialsEta(ticketId, d); closeModal(); }
    });

  function openPortfolioModal(){
    var pf = state.portfolio || {by_hotel:{}, snapshot_date:new Date().toISOString().slice(0,10)};
    var fields = ["total","submitted","inWork","overdue","done","rejected"];
    var fieldLabels = {total:"Всего",submitted:"Подано",inWork:"В работе",overdue:"Просрочено",done:"Завершено",rejected:"Отклонено"};
    openModal(h`
      <div class="modal" data-stop style="width:760px;">
        <div class="modal-head"><h2>Снимок портфеля (c-lector.ru)</h2><button class="btn btn-ghost" data-close-modal>✕</button></div>
        <form id="portfolio-form">
          <div class="modal-body">
            <div class="field" style="max-width:220px;"><label>Дата снимка</label><input type="date" name="snapshotDate" value="${pf.snapshot_date||''}"></div>
            <div class="table-wrap"><table><thead><tr><th>Отель</th>${fields.map(function(f){return '<th class="num">'+fieldLabels[f]+'</th>';}).join("")}</tr></thead>
              <tbody>${state.hotels.filter(function(x){return x.in_service;}).map(function(x){
                var row = (pf.by_hotel && pf.by_hotel[x.id]) || {};
                return h`<tr><td>№${x.id} ${x.name}</td>${fields.map(function(f){return '<td class="num"><input type="number" name="h'+x.id+'_'+f+'" value="'+(row[f]||0)+'" style="width:64px;text-align:right;padding:4px 6px;"></td>';}).join("")}</tr>`;
              }).join("")}</tbody></table></div>
          </div>
          <div class="modal-foot"><button type="button" class="btn" data-close-modal>Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>
        </form>
      </div>`);
    document.getElementById("portfolio-form").addEventListener("submit", function(e){
      e.preventDefault(); var fd=new FormData(e.target); var byHotel={};
      state.hotels.filter(function(x){return x.in_service;}).forEach(function(x){ byHotel[x.id]={}; fields.forEach(function(f){ byHotel[x.id][f]=Number(fd.get("h"+x.id+"_"+f))||0; }); });
      savePortfolio(byHotel, fd.get("snapshotDate")); closeModal();
    });
  }

  /* ============================== ROOT RENDER ============================== */
  function render(){
    if(!CONFIGURED){
      document.getElementById("app").innerHTML = h`<div class="card configwarn">
        <h2 style="margin-top:0;">Настройка не завершена</h2>
        <p>Впишите <code>SUPABASE_URL</code> и <code>SUPABASE_ANON_KEY</code> в начале файла (значения — в вашем проекте Supabase: Project Settings → API) и разверните страницу снова.</p>
      </div>`;
      return;
    }
    if(!LIB_LOADED){
      document.getElementById("app").innerHTML = h`<div class="card configwarn">
        <h2 style="margin-top:0;">Не удалось загрузить Supabase</h2>
        <p>Библиотека <code>supabase-js</code> не загрузилась с CDN (cdn.jsdelivr.net) — проверьте подключение к интернету, отключите VPN/блокировщик, если он ограничивает доступ к CDN, и обновите страницу (F5).</p>
        <button class="btn btn-primary" onclick="location.reload()">Обновить страницу</button>
      </div>`;
      return;
    }
    if(!state.session){ renderAuthScreen(); return; }
    if(!state.me || !state.hotelsLoaded){ document.getElementById("app").innerHTML = h`<div class="auth-wrap"><div class="muted">Загрузка…</div></div>`; return; }

    var app = document.getElementById("app");
    if(state.route.view==="workorder"){
      state.selectedTicketId = null; document.getElementById("overlay-root").innerHTML = "";
      app.innerHTML = h`<div class="content" style="max-width:900px;">${viewWorkOrder(state.route.id)}</div>`;
      return;
    }
    if(!navAllowed(state.route.view)){ state.route = {view: firstAllowedView(), id:null}; }
    var titleMap = {dashboard:"Дашборд", tickets:"Заявки", team:"Команда", parts:"Склад ЗИП", "import":"Импорт из c-lector", registry:"Реестр платежей", map:"Карта", crews:"Бригады", hotels:"Отели"};
    var body = state.route.view==="tickets"?viewTickets(): state.route.view==="team"?viewTeam(): state.route.view==="parts"?viewParts(): state.route.view==="import"?viewImport(): state.route.view==="registry"?viewRegistry(): state.route.view==="map"?viewMap(): state.route.view==="crews"?viewCrews(): state.route.view==="hotels"?viewHotels(): viewDashboard();

    var navItems = [
      ["dashboard","Дашборд"], ["tickets","Заявки"], ["import","Импорт из c-lector"], ["map","Карта"],
      ["team","Команда"], ["crews","Бригады"], ["parts","Склад ЗИП"], ["registry","Реестр платежей"], ["hotels","Отели"]
    ].filter(function(x){ return navAllowed(x[0]); });
    app.innerHTML = h`
      <div class="sidebar">
        <div class="brand"><div class="brand-name">Диспетчерская</div><div class="brand-sub">Keruen Inn · Служба сервиса</div></div>
        <nav class="nav">${navItems.map(function(x){ return navItem(x[0], x[1]); }).join("")}</nav>
        <div class="nav-footer">
          <div class="zone-legend"><span>Срок прибытия: <b>Зона 1</b> — 24ч</span><span><b>Зона 2</b> — 48ч</span><span><b>Зона 3</b> — 72ч</span></div>
          <p>Заявки поступают через c-lector.ru — здесь только внутренняя диспетчеризация и наряд-задания.</p>
        </div>
      </div>
      <div class="main">
        <div class="topbar">
          <h1>${titleMap[state.route.view]||"Дашборд"}</h1>
          <div class="whoami"><div class="whoami-chip" data-action="me">
            <span class="avatar">${(state.me.name||state.me.email||"?").trim().charAt(0).toUpperCase()}</span>
            <span>${escapeHtml(state.me.name||state.me.email)}</span>
          </div></div>
        </div>
        <div class="content">${body}</div>
      </div>`;
    renderTicketPanel();
    if(state.selectedTicketId) loadNotesFor(state.selectedTicketId);
    if(state.route.view==="map") ensureMap();
  }

  /* ============================== EVENTS ============================== */
  document.addEventListener("click", function(e){
    var t = e.target;
    if(t.closest(".nav-item")) return;
    var openTicket = t.closest("[data-open-ticket]");
    if(openTicket){ state.selectedTicketId = openTicket.getAttribute("data-open-ticket"); state.editingNoteId = null; state.milestoneOpen = {}; state.editingDescShort = false; renderTicketPanel(); loadNotesFor(state.selectedTicketId); return; }
    if(t.closest("[data-close-panel]")){ state.selectedTicketId = null; state.editingNoteId = null; state.milestoneOpen = {}; state.editingDescShort = false; renderTicketPanel(); return; }
    if(t.matches(".modal-scrim") && t.hasAttribute("data-close-modal")){ closeModal(); return; }
    if(t.hasAttribute("data-close-modal")){ closeModal(); return; }
    // Кнопка "Удалить" в "Склад ЗИП" — раньше эта проверка ошибочно лежала
    // внутри блока data-action ниже (t.closest("[data-action]")), а у самой
    // кнопки нет атрибута data-action (только data-part-remove), поэтому клик
    // по ней никогда не долетал до этой проверки и позиция не удалялась.
    var partRemoveEl = t.closest("[data-part-remove]");
    if(partRemoveEl){ if(confirm("Удалить позицию склада?")) removePart(partRemoveEl.getAttribute("data-part-remove")); return; }

    if(t.id==="import-parse-btn"){
      var ta = document.getElementById("import-paste"); var parsed = parseDelimited(ta?ta.value:"");
      if(parsed.headers.length) setImportData(parsed.headers, parsed.rows);
      else alert("Не удалось распознать таблицу — убедитесь, что скопирована таблица с заголовками.");
      return;
    }
    if(t.id==="copy-link"){
      navigator.clipboard && navigator.clipboard.writeText(window.location.origin+window.location.pathname).then(function(){ t.textContent="Скопировано"; setTimeout(function(){ t.textContent="Скопировать ссылку"; },1500); });
      return;
    }

    var actionEl = t.closest("[data-action]");
    if(actionEl){
      var action = actionEl.getAttribute("data-action"); var id = actionEl.getAttribute("data-id");
      if(action==="me") return openMeModal();
      if(action==="edit-portfolio") return openPortfolioModal();
      if(action==="clear-demo"){ if(confirm("Удалить все примеры заявок?")) clearDemo(); return; }
      if(action==="import-commit") return commitImport();
      if(action==="import-reset") return resetImport();
      if(action==="assign"){
        var sel=document.getElementById("assign-select"); var name=sel&&sel.value;
        if(!name){ alert("Выберите исполнителя из списка (назначьте роль в «Команде» или создайте бригаду в «Бригадах», если список пуст)."); return; }
        assignSpecialist(id,name); return;
      }
      if(action==="reassign"){
        var rsel=document.getElementById("reassign-select"); var rname=rsel&&rsel.value;
        if(!rname){ alert("Выберите нового исполнителя из списка."); return; }
        reassignSpecialist(id,rname); return;
      }
      if(action==="arrived") return markArrived(id);
      if(action==="materials") return openMaterialsEtaModal(id);
      if(action==="materials-ready-toggle") return setMaterialsReady(id, actionEl.getAttribute("data-val")==="1");
      if(action==="crew-manual-toggle") return setCrewManualDone(id, actionEl.getAttribute("data-val")==="1");
      if(action==="work-manual-toggle") return setWorkManualDone(id, actionEl.getAttribute("data-val")==="1");
      if(action==="act-signed-toggle") return setActSigned(id, actionEl.getAttribute("data-val")==="1");
      if(action==="act-open") return openActFile(actionEl.getAttribute("data-path"));
      if(action==="act-clear") return clearActSigned(id);
      if(action==="invoice-open") return openInvoiceFile(actionEl.getAttribute("data-path"));
      if(action==="invoice-delete") return deleteInvoice(id, actionEl.getAttribute("data-path"));
      if(action==="registry-export") return exportRegistryExcel();
      if(action==="tickets-export") return exportTicketsExcel();
      if(action==="toggle-status-filter"){
        var sv = actionEl.getAttribute("data-value");
        state.filters = state.filters||{}; state.filters.statusList = state.filters.statusList||[];
        var sidx = state.filters.statusList.indexOf(sv);
        if(sidx>-1) state.filters.statusList.splice(sidx,1); else state.filters.statusList.push(sv);
        render(); return;
      }
      if(action==="clear-status-filter"){ e.preventDefault(); state.filters=state.filters||{}; state.filters.statusList=[]; render(); return; }
      if(action==="sort-tickets"){
        var sfield = actionEl.getAttribute("data-field");
        state.filters = state.filters||{};
        var curSort = state.filters.sort || {};
        state.filters.sort = (curSort.field===sfield) ? {field:sfield, dir: curSort.dir==="asc"?"desc":"asc"} : {field:sfield, dir:"asc"};
        render(); return;
      }
      if(action==="clear-registry-filter"){ e.preventDefault(); var keepSort = (state.registryFilters||{}).sort; state.registryFilters = {q:"", hotel:"", dateFrom:"", dateTo:"", sort: keepSort}; render(); return; }
      if(action==="sort-registry"){
        var rfield = actionEl.getAttribute("data-field");
        state.registryFilters = state.registryFilters||{};
        var rcurSort = state.registryFilters.sort || {};
        state.registryFilters.sort = (rcurSort.field===rfield) ? {field:rfield, dir: rcurSort.dir==="asc"?"desc":"asc"} : {field:rfield, dir:"asc"};
        render(); return;
      }
      if(action==="note-edit"){ e.preventDefault(); state.editingNoteId = id; renderTicketPanel(); return; }
      if(action==="note-cancel"){ e.preventDefault(); state.editingNoteId = null; renderTicketPanel(); return; }
      if(action==="toggle-milestone"){
        // Кнопка "прикрепить" (скрепка, milestoneAttachControl) лежит внутри той
        // же строки milestone-hd, у которой стоит data-action="toggle-milestone" —
        // без этой проверки клик по скрепке (выбор файла) заодно сворачивал/
        // разворачивал пункт чек-листа, потому что клик всплывает до ближайшего
        // предка с data-action, а сама скрепка своего data-action не имеет.
        if(t.closest(".milestone-attach-btn")) return;
        var mkey = actionEl.getAttribute("data-key");
        state.milestoneOpen = state.milestoneOpen || {};
        state.milestoneOpen[mkey] = !state.milestoneOpen[mkey];
        renderTicketPanel(); return;
      }
      if(action==="toggle-desc-edit"){ state.editingDescShort = !state.editingDescShort; renderTicketPanel(); return; }
      if(action==="note-delete"){ e.preventDefault(); if(confirm("Удалить запись из журнала?")) deleteNote(id); return; }
      if(action==="crew-delete"){ if(confirm("Удалить бригаду?")) deleteCrew(id); return; }
      if(action==="crew-member-remove"){
        e.preventDefault();
        var crew = state.crews.find(function(c){return c.id===id;});
        if(crew) removeCrewMember(crew, actionEl.getAttribute("data-member"));
        return;
      }
      if(action==="wo-download"){
        var tk = state.tickets.find(function(x){return x.id===id;});
        var htmlDoc = "<!doctype html><html><head><meta charset='utf-8'><title>"+workOrderNo(tk)+"</title></head><body>"+document.getElementById("wo-content").outerHTML+"</body></html>";
        var blob = new Blob([htmlDoc], {type:"text/html"}); var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href=url; a.download=workOrderNo(tk)+".html"; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
        return;
      }
      if(action==="profile-toggle-active"){ if(!isOwner()) return; updateProfile(id, {active: actionEl.getAttribute("data-val")==="1"}); return; }
      if(action==="profile-delete"){ if(!isOwner()) return; deleteProfile(id, actionEl.getAttribute("data-label")||"—"); return; }
      if(action==="attention-toggle"){
        var turnOn = actionEl.getAttribute("data-val")==="1";
        var note = turnOn ? (prompt("Комментарий (необязательно) — например, кто обратил внимание:")||"") : "";
        return setAttentionFlag(id, turnOn, note);
      }
      if(action==="duplicate-set") return setDuplicateOf(id);
      if(action==="duplicate-clear") return clearDuplicateOf(id);
      if(action==="photo-open") return openPhotoFile(actionEl.getAttribute("data-path"));
      if(action==="photo-delete"){ deletePhoto(id, actionEl.getAttribute("data-path")); return; }
      if(action==="hotel-add"){
        var hform = document.getElementById("hotel-form");
        var hfd = new FormData(hform);
        addHotel(hfd.get("name"), hfd.get("zone"), hfd.get("lat"), hfd.get("lng"));
        hform.reset();
        return;
      }
      if(action==="hotel-delete"){ deleteHotel(id); return; }
      if(action==="hotel-toggle-active"){ toggleHotelActive(id, actionEl.getAttribute("data-val")==="1"); return; }
    }
  });

  document.addEventListener("change", function(e){
    if(e.target.matches("[data-filter]")){ state.filters=state.filters||{}; state.filters[e.target.getAttribute("data-filter")]=e.target.value; render(); }
    if(e.target.matches("[data-filter-checkbox]")){ state.filters=state.filters||{}; state.filters[e.target.getAttribute("data-filter-checkbox")]=e.target.checked; render(); return; }
    if(e.target.matches("[data-registry-filter]")){ state.registryFilters=state.registryFilters||{}; state.registryFilters[e.target.getAttribute("data-registry-filter")]=e.target.value; render(); return; }
    if(e.target.matches("[data-hotel-field]")){ updateHotelField(e.target.getAttribute("data-id"), e.target.getAttribute("data-hotel-field"), e.target.value); return; }
    if(e.target.id==="import-file"){ var f=e.target.files&&e.target.files[0]; if(f) loadImportFile(f); return; }
    if(e.target.matches("[data-import-map]")){ state.importMapping[e.target.getAttribute("data-import-map")]=e.target.value; render(); return; }
    if(e.target.id==="case-select") setCaseType(e.target.getAttribute("data-id"), e.target.value);
    if(e.target.id==="repair-hours-input"){
      var rh = e.target.value===""?null:Number(e.target.value);
      var rhId = e.target.getAttribute("data-id");
      saveTicketField(rhId, {repair_hours: rh}, "repair-hours-feedback").then(function(ok){
        if(!ok) return;
        if(rh!=null) maybeAutoComplete(rhId);
        addNote(rhId, rh!=null ? ("Указаны часы главного инженера на устранение: "+rh+".") : "Часы главного инженера на устранение сброшены.");
      });
    }
    if(e.target.id==="desc-short-input"){
      var dsId = e.target.getAttribute("data-id"), dsVal = e.target.value.trim()||null;
      saveTicketField(dsId, {description_short: dsVal}, "desc-short-feedback").then(function(ok){
        if(!ok) return;
        addNote(dsId, dsVal ? ("Изменена формулировка «Сути»: "+dsVal) : "Формулировка «Сути» очищена.");
      });
    }
    if(e.target.matches("[data-crew-rename]")) renameCrew(e.target.getAttribute("data-crew-rename"), e.target.value);
    if(e.target.matches("[data-part-qty]")) updatePartQty(e.target.getAttribute("data-part-qty"), e.target.value);
    if(e.target.matches("[data-profile-role]")){ if(!isOwner()) return; updateProfile(e.target.getAttribute("data-profile-role"), {role:e.target.value}); }
    // Кнопки "прикрепить" прямо в строке чек-листа "Ход работ" (milestoneAttachControl) —
    // в отличие от прежних форм с отдельной кнопкой "Отправить", загрузка начинается
    // сразу при выборе файла(ов), можно выбрать несколько штук за один раз.
    if(e.target.matches(".ms-quick-attach")){
      var qaFiles = Array.from(e.target.files||[]);
      if(!qaFiles.length) return;
      var qaId = e.target.getAttribute("data-id"), qaCategory = e.target.getAttribute("data-category");
      Promise.all(qaFiles.map(function(f){ return uploadInvoice(qaId, f, qaCategory); })).then(function(){ e.target.value=""; });
      return;
    }
    if(e.target.matches(".ms-quick-photo")){
      // Замечания (раздел "Фото") — сюда фото-доказательства выполненной
      // работы к Акту больше не попадают, см. .ms-quick-act-photo ниже, и ни
      // одно из двух не влияет на автопереход "Работа" (см. STATUS_ICON_DEFS/
      // maybeAutoComplete выше — этот пункт теперь всегда только ручной).
      var qpFiles = Array.from(e.target.files||[]);
      if(!qpFiles.length) return;
      var qpId = e.target.getAttribute("data-id");
      Promise.all(qpFiles.map(function(f){ return uploadPhoto(qpId, f); })).then(function(){ e.target.value=""; });
      return;
    }
    if(e.target.matches(".ms-quick-act-photo")){
      var qapFiles = Array.from(e.target.files||[]);
      if(!qapFiles.length) return;
      var qapId = e.target.getAttribute("data-id");
      Promise.all(qapFiles.map(function(f){ return uploadPhoto(qapId, f, "act"); })).then(function(){ e.target.value=""; markActConfirmedByPhoto(qapId); });
      return;
    }
    if(e.target.matches(".ms-quick-act")){
      var qactFile = e.target.files && e.target.files[0];
      if(!qactFile) return;
      var qactId = e.target.getAttribute("data-id");
      uploadActFile(qactId, qactFile).then(function(){ e.target.value=""; });
      return;
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target.id==="note-form"){
      e.preventDefault(); var fd=new FormData(e.target); var text=(fd.get("text")||"").trim();
      if(text){ addNote(e.target.getAttribute("data-id"), text); e.target.reset(); }
    }
    if(e.target.matches(".note-edit-form")){
      e.preventDefault(); var fdn=new FormData(e.target); var newText=(fdn.get("text")||"").trim();
      var noteId = e.target.getAttribute("data-note-id");
      if(newText){ updateNote(noteId, newText).then(function(){ state.editingNoteId=null; }); }
      else { state.editingNoteId=null; renderTicketPanel(); }
    }
    if(e.target.id==="part-form"){
      e.preventDefault(); var fd3=new FormData(e.target); if(!fd3.get("name")) return;
      addPart({name:fd3.get("name"), qty:fd3.get("qty"), unit:fd3.get("unit"), note:fd3.get("note")}); e.target.reset();
    }
    if(e.target.id==="crew-form"){
      e.preventDefault(); var fdc=new FormData(e.target); var name=(fdc.get("name")||"").trim();
      if(name){ createCrew(name); e.target.reset(); }
    }
    if(e.target.matches(".crew-member-form")){
      e.preventDefault(); var fdm=new FormData(e.target); var member=(fdm.get("member")||"").trim();
      var crewId = e.target.getAttribute("data-id");
      var crew = state.crews.find(function(c){return c.id===crewId;});
      if(member && crew){ addCrewMember(crew, member); e.target.reset(); }
    }
  });

  setInterval(function(){ if(!document.querySelector(".modal-scrim")) render(); }, 60000);

  render();
  initAuth();
})();
</script>
</body>
</html>
