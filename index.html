<style>
  :root{
    --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E4EAEE; --surface-3:#DAE2E7;
    --line:#D3DBE1; --ink:#16232E; --ink-soft:#54636F; --ink-faint:#8B99A4;
    --accent:#0E7C90; --accent-ink:#FFFFFF; --accent-soft:#DCEFF2; --accent-line:#B9DEE4;
    --ok:#1E8E5A; --ok-soft:#E1F3E8; --warn:#A8710F; --warn-soft:#FBEED9; --crit:#C2410C; --crit-soft:#FBE1D2;
    --shadow:0 1px 2px rgba(22,35,46,.07),0 6px 18px rgba(22,35,46,.08);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1620; --surface:#16212B; --surface-2:#1C2833; --surface-3:#23313D;
      --line:#2B3A46; --ink:#E7EDF1; --ink-soft:#A9B8C2; --ink-faint:#70828D;
      --accent:#3FB5C9; --accent-ink:#062229; --accent-soft:#163239; --accent-line:#255560;
      --ok:#4FC08C; --ok-soft:#123524; --warn:#DDAA55; --warn-soft:#3A2C14; --crit:#E17A4C; --crit-soft:#3C2216;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.38);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }
  button, select, input, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  a{ color:var(--accent); }
  #app{ display:flex; min-height:100vh; max-width:1440px; margin:0 auto; background:var(--surface); box-shadow:0 0 0 1px var(--line), 0 24px 60px rgba(22,35,46,.14); }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:216px; flex:0 0 216px; background:var(--surface-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 0; position:sticky; top:0; height:100vh;
  }
  .brand{ padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .brand-name{ font-weight:700; font-size:15px; letter-spacing:.2px; }
  .brand-sub{ color:var(--ink-faint); font-size:11.5px; margin-top:3px; text-transform:uppercase; letter-spacing:.06em; }
  .nav{ display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer;
    color:var(--ink-soft); text-decoration:none; border-left:3px solid transparent; font-weight:500;
  }
  .nav-item:hover{ background:var(--surface-3); color:var(--ink); }
  .nav-item.active{ background:var(--surface); color:var(--ink); border-left-color:var(--accent); box-shadow:var(--shadow); }
  .nav-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto; }
  .nav-footer{ margin-top:auto; padding:14px 20px 0; border-top:1px solid var(--line); }
  .nav-footer p{ margin:10px 0 0; font-size:11.5px; color:var(--ink-faint); line-height:1.5; }

  /* ---------- main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
    padding:14px 28px; display:flex; align-items:center; gap:16px;
  }
  .topbar h1{ font-size:18px; margin:0; font-weight:700; flex:1; min-width:0; }
  /* 0.3.9: гамбургер-кнопка открытия сайдбара на телефоне — на десктопе
     скрыта (display:none здесь), показывается только внутри мобильной
     media query ниже (правило там идёт позже по тексту файла и той же
     специфичности, поэтому и побеждает при узком экране). */
  .hamburger-btn{ display:none; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; flex:none; padding:0; }
  .hamburger-btn svg{ width:18px; height:18px; display:block; }
  .sidebar-scrim{ display:none; }
  .whoami{ display:flex; align-items:center; gap:6px; }
  .whoami-chip{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    padding:6px 10px 6px 6px; border-radius:20px; cursor:pointer;
  }
  .avatar{
    width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:0 0 auto;
  }
  .content{ padding:24px 28px 60px; max-width:1180px; width:100%; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ color:var(--crit); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:7px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- cards / kpi ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:18px 20px; }
  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; margin:0 0 12px; }
  .info-dot{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--surface-3); border:1px solid var(--line); color:var(--ink-faint); font-size:10px; font-weight:700; font-style:italic; font-family:Georgia,'Times New Roman',serif; text-transform:none; letter-spacing:normal; cursor:help; flex:none; margin-left:5px; user-select:none; vertical-align:middle; }
  .grid-kpi{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px; }
  .kpi{ padding:16px 18px; }
  .kpi-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .kpi-value{ font-size:30px; font-weight:600; margin-top:6px; }
  .kpi-value.crit{ color:var(--crit); } .kpi-value.ok{ color:var(--ok); } .kpi-value.accent{ color:var(--accent); }
  .kpi-sub{ font-size:12px; color:var(--ink-faint); margin-top:3px; }

  /* «Затраты по заявке» — карточка вместо плоского списка kv (по просьбе
     Антона: сделать нагляднее/«красивее»), тот же акцентный язык, что и у
     kpi-плиток на дашборде. */
  .cost-summary{ background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:10px; padding:14px 16px; }
  .cost-summary-total{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .cost-summary-total-label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .cost-summary-total-value{ font-size:24px; font-weight:700; color:var(--accent); font-family:'SF Mono',Consolas,monospace; white-space:nowrap; }
  .cost-summary-breakdown{ display:flex; flex-wrap:wrap; gap:18px; margin-top:10px; padding-top:10px; border-top:1px solid var(--accent-line); }
  .cost-summary-item{ display:flex; flex-direction:column; gap:2px; }
  .cost-summary-item-label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  .cost-summary-item-value{ font-size:14.5px; font-weight:600; color:var(--ink); font-family:'SF Mono',Consolas,monospace; }
  .cost-summary-item-value .count{ font-weight:500; color:var(--ink-faint); font-family:inherit; }
  .cost-summary-warn{ font-size:11.5px; color:var(--warn); margin-top:8px; }

  .row-gap{ display:flex; flex-direction:column; gap:18px; }
  .two-col{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; align-items:start; }
  @media (max-width:880px){ .two-col{ grid-template-columns:1fr; } }

  /* ---------- badges / pills ---------- */
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pill-neutral{ background:var(--surface-3); color:var(--ink-soft); }
  .pill-accent{ background:var(--accent-soft); color:var(--accent); }
  .pill-ok{ background:var(--ok-soft); color:var(--ok); }
  .pill-warn{ background:var(--warn-soft); color:var(--warn); }
  .pill-crit{ background:var(--crit-soft); color:var(--crit); }
  .zone-badge{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; border:1px solid var(--line); font-size:11px; font-weight:600; color:var(--ink-soft); }
  .demo-tag{ background:var(--warn-soft); color:var(--warn); font-size:10px; padding:1px 6px; border-radius:5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  .source-tag{ background:var(--accent-soft); color:var(--accent); font-size:10px; padding:1px 6px; border-radius:5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  .clector-sync-badge{ display:inline-block; margin-top:5px; background:var(--warn-soft); color:var(--warn); font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px; white-space:nowrap; }
  /* 0.2.18: заявка, которую автосинхронизация c-lector пометила удалённой на
     источнике (tickets.clector_deleted_at) — см. clectorDeletedBadge(). */
  .clector-deleted-badge{ display:inline-block; margin-top:5px; background:var(--crit-soft); color:var(--crit); font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px; white-space:nowrap; }
  .clector-deleted-banner{ background:var(--crit-soft); color:var(--crit); font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; margin-bottom:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  /* Унифицированные "отметки" в карточке заявки (0.2.12) — "Пометить как
     дубль" и "Системный брак" визуально выглядят одинаково: пунктирный
     контур, пока не отмечено (для системного брака — прямо вокруг поля
     ввода названия), сплошная цветная плашка с крестиком, когда отмечено.
     Раньше это были два разных по виду элемента управления (кнопка-ссылка
     и текстовое поле с отдельной кнопкой "Снять пометку") — см. правку
     "чтобы обе отметки выглядели одинаково". */
  .flag-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .flag-chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 8px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px dashed var(--line); color:var(--ink-soft); background:transparent; cursor:pointer; font-family:inherit; }
  .flag-chip svg{ width:14px; height:14px; flex:none; }
  .flag-chip.set{ border-style:solid; cursor:default; }
  .flag-chip.set.warn{ border-color:transparent; background:var(--warn-soft); color:var(--warn); }
  .flag-chip.set.crit{ border-color:transparent; background:var(--crit-soft); color:var(--crit); }
  .flag-chip .x{ display:inline-flex; align-items:center; justify-content:center; margin-left:2px; margin-right:-4px; opacity:.7; cursor:pointer; background:none; border:none; color:inherit; padding:2px; }
  .flag-chip .x:hover{ opacity:1; }
  .flag-chip .link-btn{ background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer; font:inherit; font-weight:600; padding:0; }
  .flag-chip.input-chip{ padding:3px 10px 3px 8px; cursor:text; }
  .flag-chip.input-chip input{ background:transparent; border:none; color:var(--ink-soft); font:inherit; font-weight:600; padding:0; width:160px; }
  .flag-chip.input-chip input::placeholder{ color:var(--ink-faint); font-weight:600; }
  .flag-chip.input-chip input:focus{ outline:none; }
  /* Компактные чекбоксы-фильтры по 4 пунктам чек-листа — сидят прямо в
     заголовке колонки "№ c-lector", ровно над строкой значков в каждой
     строке (statusIconsRow), поэтому занимают минимум места и не требуют
     отдельной строки фильтров сверху. */
  .tag-filter-row{ display:flex; gap:3px; margin-top:5px; }
  .tag-filter-chip{ position:relative; display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:5px; border:1px solid var(--line); color:var(--ink-faint); cursor:pointer; background:var(--surface); }
  .tag-filter-chip svg{ width:11px; height:11px; display:block; }
  .tag-filter-chip input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .tag-filter-chip:hover{ border-color:var(--accent-line); }
  .tag-filter-chip.active{ background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); }
  /* Трёхпозиционный фильтр "Материал" (0.2.9) — жёлтый/зелёный вместо общего
     акцентного цвета .active выше, чтобы сразу читалось, какое именно
     состояние сейчас выбрано (как и у самой иконки статуса, см. .status-icon
     выше). Отдельные правила после .active, чтобы точно её переопределить. */
  .tag-filter-chip.warn-lit{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); }
  .tag-filter-chip.lit{ background:var(--ok-soft); border-color:var(--ok); color:var(--ok); }
  .status-icons{ display:inline-flex; align-items:center; gap:4px; vertical-align:middle; }
  .status-icon{ width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-faint); opacity:.4; transition:opacity .15s ease, color .15s ease, filter .15s ease; cursor:default; }
  .status-icon svg{ width:14px; height:14px; display:block; }
  .status-icon.lit{ color:var(--ok); opacity:1; filter:drop-shadow(0 0 3px var(--ok)); }
  .status-icon.warn-lit{ color:var(--warn); opacity:1; filter:drop-shadow(0 0 3px var(--warn)); }
  .attn-badge{ display:inline-flex; color:var(--crit); margin-right:5px; filter:drop-shadow(0 0 3px var(--crit)); vertical-align:middle; }
  .attn-badge svg{ width:15px; height:15px; display:block; }
  tr.attn-row{ background:var(--crit-soft); }
  tr.attn-row:hover{ filter:brightness(0.97); }
  .attn-toggle-btn{ color:var(--ink-faint); opacity:.55; }
  .attn-toggle-btn svg{ display:block; }
  .attn-toggle-btn:hover{ opacity:1; }
  .attn-toggle-btn.is-active{ color:var(--crit); opacity:1; filter:drop-shadow(0 0 3px var(--crit)); }
  .photo-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .photo-item{ display:flex; flex-direction:column; align-items:center; gap:3px; width:84px; }
  .photo-thumb{ position:relative; width:84px; height:84px; border-radius:8px; border:1px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center; background:var(--surface-3); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .photo-del{ position:absolute; top:2px; right:2px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:5px; font-size:11px; line-height:1; padding:3px 5px; cursor:pointer; }
  .photo-date{ font-size:10.5px; color:var(--ink-faint); line-height:1.2; }
  .map-table td, .map-table th{ vertical-align:middle; }
  .import-summary{ display:flex; gap:18px; flex-wrap:wrap; margin:14px 0; }
  .import-summary .stat{ font-size:13px; } .import-summary .stat b{ font-size:18px; display:block; font-family:"IBM Plex Mono",monospace; }
  .dropzone{ border:1px dashed var(--line); border-radius:9px; padding:16px; text-align:center; color:var(--ink-faint); font-size:12.5px; }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; }
  .registry-totals-row td{ background:var(--surface-2); border-top:2px solid var(--line); padding-top:8px; padding-bottom:8px; }
  /* 0.2.19: строка-разделитель месяца оплаты внутри «Реестра платежей» (см.
     paidMonthDividerRow) — легче строки итогов, чтобы не спутать с ней. */
  .registry-month-divider td{ background:var(--surface-2); font-weight:600; padding-top:6px; padding-bottom:6px; color:var(--ink-soft); }
  /* 0.4.6, п.2 (по просьбе Антона): развёрнутая строка "общий счёт/расход на
     несколько заявок" (см. registryGroupRow в «Реестре платежей» и
     cashExpenseRow-группу в «Расходах») раньше не имела вообще никакого
     оформления и сливалась с обычными строками — акцентный фон + рамка
     сверху/снизу выделяют её как отдельную сущность, а не рядовую строку. */
  .registry-group-row td{ background:var(--accent-soft); border-top:1px solid var(--accent-line); border-bottom:1px solid var(--accent-line); }
  /* Позиции внутри такой развёрнутой группы (по одной на каждую заявку) —
     тем же приёмом, что и у .registry-alloc-row ниже: чуть притенённый фон,
     чтобы визуально оставаться "под" группой, не притворяясь обычной строкой. */
  .cash-expense-subrow td{ background:var(--surface-2); }
  /* 0.3.8/0.4.6: заголовок группы "по прорабу" в «Выдачах»/«Расходах» (см.
     cash-person-divider) — раньше тоже без всякого фона, выделялся только
     жирным именем; теперь того же уровня, что и заголовок месяца в «Реестре»
     (см. .registry-month-divider выше), чтобы верхний уровень группировки
     был явно виден. */
  .cash-person-divider td{ background:var(--surface-2); font-weight:600; padding-top:6px; padding-bottom:6px; }
  /* 0.4.6, п.3: второй уровень группировки в «Расходах» — месяц внутри
     прораба (см. cashExpenseMonthKey/groupCashExpensesByMonth) — тот же приём,
     что и .registry-month-divider, но с отступом слева (padding-left задаётся
     инлайново в разметке), чтобы визуально быть "внутри" строки прораба. */
  .cash-expense-month-divider td{ background:var(--surface-2); font-weight:500; padding-top:5px; padding-bottom:5px; color:var(--ink-soft); }
  /* 0.2.13.1: реестр платежей стал 10-колоночным (валюта/НДС/налог/учтено) —
     компактный режим, чтобы всё помещалось без горизонтальной прокрутки на
     обычном экране. table-layout:fixed заставляет колонки уважать ширины из
     <colgroup>, а не растягиваться под самый широкий контент (имя файла). */
  .registry-table{ table-layout:fixed; }
  /* 0.2.17 (по просьбе Антона): заголовки колонок реестра — по центру. */
  .registry-table th{ white-space:normal; line-height:1.25; padding:7px 6px; font-size:10px; text-align:center; }
  .registry-table td{ padding:6px 6px; font-size:12.5px; vertical-align:top; }
  .registry-table td input[type="number"],
  .registry-table td select{ width:100%; box-sizing:border-box; padding:4px 4px; font-size:12px; }
  .registry-table td input.registry-amount-input{ width:100%; box-sizing:border-box; padding:4px 4px; font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  .registry-file-btn{ display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
  /* 0.2.16: "Сумма" — обычный текст (разряды через пробел), пока по нему не
     кликнут; тогда вместо него на месте появляется поле ввода (см. change/
     focusout выше). Прочерк — как обычно, "не заполнено".
     0.3.6 (по просьбе Антона, п.4): раньше кликалась только сама кнопка/строка
     текста — одна строка высотой у верхнего края ячейки (см. vertical-align:top
     выше). У сгруппированных счетов и счетов с предупреждениями соседние
     ячейки строки («№ заявки», «Отель») часто в 3-10 строк, вся строка
     таблицы визуально высокая — а клик где угодно НИЖЕ этой одной строки (но
     всё ещё в границах видимо высокой строки) попадал мимо кнопки, в фон
     самой ячейки, и ничего не происходило. Отсюда "работает через раз":
     срабатывало только если попасть точно по узкой полоске текста вверху.
     Первая попытка чинить это (height:100% на кнопке/поле ввода) не сработала:
     вопреки распространённому мифу про "проценты высоты в table layout",
     высота <td>, определённая ПО ВЫСОТЕ СТРОКИ (растянутая под соседнюю
     ячейку "№ заявки"/предупреждение, а не под свой собственный контент), не
     является "определённой" высотой (definite height) для дочерних элементов с
     точки зрения спеки CSS2.1 — height:100% у кнопки/поля так и остаётся
     равен её min-height (проверено отдельно, в этом самом браузере/сборке
     Chromium — процентная высота у потомка НЕ подтягивается к фактической
     растянутой высоте ячейки, только к её собственной intrinsic-высоте).
     Настоящий рабочий приём — сделать саму ячейку (.registry-amount-td)
     position:relative, а кнопку/поле — position:absolute; inset:0: тогда
     они позиционируются от РЕАЛЬНОГО отрендеренного прямоугольника ячейки
     (а не от процента её CSS-высоты), какой бы высокой строка ни оказалась
     из-за соседних ячеек — и клик работает по всей видимой площади ячейки
     без исключений. Ширину столбца это не задевает: у .registry-table
     table-layout:fixed, ширины колонок берутся из <colgroup>, а не из
     контента конкретной ячейки. */
  .registry-table td.registry-amount-td{ padding:0; position:relative; }
  .registry-amount-display{ position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; box-sizing:border-box; min-height:24px; background:none; border:1px dashed transparent; padding:4px 4px; font:inherit; font-variant-numeric:tabular-nums; text-align:right; cursor:pointer; color:inherit; border-radius:4px; }
  .registry-amount-display:hover:not(:disabled){ border-color:var(--line); }
  .registry-amount-display:disabled{ cursor:default; }
  .registry-table td.registry-amount-td input.registry-amount-input{ position:absolute; inset:0; min-height:24px; }
  /* 0.2.17: «Отели» — «Зона»/«Координаты»/«Лицо от Заказчика» тем же приёмом:
     обычный текст без рамки, пока заполнено; клик — раскрывает настоящее
     поле(-я) ввода на его месте. */
  .hotel-field-display{ display:block; width:100%; background:none; border:1px dashed transparent; padding:3px 4px; font:inherit; text-align:left; cursor:pointer; color:inherit; border-radius:4px; }
  .hotel-field-display:hover{ border-color:var(--line); }
  .registry-related-line{ font-size:10.5px; line-height:1.4; margin-top:2px; white-space:normal; }
  .registry-related-line a{ white-space:nowrap; }
  /* 0.3.0: предупреждение о возможно случайном совпадении имени файла между
     разными заявками (см. isGenericInvoiceFileName/registryGroupRow). */
  .registry-suspicious-match{ font-size:10.5px; line-height:1.4; margin-top:2px; white-space:normal; color:var(--warn, #a06a00); cursor:help; }
  /* 0.2.20: счёт, общий сразу на несколько заявок (см. registryGroupRow) —
     разворачивается в построчную разбивку доли каждой заявки. */
  .registry-expand-btn{ padding:1px 5px; margin-right:4px; font-size:11px; line-height:1; vertical-align:middle; }
  .registry-alloc-row td{ background:var(--surface-2); border-top:none; padding-top:3px; padding-bottom:3px; }
  .registry-alloc-row input{ box-sizing:border-box; padding:2px 4px; font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  /* 0.2.21 (по просьбе Антона): доля/сумма в разбивке — тот же приём, что и
     «Сумма»/«Отели» выше — обычный текст без рамки (даже когда это прочерк,
     то есть доля ещё не указана), клик раскрывает настоящее поле ввода. */
  .registry-alloc-display{ display:inline-block; min-width:44px; background:none; border:1px dashed transparent; padding:2px 4px; font:inherit; font-size:12px; font-variant-numeric:tabular-nums; text-align:right; cursor:pointer; color:inherit; border-radius:4px; }
  .registry-alloc-display:hover:not(:disabled){ border-color:var(--line); }
  .registry-alloc-display:disabled{ cursor:default; opacity:.6; }
  .registry-alloc-input{ box-sizing:border-box; padding:2px 4px; font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  /* 0.2.21: заявка, отмеченная как «дубль» другой — весь текст строки
     зачёркнут и приглушён, как неактивная (см. duplicateBadge). */
  tr.dup-row{ opacity:.55; }
  tr.dup-row .ttl, tr.dup-row .line-clamp-2{ text-decoration:line-through; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:var(--surface-2); }
  td.num, th.num{ text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .ttl{ font-weight:600; }
  .muted{ color:var(--ink-faint); }
  .empty-state{ padding:40px 20px; text-align:center; color:var(--ink-faint); }
  .empty-state b{ color:var(--ink-soft); display:block; margin-bottom:4px; font-size:14px; }

  /* ---------- forms ---------- */
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=email], input[type=number], input[type=date], select, textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .chip-toggle{ display:inline-flex; gap:6px; flex-wrap:wrap; }
  .chip-toggle label{ display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:4px 10px 4px 6px; font-size:12px; font-weight:500; color:var(--ink-soft); cursor:pointer; margin:0; }
  .chip-toggle input{ width:auto; }

  /* ---------- filters ---------- */
  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .filters select, .filters input[type=text]{ width:auto; min-width:140px; }
  .status-filter-group{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .status-filter-chip{ cursor:pointer; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--line); color:var(--ink-soft); background:var(--surface-2); user-select:none; }
  .status-filter-chip:hover{ border-color:var(--accent-line); }
  .status-filter-chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  /* ---------- «Финансы»: вкладки Реестр платежей / Наличные расходы ---------- */
  .finance-tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .finance-tab{ padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .finance-tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .finance-tab:hover{ color:var(--ink); }
  .cash-balance-row.negative td{ color:var(--crit); font-weight:600; }

  /* ---------- отчёт по СЕРВИСу на дашборде (0.2.6/0.2.7) ---------- */
  .report-text{
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px;
    line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:340px; overflow-y:auto;
  }
  /* Период отчёта — быстрые пресеты (7/14/30 дней) + своё число, в одну строку,
     как в привычных аналитических дашбордах ("Last 7 days / 30 days / Custom"). */
  .report-period-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .report-period-row .field{ margin:0; }
  .report-period-row .field input{ width:76px; }
  /* Компактные плитки с цифрами отчёта (ГЛАВНОЕ) — вместо простыни текста. */
  .report-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .report-stat{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .report-stat-label{ font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:5px; }
  .report-stat-value{ font-size:18px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; }
  .report-stat-sub{ font-size:11px; color:var(--ink-faint); margin-top:1px; font-variant-numeric:tabular-nums; }
  /* Таблица по объектам — медаль, отель, закрыто/открыто/% в виде обычной
     компактной таблицы, а не строк текста. */
  .report-hotel-table td{ font-variant-numeric:tabular-nums; }
  .report-hotel-table .medal{ font-size:15px; }
  .report-pct-bar{ display:inline-block; width:46px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; vertical-align:middle; margin-right:6px; }
  .report-pct-bar > span{ display:block; height:100%; background:var(--accent); }
  details.report-raw{ margin-top:14px; }
  details.report-raw > summary{ cursor:pointer; font-size:12.5px; color:var(--ink-soft); font-weight:600; user-select:none; }
  details.report-raw > summary:hover{ color:var(--ink); }
  details.report-raw .report-text{ margin-top:10px; }

  /* ---------- panel (slide-over) ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(10,16,22,.35); z-index:20; }
  .panel{
    position:fixed; top:0; right:0; height:100vh; width:460px; max-width:94vw; background:var(--surface);
    box-shadow:-8px 0 30px rgba(0,0,0,.18); z-index:21; overflow-y:auto; border-left:1px solid var(--line);
  }
  .panel-head{ padding:18px 20px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:10px; position:sticky; top:0; background:var(--surface); z-index:2;}
  .panel-body{ padding:20px; display:flex; flex-direction:column; gap:18px; }
  .panel-close{ margin-left:auto; }
  .kv{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--ink-faint); }
  .kv .v{ font-weight:600; text-align:right; }
  .deadline-box{ padding:12px 14px; border-radius:9px; border:1px solid var(--line); }
  .deadline-box.overdue{ border-color:var(--crit); background:var(--crit-soft); }
  .deadline-box.soon{ border-color:var(--warn); background:var(--warn-soft); }
  .note{ padding:9px 10px; background:var(--surface-2); border-radius:8px; font-size:12.5px; margin-bottom:7px; }
  /* 0.3.0 (по просьбе Антона): «Журнал» в карточке заявки — видно примерно
     4 последних записи, остальные (старые) — прокруткой внутри блока, а не
     растягивая всю карточку заявки в высоту. */
  .journal-list{ max-height:320px; overflow-y:auto; padding-right:4px; }
  .note .meta{ color:var(--ink-faint); font-size:11px; margin-bottom:3px; }
  .actions-row{ display:flex; gap:8px; flex-wrap:wrap; }
  /* "Ход работ" — компактный аккордеон: по умолчанию видна только строка
     галочка+название+шеврон (1 строка на пункт), тело (формы/списки) — только
     у раскрытого пункта. Раньше все 4 пункта были всегда полностью раскрыты
     и раздел растягивался на весь экран. */
  .milestone-row{ border-top:1px solid var(--line); }
  .milestone-row:first-child{ border-top:none; }
  .milestone-hd{ display:flex; align-items:center; gap:8px; padding:7px 2px; cursor:pointer; user-select:none; }
  /* Значок-иконка пункта (бригада/материал/работа/акт) — та же картинка, что и
     в статус-иконках под номером заявки наверху (см. STATUS_ICON_DEFS), чтобы
     обе точки были явно "одно и то же состояние". С версии 0.2.2 значок
     "Материал" — трёхцветный (см. materialsState/.warn-lit/.milestone-icon.warn)
     и уже не кликабелен: состояние теперь целиком выводится из счетов и флажка
     "материал не нужен" (см. setMaterialsNotNeeded). "Работа" и "Акт" отмечаются
     выполненными реальным действием (приложить фото/подписать акт), поэтому там
     значок тоже не кликабелен. */
  .milestone-icon{ flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--ink-faint); border:none; padding:0; }
  .milestone-icon svg{ width:14px; height:14px; display:block; }
  .milestone-icon.done{ background:var(--ok-soft); color:var(--ok); filter:drop-shadow(0 0 3px var(--ok)); }
  .milestone-icon.warn{ background:var(--warn-soft); color:var(--warn); filter:drop-shadow(0 0 3px var(--warn)); }
  button.milestone-icon{ cursor:pointer; }
  .milestone-title{ flex:1; min-width:0; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .milestone-meta{ flex:none; font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
  /* Кнопка "прикрепить" прямо в строке чек-листа (видна без разворачивания) —
     круглая иконка со скрепкой, поверх которой лежит невидимый input[type=file];
     клик по ней открывает системный диалог выбора файлов (можно выбрать сразу
     несколько — счетов на бригаду/материал, или фото на работу). */
  .milestone-attach-btn{ flex:none; position:relative; overflow:hidden; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-faint); cursor:pointer; }
  .milestone-attach-btn svg{ width:13px; height:13px; display:block; }
  .milestone-attach-btn:hover{ color:var(--accent); border-color:var(--accent-line); }
  .milestone-attach-btn input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .milestone-chevron{ flex:none; color:var(--ink-faint); font-size:10px; }
  .milestone-body{ padding:0 4px 10px 32px; }
  .line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---------- modal ---------- */
  .modal-scrim{ position:fixed; inset:0; background:rgba(10,16,22,.4); z-index:30; display:flex; align-items:flex-start; justify-content:center; padding:6vh 20px; overflow-y:auto; }
  .modal{ background:var(--surface); border-radius:12px; width:640px; max-width:100%; box-shadow:var(--shadow); }
  .modal-head{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .modal-head h2{ font-size:16px; margin:0; flex:1; }
  .modal-body{ padding:18px 20px; max-height:70vh; overflow-y:auto; }
  .modal-foot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }

  /* ---------- workorder (print) ---------- */
  .wo-page{ max-width:760px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:40px 44px; box-shadow:var(--shadow); }
  .wo-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .wo-co{ font-weight:700; font-size:14px; }
  .wo-addr{ color:var(--ink-faint); font-size:12px; margin-top:2px; }
  .wo-title{ font-size:22px; font-weight:700; margin:18px 0 2px; }
  .wo-no{ color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; font-size:13px; }
  .wo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 26px; margin:22px 0; }
  .wo-field .k{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  .wo-field .v{ font-size:14.5px; margin-top:3px; }
  .wo-desc{ background:var(--surface-2); border-radius:9px; padding:14px 16px; margin:8px 0 20px; font-size:13.5px; }
  .wo-sign{ display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-top:44px; }
  .sign-line{ border-top:1px solid var(--ink-faint); padding-top:6px; font-size:11.5px; color:var(--ink-faint); }
  .wo-toolbar{ max-width:760px; margin:0 auto 16px; display:flex; gap:8px; justify-content:flex-end; }
  @media print{
    .sidebar, .topbar, .wo-toolbar, .no-print{ display:none !important; }
    body, .content{ background:#fff; padding:0; margin:0; }
    .wo-page{ box-shadow:none; border:none; max-width:none; }
  }

  /* ---------- мобильная адаптация (0.3.9, по просьбе Антона: "чтобы
     работала на телефоне") — базовый набор: сайдбар прячется за гамбургер,
     карточка заявки открывается на весь экран, формы/сетки в одну колонку.
     Тот же порог 880px, что и у .two-col выше — ничего из этого не действует
     на десктопе (сайдбар остаётся как был, шире экрана — стили просто не
     применяются). */
  @media (max-width:880px){
    #app{ max-width:100%; box-shadow:none; }
    .hamburger-btn{ display:inline-flex; }
    .sidebar{
      position:fixed; top:0; left:0; z-index:26; width:250px; flex:0 0 250px;
      transform:translateX(-100%); transition:transform .18s ease; box-shadow:8px 0 30px rgba(0,0,0,.22);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-scrim.open{ display:block; position:fixed; inset:0; background:rgba(10,16,22,.35); z-index:25; }
    .topbar{ padding:12px 14px; gap:10px; }
    .topbar h1{ font-size:16px; }
    .content{ padding:16px 14px 40px; }
    /* карточка заявки (.panel — обычно узкая выезжающая справа панель)
       на телефоне занимает весь экран, а не 460px/94vw как на десктопе. */
    .panel{ width:100%; max-width:100%; }
    /* модалки — тоже на весь экран, без полей вокруг (модал-скрим на
       десктопе центрирует узкое окно с отступами сверху/по бокам). */
    .modal-scrim{ padding:0; align-items:stretch; }
    .modal{ width:100%; max-width:100%; min-height:100vh; border-radius:0; }
    /* формы/сетки, рассчитанные на 2 колонки на десктопе, на телефоне в
       одну — как и .two-col выше (тот же приём, другой набор селекторов). */
    .field-row, .wo-grid, .wo-sign{ grid-template-columns:1fr; }
    /* .grid-kpi и .report-stats уже сами по себе адаптивны
       (repeat(auto-fit,minmax(...))) — под них не нужен отдельный override:
       колонки и так сжимаются вплоть до одной на самых узких экранах. */
    /* 0.4.0 (по фото Антона: "фото 2-4 — много чего не читается") — все
       таблицы приложения растянуты в 100% ширины (см. правило "table{...}"
       выше), а .table-wrap вокруг них — только overflow-x:auto (прокрутка
       появляется, ТОЛЬКО если таблица шире своего контейнера). На десктопе
       так и есть: контента внутри .content хватает места, 100% ничего не
       ломает. На телефоне же 100% заставляет браузер СЖИМАТЬ колонки под
       ширину экрана вместо того, чтобы дать таблице стать шире и
       прокручиваться — отсюда обрезанные "счёт"→"c…", наползающие друг на
       друга суммы и урезанные названия отелей на скриншотах. width:auto
       вместо 100% (только на телефоне) снимает это ограничение — таблица
       остаётся на всю ширину карточки, пока содержимого хватает, но
       становится шире и скроллится по горизонтали, если нет; там, где у
       таблицы есть <colgroup> с фиксированными ширинами (.registry-table),
       это те самые пиксельные ширины и работает ровно то же самое решение,
       что уже применялось к ней на десктопе, просто теперь доступное и на
       телефоне вместо принудительного сжатия. */
    .table-wrap table{ width:auto; min-width:100%; }
    /* Пустая таблица (например, "Наличные расходы" без единой записи) всё
       равно получает ширину по заголовкам колонок ("КОММЕНТАРИЙ", "ВЫДАНО" и
       т.п.) — этого достаточно, чтобы таблица стала шире экрана даже без
       единой строки данных. "Таблица пуста" по центру такой широкой таблицы
       обрезается на старте (видна только середина, а не весь текст) — по
       левому краю читается сразу, без прокрутки. */
    .table-wrap .empty-state{ text-align:left; }
  }

  .banner{ display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:9px; background:var(--warn-soft); color:var(--warn); font-size:13px; margin-bottom:18px; font-weight:500; }
  .banner .btn{ margin-left:auto; }
  .helptext{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .zone-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); }
  .zone-legend span b{ color:var(--ink); }
  /* 0.3.5: height/width сами по себе не защищают от переполнения — если
     leaflet.css с CDN подгрузится позже основной страницы (медленная сеть,
     блокировка jsdelivr и т.п.), у тайлов ещё не будет "position:absolute" и
     они на мгновение (а то и насовсем, если стиль так и не подтянется)
     лягут в обычный поток внутри #map-canvas, раздувая блок вниз/вширь и
     перекрывая собой сайдбар и остальную страницу — ровно то, что увидел
     Антон в проде. position:relative + overflow:hidden выставляем СВОИМ
     правилом (не полагаясь на .leaflet-container из внешнего CSS), чтобы
     карта была гарантированно обрезана по границам блока в любом случае.
     contain:layout — дополнительная страховка на случай, если что-то внутри
     всё же попробует вылезти через position:fixed/absolute с отступами от
     viewport, а не от контейнера. */
  #map-canvas{ height:540px; width:100%; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface-2); position:relative; overflow:hidden; contain:layout; }
  /* 0.3.4: собственная иконка метки для Leaflet (см. mapMarkerIcon) — число
     активных заявок прямо на метке, в цветах приложения (акцентный цвет —
     как только в отеле есть открытые заявки, серый — если их нет). */
  .map-marker-icon{ background:none; border:none; }
  .map-marker-badge{
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-faint);
    background:var(--surface); border:2px solid var(--line); box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer;
  }
  .map-marker-badge.has-tickets{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  /* по просьбе Антона: название отеля видно на самой карте, не только по
     наведению (см. mapHotelTooltipHtml/подсказка ниже) — подпись под меткой. */
  .map-marker-label{
    position:absolute; top:31px; left:50%; transform:translateX(-50%);
    white-space:nowrap; font-size:11px; font-weight:600; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; box-shadow:0 1px 3px rgba(0,0,0,.22); pointer-events:none;
  }
  /* 0.3.5: всплывающая подсказка при наведении на метку отеля (см. ensureMap) —
     свои цвета вместо стандартных белых у Leaflet, чтобы не выбивалось из
     тёмной/светлой темы приложения. */
  .map-hotel-tip{ background:var(--surface) !important; color:var(--ink) !important; border:1px solid var(--line) !important; border-radius:8px !important; box-shadow:0 4px 16px rgba(0,0,0,.25) !important; padding:8px 10px !important; font-family:inherit; opacity:1 !important; }
  .map-hotel-tip::before{ display:none; }
  .map-hotel-tip .mht-title{ font-weight:700; font-size:13px; margin-bottom:4px; }
  .map-hotel-tip .mht-row{ font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between; gap:14px; }
  .map-hotel-tip .mht-row b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  ::selection{ background:var(--accent-soft); }

  /* ---------- auth screen ---------- */
  /* width:100% (0.2.10) — #app само по себе display:flex (см. #app выше), а
     .auth-wrap/.configwarn/"Загрузка…" — единственные дети #app на экранах
     входа/загрузки/ожидания. Без width:100% каждый из них как flex-элемент
     сжимается до ширины своего контента (карточки в 380px) и прижимается к
     ЛЕВОМУ краю #app (который сам по себе центрирован на странице через
     max-width+margin:auto) — снаружи это выглядит так, будто окно входа
     висит слева, а не по центру. width:100% отдаёт .auth-wrap всю ширину
     #app, и уже её собственные align-items/justify-content центрируют карточку.*/
  .auth-wrap{ width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:380px; max-width:100%; padding:34px 30px; }
  .auth-logo{ font-weight:700; font-size:19px; margin-bottom:2px; }
  .auth-sub{ color:var(--ink-faint); font-size:12.5px; margin-bottom:26px; }
  .auth-err{ background:var(--crit-soft); color:var(--crit); border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; }
  .auth-ok{ background:var(--ok-soft); color:var(--ok); border-radius:8px; padding:12px 14px; font-size:13px; }
  /* "Заказчик" без доступа (0.2.8) — тот же экран-обёртка входа, но нейтрально-
     предупреждающего цвета, а не зелёного "успеха" (auth-ok выше). */
  .auth-maintenance{ background:var(--warn-soft); color:var(--warn); border-radius:8px; padding:12px 14px; font-size:13px; }
  .configwarn{ max-width:560px; margin:60px auto; padding:24px 26px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>

<script>
(function(){
  "use strict";

  /* ============================== SUPABASE CONFIG ==============================
     Заполните значениями вашего проекта: Project Settings -> API
     (Project URL и anon public key — не секретный service_role!). */
  var SUPABASE_URL = "https://wpgbkndpojjjimppxogm.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_WOzfGGAkM1SJiFKnhkBc2w_Nia1I0za";
  /* ============================================================================ */

  var CONFIGURED = SUPABASE_URL.indexOf("YOUR-PROJECT") === -1 && SUPABASE_ANON_KEY.indexOf("YOUR-ANON") === -1;
  // 0.3.4: карта отелей (0.3.6: теперь часть «Дашборда», а не отдельный
  // пункт меню — см. viewDashboard/viewMap) на Leaflet + бесплатных тайлах
  // OpenStreetMap — ключ API больше не нужен, MAPS_CONFIGURED убран;
  // единственное, что ещё может не загрузиться — сама библиотека Leaflet с
  // CDN (см. LIB_LOADED ниже — тот же приём для supabase-js).
  var MAPS_LIB_LOADED = typeof window.L !== "undefined" && !!window.L.map;
  var LIB_LOADED = typeof window.supabase !== "undefined" && !!window.supabase.createClient;
  var sb = (CONFIGURED && LIB_LOADED) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  /* ============================== CONFIG ============================== */
  // Список отелей раньше был зашит прямо здесь в коде — теперь он хранится в
  // таблице hotels в Supabase и редактируется в разделе «Отели» интерфейса
  // (добавить/переименовать/сменить зону/снять с эксплуатации — без правки кода
  // и передеплоя). SQL-скрипт при первой настройке сам заполняет эту таблицу
  // теми же 8 отелями, что были здесь раньше. См. state.hotels и reloadHotels().
  var ZONE_HOURS = {1:24, 2:48, 3:72};
  var ZONE_LABEL = {1:"Зона 1 · авто", 2:"Зона 2 · авиа", 3:"Зона 3 · смешанная"};
  var GROUP_LABEL = {1:"Группа 1 · критическая", 2:"Группа 2 · средняя", 3:"Группа 3 · плановая"};

  // 0.2.18: ручное удаление заявки из карточки (по просьбе Антона — например,
  // когда заявку удалили в c-lector и её уже не нужно держать в системе, или
  // завели по ошибке). Удаление необратимо и каскадом стирает всё, что
  // привязано к заявке (счета, фото, журнал — см. "on delete cascade" в
  // supabase_schema.sql).
  // 0.4.4: как и canEditRegistry() выше, раньше это была проверка роли
  // (Администратор/Руководитель), теперь — чистая персональная галочка
  // can_delete_ticket, подставляемая по умолчанию при смене роли (см.
  // ROLE_DEFAULT_DELETE_TICKET выше), которую владелец может выставить/снять
  // независимо от роли через окно «Права».
  function canDeleteTicket(){
    return !!(state.me && state.me.can_delete_ticket);
  }
  // Единственный email, которому в разделе «Команда» доступны изменение
  // роли/зон, включение/отключение и удаление сотрудника, а также окно
  // «Права» — по просьбе Антона (0.4.4: явно закреплено — администратор может
  // быть только один, и это он) это должен делать только он, а не любой, кто
  // открыл «Команду». Как и ROLE_NAV выше, это ограничение только интерфейса:
  // RLS в базе остаётся открытой для всех вошедших, так что это подсказка/
  // удобство, а не настоящая защита от технически подкованного сотрудника.
  var OWNER_EMAIL = "anton.byst@gmail.com";
  function isOwner(){ return !!(state.me && state.me.email && state.me.email.toLowerCase() === OWNER_EMAIL.toLowerCase()); }
  // Реестр платежей — по просьбе Антона упрощён до простого списка прикреплённых
  // счетов: заявка, отель, сам файл. Раньше здесь было 23 колонки 1:1 с
  // корпоративным Excel-файлом (поставщик, суммы, валюта, НДС, статья бюджета,
  // ERP-поля и т.д.) — все они заполнялись вручную и оказались не нужны прямо
  // в этом приложении.
  // "Оплачено" (версия 0.2.2, п.3) добавлена последней колонкой, чтобы не
  // сдвигать нумерацию/сортировку уже существующих — редактировать её могут
  // только роли, перечисленные в canEditRegistry() выше.
  // 0.2.13.1: "Добавлен в реестр" убрана с экрана и из выгрузки (даты и так
  // фильтруются полями "с"/"по" в фильтрах — отдельная колонка дублировала их).
  // Взамен добавлены "Валюта", "НДС", "Налог" и расчётная "Учтено в затратах" —
  // см. CURRENCY_VAT_RATE/TAX_BASIS_RATE/invoiceCostAccounted() ниже.
  // 0.2.15: добавлена "Подано в оплату" — промежуточный статус между
  // "счёт прикреплён" и "оплачено" (см. setInvoiceSubmitted).
  // 0.2.17 (по просьбе Антона): "Файл" переименован в "Счёт" (сама ячейка
  // всегда показывает общее слово "счёт", а не имя файла — см. viewRegistry —
  // чтобы длинное имя не растягивало колонку); "Учтено в затратах" явно
  // указывает валюту и что НДС уже вычтен (это именно так считается, см.
  // invoiceAccountedKZT).
  var REGISTRY_COLUMN_LABELS = ["№","№ заявки (c-lector)","Отель","Счёт","Сумма","Валюта","НДС","Налог","Учтено в затратах, KZT без НДС","Подано в оплату","Оплачено"];

  // Ставка НДС по валюте платежа (0.2.13.1, по просьбе Антона): KZT — 16%,
  // RUB/BYN — 20%. Нужна только чтобы снять НДС с суммы, если она указана
  // "с НДС" — см. invoiceCostAccounted().
  var CURRENCY_VAT_RATE = { KZT: 0.16, RUB: 0.20, BYN: 0.20 };
  // Доп. налог/наценка, которую нужно учесть в бюджете сверх суммы без НДС, в
  // зависимости от того, как оплачен счёт: обычный счёт от плательщика НДС —
  // 0%, подрядчик на упрощённой системе налогообложения — 20%, наличный
  // расчёт — 30% (все три значения — по словам Антона).
  // 0.2.15: "Обычный счёт" (0%) больше не отдельный пункт списка — если
  // доп. налог не указан (прочерк), он и означает 0%, как раньше означал
  // выбор "Обычный счёт". "regular" в TAX_BASIS_RATE оставлен только ради
  // старых счетов, у которых это значение уже сохранено в базе.
  var TAX_BASIS_LABEL = { regular: "Обычный счёт", simplified: "Упрощёнка у подрядчика (+20%)", cash: "Наличный расчёт (+30%)" };
  var TAX_BASIS_RATE = { regular: 0, simplified: 0.20, cash: 0.30 };
  // 0.3.6 (по просьбе Антона, п.5): раньше доп. налог был жёстко одним из
  // трёх готовых значений (0/20/30%) — теперь можно ввести СВОЙ процент
  // ("custom"), для случаев, которые не укладываются в "упрощёнку"/"нал.".
  // Сам процент хранится не отдельной колонкой в БД (чтобы не менять схему
  // ради одного числа), а в уже существующем JSONB-поле extra — тем же
  // приёмом, что alloc_percent (см. setInvoiceAllocPercent) — и читается
  // этими двумя функциями вместо прямого обращения к TAX_BASIS_LABEL/RATE.
  function invoiceCustomTaxPct(iv){
    var p = iv && iv.extra && iv.extra.custom_tax_pct;
    return (typeof p==="number" && isFinite(p)) ? p : null;
  }
  // 0.3.7 (по просьбе Антона: "свой налог - это или % или сумма, я должен
  // иметь возможность ввести или то или то") — "Свой" доп. налог теперь можно
  // ввести либо процентом (как в 0.3.6), либо готовой суммой в ₸ сверх суммы
  // без НДС, когда доп. расход известен как число, а не как доля от счёта.
  // Взаимоисключающе — тем же приёмом, что alloc_percent/alloc_amount у
  // "Доли" (setInvoiceAllocPercent/Amount): заполнение одного стирает другое
  // (см. setInvoiceCustomTaxPct/setInvoiceCustomTaxAmount).
  function invoiceCustomTaxAmount(iv){
    var a = iv && iv.extra && iv.extra.custom_tax_amount;
    return (typeof a==="number" && isFinite(a)) ? a : null;
  }
  function taxBasisRate(iv){
    if(!iv.tax_basis) return 0;
    if(iv.tax_basis==="custom"){
      // Фиксированная сумма — не ставка, считается отдельно прямым сложением
      // (см. invoiceCostAccounted), сюда её не переводим.
      if(invoiceCustomTaxAmount(iv)!=null) return null;
      var pct = invoiceCustomTaxPct(iv); return pct!=null ? pct/100 : null;
    }
    return TAX_BASIS_RATE.hasOwnProperty(iv.tax_basis) ? TAX_BASIS_RATE[iv.tax_basis] : null;
  }
  function taxBasisLabel(iv){
    var tb = iv.tax_basis==="regular" ? null : iv.tax_basis;
    if(!tb) return "";
    if(tb==="custom"){
      var amt = invoiceCustomTaxAmount(iv);
      if(amt!=null) return "Свой (+"+fmtKZT(amt)+" ₸)";
      var pct = invoiceCustomTaxPct(iv);
      return "Свой ("+(pct!=null?("+"+fmtKZT(pct)+"%"):"не указано")+")";
    }
    return TAX_BASIS_LABEL[tb] || tb;
  }
  // "Учтено в затратах" = сумма без НДС (снятого по ставке валюты, если
  // "Сумма" указана с НДС) × (1 + доп. налог по способу оплаты). Возвращает
  // null, пока не заполнены сумма/валюта/отметка НДС — колонка в этом случае
  // показывает "—", как и незаполненная "Сумма". Начиная с 0.2.15 пустой
  // "Налог" (прочерк) — это ЗНАЧЕНИЕ "без доп. налога" (0%), а не признак
  // незаполненности: при "с НДС" он теперь ставится автоматически.
  // 0.4.0: вынесено из invoiceCostAccounted — та же формула (вычесть НДС,
  // прибавить доп. налог по способу оплаты счёта iv), но применяется к
  // произвольной "сырой" сумме, а не обязательно к iv.amount целиком. Нужно
  // для доли отдельной заявки в общем счёте (см. setInvoiceAllocAmount) —
  // раньше сумма, введённая туда, считалась уже "Учтено в затратах" этой
  // заявки и НДС из неё фактически никогда не вычитался (по просьбе Антона,
  // п.1 — "не отнимается ндс").
  function invoiceApplyVatTax(iv, rawAmount){
    if(rawAmount==null || iv.vat_included==null) return null;
    var vatRate = CURRENCY_VAT_RATE[iv.currency];
    if(vatRate==null) return null; // валюта не выбрана или не из известных (KZT/RUB/BYN)
    var noVat = iv.vat_included ? (rawAmount / (1 + vatRate)) : rawAmount;
    // 0.3.7: "Свой" доп. налог фиксированной суммой в ₸ — прибавляется как
    // есть поверх суммы без НДС, а не как ставка (см. invoiceCustomTaxAmount/
    // taxBasisRate выше — так что этот случай проверяем раньше и отдельно).
    if(iv.tax_basis==="custom"){
      var customAmt = invoiceCustomTaxAmount(iv);
      if(customAmt!=null) return noVat + customAmt;
    }
    var taxRate = taxBasisRate(iv);
    if(taxRate==null) return null; // на случай неизвестного значения в базе, либо "свой" ещё не введён (ни % ни сумма)
    return noVat * (1 + taxRate);
  }
  function invoiceCostAccounted(iv){
    if(iv.amount==null) return null;
    return invoiceApplyVatTax(iv, iv.amount);
  }
  // 0.4.0: обратное к invoiceApplyVatTax — от уже посчитанной "Учтено в
  // затратах" суммы обратно к "сырой" (как в документе, с НДС, без вычета
  // доп. налога). Нужно только для того, чтобы при повторном открытии поля
  // "= ... ₸" доли счёта (см. registryGroupExpandRows/registryAllocFieldCell)
  // в него подставлялось то же число, которое туда вводили в прошлый раз, а
  // не пересчитанная "Учтено в затратах" — иначе поле "забывало бы", что в
  // него ввели, стоило один раз закрыть и открыть заново.
  function invoiceUnapplyVatTax(iv, accountedAmount){
    if(accountedAmount==null || iv.vat_included==null) return null;
    var vatRate = CURRENCY_VAT_RATE[iv.currency];
    if(vatRate==null) return null;
    var noVat;
    if(iv.tax_basis==="custom" && invoiceCustomTaxAmount(iv)!=null){
      // Тем же способом, что и в setInvoiceAllocAmount — фикс. доп. налог не
      // масштабируется по доле, здесь он просто не участвовал в прямом счёте.
      noVat = accountedAmount;
    } else {
      var taxRate = taxBasisRate(iv);
      if(taxRate==null) return null;
      noVat = accountedAmount / (1 + taxRate);
    }
    return iv.vat_included ? (noVat * (1 + vatRate)) : noVat;
  }

  // 0.2.16: "Учтено в затратах" для RUB/BYN счетов переводится в KZT по
  // курсу Нацбанка РК — иначе итоги "Оплачено"/"К оплате" в реестре складывали
  // бы суммы в разных валютах как одну. Курс берём: для уже оплаченных счетов —
  // на дату оплаты (paid_at), для ещё не оплаченных — на сегодня (по просьбе
  // Антона: показывает актуальную оценку, после реальной оплаты пересчитается
  // на дату оплаты). Курс приходит из Edge Function (nbk-rate) асинхронно —
  // тот же приём, что и ensurePhotoUrl: кэш + фоновая загрузка + render()
  // по готовности, вызывающий код получает {state:"pending"} на первый показ.
  var nbkRateCache = {}; // ключ "ВАЛЮТА|ГГГГ-ММ-ДД" -> "pending" | "error" | {rate,quant}
  function isoToDDMMYYYY(iso){ var p=iso.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
  function ensureNbkRate(currency, dateIso){
    var key = currency+"|"+dateIso;
    if(nbkRateCache.hasOwnProperty(key)) return;
    if(!sb || !sb.functions){ nbkRateCache[key]="error"; return; }
    nbkRateCache[key] = "pending";
    sb.functions.invoke("nbk-rate", { body: { currency: currency, date: isoToDDMMYYYY(dateIso) } }).then(function(res){
      var d = res && res.data;
      if(d && d.rate!=null && d.quant){ nbkRateCache[key] = { rate:d.rate, quant:d.quant }; }
      else { nbkRateCache[key] = "error"; }
      render();
    }).catch(function(){ nbkRateCache[key] = "error"; render(); });
  }
  // Возвращает {value, state, original, currency}: value — сумма в KZT (или
  // null, пока не готова/неизвестна), state — "ok"/"pending"/"error"/"missing"
  // (missing — как и раньше у invoiceCostAccounted, нет данных для расчёта
  // вообще), original/currency — исходная сумма и валюта (для показа рядом
  // с KZT-суммой, если валюта не KZT).
  function invoiceAccountedKZT(iv){
    var accounted = invoiceCostAccounted(iv);
    if(accounted==null) return { value:null, state:"missing" };
    var cur = iv.currency;
    if(!cur || cur==="KZT") return { value:accounted, state:"ok" };
    var dateIso = (iv.paid && iv.paid_at) ? iv.paid_at.slice(0,10) : new Date().toISOString().slice(0,10);
    ensureNbkRate(cur, dateIso);
    var r = nbkRateCache[cur+"|"+dateIso];
    if(!r || r==="pending") return { value:null, state:"pending", original:accounted, currency:cur };
    if(r==="error") return { value:null, state:"error", original:accounted, currency:cur };
    return { value: accounted * (r.rate/r.quant), state:"ok", original:accounted, currency:cur };
  }
  function fmtKZT(n){ return (Number(n)||0).toLocaleString("ru-RU", {minimumFractionDigits:0, maximumFractionDigits:2}); }
  // 0.3.7 (по просьбе Антона, п.3): "где 'учтено в затратах' где-то отражается
  // сумма после запятой, а где-то нет" — это особенность fmtKZT выше
  // (minimumFractionDigits:0) — она специально оставляет разное число знаков
  // по замыслу для обычных сумм (короче для круглых чисел). Для "Учтено в
  // затратах" нужно всегда одинаково 2 знака после запятой — отдельный
  // форматтер, применяется везде, где показывается именно "Учтено в
  // затратах" (accountedKZTLabel, итоги "Оплачено"/"К оплате" внизу реестра,
  // сумма в разделителе месяца, и новая колонка в развёрнутых строках).
  function fmtKZT2(n){ return (Number(n)||0).toLocaleString("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2}); }

  // 0.2.20: в «Реестре платежей» один и тот же файл счёта иногда прикреплён по
  // отдельности сразу к нескольким заявкам (см. invoiceRelatedTickets ниже) —
  // в базе это разные строки invoices с одинаковым file_name. Раньше каждая
  // такая строка была отдельной "непонятной" строкой реестра с пустыми
  // Сумма/Валюта/НДС — теперь их группируем в одну строку (см.
  // registryGroupRow), а сумму делят между заявками по проценту
  // (invoices.extra.alloc_percent, задаётся в развёрнутом виде группы).
  // 0.3.0: раньше invoiceGroupMembers() делал .filter() по ВСЕМ state.invoices
  // на каждый вызов — а вызывается он для КАЖДОЙ строки счёта при отрисовке
  // «Реестра платежей» (buildInvoiceGroups) и карточки заявки, так что при
  // большом количестве счетов рендер одного экрана превращался в O(n²).
  // Индекс "нормализованное имя файла → счета" строится один раз лениво (при
  // первом обращении после очередного render()) и переиспользуется всеми
  // вызовами invoiceGroupMembers в пределах этого рендера — см.
  // invalidateInvoiceGroupIndex() в render().
  var invoiceGroupIndexCache = null;
  function invalidateInvoiceGroupIndex(){ invoiceGroupIndexCache = null; }
  function getInvoiceGroupIndex(){
    if(invoiceGroupIndexCache) return invoiceGroupIndexCache;
    var idx = Object.create(null);
    (state.invoices||[]).forEach(function(x){
      if(!x.file_name) return;
      if(x.extra && x.extra.ungrouped) return; // см. ungroupInvoice — такие копии никогда не группируются
      var key = normalizeForMatch(x.file_name);
      (idx[key] || (idx[key]=[])).push(x);
    });
    Object.keys(idx).forEach(function(key){ idx[key].sort(function(a,b){ return (a.uploaded_at||"").localeCompare(b.uploaded_at||""); }); });
    invoiceGroupIndexCache = idx;
    return idx;
  }
  function invoiceGroupMembers(iv){
    if(!iv || !iv.file_name) return [iv];
    // По имени файла совпадение иногда бывает случайным (два разных счёта,
    // отсканированных под одинаковым обобщённым именем вроде "скан.pdf") — раз
    // это ложно объединяет их в реестре в одну строку, даём отменить это
    // вручную конкретно для одной из копий (см. ungroupInvoice/"Это другой
    // счёт" в развёрнутом виде группы): помеченная extra.ungrouped копия
    // больше никогда не считается той же группой, что и остальные.
    if(iv.extra && iv.extra.ungrouped) return [iv];
    var name = normalizeForMatch(iv.file_name);
    var out = getInvoiceGroupIndex()[name];
    return (out && out.length) ? out : [iv];
  }
  // См. комментарий выше — ручной "разрыв" ложного объединения по имени файла.
  function ungroupInvoice(invoiceId){
    if(!canEditRegistry()) return;
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    if(!iv) return;
    if(!confirm("Пометить «"+iv.file_name+"» по этой заявке как отдельный, не связанный с остальными счёт (совпадение имени файла случайное)?")) return;
    var extra = Object.assign({}, iv.extra||{}, {ungrouped:true});
    delete extra.alloc_percent; // доля больше не имеет смысла вне группы
    iv.extra = extra;
    render();
    sb.from("invoices").update({extra:extra}).eq("id", invoiceId).then(function(){});
  }
  // 0.3.0: группировка по имени файла (см. выше) иногда объединяет ДВА
  // РАЗНЫХ счёта на разные заявки просто потому, что оба сохранены под
  // типичным именем "по умолчанию" от сканера/телефона (img_0001.jpg,
  // скан.pdf, 20260914.pdf) — совпадение случайное, а не признак одного и
  // того же документа. Явный признак такого имени — повод показать
  // предупреждение в реестре (см. registryGroupRow), не полагаясь только на
  // то, что кто-то сам заметит задвоенную сумму. Ручной разрыв уже есть —
  // "это другой счёт" (ungroupInvoice) в развёрнутом виде группы.
  function isGenericInvoiceFileName(fileName){
    if(!fileName) return false;
    var base = String(fileName).replace(/\.[a-zA-Zа-яА-Я0-9]{1,6}$/,"").trim();
    if(!base) return true;
    if(/^[\d\s_.\-]+$/.test(base)) return true; // голая дата/номер/только цифры
    return /^(img|image|dsc|dscn|scan|photo|screenshot|снимок|скан|сканирование|фото|документ|document|copy|копия|изображение)[\s_\-]*\d*$/i.test(base);
  }
  // 0.3.6 (по просьбе Антона, п.6): "не предупреждать, счёт верный" — рядом с
  // предупреждением о случайном совпадении имени (см. isGenericInvoiceFileName
  // выше). В отличие от ungroupInvoice ниже (реально разрывает группировку —
  // для случая, когда это ДЕЙСТВИТЕЛЬНО два разных счёта), эта отметка ничего
  // не меняет в данных — просто говорит "я проверил, это один и тот же

    // в «Реестре платежей», здесь молча показывалась сумма ВСЕГО счёта
    // целиком — выглядело так, будто у заявки уже есть какая-то сумма, а на

  // Автоматический черновик "Сути" без ИИ (платный API для формулировок раньше

  /* ============================== ИМПОРТ ИЗ C-LECTOR ==============================
     С версии 0.2.11 есть официальный API c-lector (только чтение) — заявки, у
     которых он подключён, синхронизируются сами по расписанию (см.
     edge-functions/clector-sync.ts), без участия человека. Ручной путь
     ниже (вставка таблицы/файл) остаётся как запасной вариант — например,
     пока ключ API ещё не выдан, либо для данных, которых в API нет. */
  function normalizeForMatch(s){ return String(s||"").toLowerCase().replace(/[«»"'.,№#]/g,"").replace(/\s+/g," ").trim(); }
  function matchHotelByName(name){
    var n = normalizeForMatch(name);
    if(!n) return null;
    var byNum = n.match(/(?:^|\D)(\d{1,2})(?:\D|$)/); // "№4 Атырау" / "отель 4"
    if(byNum){ var h1 = hotelById(Number(byNum[1])); if(h1 && n.indexOf(normalizeForMatch(h1.name))>-1) return h1; }
    var hlist = state.hotels||[];
    for(var i=0;i<hlist.length;i++){ var hn = normalizeForMatch(hlist[i].name); if(hn && (n.indexOf(hn)>-1 || hn.indexOf(n)>-1)) return hlist[i]; }
    return null;
  }
  // Даты из выгрузки c-lector приходят в привычном для СНГ формате ДД.MM.ГГГГ
  // (иногда через "/", иногда с временем через пробел) — родной JS Date() либо
  // вообще не распознаёт точечный разделитель (Invalid Date), либо для
  // "09/01/2026" молча читает его как ММ/ДД/ГГГГ (американский порядок), что
  // для нашего формата даёт неверную дату без единой ошибки на экране (именно
  // так "16.09" от c-lector могло стать совсем другим числом после импорта).
  // Разбираем день.месяц.год явно; всё остальное (ISO "2026-09-16" и то, что
  // уже пришло валидным ISO-таймстампом) отдаём встроенному парсеру — там
  // порядок компонентов однозначен.
  function parseCLectorDate(raw){
    var s = String(raw==null?"":raw).trim();
    if(!s) return null;
    var m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if(m){
      var day = Number(m[1]), month = Number(m[2]), year = Number(m[3]);
      if(year<100) year += 2000;
      if(month>=1 && month<=12 && day>=1 && day<=31){
        var d = new Date(Date.UTC(year, month-1, day, m[4]?Number(m[4]):0, m[5]?Number(m[5]):0, m[6]?Number(m[6]):0));
        if(!isNaN(d.getTime())) return d;
      }
      return null; // похоже на дату, но день/месяц вне диапазона — не гадаем
    }
    var d2 = new Date(s);
    return isNaN(d2.getTime()) ? null : d2;
  }
  function parseDelimited(text){
    var lines = String(text||"").split(/\r\n|\r|\n/).filter(function(l){ return l.trim()!==""; });
    if(!lines.length) return {headers:[], rows:[]};
    var delim = lines[0].indexOf("\t")>-1 ? "\t" : (lines[0].indexOf(";")>-1 && lines[0].indexOf(",")===-1 ? ";" : ",");
    function splitLine(l){ return l.split(delim).map(function(c){ return c.replace(/^"|"$/g,"").trim(); }); }
    var headers = splitLine(lines[0]);
    var rows = lines.slice(1).map(splitLine);
    return {headers:headers, rows:rows};
  }
  function guessMapping(headers){
    var map = {};
    var used = {};
    // порядок важен: поля с более узким/точным смыслом определяются раньше,
    // чтобы, например, столбец "Номер заявки" не перехватывался описанием
    // из-за общей подстроки "заявк" — уже занятые столбцы пропускаются.
    // "status" обязательно проверяется раньше "description": заголовок вида
    // "Статус заявки" тоже содержит подстроку "заявк", и если бы description
    // (с его широким /заявк/i) шёл первым, он перехватывал бы колонку статуса
    // всякий раз, когда она в файле стоит левее настоящего столбца с описанием —
    // именно так статус переставал подтягиваться в «Заявки».
    var patterns = {

      // заголовки вида "Плановая дата устранения" содержат "дата" и были бы
      // перехвачены created_at, если бы deadline проверялся позже.
      deadline: /срок|дедлайн|due|планов.*(дат|заверш|исполнен)|устранени.*до|дата.*устранен/i,
      // "локация" — номер комнаты/этаж/помещение внутри отеля, где именно
      // поломка (по просьбе Антона: без этого непонятно, куда в отеле идти).
      // Без "номер" в паттерне — иначе пересекается с external_ref ("Номер
      // заявки"), который проверяется раньше и претендует на любой "номер".
      location: /локац|комнат|этаж|помещен|location|room/i,
      // "гарантия/не гарантия" — по решению Антона это поле для заявок из
      // c-lector теперь ЦЕЛИКОМ приходит из выгрузки (см. guessCaseTypeFromText/

      // руками для таких заявок.

      description: /описан|замечан|проблем|суть|заявк/i

    Object.keys(patterns).forEach(function(field){
      for(var i=0;i<headers.length;i++){
        if(used[i]) continue;
        if(patterns[field].test(headers[i])){ map[field]=String(i); used[i]=true; return; }
      }
      map[field] = "";
    });
    return map;
  }

  function readFileAsText(file){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsText(file, "utf-8"); }); }

  function loadImportFile(file){
    var ext = (file.name.split(".").pop()||"").toLowerCase();
    state.importFileError = "";

      if(typeof XLSX==="undefined" || !XLSX.read){
        // Библиотека для чтения Excel не загрузилась (например, заблокирована сетью/VPN) —
        // без этой проверки страница молча ничего не делала при выборе файла.
        state.importFileError = "Не удалось загрузить модуль для чтения Excel-файлов (возможно, заблокирован интернет/VPN). Обновите страницу и попробуйте снова, либо скопируйте таблицу из c-lector и вставьте её текстом выше.";
        render();
        return;
      }
      readFileAsBuffer(file).then(function(buf){
        var wb = XLSX.read(buf, {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:""});
        aoa = aoa.filter(function(r){ return r.some(function(c){ return String(c||"").trim()!==""; }); });
        if(!aoa.length){ state.importFileError = "Файл прочитан, но в нём не найдено ни одной строки с данными."; render(); return; }
        setImportData(aoa[0].map(String), aoa.slice(1));
      }).catch(function(err){
        state.importFileError = "Не удалось прочитать файл: " + (err && err.message ? err.message : err) + ". Проверьте, что это корректный XLSX/XLS-файл, либо вставьте таблицу текстом выше.";
        render();
      });
    } else {
      readFileAsText(file).then(function(text){
        var parsed = parseDelimited(text);
        if(!parsed.headers.length){ state.importFileError = "Файл прочитан, но в нём не найдено ни одной строки с данными."; render(); return; }
        setImportData(parsed.headers, parsed.rows);
      }).catch(function(err){
