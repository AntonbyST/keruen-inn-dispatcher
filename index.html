  // Счёт при загрузке сразу попадает в реестр платежей — просто как файл. Раньше
  // здесь стояло автораспознавание поставщика/суммы/валюты через ИИ (Anthropic
  // Claude), но эту автоматику отключили (платный API), так что все эти поля
  // заполняются вручную прямо в разделе «Реестр платежей».
  // category: null (обычный счёт из общего раздела "Счета") | "crew" (счёт/договор
  // за бригаду/подрядчика) | "materials" (счёт/договор за материалы) — привязывает
  // файл к конкретному пункту чек-листа хода работ в карточке заявки. В «Реестре
  // платежей» показываются ВСЕ счета независимо от категории — категория нужна
  // только для группировки внутри карточки заявки.
  var INVOICE_CATEGORY_LABEL = { crew:"Бригада", materials:"Материал" };
  function uploadInvoice(ticketId, file, category){
    var path = ticketId + "/" + Date.now() + "_" + file.name.replace(/[^\w.\-]+/g,"_");
    return readFileAsBuffer(file).then(function(buf){
      return sb.storage.from("invoices").upload(path, buf, {contentType: file.type || "application/octet-stream"});
    }).then(function(res){
      if(res.error) throw res.error;
      return sb.from("invoices").insert({
        ticket_id: ticketId, file_path: path, file_name: file.name,
        supplier: null, amount: null, currency: null, category: category||null,
        uploaded_by: myLabel(), in_registry: true, added_to_registry_at: new Date().toISOString(),
        extra: { responsible: myLabel() }
      });
    }).then(function(){
      addNote(ticketId, "Прикреплён файл («"+(INVOICE_CATEGORY_LABEL[category]||"Счета")+"»): "+file.name+".");
    }).catch(function(err){
      alert("Не удалось загрузить счёт: " + (err&&err.message?err.message:err));
    });
  }
  function openInvoiceFile(path){
    sb.storage.from("invoices").createSignedUrl(path, 3600).then(function(res){
      if(res.data && res.data.signedUrl) window.open(res.data.signedUrl, "_blank");
      else alert("Не удалось открыть файл.");
    });
  }
  function deleteInvoice(invoiceId, path){
    if(!confirm("Удалить этот файл?")) return;
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    sb.storage.from("invoices").remove([path]).then(function(){
      return sb.from("invoices").delete().eq("id", invoiceId);
    }).then(function(){
      if(iv) addNote(iv.ticket_id, "Удалён файл («"+(INVOICE_CATEGORY_LABEL[iv.category]||"Счета")+"»): "+iv.file_name+".");
    });
  }
  // Галочка "Оплачено" в «Реестре платежей» (версия 0.2.2, п.1/3) — только для
  // ролей из canEditRegistry() (проверка дублируется тут на случай, если кто-то
  // дёрнет обработчик мимо disabled-чекбокса в разметке). Локально патчим
  // state.invoices (как patchTicketLocal выше патчит state.tickets) ДО вызова
  // maybeAutoComplete — иначе materialsState()/materialsIsGreen() в её проверке
  // прочитали бы ещё не обновлённое состояние счёта: эхо по каналу "invoices-rt"
  // (см. reloadInvoices) придёт отдельным сетевым запросом и может не успеть до
  // этой проверки, и заявка с последним оплаченным счётом не закрылась бы сама
  // до следующего изменения.
  // Сумма счёта в «Реестре платежей» (0.2.3, п.2) — как и "Оплачено", доступна
  // только ролям из canEditRegistry(); нужна для подсчёта итогов "оплачено"/
  // "к оплате" внизу реестра. Локально патчим состояние по тому же принципу,
  // что и setInvoicePaid выше — итоговая строка пересчитывается сразу же.
  // 0.2.16: поле "Сумма" в реестре теперь текстовое (не number), чтобы во
  // время ввода можно было показывать разряды пробелом ("1 234,5") — это
  // требует своего форматирования (см. слушатель "input" ниже) и разбора
  // обратно в число при сохранении.
  function formatAmountInputValue(raw){
    var s = String(raw==null?"":raw).replace(/[^\d.,]/g, "");
    var sepIdx = -1;
    for(var i=0;i<s.length;i++){ if(s[i]==="."||s[i]===","){ sepIdx=i; break; } }
    var intPart, fracPart=null;
    if(sepIdx===-1){ intPart = s; }
    else { intPart = s.slice(0, sepIdx); fracPart = s.slice(sepIdx+1).replace(/[.,]/g, "").slice(0,2); }
    intPart = intPart.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
    var grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return fracPart!==null ? (grouped+","+fracPart) : grouped;
  }
  function parseAmountInputValue(val){
    if(val==null) return "";
    return String(val).replace(/[\s ]/g, "").replace(",", ".");
  }
  function setInvoiceAmount(invoiceId, val){
    if(!canEditRegistry()){ alert("Указывать сумму счёта может только Администратор, Руководитель или Финансист."); return; }
    var raw = parseAmountInputValue(val);
    var amount = (raw==="") ? null : Number(raw);
    if(amount!=null && isNaN(amount)){ render(); return; }
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    if(iv) iv.amount = amount;
    // 0.2.16: как только сумма сохранена, поле сразу сворачивается обратно в
    // обычный текст — не дожидаясь потери фокуса (см. просьбу "после внесения
    // цифр... чтобы пропадало окошко для ввода").
    if(state.registryEditingAmountId===invoiceId) state.registryEditingAmountId = null;
    render();
    sb.from("invoices").update({amount:amount}).eq("id", invoiceId).then(function(){
      if(iv) addNote(iv.ticket_id, "Указана сумма счёта «"+iv.file_name+"»: "+(amount!=null?amount:"—")+".");
    });
  }
  // invoiceIdOrIds — обычно один id; для сгруппированной строки «Реестра»
  // (0.2.20, один и тот же счёт сразу на несколько заявок — см.
  // registryGroupRow) сюда приходит список id через запятую, чтобы отметка
  // «оплачено»/«подано в оплату» ставилась сразу на все копии этого счёта, а
  // не расходилась по ним независимо.
  function setInvoicePaid(invoiceIdOrIds, val){
    if(!canEditRegistry()){ alert("Отмечать оплату счетов может только Администратор, Руководитель или Финансист."); return; }
    String(invoiceIdOrIds).split(",").forEach(function(invoiceId){
      var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
      // 0.2.16: paid_at — момент отметки "оплачено", нужен для курса Нацбанка
      // РК "на день оплаты" (см. invoiceAccountedKZT). Снятие галочки оставляет
      // paid_at как есть (не обнуляем) — так при повторной отметке "оплачено"
      // без изменений это будет более-менее та же дата, а если дата всё же
      // изменится — обновится ниже.
      var paidAt = val ? new Date().toISOString() : (iv ? iv.paid_at : null);
      if(iv){ iv.paid = val; iv.paid_at = paidAt; }
      sb.from("invoices").update({paid:val, paid_at:paidAt}).eq("id", invoiceId).then(function(){
        if(iv){
          addNote(iv.ticket_id, val ? "Счёт «"+iv.file_name+"» отмечен оплаченным." : "Отметка «оплачено» снята со счёта «"+iv.file_name+"».");
          if(val) maybeAutoComplete(iv.ticket_id);
        }
      });
    });
    render();
  }
  // 0.3.4 (по просьбе Антона): счёт иногда оплачивают в одном месяце, а
  // отмечают в системе «оплачено» уже позже, задним числом — раньше paid_at
  // всегда проставлялся моментом клика по галочке, поэтому такой счёт
  // попадал в группировку «Реестра платежей» по месяцу ОПЛАТЫ (0.2.19) не
  // туда, куда нужно. Позволяем поправить месяц вручную — день и время
  // внутри месяца берём прежними (если они уже были), меняем только
  // год-месяц, чтобы счёт переехал в нужный раздел.
  function setInvoicePaidMonth(invoiceIdOrIds, monthStr){
    if(!canEditRegistry()){ alert("Изменять месяц оплаты может только Администратор, Руководитель или Финансист."); return; }
    if(!/^\d{4}-\d{2}$/.test(monthStr||"")) return;
    var parts = monthStr.split("-"); var year = Number(parts[0]), month = Number(parts[1]);
    String(invoiceIdOrIds).split(",").forEach(function(invoiceId){
      var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
      if(!iv || !iv.paid) return;
      var oldDate = iv.paid_at ? new Date(iv.paid_at) : null;
      var validOld = oldDate && !isNaN(oldDate.getTime());
      var day = validOld ? oldDate.getUTCDate() : 15;
      var time = validOld ? oldDate.toISOString().slice(11) : "12:00:00.000Z";
      var daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
      if(day>daysInMonth) day = daysInMonth;
      var newIso = year+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0")+"T"+time;
      iv.paid_at = newIso;
      sb.from("invoices").update({paid_at:newIso}).eq("id", invoiceId).then(function(){
        addNote(iv.ticket_id, "Изменён месяц оплаты счёта «"+iv.file_name+"»: "+monthStr+".");
      });
    });
    render();
  }
  // 0.2.15: промежуточная отметка между "прикреплён" и "оплачено" — счёт
  // уже передан в бухгалтерию/банк на оплату, но деньги ещё не ушли.
  // Никак не влияет на расчёты (Учтено в затратах/Оплачено/К оплате) —
  // это только видимый статус для отслеживания движения счетов.
  function setInvoiceSubmitted(invoiceIdOrIds, val){
    if(!canEditRegistry()){ alert("Отмечать «подано в оплату» может только Администратор, Руководитель или Финансист."); return; }
    String(invoiceIdOrIds).split(",").forEach(function(invoiceId){
      var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
      if(iv) iv.submitted_for_payment = val;
      sb.from("invoices").update({submitted_for_payment:val}).eq("id", invoiceId).then(function(){
        if(iv) addNote(iv.ticket_id, val ? "Счёт «"+iv.file_name+"» подан в оплату." : "Отметка «подано в оплату» снята со счёта «"+iv.file_name+"».");
      });
    });
    render();
  }
  // 0.2.20: доля конкретной заявки в счёте, общем на несколько заявок (см.
  // registryGroupRow/registryGroupExpandRows) — процент хранится в
  // invoices.extra (jsonb), сумма при этом только считается на лету от
  // текущей "Учтено в затратах" ОСНОВНОГО счёта (см. invoiceAccountedKZTForTicket),
  // а не хранится отдельно — так она сама пересчитается, если курс НБ РК или
  // сумма счёта потом изменятся.
  function setInvoiceAllocPercent(invoiceId, val){
    if(!canEditRegistry()) return;
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    if(!iv) return;
    var raw = String(val||"").replace(",", ".").trim();
    var pct = raw==="" ? null : Number(raw);
    if(pct!=null && isNaN(pct)){ render(); return; }
    var extra = Object.assign({}, iv.extra||{});
    if(pct==null) delete extra.alloc_percent; else extra.alloc_percent = pct;
    iv.extra = extra;
    render();
    sb.from("invoices").update({extra:extra}).eq("id", invoiceId).then(function(){});
  }
  // Тот же процент, но введённый через сумму в KZT (по текущей "Учтено в
  // затратах" основного счёта) — процент пересчитывается один раз при вводе
  // и дальше хранится как канонический (см. комментарий выше); при пустом
  // счёте (сумма ещё не посчитана) ввод суммы недоступен — сначала нужно
  // указать сумму/валюту/НДС основного счёта.
  function setInvoiceAllocAmount(invoiceId, val){
    if(!canEditRegistry()) return;
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    if(!iv) return;
    var raw = String(val||"").replace(",", ".").trim();
    var amount = raw==="" ? null : Number(raw);
    if(amount!=null && isNaN(amount)){ render(); return; }
    var primary = invoiceGroupPrimary(iv);
    var acc = invoiceAccountedKZT(primary);
    if(amount!=null && !acc.value){ render(); return; }
    var pct = amount==null ? null : (amount / acc.value * 100);
    var extra = Object.assign({}, iv.extra||{});
    if(pct==null) delete extra.alloc_percent; else extra.alloc_percent = pct;
    iv.extra = extra;
    render();
    sb.from("invoices").update({extra:extra}).eq("id", invoiceId).then(function(){});
  }
  // Валюта / НДС / способ оплаты счёта (0.2.13.1) — те же три поля, что нужны
  // invoiceCostAccounted() для расчёта "Учтено в затратах" в «Реестре
  // платежей»; тот же принцип локального патча + сохранения в БД, что и у
  // setInvoiceAmount/setInvoicePaid выше.
  function setInvoiceCurrency(invoiceId, val){
    if(!canEditRegistry()){ alert("Указывать валюту счёта может только Администратор, Руководитель или Финансист."); return; }
    var currency = val || null;
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    if(iv) iv.currency = currency;
    // 0.2.17: как только выбрано — поле сразу сворачивается обратно в
    // обычный текст, тем же приёмом, что «Сумма» (0.2.16).
    if(state.registryEditingFieldKey===(invoiceId+":currency")) state.registryEditingFieldKey = null;
    render();
    sb.from("invoices").update({currency:currency}).eq("id", invoiceId).then(function(){
      if(iv) addNote(iv.ticket_id, "Указана валюта счёта «"+iv.file_name+"»: "+(currency||"—")+".");
    });
  }
  function setInvoiceVatIncluded(invoiceId, val){
    if(!canEditRegistry()){ alert("Указывать, включён ли НДС в сумму, может только Администратор, Руководитель или Финансист."); return; }
    var vatIncluded = val==="with" ? true : (val==="without" ? false : null);
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    // 0.2.15 (по просьбе Антона): если сумма "с НДС", доп. налог в "Налоге"
    // теперь ставится автоматически прочерком (0%) и поле недоступно для
    // выбора — "Упрощёнка"/"Наличный" имеют смысл только для счетов "без
    // НДС". Раньше сбрасывали только "regular", теперь — любое значение.
    var resetTaxBasis = false;
    var update = {vat_included:vatIncluded};
    if(vatIncluded===true && iv && iv.tax_basis){ resetTaxBasis = true; update.tax_basis = null; }
    if(iv){ iv.vat_included = vatIncluded; if(resetTaxBasis) iv.tax_basis = null; }
    if(state.registryEditingFieldKey===(invoiceId+":vat")) state.registryEditingFieldKey = null;
    render();
    sb.from("invoices").update(update).eq("id", invoiceId).then(function(){
      if(iv) addNote(iv.ticket_id, "Указано по счёту «"+iv.file_name+"»: сумма "+(vatIncluded===true?"с НДС":(vatIncluded===false?"без НДС":"—"))+(resetTaxBasis?" (доп. налог сброшен — при «с НДС» ставится автоматически прочерком)":"")+".");
    });
  }
  function setInvoiceTaxBasis(invoiceId, val){
    if(!canEditRegistry()){ alert("Указывать способ оплаты (для расчёта затрат) может только Администратор, Руководитель или Финансист."); return; }
    var iv = (state.invoices||[]).find(function(x){ return x.id===invoiceId; });
    // 0.2.15: при "с НДС" доп. налог не выбирается вручную (см.
    // setInvoiceVatIncluded) — эта проверка на случай прямого вызова.
    if(iv && iv.vat_included===true){ alert("При «с НДС» доп. налог ставится автоматически (прочерк) и недоступен для ручного выбора."); return; }
    var taxBasis = val || null;
    if(iv) iv.tax_basis = taxBasis;
    if(state.registryEditingFieldKey===(invoiceId+":tax")) state.registryEditingFieldKey = null;
    render();
    sb.from("invoices").update({tax_basis:taxBasis}).eq("id", invoiceId).then(function(){
      if(iv) addNote(iv.ticket_id, "Указан способ оплаты счёта «"+iv.file_name+"»: "+(taxBasis?(TAX_BASIS_LABEL[taxBasis]||taxBasis):"—")+".");
    });
  }
  // 0.2.13.1 (доп.): один и тот же счёт иногда прикладывают отдельно к
  // нескольким заявкам сразу (например, счёт поставщика покрывает работы по
  // 2-3 заявкам) — каждое такое прикрепление в базе остаётся своей строкой
  // invoices (см. uploadInvoice: путь файла в сторидже привязан к своей
  // заявке), поэтому в «Реестре платежей» это выглядело как несколько
  // независимых счетов.
  // 0.2.17 (по просьбе Антона): раньше это отмечалось вручную (номера заявок
  // через запятую в prompt) — теперь определяется автоматически: если тот же
  // файл (по имени) отдельно прикреплён и к другим заявкам, они считаются
  // "также относящимися" без какого-либо ручного ввода. Сама сумма/итоги при
  // этом по-прежнему не пересчитываются — это только видимая подсказка, чтобы
  // бухгалтер не считал её отдельно по каждой строке.
  function invoiceRelatedTickets(iv){
    if(!iv || !iv.file_name) return [];
    var name = normalizeForMatch(iv.file_name);
    var seenTickets = {}, out = [];
    (state.invoices||[]).forEach(function(other){
      if(other.id===iv.id) return;
      if(other.ticket_id===iv.ticket_id) return;
      if(normalizeForMatch(other.file_name||"")!==name) return;
      if(seenTickets[other.ticket_id]) return;
      seenTickets[other.ticket_id] = true;
      var t = state.tickets.find(function(x){ return x.id===other.ticket_id; });
      if(t) out.push(t);
    });
    return out;
  }

  // Фото по заявке — рабочий инструмент (до/после, подтверждение выполненных
  // работ), отдельно от c-lector и от счетов. Храним в собственном бакете
  // ticket-photos, чтобы не путать с реестром платежей.
  function reloadPhotos(){
    sb.from("ticket_photos").select("*").order("uploaded_at", {ascending:false}).then(function(res){ state.photos = res.data || []; render(); });
  }
  // category: null (замечание — раздел "Фото", проблема "до") | "act" (фото-
  // доказательство выполненной работы, прикладывается к пункту "Акт" наравне
  // с самим файлом акта — см. actPhotoGrid ниже). Разделены по просьбе Антона:
  // это разные по смыслу фото, и раньше общая галерея приводила к путанице
  // (в т.ч. к тому, что ЛЮБОЕ фото — хоть замечания — засчитывалось как
  // подтверждение "Работа выполнена"; теперь этот пункт всегда только ручной).
  var PHOTO_CATEGORY_LABEL = { act: "к Акту" };
  function uploadPhoto(ticketId, file, category){
    var path = ticketId + "/" + Date.now() + "_" + file.name.replace(/[^\w.\-]+/g,"_");
    return readFileAsBuffer(file).then(function(buf){
      return sb.storage.from("ticket-photos").upload(path, buf, {contentType: file.type || "application/octet-stream"});
    }).then(function(res){
      if(res.error) throw res.error;
      return sb.from("ticket_photos").insert({ ticket_id: ticketId, file_path: path, file_name: file.name, category: category||null, uploaded_by: myLabel(), uploaded_at: new Date().toISOString() });
    }).then(function(){
      addNote(ticketId, "Прикреплено фото"+(PHOTO_CATEGORY_LABEL[category]?(" ("+PHOTO_CATEGORY_LABEL[category]+")"):"")+": "+file.name+".");
    }).catch(function(err){
      alert("Не удалось загрузить фото: " + (err&&err.message?err.message:err));
    });
  }
  function deletePhoto(photoId, path){
    if(!confirm("Удалить это фото?")) return;
    var ph = (state.photos||[]).find(function(x){ return x.id===photoId; });
    sb.storage.from("ticket-photos").remove([path]).then(function(){
      return sb.from("ticket_photos").delete().eq("id", photoId);
    }).then(function(){
      delete photoUrlCache[path];
      if(ph) addNote(ph.ticket_id, "Удалено фото"+(PHOTO_CATEGORY_LABEL[ph.category]?(" ("+PHOTO_CATEGORY_LABEL[ph.category]+")"):"")+": "+ph.file_name+".");
    });
  }
  // Бакет с фото приватный, поэтому для показа миниатюр нужна временная
  // подписанная ссылка — запрашиваем её один раз на путь файла и кешируем в
  // памяти (не в state, чтобы не гонять её через realtime/сравнения состояния),
  // а когда ссылка приходит — перерисовываем открытую карточку заявки.
  function openPhotoFile(path){
    sb.storage.from("ticket-photos").createSignedUrl(path, 3600).then(function(res){
      if(res.data && res.data.signedUrl) window.open(res.data.signedUrl, "_blank");
      else alert("Не удалось открыть фото.");
    });
  }
  var photoUrlCache = {};
  function ensurePhotoUrl(path){
    if(photoUrlCache.hasOwnProperty(path)) return;
    photoUrlCache[path] = "pending";
    sb.storage.from("ticket-photos").createSignedUrl(path, 3600).then(function(res){
      photoUrlCache[path] = (res.data && res.data.signedUrl) || null;
      renderTicketPanel();
    });
  }
  function weekRangeLabel(iso){
    if(!iso) return "";
    var d = new Date(iso);
    var day = d.getDay();
    var diffToMonday = (day===0?-6:1-day);
    var monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
    var sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    function f(x){ return String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0"); }
    return f(monday)+"–"+f(sunday)+"."+sunday.getFullYear();
  }
  // Выгрузка реестра платежей в Excel — те же колонки, что и на экране
  // (REGISTRY_COLUMN_LABELS), плюс колонка "Разбивка по заявкам" вместо
  // прежней "Также в заявках".
  //
  // 0.3.0 (по просьбе Антона): раньше выгрузка шла построчно прямо по
  // invoices — счёт, общий на несколько заявок (см. buildInvoiceGroups/
  // invoiceGroupMembers выше), давал по отдельной строке на каждую копию,
  // с пустыми Сумма/Валюта/НДС на всех копиях кроме "основной". Теперь
  // выгрузка группирует так же, как сам «Реестр платежей» на экране — один
  // общий счёт = одна строка, № заявки перечисляет все заявки через запятую,
  // а доля каждой заявки (если она уже указана) — в отдельной колонке.
  var REGISTRY_EXPORT_COLUMN_LABELS = REGISTRY_COLUMN_LABELS.concat(["Разбивка по заявкам (если счёт общий)"]);
  function exportRegistryExcel(){
    if(typeof XLSX==="undefined" || !XLSX.utils){ alert("Модуль Excel не загрузился (возможно, заблокирован интернет/VPN) — обновите страницу и попробуйте снова."); return; }
    var list = (state.invoices||[]).filter(function(iv){ return iv.in_registry; });
    var groups = buildInvoiceGroups(list);
    var rows = groups.map(function(group, i){
      var primary = group.primary, members = group.members;
      var isGroup = members.length>1;
      var seenTicketIds = {}, uniqueTickets = [];
      members.forEach(function(iv){
        var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
        var tid = tk ? tk.id : null;
        if(tid!=null && seenTicketIds[tid]) return;
        if(tid!=null) seenTicketIds[tid] = true;
        uniqueTickets.push(tk);
      });
      var refCell = uniqueTickets.map(function(tk){ return tk ? (tk.external_ref || tk.id) : "—"; }).join(", ");
      var hotelsById = {};
      uniqueTickets.forEach(function(tk){ var h2 = tk ? hotelById(tk.hotel_id) : null; if(h2) hotelsById[h2.id]=h2; });
      var hotelIds = Object.keys(hotelsById);
      var hotelCell = hotelIds.length===1 ? ("№"+hotelsById[hotelIds[0]].id+" "+hotelsById[hotelIds[0]].name)
        : hotelIds.length>1 ? ("Разные ("+hotelIds.length+")")
        : "";
      var accounted = invoiceCostAccounted(primary);
      var allSubmitted = members.every(function(x){return x.submitted_for_payment;});
      var allPaid = members.every(function(x){return x.paid;});
      var breakdown = "";
      if(isGroup){
        var accKZT = invoiceAccountedKZT(primary);
        breakdown = members.map(function(iv){
          var tk = state.tickets.find(function(x){return x.id===iv.ticket_id;});
          var ref = tk ? (tk.external_ref || tk.id) : "—";
          var pct = invoiceAllocPercent(iv);
          if(pct==null) return ref+": доля не указана";
          var amtLabel = accKZT.value!=null ? " ("+fmtKZT(accKZT.value*(pct/100))+" ₸)" : "";
          return ref+": "+pct+"%"+amtLabel;
        }).join("; ");
      }
      return [
        i+1,
        refCell,
        hotelCell,
        primary.file_name || "",
        primary.amount!=null ? primary.amount : "",
        primary.currency || "",
        primary.vat_included===true ? "С НДС" : (primary.vat_included===false ? "Без НДС" : ""),
        primary.tax_basis ? (TAX_BASIS_LABEL[primary.tax_basis]||primary.tax_basis) : "",
        accounted!=null ? accounted : "",
        allSubmitted ? "Да" : "Нет",
        allPaid ? "Да" : "Нет",
        breakdown
      ];
    });
    var aoa = [REGISTRY_EXPORT_COLUMN_LABELS].concat(rows);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = REGISTRY_EXPORT_COLUMN_LABELS.map(function(){ return {wch:20}; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Реестр платежей");
    XLSX.writeFile(wb, "Реестр_платежей_Keruen_Inn_"+new Date().toISOString().slice(0,10)+".xlsx");
  }
  function reloadPortfolio(){
    sb.from("portfolio_snapshot").select("*").eq("id",1).maybeSingle().then(function(res){
      state.portfolio = res.data || null;
      maybeSeedPortfolio();
      render();
    });
  }
  var notesChannelTicketId = null;
  function fetchNotes(ticketId){
    sb.from("ticket_notes").select("*").eq("ticket_id", ticketId).order("created_at",{ascending:true}).then(function(res){
      state.ticketNotes = res.data || [];
      renderTicketPanel();
    });
  }
  function loadNotesFor(ticketId){
    fetchNotes(ticketId);
    // подписываемся на realtime только один раз на заявку — раньше здесь при
    // каждом вызове (в т.ч. из самого realtime-колбэка) пересоздавалась новая
    // подписка, а старая не всегда успевала быть снята, что при активной
    // работе с журналом (много записей подряд) плодило дублирующиеся каналы.
    if(notesChannelTicketId === ticketId) return;
    if(notesChannel) sb.removeChannel(notesChannel);
    notesChannelTicketId = ticketId;
    notesChannel = sb.channel("notes-"+ticketId).on("postgres_changes",
      {event:"*", schema:"public", table:"ticket_notes", filter:"ticket_id=eq."+ticketId},
      function(){ fetchNotes(ticketId); }
    ).subscribe();
  }

  var seeded = false;
  function maybeSeed(){
    if(seeded || !state.loaded || !state.hotelsLoaded) return;
    if(state.tickets.length>0){ seeded = true; return; }
    seeded = true;
    var now = new Date();
    var examples = [
      { hotelId:4, group:2, description:"Течь в бойлерной, отсыревает стена коридора 2 этажа.", status:"dispatched", assignedTo:"Главный инженер (пример)", createdAt:new Date(now.getTime()-3*3600*1000).toISOString() },
      { hotelId:1, group:3, description:"Не закрывается плотно москитная сетка, номер 108.", status:"new", assignedTo:null, createdAt:new Date(now.getTime()-1*3600*1000).toISOString() },
      { hotelId:7, group:1, description:"Ложное срабатывание пожарной сигнализации на ресепшн, возгорания нет.", status:"onsite", assignedTo:"Главный инженер (пример)", caseType:"warranty", createdAt:new Date(now.getTime()-30*3600*1000).toISOString() }
    ];
    examples.forEach(function(ex){
      var hotel = hotelById(ex.hotelId);
      if(!hotel) return; // отель мог быть переименован/удалён из «Отелей» ещё до первого запуска
      sb.from("tickets").insert({
        hotel_id: ex.hotelId, zone: hotel.zone, ticket_group: ex.group, description: ex.description,
        status: ex.status, assigned_to: ex.assignedTo||null, created_by:"Пример", created_at: ex.createdAt,
        arrival_deadline: addHours(ex.createdAt, ZONE_HOURS[hotel.zone]),
        arrived_at: ex.status==="onsite" ? addHours(ex.createdAt,4) : null,
        resolution_deadline: ex.status==="onsite" ? addBusinessDays(addHours(ex.createdAt,4),3) : null,
        case_type: ex.caseType||null, demo:true
      }).then(function(){});
    });
  }
  // ============ «Отчёты» → еженедельный отчёт по СЕРВИСу (0.2.5) ============
  // Живые счётчики СЕРВИСа по каждому отелю в сервисе (в стиле выгрузки
  // c-lector.ru "Заявок всего/подано/в работе/просрочено/завершено/отклонено",
  // см. hotel-reports в памяти) — считаем ПРЯМО из state.tickets, xlsx/импорт
  // для этого больше не нужен. "Всего" — все не-демо заявки отеля за всё
  // время (растёт монотонно), "Открыто" = подано + в работе.
  function computeLiveHotelStats(){
    var byHotel = {};
    (state.hotels||[]).forEach(function(h){ if(h.in_service) byHotel[h.id] = {total:0,submitted:0,inWork:0,overdue:0,done:0,rejected:0}; });
    (state.tickets||[]).forEach(function(t){
      if(t.demo) return;
      var row = byHotel[t.hotel_id];
      if(!row) return; // отель не в сервисе (напр. монтажный №8) — в отчёт СЕРВИС не входит
      row.total++;
      var done = isTicketDone(t);
      if(done){
        // тот же признак "отклонена", что и в isTicketDone(): текст статуса
        // c-lector, если он есть, иначе внутренний status (на практике
        // внутренний "rejected" сейчас нигде не проставляется — отклонение
        // всегда приходит из c-lector, но проверяем на будущее).
        var rejected = t.external_status ? /отклон|отказ/i.test(t.external_status) : t.status==="rejected";
        if(rejected) row.rejected++; else row.done++;
      } else {
        if(deadlineInfo(t).overdue) row.overdue++;
        if(t.status==="new") row.submitted++; else row.inWork++;
      }
    });
    return byHotel;
  }
  function sumHotelStats(byHotel){
    var totals = {total:0,submitted:0,inWork:0,overdue:0,done:0,rejected:0};
    Object.keys(byHotel||{}).forEach(function(id){ var r=byHotel[id]||{}; Object.keys(totals).forEach(function(f){ totals[f]+=(r[f]||0); }); });
    return totals;
  }
  // Раз в день добавляем/обновляем строку-снимок на СЕГОДНЯ (ticket_stats_snapshots)
  // — это и есть будущая точка сравнения "N дней назад" для отчёта, без
  // какой-либо внешней выгрузки. Обновляем существующую строку за сегодня при
  // каждом открытии платформы (а не только создаём один раз), чтобы к концу
  // дня в снимке было отражено более свежее состояние.
  var statsSnapshotChecked = false;
  function maybeRecordTodaysStatsSnapshot(){
    if(statsSnapshotChecked) return;
    if(!state.loaded || !state.hotelsLoaded || !state.statsSnapshotsLoaded) return;
    statsSnapshotChecked = true;
    var todayIso = new Date().toISOString().slice(0,10);
    var byHotel = computeLiveHotelStats();
    var existing = (state.statsSnapshots||[]).find(function(s){ return s.snapshot_date===todayIso; });
    // 0.3.0: раньше ошибка сохранения снимка (например, RLS или временный сбой
    // сети) проглатывалась молча — без снимка за день период сравнения в
    // «Отчёт по СЕРВИСу заказчику» тихо перестаёт различаться (см. баннер
    // несовпадения периода выше). Логируем в консоль, чтобы это было видно.
    if(existing) sb.from("ticket_stats_snapshots").update({by_hotel: byHotel}).eq("id", existing.id).then(function(res){ if(res && res.error) console.error("Не удалось обновить сегодняшний снимок счётчиков:", res.error); });
    else sb.from("ticket_stats_snapshots").insert({snapshot_date: todayIso, by_hotel: byHotel}).then(function(res){ if(res && res.error) console.error("Не удалось сохранить сегодняшний снимок счётчиков:", res.error); });
  }
  // Ближайший по дате снимок к "N дней назад" — тот же принцип терпимости к
  // пропущенным дням, что и closedSinceLastWeek() выше (снимки копятся раз в
  // день, только пока кто-то заходит в платформу — если день пропущен, берём
  // ближайший из тех, что реально есть, вместо того чтобы требовать ровно N).
  function findSnapshotNearDaysAgo(days){
    var snaps = (state.statsSnapshots||[]).filter(function(s){ return s.snapshot_date; });
    if(!snaps.length) return null;
    // Снимки — календарные даты без времени ("2026-09-14"), поэтому цель
    // сравнения тоже нормализуем к полуночи сегодняшнего дня, а не берём
    // "Date.now() - N дней" как есть. Иначе сравнение расстояния в миллисекундах
    // зависит от времени суток, в которое считается отчёт: например, во второй
    // половине дня снимок "сегодня" (полночь сегодня) оказывается ближе к
    // "N дней назад", чем снимок ровно N дней назад (полночь N дней назад) —
    // отчёт молча сравнивал бы себя с самим собой вместо нужного дня.
    var todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
    var targetTime = todayMidnight.getTime() - days*24*3600*1000;
    var best = null, bestDiff = Infinity;
    snaps.forEach(function(s){
      var diff = Math.abs(new Date(s.snapshot_date).getTime() - targetTime);
      if(diff<bestDiff){ bestDiff = diff; best = s; }
    });
    return best;
  }
  // Собирает готовый текст отчёта — тот же формат, что Антон уже рассылает в
  // Telegram (см. память hotel-reports): ГЛАВНОЕ + разбивка ПО ОБЪЕКТАМ,
  // отсортированная по числу закрытых за период (лидер — 🥇, аутсайдер — 🔸,
  // остальные — 🔹; это наша собственная простая сортировка, не претендует на
  // точное повторение чьей-то ручной расстановки медалей в прошлых отчётах).
  // Возвращает null, если снимков вообще ещё нет (платформа только что
  // начала их копить) — вызывающий код должен показать честное сообщение,
  // а не подставлять нулевые цифры.
  function buildServiceReport(periodDays){
    var currentByHotel = computeLiveHotelStats();
    var currentTotals = sumHotelStats(currentByHotel);
    var baseline = findSnapshotNearDaysAgo(periodDays);
    if(!baseline) return null;
    var baseByHotel = baseline.by_hotel || {};
    var baseTotals = sumHotelStats(baseByHotel);
    var actualDays = Math.round((Date.now() - new Date(baseline.snapshot_date).getTime())/86400000);
    var pctOf = function(totals){ return (totals.total-totals.rejected)>0 ? totals.done/(totals.total-totals.rejected)*100 : 0; };
    var pctNow = pctOf(currentTotals), pctBefore = pctOf(baseTotals);

    var rows = (state.hotels||[]).filter(function(h){return h.in_service;}).map(function(h){
      var cur = currentByHotel[h.id] || {total:0,submitted:0,inWork:0,overdue:0,done:0,rejected:0};
      var base = baseByHotel[h.id] || {total:0,submitted:0,inWork:0,overdue:0,done:0,rejected:0};
      return { hotel:h, closed: cur.done-base.done, open: cur.submitted+cur.inWork, pct: pctOf(cur) };
    }).sort(function(a,b){ return b.closed-a.closed; });

    var fmtPct = function(n){ return n.toLocaleString("ru-RU", {minimumFractionDigits:1, maximumFractionDigits:1}); };
    var now = new Date();
    var closedPeriod = currentTotals.done - baseTotals.done;
    var openBefore = baseTotals.submitted+baseTotals.inWork, openNow = currentTotals.submitted+currentTotals.inWork;
    // 0.3.0 (по просьбе Антона): раньше "Отклонено дополнительно" считалось
    // как currentTotals.rejected-baseTotals.rejected — разница между двумя
    // "снимками" общего числа отклонённых заявок НА ТЕКУЩИЙ МОМЕНТ. У такой
    // разницы есть особенность: если старая, уже отклонённая заявка удалена
    // (например, дубль, которую позже удалили — 0.2.18) или её c-lector-статус
    // при повторной синхронизации перестал совпадать с текстом "отклон"/"отказ",
    // она тихо выпадает из currentTotals.rejected, как будто её "отменили" —
    // и разность может уйти в минус, даже если за период появились НОВЫЕ
    // отклонённые заявки (наблюдение Антона: отчёт показал -1, хотя визуально
    // в списке заявок за этот период отклонены 2 новые заявки). Считаем
    // честно и напрямую: сколько ИЗ ЗАЯВОК, СОЗДАННЫХ С МОМЕНТА СНИМКА
    // СРАВНЕНИЯ, сейчас отклонены — эта величина не может стать
    // отрицательной и не зависит от того, что происходит со старыми заявками.
    var baselineDateMs = new Date(baseline.snapshot_date).getTime();
    var rejectedDelta = (state.tickets||[]).filter(function(t){
      if(t.demo) return false;
      if(!currentByHotel[t.hotel_id]) return false; // отель вне СЕРВИСа — не входит в отчёт
      if(!t.created_at || new Date(t.created_at).getTime() <= baselineDateMs) return false;
      if(!isTicketDone(t)) return false;
      return t.external_status ? /отклон|отказ/i.test(t.external_status) : t.status==="rejected";
    }).length;
    var lines = [];
    lines.push("Здравствуйте!");
    lines.push("Отчет "+fmtDDMM(now));
    lines.push("");
    lines.push("СЕРВИС");
    lines.push("Период: "+fmtDMY(baseline.snapshot_date)+" → "+fmtDMY(now)+" ("+actualDays+" "+pluralRu(actualDays,"день","дня","дней")+")");
    lines.push("");
    lines.push("ГЛАВНОЕ");
    lines.push("✅ Закрыто за период: "+closedPeriod+" "+pluralRu(closedPeriod,"заявка","заявки","заявок"));
    lines.push("🆕 Новых заявок: "+(currentTotals.total-baseTotals.total)+" ("+baseTotals.total+" → "+currentTotals.total+")");
    lines.push("🔵 Открытых: "+openBefore+" → "+openNow+" ("+fmtSigned(openNow-openBefore)+")");
    lines.push("❌ Отклонено дополнительно: "+rejectedDelta);
    lines.push("⏰ Просрочено на "+fmtDDMM(now)+": "+currentTotals.overdue);
    lines.push("📈 % выполнения: "+fmtPct(pctBefore)+"% → "+fmtPct(pctNow)+"%");
    lines.push("");
    lines.push("ПО ОБЪЕКТАМ (закрыто за период / открытых на "+fmtDDMM(now)+" / % выполнения)");
    rows.forEach(function(r, idx){
      r.medal = idx===0 ? "🥇" : (idx===rows.length-1 ? "🔸" : "🔹");
      lines.push(r.medal+" Отель №"+r.hotel.id+", "+r.hotel.name+" — "+fmtSigned(r.closed)+" / "+r.open+" / "+fmtPct(r.pct)+"%");
    });
    // Помимо готового текста для копирования (text, формат — как в Telegram),
    // отдаём и разобранные по полям цифры — дашборд (0.2.7) рисует из них
    // компактный виджет с плитками и таблицей, а не кладёт весь текст отчёта
    // целиком в один блок, который иначе съедает весь экран.
    return {
      text: lines.join("\n"), actualDays: actualDays, baselineDate: baseline.snapshot_date, thin: actualDays<1,
      periodToDate: now, closedPeriod: closedPeriod,
      newCount: currentTotals.total-baseTotals.total, newBefore: baseTotals.total, newAfter: currentTotals.total,
      openBefore: openBefore, openNow: openNow, openDelta: openNow-openBefore,
      rejectedDelta: rejectedDelta, overdueNow: currentTotals.overdue,
      pctBefore: pctBefore, pctNow: pctNow, fmtPct: fmtPct, rows: rows
    };
  }
  function maybeSeedPortfolio(){
    if(state.portfolio) return;
    if(state._seedingPf) return; state._seedingPf = true;
    sb.from("portfolio_snapshot").upsert({
      id:1, snapshot_date:"2026-09-05",
      by_hotel: {

        2:{total:149,submitted:0,inWork:10,overdue:3,done:117,rejected:22},
        3:{total:53,submitted:0,inWork:12,overdue:10,done:29,rejected:12},
        4:{total:85,submitted:0,inWork:33,overdue:28,done:38,rejected:14},
        5:{total:101,submitted:0,inWork:6,overdue:2,done:50,rejected:45},
        6:{total:5,submitted:0,inWork:0,overdue:0,done:3,rejected:2},
        7:{total:7,submitted:1,inWork:3,overdue:1,done:2,rejected:1}

  /* ============================== DEADLINES ============================== */
  function deadlineInfo(t){
    // label — с пояснением ("Прибытие к…"/"Устранение к…"), используется там,
    // где колонка/поле само по себе не называется "Срок" (карточка заявки,
    // экспорт). dateLabel — голая дата без пояснения, для колонки "Срок" в
    // списках (там пояснение излишне, только дата).
    var now = Date.now();
    if(t.status==="closed" || t.status==="rejected") return {label:"—", dateLabel:"—", overdue:false, done:true};
    // 0.2.17: столбец "Срок" берётся из "сроков" c-lector (resolution_deadline)
    // НЕЗАВИСИМО от статуса заявки — раньше, пока заявка не "на месте", тут
    // показывался локально посчитанный "срок прибытия" (по зоне отеля), а
    // настоящий срок из c-lector появлялся только для статуса "onsite". Раз
    // c-lector присылает этот срок уже при самом импорте (см. commitImport),
    // и он не зависит от внутреннего статуса наряда-задания, показываем его
    // тут при первой возможности, для любого активного статуса.
    if(t.resolution_deadline){
      var ms2 = new Date(t.resolution_deadline).getTime()-now;
      return {label:"Срок (c-lector): "+fmtDate(t.resolution_deadline), dateLabel:fmtDateShort(t.resolution_deadline), overdue: ms2<0, soon: ms2>0 && ms2<24*3600*1000, ms:ms2, kind:"resolution"};
    }
    // 0.2.20 (по просьбе Антона): раньше для new/dispatched без resolution_deadline
    // сюда подставлялся внутренний "срок прибытия" (по зоне отеля) — в колонке
    // "Срок" это выглядело так, будто у заявки уже ЕСТЬ срок из c-lector, хотя
    // на самом деле c-lector его просто ещё не прислал. "Срок реагирования" по
    // зоне — теперь отдельная информация (см. «Отели» и наряд-задание), в
    // колонке "Срок" её больше не показываем ни для одного статуса — честно
    // показываем, что данных нет, а не подставляем свою дату.
    if(t.status==="new" || t.status==="dispatched" || t.status==="onsite"){
      return {label:"Срок не указан (нет данных c-lector)", dateLabel:"Срок не указан", overdue:false, kind:"resolution"};
    }
    return {label:"—", dateLabel:"—", overdue:false};
  }
  // ВАЖНО: раньше здесь проверялся только внутренний t.status ("closed"/"rejected"),
  // без учёта реального статуса из c-lector (t.external_status, например
  // "Выполнена") — из-за этого выполненные/отклонённые по c-lector заявки, у
  // которых внутренний статус наряда-задания не был вручную переведён в
  // closed/rejected, продолжали считаться "активными" и попадали в дашборд
  // ("Требуют внимания", KPI, зоны) и на карту. Делегируем в isTicketDone(t) —
  // ту же логику, что уже используется в списке «Заявки» для скрытия закрытых.
  function isActive(t){ return !isTicketDone(t); }
  // Заявки грузятся из c-lector вручную (не каждый день), поэтому "закрыто за 7
  // дней" не может опираться на календарные сутки внутри платформы — вместо
  // этого берём снимок счётчиков из ЗАГРУЗКИ, ближайшей к 7 дням назад, и
  // сравниваем с последней загрузкой (см. recordImportSnapshot).
  function closedSinceLastWeek(){
    var snaps = state.snapshots || [];
    if(snaps.length<2) return null;
    var latest = snaps[snaps.length-1];
    var targetTime = Date.now() - 7*24*3600*1000;
    var best = null, bestDiff = Infinity;
    for(var i=0;i<snaps.length-1;i++){
      var diff = Math.abs(new Date(snaps[i].imported_at).getTime() - targetTime);
      if(diff<bestDiff){ bestDiff = diff; best = snaps[i]; }
    }
    if(!best) return null;
    return { delta: latest.closed-best.closed, fromDate: best.imported_at, toDate: latest.imported_at };
  }

  /* ============================== MUTATIONS ============================== */
  // Заявки регистрируются только через импорт из c-lector (см. раздел "Импорт") —
  // ручного создания заявки в платформе больше нет, так как источник один.
  function myLabel(){ return (state.me && (state.me.name||state.me.email)) || "—"; }
  // Для журнала заявки (0.2.3): указываем не только имя автора записи, но и его
  // роль в системе — чтобы по журналу было видно, кто именно (администратор,
  // гл. инженер, снабжение...) выполнил то или иное действие. На остальные
  // места, где используется myLabel() (загрузка счетов/фото, импорт из
  // c-lector), это намеренно не влияет — там роль не требовалась.
  function myLabelWithRole(){
    var base = myLabel();
    var roleLabel = state.me && ROLE_LABEL[state.me.role];
    return roleLabel ? base+" ("+roleLabel+")" : base;
  }
  function addNote(ticketId, text){
    // не полагаемся только на realtime-канал notes-* (может запаздывать или не
    // сработать, если для ticket_notes republication/RLS настроены не так, как
    // для остальных таблиц) — как только запись реально сохранена, сразу же
    // перезапрашиваем журнал открытой заявки, чтобы запись гарантированно
    // появилась в интерфейсе немедленно.
    return sb.from("ticket_notes").insert({ticket_id:ticketId, author:myLabelWithRole(), note_text:text}).then(function(res){
      if(res && res.error){ console.error("addNote failed:", res.error); }
      else if(state.selectedTicketId===ticketId){ loadNotesFor(ticketId); }
      return res;
    });
  }
  // Применяем патч к state.tickets НЕМЕДЛЕННО, синхронно, ещё до того, как
  // запрос на сохранение вообще ушёл в Supabase — а не только после того, как
  // он подтвердится (тот вариант чинил гонку лишь наполовину: в реальном
  // приложении подтверждение приходит по сети не мгновенно, и быстрое
  // закрытие/открытие карточки заявки успевает отрендерить её из ещё не
  // обновлённого state.tickets ДО завершения запроса). Не полагаемся и на
  // realtime-канал "tickets-rt" (см. reloadTickets выше) — та же история, что
  // и у уже исправленного бага с журналом (addNote/loadNotesFor выше), только
  // без сетевой задержки её было не воспроизвести локально в тестах.
  // Если сохранение всё же не удастся (сеть/права), значение останется
  // визуально применённым до следующего эха realtime — сознательный компромисс:
  // остальной код приложения тоже нигде не показывает "не сохранилось" для
  // этих полей и не делает откат, кроме отдельных полей с fieldFeedback.
  function patchTicketLocal(id, patch){
    var t = state.tickets.find(function(x){return x.id===id;});
    if(t) Object.assign(t, patch);
  }
  function assignSpecialist(id, name){
    // Назначение реального исполнителя снимает "бригада не нужна" (0.2.2), если
    // она почему-то была отмечена раньше — состояния взаимоисключающие по смыслу.
    var patch = {assigned_to:name, status:"dispatched", crew_not_needed:false};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Назначен главный инженер: "+name+".");
      maybeAutoComplete(id);
    });
  }
  // Смена исполнителя уже назначенной заявки (в отличие от assignSpecialist выше,
  // не трогает status/дедлайны — те уже отсчитываются от прибытия/устранения).
  function reassignSpecialist(id, name){
    var patch = {assigned_to:name, crew_not_needed:false};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Исполнитель изменён на: "+name+".");
      maybeAutoComplete(id);
    });
  }
  function markArrived(id){
    // Срок устранения (resolution_deadline) сюда больше не пишем — он приходит
    // только из c-lector при импорте, платформа его сама не считает.
    var patch = {status:"onsite", arrived_at:new Date().toISOString()};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Главный инженер прибыл на объект.");
    });
  }
  // ВАЖНО: в отличие от соседних сеттеров выше/ниже, эта функция не пишет
  // запись в журнал (addNote) — категория "Гарантийный/Негарантийный/
  // Необоснованная" сама по себе не событие для журнала. Из-за этого раньше
  // (единственная среди всех сеттеров заявки) она не вызывала вообще никакого
  // перерисовывания карточки после сохранения — только addNote()-у соседей
  // "случайно" перепадал render() через fetchNotes()->renderTicketPanel().
  // Именно поэтому при быстром закрытии/открытии заявки выбранная категория
  // "откатывалась" на старое значение: state.tickets ещё не подтянул новое
  // значение, а перерисовать карточку было некому. Немедленный patchTicketLocal
  // + renderTicketPanel() ниже чинят это, не дожидаясь ни ответа от Supabase,
  // ни эха realtime-подписки.
  function setCaseType(id, val){
    var patch = {case_type: val||null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id);
  }
  function setMaterialsEta(id, dateStr){
    // Дата ожидаемой поставки материалов — чисто информационная пометка, срок
    // устранения (из c-lector) она больше не подменяет и не сдвигает.
    var patch = {materials_wait:true, materials_eta:dateStr};

  // "Материал не нужен" (версия 0.2.2) — заменяет старый ручной флажок
  // materials_ready: пункт чек-листа "Материал" сразу становится зелёным, счёт
  // не требуется. Взаимоисключаемо со счетами по смыслу, но не технически —
  // если счета уже прикреплены, галочку всё равно можно поставить (например,
  // если счёт оказался ошибочно приложен не к той заявке).
  function setMaterialsNotNeeded(id, val){
    var patch = {materials_not_needed:val};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Отмечено: материал для этой заявки не нужен." : "Отметка «материал не нужен» снята.");

  // "Оплачено за наличные" (0.2.16) — не все материалы идут по счёту от
  // поставщика: иногда прораб платит сразу наличными, счёта вообще не будет.
  // Галочка переводит "Материал" в жёлтый (ожидание) вместо нейтрального —
  // это осознанно отмеченное намерение, а не забытый пункт. Сама галочка НЕ
  // снимает потребность в реальной записи расхода — как только она появится в
  // «Финансы → Наличные расходы» (категория «Материал», привязка к этой
  // заявке), maybeClearMaterialsCashPending() снимет галочку автоматически и
  // подтянет сумму (см. materialsState()/milestoneRow "materials" в карточке).
  function setMaterialsCashPending(id, val){
    var patch = {materials_cash_pending:val};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Отмечено: материал по этой заявке оплачивается наличными (ждём запись в «Наличные расходы»)." : "Отметка «оплачено за наличные» по материалу снята.");
    });

  // Вызывается после успешного сохранения наличного расхода категории
  // "Материал" с привязкой к заявке (addCashExpense/commitCashImport) — если у
  // заявки была включена галочка "оплачено за наличные", снимаем её (расход
  // уже подвязался сам по себе через cashExpensesFor(), галочка своё
  // отслужила) и сообщаем об этом в журнале.
  function maybeClearMaterialsCashPending(ticketId){
    if(!ticketId) return;
    var t = state.tickets.find(function(x){ return x.id===ticketId; });
    if(!t || !t.materials_cash_pending) return;
    patchTicketLocal(ticketId, {materials_cash_pending:false});
    render();
    sb.from("tickets").update({materials_cash_pending:false}).eq("id", ticketId).then(function(){
      addNote(ticketId, "«Материал»: наличный расход внесён — отметка «оплачено за наличные» снята автоматически, статус стал зелёным.");
      maybeAutoComplete(ticketId);
    });

  // "Бригада не нужна" (версия 0.2.2) — заменяет прежнюю безымянную ручную
  // отметку crew_manual_done ("выполнено вручную" без указания, кто именно):
  // теперь пункт "Бригада" зелёный либо когда реально назначен исполнитель
  // (assigned_to — см. "Назначить"/"Сменить" в теле пункта), либо когда явно
  // отмечено, что бригада для этой заявки не нужна.
  function setCrewNotNeeded(id, val){
    var patch = {crew_not_needed:val};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){

      if(val) maybeAutoComplete(id);

  function setWorkManualDone(id, val){
    var patch = {work_manual_done:val};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Работа отмечена выполненной вручную (без фото)." : "Ручная отметка «работа» снята.");
      if(val) maybeAutoComplete(id);
    });

  // Акт — четвёртый пункт чек-листа хода работ. В отличие от трёх остальных,
  // хранится отдельным полем (act_signed), а не выводится из статуса заявки —
  // иначе автопереход "все 4 пункта -> статус Выполнено" ниже был бы замкнут сам
  // на себя (акт делался бы условием статуса closed, а сам получался бы из него).
  function uploadActFile(ticketId, file){
    var path = ticketId + "/act_" + Date.now() + "_" + file.name.replace(/[^\w.\-]+/g,"_");
    var patch = {act_signed:true, act_file_path:path, act_file_name:file.name};
    return readFileAsBuffer(file).then(function(buf){
      return sb.storage.from("invoices").upload(path, buf, {contentType: file.type || "application/octet-stream"});
    }).then(function(res){
      if(res.error) throw res.error;
      patchTicketLocal(ticketId, patch);
      renderTicketPanel();
      return sb.from("tickets").update(patch).eq("id", ticketId);
    }).then(function(){
      addNote(ticketId, "Акт подписан, файл прикреплён: "+file.name+".");
      maybeAutoComplete(ticketId);
    }).catch(function(err){
      alert("Не удалось загрузить акт: " + (err&&err.message?err.message:err));
    });
  }
  function clearActSigned(id){
    var t = state.tickets.find(function(x){return x.id===id;});
    var msg = (t && t.act_file_path)
      ? "Снять отметку «акт подписан»? Прикреплённый файл акта останется доступным по ссылке, но перестанет учитываться как подтверждение."
      : "Снять ручную отметку «акт подписан»?";
    if(!confirm(msg)) return;
    var patch = {act_signed:false};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Отметка «акт подписан» снята.");
    });
  }
  // Быстрая ручная отметка "акт подписан" прямо по клику на значок пункта
  // (см. setWorkManualDone выше) — доступна только пока файл
  // акта не прикреплён; как только файл есть, снимать отметку нужно через
  // кнопку "Снять отметку" внутри пункта (clearActSigned, с подтверждением).
  function setActSigned(id, val){
    var patch = {act_signed:val};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? "Акт отмечен подписанным вручную (без файла)." : "Ручная отметка «акт» снята.");
      if(val) maybeAutoComplete(id);
    });
  }
  // Фото-доказательство к Акту (category:"act", см. actPhotoGrid/uploadPhoto
  // выше) само по себе подтверждает, что акт есть — по просьбе Антона это
  // должно сразу переводить пункт "Акт" в "акт имеется", без отдельного клика
  // по значку. Если акт уже подписан (файлом или вручную) — трогать нечего.
  function markActConfirmedByPhoto(id){
    var t = state.tickets.find(function(x){return x.id===id;});
    if(t && t.act_signed) return;
    var patch = {act_signed:true};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Акт отмечен подписанным автоматически — прикреплено фото-доказательство.");

  function openActFile(path){
    sb.storage.from("invoices").createSignedUrl(path, 3600).then(function(res){
      if(res.data && res.data.signedUrl) window.open(res.data.signedUrl, "_blank");

  // Табель на выполненные работы — по просьбе Антона живёт внутри пункта
  // "Акт" (см. milestoneRow key:"act" ниже), а не отдельным пунктом чек-листа.
  // Два взаимоисключающих варианта: свой файл табеля НА ЭТУ заявку, либо
  // отметка "табель учтён в заявке №..." — когда один табель закрывает сразу
  // несколько заявок и незачем дублировать файл в каждой.
  function uploadTimesheetFile(ticketId, file){
    var path = ticketId + "/timesheet_" + Date.now() + "_" + file.name.replace(/[^\w.\-]+/g,"_");
    var patch = {timesheet_file_path:path, timesheet_file_name:file.name, timesheet_ref_ticket_id:null};
    return readFileAsBuffer(file).then(function(buf){
      return sb.storage.from("invoices").upload(path, buf, {contentType: file.type || "application/octet-stream"});
    }).then(function(res){
      if(res.error) throw res.error;
      patchTicketLocal(ticketId, patch);
      renderTicketPanel();
      return sb.from("tickets").update(patch).eq("id", ticketId);
    }).then(function(){
      addNote(ticketId, "Прикреплён табель: "+file.name+".");
    }).catch(function(err){
      alert("Не удалось загрузить табель: " + (err&&err.message?err.message:err));
    });
  }
  function clearTimesheetFile(id){
    if(!confirm("Удалить прикреплённый табель?")) return;
    var patch = {timesheet_file_path:null, timesheet_file_name:null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Табель удалён.");
    });
  }
  function openTimesheetFile(path){
    sb.storage.from("invoices").createSignedUrl(path, 3600).then(function(res){
      if(res.data && res.data.signedUrl) window.open(res.data.signedUrl, "_blank");
      else alert("Не удалось открыть файл табеля.");
    });
  }
  function setTimesheetRef(id){
    var ref = prompt("Номер заявки c-lector, в которой учтён табель на эту заявку:", "");
    if(ref==null) return;
    ref = ref.trim();
    if(!ref) return;
    var target = findTicketByRef(ref);
    if(!target){ alert("Заявка с номером c-lector «"+ref+"» не найдена среди загруженных."); return; }
    if(target.id===id){ alert("Заявка не может ссылаться сама на себя."); return; }
    var patch = {timesheet_ref_ticket_id: target.id, timesheet_file_path:null, timesheet_file_name:null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Табель на эту заявку учтён в заявке № "+(target.external_ref||target.id)+".");
    });
  }
  function clearTimesheetRef(id){
    var patch = {timesheet_ref_ticket_id:null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Отметка «табель учтён в другой заявке» снята.");
    });
  }
  // Автопереход "в работе -> выполнено": как только у заявки одновременно
  // назначен исполнитель, закуплены материалы, вписаны часы устранения и
  // подписан акт — статус сам становится "Закрыта", без дополнительных условий
  // (по решению Антона — категория "Гарантийный/Негарантийный/Необоснованный"
  // для этого НЕ обязательна, хотя обычно нужна для оплаты по Регламенту, поэтому
  // если она не заполнена — обращаем на это внимание отдельной записью в журнале).
  // Тянем свежую строку заявки напрямую из базы (а не из state.tickets), чтобы не
  // зависеть от того, успел ли уже прийти realtime-апдейт к этому моменту.
  function maybeAutoComplete(id){
    sb.from("tickets").select("*").eq("id", id).maybeSingle().then(function(res){
      var t = res.data; if(!t) return;
      if(t.status==="closed" || t.status==="rejected") return;
      // "Бригада" — реальное назначение (assigned_to) либо явная отметка "не
      // нужна" (crew_not_needed, версия 0.2.2 — прежней безымянной ручной
      // отметки больше нет). "Материал" — зелёный по materialsIsGreen() (все
      // счета категории "materials" оплачены, либо отмечено "не нужен") —
      // жёлтого (счёт есть, но не оплачен) для автозакрытия НЕ достаточно.
      // "Работа" — всегда просто ручной флажок (см. STATUS_ICON_DEFS выше: фото
      // в "Работа" больше не участвуют — "Фото" теперь отдельная галерея
      // замечаний, а не признак сделанной работы).
      var allDone = (!!t.assigned_to || !!t.crew_not_needed) && materialsIsGreen(t) && !!t.work_manual_done && !!t.act_signed;
      if(!allDone) return;
      var patch = {status:"closed", closed_at:new Date().toISOString()};
      patchTicketLocal(id, patch);
      render();
      sb.from("tickets").update(patch).eq("id",id).then(function(){
        addNote(id, "Все 4 пункта выполнены (бригада, материал, работа, акт) — статус автоматически изменён на «Закрыта»."+(!t.case_type?" Категория по осмотру не указана — заполните её для расчёта оплаты по Регламенту.":""));
      });
    });
  }
  // Ручная пометка "особое внимание" — например, когда заявкой заинтересовался
  // руководитель или заказчик, независимо от статуса/сроков по c-lector.
  function setAttentionFlag(id, val, note){
    var patch = {attention_flag:val, attention_note: val ? (note||null) : null};
    patchTicketLocal(id, patch);
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, val ? ("Поставлена пометка «особое внимание»."+(note?" "+note:"")) : "Пометка «особое внимание» снята.");
    });
  }
  // Пометка "дубль" — заявка по факту та же поломка, что уже заведена под
  // другим номером c-lector (частая ситуация при повторной выгрузке/повторном
  // обращении жильца). Ищем целевую заявку по её номеру c-lector (external_ref)
  // среди уже загруженных — самый надёжный признак, который знает диспетчер,
  // не открывая саму заявку. Заявку саму на себя дублем не делаем.
  function findTicketByRef(ref){
    var needle = String(ref||"").trim();
    if(!needle) return null;
    return (state.tickets||[]).find(function(x){ return x.external_ref && String(x.external_ref).trim()===needle; }) || null;
  }
  function setDuplicateOf(id){
    var t = state.tickets.find(function(x){return x.id===id;});
    var ref = prompt("Номер заявки c-lector, которую дублирует эта заявка (например, "+"123"+"):", "");
    if(ref==null) return;
    ref = ref.trim();
    if(!ref) return;
    var target = findTicketByRef(ref);
    if(!target){ alert("Заявка с номером c-lector «"+ref+"» не найдена среди загруженных."); return; }
    if(target.id===id){ alert("Заявка не может дублировать сама себя."); return; }
    var patch = {duplicate_of_ticket_id: target.id};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Отмечена как дубль заявки № "+(target.external_ref||target.id)+".");
    });
  }
  function clearDuplicateOf(id){
    if(!confirm("Снять пометку «дубль»?")) return;
    var patch = {duplicate_of_ticket_id:null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Пометка «дубль» снята.");
    });
  }
  // 0.2.18: ручное удаление заявки (кнопка в карточке — см. canDeleteTicket()
  // и renderTicketPanel). Необратимо: счета/фото/журнал этой заявки удаляются
  // каскадом вместе с ней (see supabase_schema.sql, on delete cascade);
  // наличные расходы и заявки, ссылавшиеся на неё как на дубль/табель, просто
  // теряют эту ссылку (on delete set null), а не удаляются сами.
  function deleteTicket(id){
    if(!canDeleteTicket()) return;
    var t = state.tickets.find(function(x){return x.id===id;});
    if(!t) return;
    var label = t.external_ref ? ("№ "+t.external_ref) : "без номера c-lector";
    if(!confirm("Удалить заявку "+label+" насовсем?\n\nВместе с ней безвозвратно удалятся все привязанные к ней счета, фото и записи журнала. Наличные расходы и другие заявки, ссылавшиеся на неё (дубль/табель), просто потеряют эту ссылку.\n\nОтменить это действие нельзя.")) return;
    state.selectedTicketId = null;
    renderTicketPanel();
    sb.from("tickets").delete().eq("id", id).then(function(){});
  }
  // "Системный брак" — название задаётся вручную в карточке (текстовое поле с
  // подсказкой уже введённых названий через <datalist>, чтобы не плодить
  // варианты написания одного и того же брака) — см. viewSystemDefects ниже,
  // где заявки группируются по этому названию в отдельном разделе меню.
  function distinctSystemDefectNames(){
    var seen = {}; var out = [];
    (state.tickets||[]).forEach(function(t){
      var n = t.system_defect_name;
      if(n && !seen[n]){ seen[n]=true; out.push(n); }
    });
    return out.sort(function(a,b){ return a.localeCompare(b,"ru"); });
  }
  function clearSystemDefectName(id){
    var patch = {system_defect_name:null};
    patchTicketLocal(id, patch);
    renderTicketPanel();
    sb.from("tickets").update(patch).eq("id",id).then(function(){
      addNote(id, "Пометка «системный брак» снята.");
    });
  }
  // Ручного закрытия/отклонения/переоткрытия заявки в приложении больше нет
  // (по решению Антона) — заявка закрывается либо автоматически, когда
  // выполнены все 4 пункта "Ход работ" (см. maybeAutoComplete выше), либо
  // когда следующая выгрузка из c-lector.ru покажет её закрытой/отклонённой

  function clearDemo(){
    sb.from("tickets").delete().eq("demo", true).then(function(){});

  function updateProfile(id, fields){ sb.from("profiles").update(fields).eq("id", id).then(function(){}); }
  // Удаление сотрудника из «Команды» — доступно только владельцу (см. isOwner()).
  // Заявки, уже назначенные на этого человека (assigned_to — текст-имя, не

  function deleteProfile(id, label){
    if(!confirm("Удалить сотрудника «"+label+"» из списка команды и сбросить его роль/зоны? Уже назначенные на него заявки не изменятся (имя останется в поле «Исполнитель»).\n\nВажно: сам вход по почте это не отключает (это может сделать только Supabase Auth, у приложения нет туда доступа) — если человек всё ещё нужен, войдя снова, он будет работать как «"+ROLE_LABEL.specialist+"» без ролей/зон, но обратно в этот список автоматически не попадёт.")) return;
    sb.from("profiles").delete().eq("id", id).then(function(){});

  function updatePartQty(id, qty){ sb.from("parts").update({qty:Number(qty)||0, updated_at:new Date().toISOString()}).eq("id",id).then(function(){}); }

  function savePortfolio(byHotel, snapshotDate){ sb.from("portfolio_snapshot").upsert({id:1, by_hotel:byHotel, snapshot_date:snapshotDate}).then(function(){}); }
  // Автообновление "Портфель по c-lector.ru" вместе с импортом (0.2.9, по
  // просьбе Антона) — раньше эти цифры (total/submitted/inWork/overdue/done/
  // rejected по каждому отелю) заполнялись вручную через кнопку "Обновить
  // снимок" (см. бывший openPortfolioModal, убран вместе с кнопкой), теперь
  // считаются автоматически из тех же живых данных заявок, что и "Отчёт по
  // СЕРВИСу" (см. computeLiveHotelStats выше) — сразу после каждого коммита
  // импорта из c-lector (см. commitImport → finish). state.portfolio
  // обновляем локально сразу же (а не только через savePortfolio → realtime),
  // чтобы виджет на дашборде обновился в тот же рендер, не дожидаясь ответа
  // от Supabase/канала portfolio-rt.
  function updatePortfolioFromImport(){
    var todayIso = new Date().toISOString().slice(0,10);
    var byHotel = computeLiveHotelStats();

  // Единый обработчик для полей, которые сохраняются "на лету" (Табель, Суть,
  // поля счёта в реестре) — раньше такие сохранения были "выстрелил и забыл"
  // без единой обработки ошибок, из-за чего несохранённые правки (например, из-за
  // отсутствующей колонки в БД) были не видны пользователю. Показывает короткую
  // подпись "Сохранено…" / текст ошибки рядом с полем.
  // Подпись храним в состоянии (fieldFeedback), а не пишем в DOM напрямую: таблицы
  // tickets/invoices подписаны на realtime, и событие от собственного же сохранения
  // почти сразу вызывает полный render() — прямая запись в textContent мгновенно
  // стиралась бы этим перерисовыванием, и пользователь не успевал увидеть "Сохранено".
  var fieldFeedback = {};
  function feedbackHtml(id){
    var f = fieldFeedback[id];
    if(!f) return h`<span id="${id}" class="helptext mono"></span>`;
    return h`<span id="${id}" class="helptext mono" style="color:${f.ok?'var(--ok)':'var(--crit)'};">${escapeHtml(f.text)}</span>`;
  }
  function saveWithFeedback(promise, feedbackElId){
    // возвращает true/false (сохранилось или нет) — используется вызывающим
    // кодом, чтобы не писать в журнал запись об "изменении", если сохранение
    // на самом деле не удалось.
    return promise.then(function(res){
      if(res && res.error){
        if(feedbackElId){ fieldFeedback[feedbackElId] = {text:"Ошибка: "+res.error.message, ok:false}; render(); }
        else alert("Не удалось сохранить: "+res.error.message);
        return false;
      }
      if(feedbackElId){
        fieldFeedback[feedbackElId] = {text:"Сохранено", ok:true};
        render();
        setTimeout(function(){
          if(fieldFeedback[feedbackElId] && fieldFeedback[feedbackElId].text==="Сохранено"){ delete fieldFeedback[feedbackElId]; render(); }
        }, 2000);
      }
      return true;
    }).catch(function(err){
      var msg = err && err.message ? err.message : String(err);
      if(feedbackElId){ fieldFeedback[feedbackElId] = {text:"Ошибка: "+msg, ok:false}; render(); }
      else alert("Не удалось сохранить: "+msg);
      return false;
    });
  }
  function saveTicketField(id, patch, feedbackElId){
    patchTicketLocal(id, patch);
    return saveWithFeedback(sb.from("tickets").update(patch).eq("id", id), feedbackElId);
  }
  function saveInvoiceField(id, patch, feedbackElId){ return saveWithFeedback(sb.from("invoices").update(patch).eq("id", id), feedbackElId); }

  /* ---- Журнал: редактирование и удаление записей ---- */
  function updateNote(id, text){
    return sb.from("ticket_notes").update({note_text:text, edited_at:new Date().toISOString()}).eq("id", id);
  }
  // Раньше .delete() ни на что не проверялся: если удаление по какой-то
  // причине не проходило на сервере (RLS, сетевая ошибка) — Supabase не
  // бросает исключение, просто удаляет 0 строк молча, и запись оставалась на
  // месте без единого сообщения об этом (подтверждение "Удалить запись из
  // журнала?" при этом всё равно показывалось и принимало ответ). Плюс сам
  // журнал обновлялся только через realtime-подписку — если она почему-то не
  // сработала, строка тоже осталась бы висеть. Теперь явно проверяем ошибку
  // (и сообщаем о ней) и в любом случае перезапрашиваем список записей, не
  // полагаясь только на realtime.
  function deleteNote(id){
    var note = (state.ticketNotes||[]).find(function(n){ return String(n.id)===String(id); });
    var ticketId = note ? note.ticket_id : notesChannelTicketId;
    return sb.from("ticket_notes").delete().eq("id", id).then(function(res){
      if(res.error){ alert("Не удалось удалить запись: "+res.error.message); return; }
      if(ticketId) fetchNotes(ticketId);
    });
  }

  /* ---- Бригады: создание/переименование/участники/удаление ---- */
  function createCrew(name){
    if(!name || !name.trim()) return;
    sb.from("crews").insert({name:name.trim(), members:[]}).then(function(){});
  }
  function renameCrew(id, name){
    if(!name || !name.trim()) return;
    sb.from("crews").update({name:name.trim()}).eq("id", id).then(function(){});
  }
  function deleteCrew(id){
    sb.from("crews").delete().eq("id", id).then(function(){});
  }
  function addCrewMember(crew, name){
    if(!name || !name.trim()) return;
    var members = (crew.members||[]).slice();
    if(members.indexOf(name.trim())===-1) members.push(name.trim());
    sb.from("crews").update({members:members}).eq("id", crew.id).then(function(){});
  }
  function removeCrewMember(crew, name){
    var members = (crew.members||[]).filter(function(m){ return m!==name; });
    sb.from("crews").update({members:members}).eq("id", crew.id).then(function(){});
  }

  /* ============================== RENDER HELPERS ============================== */
  function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function h(strings){ var args=[].slice.call(arguments,1); return strings.reduce(function(acc,s,i){ return acc+s+(i<args.length?args[i]:""); },""); }
  // extraActiveViews (0.2.4) — для пункта «Финансы»: он ведёт на "#/registry",
  // но должен подсвечиваться активным и когда открыта вторая вкладка раздела
  // ("cashexpenses") — переключение между вкладками происходит внутри
  // содержимого (см. financeTabs), а не отдельным пунктом бокового меню.
  function navItem(view, label, extraActiveViews){
    var active = (state.route.view===view || (extraActiveViews && extraActiveViews.indexOf(state.route.view)>-1)) ? "active":"";
    return h`<a class="nav-item ${active}" href="#/${view}"><span class="nav-dot"></span>${label}</a>`;
  }
  // Вкладки-переключатели вкладок раздела «Финансы» — общие для viewRegistry()
  // и viewCashExpenses() (0.2.4), чтобы между "Реестр платежей" и "Наличные
  // расходы" можно было переключаться прямо в контенте, не возвращаясь в меню.
  function financeTabs(active){
    var tabs = [["registry","Реестр платежей"], ["cashexpenses","Наличные расходы"]];
    return h`<div class="finance-tabs">${tabs.map(function(t){
      return h`<a href="#/${t[0]}" class="finance-tab ${active===t[0]?'active':''}">${t[1]}</a>`;
    }).join("")}</div>`;
  }
  // 0.2.17: тот же приём вкладок, что и у «Финансы», — теперь для «Заявок»,
  // раз «Импорт из c-lector» стал вкладкой внутри «Заявок», а не отдельным
  // пунктом меню (см. navItems выше). Показываем вкладку «Импорт», только
  // если она вообще разрешена этой роли (см. navAllowed('import')) — не у
  // всех, кому доступны «Заявки», есть доступ к импорту (например,
  // Заказчик/Специалист/Снабжение).
  function ticketsTabs(active){
    if(!navAllowed("import")) return "";
    var tabs = [["tickets","Заявки"], ["import","Импорт из c-lector"]];
    return h`<div class="finance-tabs">${tabs.map(function(t){
      return h`<a href="#/${t[0]}" class="finance-tab ${active===t[0]?'active':''}">${t[1]}</a>`;
    }).join("")}</div>`;
  }
  function statusPill(status){ return h`<span class="pill ${STATUS_PILL[status]}">${STATUS_LABEL[status]}</span>`; }
  // Статус, который прислал c-lector.ru — показываем его текстом как есть (там свои
  // формулировки), просто подбираем цвет пилюли по ключевым словам.
  function externalStatusPill(text){
    if(!text) return h`<span class="pill pill-neutral">—</span>`;
    var cls = "pill-neutral";
    if(/выполн|заверш|устранен[оы]|закрыт/i.test(text)) cls = "pill-ok";
    else if(/отклон|отказ/i.test(text)) cls = "pill-crit";
    else if(/работ|обраб|принят|провер|назначен/i.test(text)) cls = "pill-accent";
    else if(/подан|нов|ожида/i.test(text)) cls = "pill-warn";
    return h`<span class="pill ${cls}">${escapeHtml(text)}</span>`;
  }
  function isClosedExternalStatus(text){ return !!text && /выполн|заверш|устранен[оы]|закрыт/i.test(text); }
  // 0.2.18: заявка удалена на стороне c-lector — ставится автосинхронизацией
  // по API (clector-sync.ts пишет tickets.clector_deleted_at, когда c-lector
  // сообщает deleted_at по этой заявке); ручной перенос (вставка/файл) такой
  // сигнал в принципе не может дать — сравнивать не с чем, там просто нет
  // строки в выгрузке. Раньше приложение вообще не смотрело на эту колонку.
  function isDeletedInClector(t){ return !!t.clector_deleted_at; }
  // Внутренний статус наряда-задания — второстепенная метка рядом со статусом c-lector,
  // когда у заявки уже есть внешний статус (иначе внутренний и есть единственный статус).
  function internalStageTag(status){ return h`<span class="pill pill-neutral" style="opacity:.65;font-weight:500;" title="Статус внутреннего наряда-задания">наряд: ${STATUS_LABEL[status]}</span>`; }
  function groupPill(g){ var cls = g===1?"pill-crit":(g===2?"pill-warn":"pill-neutral"); return h`<span class="pill ${cls}">${GROUP_LABEL[g]}</span>`; }
  function zoneBadge(zone){ return zone ? h`<span class="zone-badge">Зона ${zone}</span>` : h`<span class="zone-badge">стройка</span>`; }
  function roleLabel(r){ return ROLE_LABEL[r] || r; }
  // Видимый статус заявки для списка/фильтра: если есть статус из c-lector — берём
  // его текстом как есть (это и есть то, что реально показывается пользователю),
  // иначе — внутренний статус наряда-задания.
  function ticketStatusLabel(t){ return t.external_status || STATUS_LABEL[t.status] || "—"; }
  // Заявка считается закрытой/отклонённой для целей списка «Заявки» (скрыть по
  // умолчанию), если так говорит статус c-lector (там свои формулировки —
  // "Выполнена", "Отклонена" и т.п.), а если внешнего статуса нет — по
  // внутреннему статусу наряда-задания.
  function isTicketDone(t){
    // 0.2.18: удалённую в c-lector заявку тоже прячем по умолчанию (галочка
    // "Показывать закрытые/отклонённые/удалённые из c-lector" их раскрывает) —
    // с ней уже нечего делать, как и с закрытой/отклонённой.
    if(isDeletedInClector(t)) return true;
    if(t.external_status) return /выполн|заверш|устранен[оы]|закрыт|отклон|отказ/i.test(t.external_status);
    return t.status==="closed" || t.status==="rejected";
  }
  // Компактная отметка "назначена бригаде/инженеру" — раньше для этого была отдельная
  // колонка "Главный инженер" в списке заявок, теперь вместо неё значок рядом со
  // статусом (статуса "Диспетчеризована" как отдельного состояния на практике не бывает,
  // а вот видеть с одного взгляда, назначен ли исполнитель, — нужно).
  // Мини-иконки хода работ в списке заявок (заменяют собой прежний текстовый
  // значок "✓ назначена"). Каждая иконка приглушена по умолчанию и "загорается"
  // (акцентный цвет + лёгкое свечение) когда соответствующее условие выполнено.
  // "Бригада" (0.2.2): зелёная либо когда назначен реальный исполнитель
  // (t.assigned_to), либо когда явно отмечено "бригада не нужна" — прежней
  // безымянной ручной отметки ("выполнено вручную" без имени) больше нет.
  //
  // "Материал" (0.2.2): три состояния вместо старого ручного флажка —
  // нейтральный (нет счетов и не отмечено "не нужен"), жёлтый (счёт есть, но
  // не все счета оплачены), зелёный (все счета категории "materials" оплачены,
  // ИЛИ отмечено "материал не нужен"). См. materialsState()/materialsIsGreen()
  // ниже — определены после invoicesFor(), но вызываются лениво, так что
  // порядок объявления в файле значения не имеет (function-декларации hoisted).
  // "Материал" учитывает два независимых источника (решение Антона): плитку
  // могут заказать заранее по счёту (безнал), а крестики/расходники под неё —
  // купить прораб за наличные из выданных ему денег. Поэтому: если есть хоть
  // один неоплаченный счёт на материалы — жёлтый статус в любом случае (нал не
  // подменяет собой оплату счёта); иначе зелёный, если все счета на материалы
  // оплачены ИЛИ по этой заявке есть хоть один наличный расход с категорией
  // "Материал"; иначе нейтральный (материалы вообще не заводили).
  function materialsState(t){
    if(t.materials_not_needed) return "ok";
    var invs = invoicesFor(t, "materials");
    var hasUnpaidInvoice = invs.some(function(iv){ return !iv.paid; });
    if(hasUnpaidInvoice) return "warn";
    if(invs.length) return "ok";
    if(cashExpensesFor(t, "materials").length) return "ok";
    // 0.2.16: галочка «оплачено за наличные» — не все материалы идут по счёту
    // от поставщика, иногда прораб просто платит наличными сразу на месте, и
    // счёта не будет вообще. Пока сама наличная запись ещё не внесена в
    // «Финансы → Наличные расходы», статус жёлтый (ожидание), а не нейтральный —
    // это осознанно отмеченное намерение, а не забытый пункт. Как только
    // появится наличный расход категории «Материал» по этой заявке, сработает
    // проверка выше (cashExpensesFor(...).length) и статус станет зелёным
    // (см. maybeClearMaterialsCashPending, которая заодно снимает саму галочку).
    if(t.materials_cash_pending) return "warn";
    return "neutral";
  }
  function materialsIsGreen(t){ return materialsState(t)==="ok"; }
  var STATUS_ICON_DEFS = [
    { key:'crew', svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L2 19l3 3 7.1-7.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2-2 2.5-2.5z"/></svg>',
      lit:function(t){ return !!t.assigned_to || !!t.crew_not_needed; },
      label:function(t){ return t.assigned_to ? "Бригада назначена: "+t.assigned_to : (t.crew_not_needed ? "Бригада не нужна для этой заявки" : "Бригада ещё не назначена"); } },
    { key:'materials', svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
      lit:function(t){ return materialsIsGreen(t); },

    { key:'work', svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      // "работа выполнена" — раньше срабатывала по наличию ЛЮБОГО фото в общей
      // галерее "Фото", но с разделением "Фото" (замечания) и фото-доказательств
